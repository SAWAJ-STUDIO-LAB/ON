# ═══════════════════════════════════════════════════════════
# SawajStudioBot — pyproject.toml
# ═══════════════════════════════════════════════════════════

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sawajstudiobot"
version = "1.0.0"
description = "Automated Islamic Video Generation & Social Media Automation Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "Sawaj Studio", email = "sawajstudio@example.com" }
]
keywords = ["islamic", "video", "automation", "hadith", "youtube", "facebook"]

dependencies = [
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "Pillow>=10.2.0",
    "mutagen>=1.47.0",
    "google-auth>=2.25.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.110.0",
    "edge-tts>=6.1.9",
    "gTTS>=2.5.1",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
long = [
    "numpy>=1.26.0",
]

[project.scripts]
story = "sawajstudiobot.video_generator.fb_ig_story_video_generator.G_entry.G2_run:main"
short = "sawajstudiobot.video_generator.fb_ig_yt_short_video_generator.G_entry.G2_run:main"
long = "sawajstudiobot.video_generator.fb_yt_long_video_generator.G_entry.G2_run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sawajstudiobot*"]

[tool.pytest.ini_options]
testpaths = [
    "sawajstudiobot/video_generator/fb_ig_story_video_generator/H_tests",
    "sawajstudiobot/video_generator/fb_ig_yt_short_video_generator/H_tests",
    "sawajstudiobot/video_generator/fb_yt_long_video_generator/H_tests",
]
python_files = "H*test_*.py"

[tool.coverage.run]
source = ["sawajstudiobot"]
omit = ["*/H_tests/*", "*/__init__.py"]
