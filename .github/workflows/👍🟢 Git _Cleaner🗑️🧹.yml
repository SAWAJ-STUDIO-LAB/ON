name: 👍🟢Git_Cleaner🧹

on:
  workflow_dispatch:
  workflow_run:
    workflows: 
      - "KING — One File At A Time (Full Upgrade)"
      - "Full Secrets API testing"
      - "Bot Update Upgrade — KING (Single YAML + Telegram File)"
    types:
      - completed
      - requested
      - in_progress

jobs:
  clean-history:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Ultra-Powerful Force Cleaner (Running & Completed)
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          echo "🔥 Ultimate cleaner activated! Saare running aur completed workflows ko saaf kiya ja raha hai..."
          
          # Sabhi runs ki ID nikal lo
          RUN_IDS=$(gh api "repos/$REPO/actions/runs?per_page=100" --paginate --jq '.workflow_runs[].id' || true)
          
          if [ -z "$RUN_IDS" ]; then
            echo "✅ Repository ekdum clean hai!"
            exit 0
          fi
          
          SUCCESS_COUNT=0
          
          for ID in $RUN_IDS; do
            # Khud apne chal rahe workflow ko delete hone se bachane ke liye condition
            if [ "$ID" = "$CURRENT_RUN_ID" ]; then
              echo "🛡️ Skipping current cleaner run ID: $ID (Khud ko bacha liya)"
              continue
            fi
            
            echo "🗑️ Targeting run ID: $ID..."
            
            # Agar chal raha hai toh pehle cancel karo
            gh api -X POST "repos/$REPO/actions/runs/$ID/cancel" --silent || true
            
            # Turant delete karo
            if gh api -X DELETE "repos/$REPO/actions/runs/$ID" --silent; then
              SUCCESS_COUNT=$((SUCCESS_COUNT+1))
            fi
            
            sleep 0.1
          done
          
          echo "====================================================="
          echo "🎉 Total $SUCCESS_COUNT workflows ko successfully uda diya gaya hai!"
          echo "====================================================="
