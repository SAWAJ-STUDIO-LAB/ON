name: 💻 Generate Code

on:
  workflow_dispatch:
    inputs:
      send_telegram:
        description: 'Send report to Telegram?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

concurrency:
  group: generate-code-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.10'

jobs:
  generate:
    name: 💻 Generate Code
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ═══════════════════════════════════════════════════════════
      # ① CHECKOUT
      # ═══════════════════════════════════════════════════════════
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB }}

      # ═══════════════════════════════════════════════════════════
      # ② SETUP PYTHON
      # ═══════════════════════════════════════════════════════════
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ═══════════════════════════════════════════════════════════
      # ③ INSTALL DEPENDENCIES
      # ═══════════════════════════════════════════════════════════
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow mutagen

      # ═══════════════════════════════════════════════════════════
      # ④ RUN CORE
      # ═══════════════════════════════════════════════════════════
      - name: 💻 Generate Core Code
        run: |
          echo "═══════════════════════════════════════════════════════════════"
          echo "💻 RUNNING: scripts/core.py"
          echo "═══════════════════════════════════════════════════════════════"
          python3 scripts/core.py

      # ═══════════════════════════════════════════════════════════
      # ⑤ RUN GRAPHICS
      # ═══════════════════════════════════════════════════════════
      - name: 🎨 Generate Graphics Code
        run: |
          echo "═══════════════════════════════════════════════════════════════"
          echo "🎨 RUNNING: scripts/graphics.py"
          echo "═══════════════════════════════════════════════════════════════"
          python3 scripts/graphics.py

      # ═══════════════════════════════════════════════════════════
      # ⑥ RUN CONTENT
      # ═══════════════════════════════════════════════════════════
      - name: 📖 Generate Content Code
        run: |
          echo "═══════════════════════════════════════════════════════════════"
          echo "📖 RUNNING: scripts/content.py"
          echo "═══════════════════════════════════════════════════════════════"
          python3 scripts/content.py

      # ═══════════════════════════════════════════════════════════
      # ⑦ VERIFY PYTHON SYNTAX
      # ═══════════════════════════════════════════════════════════
      - name: 🔍 Verify Python Syntax
        continue-on-error: true
        run: |
          python3 <<'PYEOF'
          import os
          import py_compile

          errors = []
          checked = 0

          for root, _, files in os.walk("Sawaj_studio"):
              for file in files:
                  if file.endswith(".py"):
                      path = os.path.join(root, file)
                      checked += 1
                      try:
                          py_compile.compile(path, doraise=True)
                      except py_compile.PyCompileError as e:
                          errors.append(f"{path}: {str(e)[:100]}")

          print("=" * 60)
          print(f"✅ Checked: {checked} files")
          if errors:
              print(f"❌ Errors: {len(errors)}")
              for e in errors[:10]:
                  print(f"   {e}")
          else:
              print("🎉 All Python files valid!")
          print("=" * 60)
          PYEOF

      # ═══════════════════════════════════════════════════════════
      # ⑧ DELETE OLD 11 FILES IN scripts/
      # ═══════════════════════════════════════════════════════════
      - name: 🗑️ Clean Old Scripts
        run: |
          cd scripts
          OLD_FILES="code_config.py code_logger.py code_telegram.py code_utils.py code_pipeline.py code_secrets.py code_fonts.py code_graphics.py code_content.py code_workers.py code_uploaders.py"

          for f in $OLD_FILES; do
            if [ -f "$f" ]; then
              rm -f "$f"
              echo "🗑️  Deleted: $f"
            fi
          done

          echo "✅ Scripts folder cleaned"

      # ═══════════════════════════════════════════════════════════
      # ⑨ COMMIT & PUSH
      # ═══════════════════════════════════════════════════════════
      - name: 📤 Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ${{ github.ref_name }} || true
          git add -A
          if git diff --cached --quiet; then
            echo "✅ No changes"
          else
            git commit -m "💻 Generate Sawaj Studio code [skip ci]"
            git push origin HEAD
            echo "✅ Pushed"
          fi

      # ═══════════════════════════════════════════════════════════
      # ⑩ FINAL COUNT
      # ═══════════════════════════════════════════════════════════
      - name: 📊 Final Count
        id: count
        if: always()
        run: |
          FOLDERS=$(find Sawaj_studio/ -type d 2>/dev/null | wc -l)
          FILES=$(find Sawaj_studio/ -type f 2>/dev/null | wc -l)
          PY=$(find Sawaj_studio/ -name '*.py' 2>/dev/null | wc -l)
          CODE=$(find Sawaj_studio/ -name '*.py' -size +100c 2>/dev/null | wc -l)
          SCRIPTS=$(ls scripts/ 2>/dev/null | wc -l)

          echo "folders=$FOLDERS" >> $GITHUB_OUTPUT
          echo "files=$FILES" >> $GITHUB_OUTPUT
          echo "py=$PY" >> $GITHUB_OUTPUT
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "scripts=$SCRIPTS" >> $GITHUB_OUTPUT

          echo "═══════════════════════════════════════════════════════════════"
          echo "📊 FINAL COUNT"
          echo "═══════════════════════════════════════════════════════════════"
          echo "📁 Folders:      $FOLDERS"
          echo "📄 Files:        $FILES"
          echo "🐍 Python:       $PY"
          echo "💻 With Code:    $CODE"
          echo "📜 Scripts:      $SCRIPTS"
          echo "═══════════════════════════════════════════════════════════════"

      # ═══════════════════════════════════════════════════════════
      # ⑪ TELEGRAM REPORT
      # ═══════════════════════════════════════════════════════════
      - name: 📱 Telegram Report
        if: always() && github.event.inputs.send_telegram != 'false'
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "⚠️ Telegram secrets missing"
            exit 0
          fi

          FOLDERS="${{ steps.count.outputs.folders }}"
          FILES="${{ steps.count.outputs.files }}"
          PY="${{ steps.count.outputs.py }}"
          CODE="${{ steps.count.outputs.code }}"
          SCRIPTS="${{ steps.count.outputs.scripts }}"

          curl -s -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d chat_id="$TG_CHAT" \
            -d parse_mode="HTML" \
            -d text="💻 <b>CODE GENERATED</b>

          ━━━━━━━━━━━━━━━━━━━━
          📁 Folders: <b>$FOLDERS</b>
          📄 Files: <b>$FILES</b>
          🐍 Python: <b>$PY</b>
          💻 With code: <b>$CODE</b>
          📜 Scripts: <b>$SCRIPTS</b>
          ━━━━━━━━━━━━━━━━━━━━

          🔢 Run: #${{ github.run_number }}
          👤 Actor: ${{ github.actor }}
          🕐 $(date '+%H:%M:%S UTC')" || true

      # ═══════════════════════════════════════════════════════════
      # ⑫ GITHUB SUMMARY
      # ═══════════════════════════════════════════════════════════
      - name: 📊 Summary
        if: always()
        run: |
          {
            echo "# 💻 Sawaj Studio — Code Generated"
            echo ""
            echo "| Metric | Count |"
            echo "|--------|-------|"
            echo "| Folders | ${{ steps.count.outputs.folders }} |"
            echo "| Files | ${{ steps.count.outputs.files }} |"
            echo "| Python | ${{ steps.count.outputs.py }} |"
            echo "| With Code | ${{ steps.count.outputs.code }} |"
            echo "| Scripts | ${{ steps.count.outputs.scripts }} |"
            echo ""
            echo "🔢 Run: #${{ github.run_number }}"
          } >> $GITHUB_STEP_SUMMARY
