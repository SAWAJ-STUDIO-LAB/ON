name: "🟢Story Video"

on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * *'   # 4:00 AM IST

permissions:
  contents: write
  actions: write

concurrency:
  group: morning-story
  cancel-in-progress: false

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Python Packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-tools
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Custom Fonts
        id: cache-fonts
        uses: actions/cache@v4
        with:
          path: ~/.fonts
          key: ${{ runner.os }}-custom-fonts-v4

      - name: Install System Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto fonts-noto-core fonts-noto-extra fonts-noto-ui-core fonts-dejavu-core fonts-noto-color-emoji fontconfig

      - name: Download Custom Fonts
        if: steps.cache-fonts.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.fonts
          wget -q --timeout=20 "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSans/NotoSans-Regular.ttf" -O ~/.fonts/NotoSans-Regular.ttf || true
          wget -q --timeout=20 "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSans/NotoSans-Bold.ttf" -O ~/.fonts/NotoSans-Bold.ttf || true
          wget -q --timeout=20 "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSansDevanagari/NotoSansDevanagari-Regular.ttf" -O ~/.fonts/NotoSansDevanagari-Regular.ttf || true
          wget -q --timeout=20 "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSansDevanagari/NotoSansDevanagari-Bold.ttf" -O ~/.fonts/NotoSansDevanagari-Bold.ttf || true
          wget -q --timeout=20 "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoNaskhArabic/NotoNaskhArabic-Regular.ttf" -O ~/.fonts/NotoNaskhArabic-Regular.ttf || true
          wget -q --timeout=20 "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoNaskhArabic/NotoNaskhArabic-Bold.ttf" -O ~/.fonts/NotoNaskhArabic-Bold.ttf || true

      - name: Install Python Packages
        run: |
          fc-cache -f -v
          pip install --no-cache-dir requests edge-tts mutagen Pillow google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Run Story Pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          DRIVE_STORY_FOLDER_ID: ${{ secrets.GDRIVE_STORY_VIDEO_FOLDER_ID }}
          
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_AI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_AI }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY_AI }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          TUNETANK_API_URL: ${{ secrets.TUNETANK_API_URL }}
          FREETOUSE_MUSIC_URL: ${{ secrets.FREETOUSE_MUSIC_URL }}
          
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          
          HADITH_API_URL: ${{ secrets.HADITH_API_URL }}
        run: |
          python3 << 'PYEOF'
          import os, re, time, random, subprocess, requests, sys, datetime
          from mutagen.mp3 import MP3
          from PIL import Image, ImageDraw, ImageFont
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          session = requests.Session()
          retry = Retry(total=3, backoff_factor=1.5, status_forcelist=[429, 500, 502, 503, 504])
          session.mount("https://", HTTPAdapter(max_retries=retry))

          TG_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN")
          TG_CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID")
          api_status = {"1_Hadith": {}, "2_Translation": {}, "3_TTS": {}, "4_Music": {}, "5_Background": {}, "6_Drive": {}, "7_AI": {}}

          def send_tg(msg):
              if TG_TOKEN and TG_CHAT_ID:
                  try:
                      session.post(f"https://api.telegram.org/bot{TG_TOKEN}/sendMessage",
                                   json={"chat_id": TG_CHAT_ID, "text": msg, "parse_mode": "HTML", "disable_web_page_preview": True}, timeout=12)
                  except: pass
              print(msg)

          def run_cmd(cmd):
              print(f"[CMD] {cmd[:150]}...")
              subprocess.run(cmd, shell=True, check=True)

          def sanitize(t):
              if not t: return ""
              t = re.sub(r'[\u200b-\u200f\ufeff\u202a-\u202e]', '', str(t))
              return t.replace('"', '').replace("'", '').replace('\n', ' ').strip()

          def report_api_status():
              lines = ["📊 <b>SYSTEM STATUS</b>\n"]
              for section, status in api_status.items():
                  if not status: continue
                  lines.append(f"<b>{section}:</b>")
                  for name, result in status.items():
                      icon = "✅" if result == "success" else "❌"
                      lines.append(f"  {icon} {name} → {result}")
              send_tg("\n".join(lines))

          def download(url, path):
              try:
                  r = session.get(url, timeout=35)
                  if r.status_code == 200 and len(r.content) > 12000:
                      open(path, "wb").write(r.content)
                      return True
              except: pass
              return False

          try:
              send_tg("🌍 <b>GLOBAL STORY STARTED</b>\n⏱️ Target: 10-55 seconds")

              # ==================== 1. HADITH ====================
              def fetch_hadith():
                  books = [
                      {"eng": "eng-bukhari", "ara": "ara-bukhari", "name": "Sahih al-Bukhari", "max": 7000},
                      {"eng": "eng-muslim", "ara": "ara-muslim", "name": "Sahih Muslim", "max": 5000}
                  ]
                  bases = []
                  if os.environ.get("HADITH_API_URL"):
                      bases.append(os.environ["HADITH_API_URL"].rstrip("/"))
                  bases += ["https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1", "https://raw.githubusercontent.com/fawazahmed0/hadith-api/1"]

                  for _ in range(40):
                      book = random.choice(books)
                      num = random.randint(1, book["max"])
                      for base in bases:
                          try:
                              url = f"{base}/editions/{book['eng']}/{num}.json"
                              r = session.get(url, timeout=15)
                              if r.status_code != 200: continue
                              data = r.json()
                              hs = data.get("hadiths", [])
                              if not hs: continue
                              eng = sanitize(hs[0].get("text", ""))
                              if 45 <= len(eng) <= 480:
                                  ara = ""
                                  try:
                                      ar = session.get(url.replace(book["eng"], book["ara"]), timeout=10)
                                      if ar.status_code == 200:
                                          ad = ar.json().get("hadiths", [])
                                          if ad: ara = sanitize(ad[0].get("text", ""))
                                  except: pass
                                  api_status["1_Hadith"]["API"] = "success"
                                  return {"collection": book["name"], "number": str(hs[0].get("hadithnumber") or num), "english": eng, "arabic": ara}
                          except: pass
                  api_status["1_Hadith"]["API"] = "failed"
                  return None

              # ==================== 2. TRANSLATION ====================
              def call_ai(prompt, max_tokens=400):
                  providers = []
                  if os.environ.get("OPENROUTER_API_KEY"):
                      providers.append(("OpenRouter", "https://openrouter.ai/api/v1/chat/completions", {"Authorization": f"Bearer {os.environ['OPENROUTER_API_KEY']}"}, "openai/gpt-4o-mini"))
                  if os.environ.get("GROQ_API_KEY"):
                      providers.append(("Groq", "https://api.groq.com/openai/v1/chat/completions", {"Authorization": f"Bearer {os.environ['GROQ_API_KEY']}"}, "llama-3.3-70b-versatile"))
                  if os.environ.get("NVIDIA_API_KEY"):
                      providers.append(("NVIDIA", "https://integrate.api.nvidia.com/v1/chat/completions", {"Authorization": f"Bearer {os.environ['NVIDIA_API_KEY']}"}, "meta/llama3-70b-instruct"))
                  if os.environ.get("MISTRAL_API_KEY"):
                      providers.append(("Mistral", "https://api.mistral.ai/v1/chat/completions", {"Authorization": f"Bearer {os.environ['MISTRAL_API_KEY']}"}, "mistral-small-latest"))
                  for name, url, headers, model in providers:
                      try:
                          payload = {"model": model, "messages": [{"role": "user", "content": prompt}], "temperature": 0.7, "max_tokens": max_tokens}
                          r = session.post(url, headers={**headers, "Content-Type": "application/json"}, json=payload, timeout=40)
                          if r.status_code == 200:
                              api_status["7_AI"][name] = "success"
                              return r.json()["choices"][0]["message"]["content"].strip()
                          api_status["7_AI"][name] = "failed"
                      except: api_status["7_AI"][name] = "failed"
                  return None

              def translate_text(text):
                  key = os.environ.get("DEEPL_API_KEY")
                  if key:
                      try:
                          r = session.post("https://api-free.deepl.com/v2/translate", headers={"Authorization": f"DeepL-Auth-Key {key}"}, data={"text": text, "target_lang": "HI"}, timeout=20)
                          if r.status_code == 200:
                              api_status["2_Translation"]["DeepL"] = "success"
                              return r.json()["translations"][0]["text"]
                      except: pass
                      api_status["2_Translation"]["DeepL"] = "failed"
                  sarvam_key = os.environ.get("SARVAM_API_KEY")
                  if sarvam_key:
                      try:
                          r = session.post("https://api.sarvam.ai/translate", headers={"api-subscription-key": sarvam_key, "Content-Type": "application/json"}, json={"input": text, "source_language_code": "en-IN", "target_language_code": "hi-IN", "speaker_gender": "Male"}, timeout=20)
                          if r.status_code == 200:
                              api_status["2_Translation"]["Sarvam"] = "success"
                              return r.json().get("translated_text", "")
                      except: pass
                      api_status["2_Translation"]["Sarvam"] = "failed"
                  result = call_ai(f"Is English Hadith ka soft accurate Hindi tarjuma likho. Sirf tarjuma.\n\n{text}")
                  if result:
                      api_status["2_Translation"]["AI"] = "success"
                  else:
                      api_status["2_Translation"]["AI"] = "failed"
                  return result

              # ==================== 3. TTS ====================
              def gen_tts(text, outfile):
                  text = sanitize(text)
                  el = os.environ.get("ELEVENLABS_API_KEY")
                  if el:
                      try:
                          r = session.post("https://api.elevenlabs.io/v1/text-to-speech/pNInz6obpgDQGcFmaJgB", headers={"Accept": "audio/mpeg", "Content-Type": "application/json", "xi-api-key": el}, json={"text": text, "model_id": "eleven_multilingual_v2"}, timeout=50)
                          if r.status_code == 200 and len(r.content) > 5000:
                              open(outfile, "wb").write(r.content)
                              api_status["3_TTS"]["ElevenLabs"] = "success"
                              return True
                      except: pass
                      api_status["3_TTS"]["ElevenLabs"] = "failed"
                  dg = os.environ.get("DEEPGRAM_API_KEY")
                  if dg:
                      try:
                          r = session.post("https://api.deepgram.com/v1/speak?model=aura-asteria-en", headers={"Authorization": f"Token {dg}", "Content-Type": "application/json"}, json={"text": text}, timeout=40)
                          if r.status_code == 200 and len(r.content) > 5000:
                              open(outfile, "wb").write(r.content)
                              api_status["3_TTS"]["Deepgram"] = "success"
                              return True
                      except: pass
                      api_status["3_TTS"]["Deepgram"] = "failed"
                  try:
                      tmp = outfile + ".txt"
                      open(tmp, "w", encoding="utf-8").write(text)
                      run_cmd(f'edge-tts --file "{tmp}" --write-media "{outfile}" --voice hi-IN-MadhurNeural --rate=-7% --pitch=-2Hz --volume=+8%')
                      if os.path.exists(tmp): os.remove(tmp)
                      api_status["3_TTS"]["edge-tts"] = "success"
                      return True
                  except:
                      api_status["3_TTS"]["edge-tts"] = "failed"
                      return False

              # ==================== 4. MUSIC ====================
              def get_music():
                  fs = os.environ.get("FREESOUND_API_KEY")
                  if fs:
                      try:
                          r = session.get("https://freesound.org/apiv2/search/text/", params={"query": "meditation ambient", "filter": "duration:[30 TO 200]", "fields": "previews", "page_size": 5, "token": fs}, timeout=14)
                          if r.status_code == 200 and r.json().get("results"):
                              for s in r.json()["results"]:
                                  p = s.get("previews", {}).get("preview-hq-mp3")
                                  if p and download(p, "music_raw.mp3"):
                                      run_cmd('ffmpeg -y -i music_raw.mp3 -af "volume=0.22,afade=t=in:st=0:d=2,afade=t=out:st=90:d=5" -t 110 music_soft.mp3')
                                      api_status["4_Music"]["Freesound"] = "success"
                                      return True
                          api_status["4_Music"]["Freesound"] = "failed"
                      except: api_status["4_Music"]["Freesound"] = "failed"
                  jm = os.environ.get("JAMENDO_CLIENT_ID")
                  if jm:
                      try:
                          r = session.get(f"https://api.jamendo.com/v3.0/tracks/?client_id={jm}&format=json&limit=5&tags=meditation", timeout=14)
                          if r.status_code == 200 and r.json().get("results"):
                              for track in r.json()["results"]:
                                  audio_url = track.get("audio")
                                  if audio_url and download(audio_url, "music_raw.mp3"):
                                      run_cmd('ffmpeg -y -i music_raw.mp3 -af "volume=0.22,afade=t=in:st=0:d=2,afade=t=out:st=90:d=5" -t 110 music_soft.mp3')
                                      api_status["4_Music"]["Jamendo"] = "success"
                                      return True
                          api_status["4_Music"]["Jamendo"] = "failed"
                      except: api_status["4_Music"]["Jamendo"] = "failed"
                  for name, url in [("TuneTank", os.environ.get("TUNETANK_API_URL")), ("FreeToUse", os.environ.get("FREETOUSE_MUSIC_URL"))]:
                      if url and url.startswith("http"):
                          if download(url, "music_raw.mp3"):
                              run_cmd('ffmpeg -y -i music_raw.mp3 -af "volume=0.22,afade=t=in:st=0:d=2,afade=t=out:st=90:d=5" -t 110 music_soft.mp3')
                              api_status["4_Music"][name] = "success"
                              return True
                      api_status["4_Music"][name] = "failed"
                  online_fallbacks = [
                      ("Pixabay-Soft", "https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=soft-ambient-112191.mp3"),
                      ("Pixabay-Meditation", "https://cdn.pixabay.com/download/audio/2022/03/24/audio_4f3b5c5e3d.mp3?filename=peaceful-background-112194.mp3"),
                      ("Mixkit-Ambient", "https://assets.mixkit.co/music/preview/mixkit-dreaming-big-31.mp3"),
                      ("Bensound-Relax", "https://www.bensound.com/bensound-music/bensound-relaxing.mp3")
                  ]
                  for name, url in online_fallbacks:
                      if download(url, "music_raw.mp3"):
                          run_cmd('ffmpeg -y -i music_raw.mp3 -af "volume=0.22,afade=t=in:st=0:d=2,afade=t=out:st=90:d=5" -t 110 music_soft.mp3')
                          api_status["4_Music"][name] = "success"
                          return True
                      api_status["4_Music"][name] = "failed"
                  return False

              # ==================== 5. BACKGROUND ====================
              def download_video(url, path):
                  try:
                      r = session.get(url, timeout=40, stream=True)
                      if r.status_code == 200:
                          with open(path, "wb") as f:
                              for chunk in r.iter_content(chunk_size=1024*1024):
                                  if chunk: f.write(chunk)
                          return True
                  except: pass
                  return False

              def get_multi_bg(dur):
                  DARKEN = "eq=contrast=1.10:brightness=0.02:saturation=1.12,vignette=PI/5"
                  islamic_queries = ["mosque night", "islamic architecture", "kaaba", "quran book", "ramadan lantern"]
                  valid_keywords = ["mosque", "islam", "muslim", "quran", "kaaba", "prayer", "ramadan", "islamic", "makkah", "madinah"]
                  downloaded_vids = []
                  
                  if dur < 15.0: target_clips = 1
                  elif dur < 30.0: target_clips = 2
                  else: target_clips = 3

                  pk = os.environ.get("PEXELS_API_KEY")
                  if pk:
                      for q in random.sample(islamic_queries, len(islamic_queries)):
                          if len(downloaded_vids) >= target_clips: break
                          try:
                              r = session.get(f"https://api.pexels.com/videos/search?query={q}&orientation=portrait&per_page=10", headers={"Authorization": pk}, timeout=15)
                              if r.status_code == 200:
                                  for v in r.json().get("videos", []):
                                      alt = (v.get("alt") or "").lower()
                                      if any(kw in alt for kw in valid_keywords) or any(kw in str(v).lower() for kw in valid_keywords):
                                          files = sorted(v.get("video_files", []), key=lambda x: x.get("width", 0), reverse=True)
                                          if files:
                                              path = f"vid_{len(downloaded_vids)}.mp4"
                                              if download_video(files[0]["link"], path):
                                                  processed = f"proc_{len(downloaded_vids)}.mp4"
                                                  seg_dur = max(dur / target_clips, 4.0)
                                                  run_cmd(f'ffmpeg -y -stream_loop -1 -i {path} -vf "scale=1200:2140:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z=\'min(zoom+0.0004,1.06)\':d=1:x=\'iw/2-(iw/zoom/2)\':y=\'ih/2-(ih/zoom/2)\':s=1080x1920,setsar=1,{DARKEN}" -t {seg_dur:.2f} -an -c:v libx264 -preset veryfast -crf 18 {processed}')
                                                  downloaded_vids.append(processed)
                                                  break
                          except: pass
                      api_status["5_Background"]["Pexels"] = "success" if len(downloaded_vids) >= target_clips else "failed"

                  if len(downloaded_vids) < target_clips:
                      px = os.environ.get("PIXABAY_API_KEY")
                      if px:
                          for q in random.sample(islamic_queries, len(islamic_queries)):
                              if len(downloaded_vids) >= target_clips: break
                              try:
                                  query_str = q.replace(" ", "+")
                                  r = session.get(f"https://pixabay.com/api/videos/?key={px}&q={query_str}&orientation=vertical&per_page=10", timeout=14)
                                  if r.status_code == 200:
                                      for h in r.json().get("hits", []):
                                          tags = (h.get("tags") or "").lower()
                                          if any(kw in tags for kw in valid_keywords):
                                              u = (h.get("videos", {}).get("large", {}) or {}).get("url") or (h.get("videos", {}).get("medium", {}) or {}).get("url")
                                              if u:
                                                  path = f"vid_{len(downloaded_vids)}.mp4"
                                                  if download_video(u, path):
                                                      processed = f"proc_{len(downloaded_vids)}.mp4"
                                                      seg_dur = max(dur / target_clips, 4.0)
                                                      run_cmd(f'ffmpeg -y -stream_loop -1 -i {path} -vf "scale=1200:2140:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z=\'min(zoom+0.0004,1.06)\':d=1:x=\'iw/2-(iw/zoom/2)\':y=\'ih/2-(ih/zoom/2)\':s=1080x1920,setsar=1,{DARKEN}" -t {seg_dur:.2f} -an -c:v libx264 -preset veryfast -crf 18 {processed}')
                                                      downloaded_vids.append(processed)
                                                      break
                              except: pass
                          api_status["5_Background"]["Pixabay"] = "success" if len(downloaded_vids) >= target_clips else "failed"

                  if len(downloaded_vids) < target_clips:
                      cv = os.environ.get("COVERR_API_KEY")
                      if cv:
                          try:
                              r = session.get("https://api.coverr.co/videos", params={"query": "islamic night", "urls": "true", "api_key": cv, "page_size": 5}, timeout=14)
                              if r.status_code == 200:
                                  for v in r.json().get("hits", []):
                                      u = (v.get("urls") or {}).get("mp4_download")
                                      if u:
                                          path = f"vid_{len(downloaded_vids)}.mp4"
                                          if download_video(u, path):
                                              processed = f"proc_{len(downloaded_vids)}.mp4"
                                              seg_dur = max(dur / target_clips, 4.0)
                                              run_cmd(f'ffmpeg -y -stream_loop -1 -i {path} -vf "scale=1200:2140:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z=\'min(zoom+0.0004,1.06)\':d=1:x=\'iw/2-(iw/zoom/2)\':y=\'ih/2-(ih/zoom/2)\':s=1080x1920,setsar=1,{DARKEN}" -t {seg_dur:.2f} -an -c:v libx264 -preset veryfast -crf 18 {processed}')
                                              downloaded_vids.append(processed)
                                              if len(downloaded_vids) >= target_clips: break
                          except: pass
                          api_status["5_Background"]["Coverr"] = "success" if len(downloaded_vids) >= target_clips else "failed"

                  if len(downloaded_vids) < target_clips:
                      api_status["5_Background"]["Result"] = "failed"
                      return None

                  out = "bg_final.mp4"
                  if target_clips == 1:
                      run_cmd(f'ffmpeg -y -i {downloaded_vids[0]} -c:v libx264 -preset veryfast -crf 18 -t {dur:.2f} {out}')
                  elif target_clips == 2:
                      off1 = max(0.5, dur/2 - 1)
                      run_cmd(f'ffmpeg -y -i {downloaded_vids[0]} -i {downloaded_vids[1]} -filter_complex "[0:v][1:v]xfade=transition=fade:duration=1:offset={off1:.2f}[outv]" -map "[outv]" -t {dur:.2f} -c:v libx264 -preset veryfast -crf 18 {out}')
                  else:
                      off1 = max(0.5, dur/3 - 1)
                      off2 = max(1.0, 2*(dur/3) - 2)
                      run_cmd(f'ffmpeg -y -i {downloaded_vids[0]} -i {downloaded_vids[1]} -i {downloaded_vids[2]} -filter_complex "[0:v][1:v]xfade=transition=fade:duration=1:offset={off1:.2f}[v01]; [v01][2:v]xfade=transition=fade:duration=1:offset={off2:.2f}[outv]" -map "[outv]" -t {dur:.2f} -c:v libx264 -preset veryfast -crf 18 {out}')
                  
                  api_status["5_Background"]["Multi-Scene"] = "success"
                  return out

              def make_logo():
                  for src in ["sawaj_studio-logo.png", "logo.png", "logo.jpg", "assets/logo.png", "assets/logo.jpg"]:
                      if os.path.exists(src):
                          try:
                              img = Image.open(src).convert("RGBA")
                              border, bottom = 10, 22
                              nw, nh = img.width + border*2, img.height + border + bottom
                              canvas = Image.new("RGBA", (nw, nh), (0, 0, 0, 0))
                              draw = ImageDraw.Draw(canvas)
                              draw.rectangle([0, 0, nw-1, nh-1], outline=(212, 175, 55, 255), width=border)
                              draw.rectangle([0, nh-bottom, nw-1, nh-1], fill=(20, 15, 8, 240))
                              canvas.paste(img, (border, border), img)
                              canvas.save("avatar.png")
                              return True
                          except: pass
                  try:
                      canvas = Image.new("RGBA", (400, 170), (0, 0, 0, 0))
                      draw = ImageDraw.Draw(canvas)
                      draw.rounded_rectangle([6, 6, 394, 164], radius=16, fill=(16, 12, 6, 245), outline=(212, 175, 55, 255), width=5)
                      try: fnt = ImageFont.truetype(os.path.expanduser("~/.fonts/NotoSans-Bold.ttf"), 44)
                      except: fnt = ImageFont.load_default()
                      draw.text((200, 65), "SAWAJ", fill=(230, 200, 130, 255), font=fnt, anchor="mm")
                      draw.text((200, 115), "STUDIO", fill=(200, 170, 110, 255), font=fnt, anchor="mm")
                      canvas.save("avatar.png")
                      return True
                  except: return False

              # ==================== 6. DRIVE ====================
              def upload_drive(path):
                  try:
                      creds = Credentials(None, refresh_token=os.environ.get("GOOGLE_DRIVE_REFRESH_TOKEN"),
                                          client_id=os.environ.get("GOOGLE_DRIVE_CLIENT_ID"),
                                          client_secret=os.environ.get("GOOGLE_DRIVE_CLIENT_SECRET"),
                                          token_uri="https://oauth2.googleapis.com/token")
                      service = build("drive", "v3", credentials=creds, cache_discovery=False)
                      meta = {"name": f"GlobalNo1_Story_{int(time.time())}.mp4"}
                      folder_id = os.environ.get("DRIVE_STORY_FOLDER_ID")
                      if folder_id: meta["parents"] = [folder_id]
                      up = service.files().create(body=meta, media_body=MediaFileUpload(path, mimetype="video/mp4", resumable=True), fields="id").execute()
                      did = up.get("id")
                      service.permissions().create(fileId=did, body={"type": "anyone", "role": "reader"}).execute()
                      link = f"https://drive.google.com/file/d/{did}/view"
                      api_status["6_Drive"]["Upload"] = "success"
                      send_tg(f"✅ <b>Drive Upload Successful</b>\n🔗 <a href='{link}'>Watch Video</a>")
                  except Exception as e:
                      api_status["6_Drive"]["Upload"] = f"failed ({str(e)[:50]})"
                      send_tg(f"❌ Drive Upload Failed: {e}")

              # ==================== EXECUTION ====================
              h = fetch_hadith()
              if not h: raise Exception("Hadith fail")

              hindi = translate_text(h["english"])
              if not hindi: raise Exception("Translation fail")

              if not gen_tts(f"हदीस शरीफ। {hindi}", "s_raw.mp3"): raise Exception("TTS fail")
              if not gen_tts("अस्सलामु अलैकुम, स्वागत है आज की हदीस में।", "intro_voice.mp3"): raise Exception("Intro TTS fail")

              if not get_music(): raise Exception("Music fail")

              intro_dur = MP3("intro_voice.mp3").info.length
              raw_dur = MP3("s_raw.mp3").info.length
              current_total = intro_dur + raw_dur + 4.0

              atempo = 1.0
              if current_total > 52.0:
                  atempo = current_total / 50.0
                  if atempo > 1.28:
                      raise Exception(f"Hadith too long ({current_total:.1f}s)")
              elif current_total < 12.0:
                  atempo = current_total / 14.0
                  if atempo < 0.78:
                      raise Exception(f"Hadith too short ({current_total:.1f}s)")

              send_tg(f"⏱️ Tempo: {atempo:.3f}x | Raw: {current_total:.1f}s")
              run_cmd(f'ffmpeg -y -i s_raw.mp3 -af "atempo={atempo:.4f},loudnorm=I=-16:TP=-1.5:LRA=11,volume=1.35" s_v.mp3')

              d1 = MP3("s_v.mp3").info.length
              total = intro_dur + d1 + 4.0

              if not (10.0 <= total <= 55.0):
                  raise Exception(f"Final duration {total:.1f}s out of range")

              bg_vid = get_multi_bg(total + 1.0)
              if not bg_vid: raise Exception("Background fail")

              run_cmd('ffmpeg -y -i intro_voice.mp3 -i s_v.mp3 -filter_complex "[0:a][1:a]concat=n=2:v=0:a=1[mainvoice]" -map "[mainvoice]" s_fullvoice.mp3')
              run_cmd('ffmpeg -y -i s_fullvoice.mp3 -i music_soft.mp3 -filter_complex "[0:a]volume=1.5,apad=pad_dur=4.0,asplit=2[fg_main][fg_side]; [1:a]volume=0.25[bg]; [bg][fg_side]sidechaincompress=threshold=0.05:ratio=10:attack=20:release=500[bg_ducked]; [fg_main][bg_ducked]amix=inputs=2:duration=first:dropout_transition=2[aout]" -map "[aout]" -c:a libmp3lame -b:a 192k s_final_audio.mp3')

              make_logo()
              fonts_dir = os.path.abspath(os.path.expanduser("~/.fonts"))
              date_str = datetime.datetime.now().strftime("%d %B %Y")

              # ==================== SUBTITLES (Left Side Alignment) ====================
              ass_text = "[Script Info]\n"
              ass_text += "ScriptType: v4.00+\n"
              ass_text += "PlayResX: 1080\n"
              ass_text += "PlayResY: 1920\n"
              ass_text += "WrapStyle: 0\n"
              ass_text += "ScaledBorderAndShadow: yes\n\n"
              ass_text += "[V4+ Styles]\n"
              ass_text += "Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding\n"
              
              # Alignment changed to 7 (Top-Left) and MarginL changed to 100 (to start from left)
              ass_text += "Style: Hook,Noto Sans,92,&H0000FFFF,&H000000FF,&H00000000,&H80000000,-1,0,0,0,100,100,0,0,1,8,3,7,100,100,0,1\n"
              ass_text += "Style: Intro,Noto Sans,72,&H00FFFFFF,&H000000FF,&H00000000,&H80000000,-1,0,0,0,100,100,0,0,1,5,2,7,100,100,0,1\n"
              ass_text += "Style: Arabic,Noto Naskh Arabic,88,&H00F0E6D2,&H000000FF,&H00000000,&H80000000,-1,0,0,0,100,100,0,0,1,5,2,7,100,100,500,1\n"
              ass_text += "Style: Hindi,Noto Sans Devanagari,74,&H00FFFFFF,&H0000FFFF,&H00000000,&H80000000,-1,0,0,0,100,100,0,0,1,4,2,7,100,100,750,1\n"
              ass_text += "Style: English,Noto Sans,58,&H00D0D0D0,&H0000FFFF,&H00000000,&H80000000,-1,0,0,0,100,100,0,0,1,3,2,7,100,100,950,1\n"
              ass_text += "Style: Outro,Noto Sans,80,&H00F0E6D2,&H000000FF,&H00000000,&H80000000,-1,0,0,0,100,100,0,0,1,5,2,7,100,100,0,1\n\n"
              ass_text += "[Events]\n"
              ass_text += "Format: Layer,Start,End,Style,Name,MarginL,MarginR,MarginV,Effect,Text\n"

              def ts(t):
                  h = int(t // 3600)
                  m = int((t % 3600) // 60)
                  s = int(t % 60)
                  cs = int((t % 1) * 100)
                  return f"{h}:{m:02d}:{s:02d}.{cs:02d}"

              # Added \an7 to Hook, Intro, and Outro to align them Left
              ass_text += f"Dialogue: 0,{ts(0)},{ts(2.4)},Hook,,0,0,0,,{{\\fad(400,400)\\an7\\pos(100,380)}}क्या आप जानते हैं?\n"
              ass_text += f"Dialogue: 0,{ts(2.4)},{ts(max(intro_dur-0.8, 3.8))},Intro,,0,0,0,,{{\\fad(400,400)\\an7\\pos(100,920)}}आज की हदीस\n"
              ass_text += f"Dialogue: 0,{ts(3.5)},{ts(intro_dur)},Intro,,0,0,0,,{{\\fad(400,400)\\an7\\pos(100,1050)}}{date_str}\n"

              # Color Palette (BGR Format)
              color_palette = ["&H00FFFF&", "&HFF00FF&", "&H00FF00&", "&H00A5FF&", "&HFFFF00&", "&HFF80FF&"]

              def typed(text, style, start, end, reset_color="&HFFFFFF&"):
                  words = sanitize(text).split()
                  if not words: return ""
                  
                  # Add 3 Balls
                  words[0] = "● ● ● " + words[0]
                  
                  wd = (end - start) / max(len(words), 1)
                  out = ""
                  t = start
                  
                  for w in words:
                      w_color = random.choice(color_palette)
                      out += f"Dialogue: 0,{ts(t)},{ts(t+wd)},{style},,0,0,0,,{{\\c{w_color}}}{w}{{\\c{reset_color}}}\n"
                      t += wd
                  return out

              with open("s_subs.ass", "w", encoding="utf-8") as f:
                  f.write(ass_text)
                  f.write(typed(h.get("arabic", ""), "Arabic", intro_dur, intro_dur + d1 - 0.3, "&HF0E6D2&"))
                  f.write(typed(hindi, "Hindi", intro_dur, intro_dur + d1 - 0.3, "&HFFFFFF&"))
                  f.write(typed(h["english"], "English", intro_dur, intro_dur + d1 - 0.3, "&HD0D0D0&"))
                  outro_start = intro_dur + d1
                  f.write(f"Dialogue: 0,{ts(outro_start)},{ts(outro_start+4)},Outro,,0,0,0,,{{\\fad(500,500)\\an7\\pos(100,780)}}JazakAllah Khair\n")
                  f.write(f"Dialogue: 0,{ts(outro_start)},{ts(outro_start+4)},Outro,,0,0,0,,{{\\fad(500,500)\\an7\\pos(100,920)\\c&H00FFFF&}}Subscribe for Daily Hadith\n")

              final = "Final_Global_Story.mp4"
              filters = "[0:v]scale=1200:2140:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.0004,1.06)':d=1:x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':s=1080x1920,setsar=1,eq=contrast=1.10:brightness=0.02:saturation=1.12,vignette=PI/5,noise=alls=8:allf=t[bg]; "
              
              if os.path.exists("avatar.png"):
                  filters += "[bg][2:v]overlay=W-w-40:40[vout]; "
                  logo_input = "-i avatar.png"
              else:
                  filters += "[bg]null[vout]; "
                  logo_input = ""
              
              filters += f"[vout]subtitles=s_subs.ass:fontsdir={fonts_dir},format=yuv420p[outv]"

              run_cmd(f'ffmpeg -y -i {bg_vid} -i s_final_audio.mp3 {logo_input} -filter_complex "{filters}" -map "[outv]" -map 1:a -c:v libx264 -preset veryfast -crf 17 -b:v 7M -c:a aac -b:a 192k -t {total:.2f} -movflags +faststart {final}')

              send_tg(f"✅ DONE → {total:.1f}s | {os.path.getsize(final)/1024/1024:.1f} MB")
              upload_drive(final)

              for f in ["s_raw.mp3", "s_v.mp3", "s_fullvoice.mp3", "s_final_audio.mp3", "s_subs.ass", "intro_voice.mp3", "music_raw.mp3", "music_soft.mp3", "avatar.png"]:
                  if os.path.exists(f):
                      try: os.remove(f)
                      except: pass
              for f in os.listdir("."):
                  if f.startswith(("vid_", "proc_")) or f == "bg_final.mp4":
                      try: os.remove(f)
                      except: pass

              send_tg("🎉 <b>STORY COMPLETED & UPLOADED</b>")

          except Exception as e:
              send_tg(f"❌ <b>FAILED</b>\n{str(e)}")
              report_api_status()
              sys.exit(1)
          PYEOF

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: morning-story
          path: Final_Global_Story.mp4
          retention-days: 5
          if-no-files-found: ignore
