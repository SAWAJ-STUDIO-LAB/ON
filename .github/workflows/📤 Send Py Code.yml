name: 📤 Code Transfer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transfer:
    name: 🚀 Transfer Code to All Files
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ▶️ Code1 (Story)
        run: python "Code editor/Code1"

      - name: ▶️ Code2 (Short)
        run: python "Code editor/Code2"

      - name: ▶️ Code3 (Long)
        run: python "Code editor/Code3"

      - name: ▶️ Code4 (Uploader)
        run: python "Code editor/Code4"

      - name: 📊 Count Transferred Files
        id: count
        run: |
          STORY=$(find sawajstudiobot/video_generator/fb_ig_story_video_generator -name "*.py" -size +0c 2>/dev/null | wc -l)
          SHORT=$(find sawajstudiobot/video_generator/fb_ig_yt_short_video_generator -name "*.py" -size +0c 2>/dev/null | wc -l)
          LONG=$(find sawajstudiobot/video_generator/fb_yt_long_video_generator -name "*.py" -size +0c 2>/dev/null | wc -l)
          UPL=$(find sawajstudiobot/video_uploader -name "*.py" -size +0c 2>/dev/null | wc -l)
          echo "story=$STORY" >> $GITHUB_OUTPUT
          echo "short=$SHORT" >> $GITHUB_OUTPUT
          echo "long=$LONG" >> $GITHUB_OUTPUT
          echo "uploader=$UPL" >> $GITHUB_OUTPUT
          echo "═══════════════════════════"
          echo "Story:    $STORY files with code"
          echo "Short:    $SHORT files with code"
          echo "Long:     $LONG files with code"
          echo "Uploader: $UPL files with code"
          echo "═══════════════════════════"

      - name: 📤 Commit Changes
        run: |
          git config user.name "SawajBot"
          git config user.email "bot@sawajstudio.com"
          git add .
          git commit -m "✅ Code transfer complete — Story + Short + Long + Uploader" || echo "No changes"
          git push

      - name: 📱 Send Telegram Report
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          STORY: ${{ steps.count.outputs.story }}
          SHORT: ${{ steps.count.outputs.short }}
          LONG: ${{ steps.count.outputs.long }}
          UPL: ${{ steps.count.outputs.uploader }}
          RUN_NUM: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "⚠️ Telegram secrets missing"
            exit 0
          fi

          MSG="📤 <b>CODE TRANSFER COMPLETE</b>
          ━━━━━━━━━━━━━━━━━━━━━
          📊 <b>Run #${RUN_NUM}</b>
          📦 <code>${REPO}</code>
          ━━━━━━━━━━━━━━━━━━━━━

          ✅ <b>Files with Code:</b>
          📖 Story:    <b>${STORY}</b>
          🎬 Short:    <b>${SHORT}</b>
          🎥 Long:     <b>${LONG}</b>
          📤 Uploader: <b>${UPL}</b>

          ━━━━━━━━━━━━━━━━━━━━━
          🎉 <b>All transfers successful</b>
          🕐 $(date -u '+%Y-%m-%d %H:%M UTC')"

          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            -d "text=${MSG}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            -o /dev/null -w "HTTP %{http_code}\n"

      - name: ✅ Summary
        run: |
          echo "## ✅ Code Transfer Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Module | Files with Code |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|----------------|" >> $GITHUB_STEP_SUMMARY
          echo "| 📖 Story | ${{ steps.count.outputs.story }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎬 Short | ${{ steps.count.outputs.short }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎥 Long | ${{ steps.count.outputs.long }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📤 Uploader | ${{ steps.count.outputs.uploader }} |" >> $GITHUB_STEP_SUMMARY
