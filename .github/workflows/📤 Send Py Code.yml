name: 📤 Send Py Code

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 🚀 Send Code to All Files
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ▶️ Run 1send_code.py (A_core)
        run: python "_temp_builder/1send_code.py"

      - name: 🧹 Delete Builder Folder
        run: |
          rm -rf _temp_builder
          echo "✅ Builder folder deleted"

      - name: 📤 Commit Changes
        run: |
          git config user.name "SawajBot"
          git config user.email "bot@sawajstudio.com"
          git add .
          git commit -m "🤖 A_core code injected" || echo "No changes"
          git push

      - name: ✅ Summary
        run: |
          echo "## ✅ A_core Code Injected" >> $GITHUB_STEP_SUMMARY
          echo "All A_core files populated successfully." >> $GITHUB_STEP_SUMMARY
