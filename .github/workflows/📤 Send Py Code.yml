name: 📤 Code Transfer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transfer:
    name: 🚀 Transfer Code to All Files
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ▶️ Code1 (Story)
        run: python "Code editor/Code1"

      - name: ▶️ Code2 (Short)
        run: python "Code editor/Code2"

      - name: ▶️ Code3 (Long)
        run: python "Code editor/Code3"

      - name: ▶️ Code4 (Uploader)
        run: python "Code editor/Code4"

      - name: 📤 Commit Changes
        run: |
          git config user.name "SawajBot"
          git config user.email "bot@sawajstudio.com"
          git add .
          git commit -m "✅ Code transfer complete — Story + Short + Long + Uploader" || echo "No changes"
          git push

      - name: ✅ Summary
        run: |
          echo "## ✅ Code Transfer Complete" >> $GITHUB_STEP_SUMMARY
          echo "| Module | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 📖 Story | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎬 Short | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎥 Long | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| 📤 Uploader | ✅ |" >> $GITHUB_STEP_SUMMARY
