          SF["C_content/C34_bg_main.py"] = '"""C34_bg_main — background main."""\nimport os\nfrom C_content.C29_bg_pexels import fetch as px\nfrom C_content.C30_bg_pixabay import fetch as pb\nfrom C_content.C31_bg_process import process\nfrom C_content.C32_bg_gradient import generate\n\n\ndef get(base, duration, outfile="bg.mp4"):\n    total_dur = duration + 5\n    if os.environ.get("PEXELS_API_KEY") and px(base, total_dur, "tmp.mp4"):\n        process(base, "tmp.mp4", outfile, total_dur)\n        return outfile\n    if os.environ.get("PIXABAY_API_KEY") and pb(base):\n        process(base, "tmp_bg.mp4", outfile, total_dur)\n        return outfile\n    generate(base, total_dur, outfile)\n    return outfile\n'
          SF["C_content/C35_logo_make.py"] = '"""C35_logo_make — logo make."""\nimport os\nfrom PIL import Image, ImageDraw, ImageFilter\n\n\ndef make(outfile="avatar.png"):\n    for src in ["logo.png", "logo.jpg", "assets/logo.png",\n                "sawajstudiobot/video_requirement/logo.png"]:\n        if os.path.exists(src):\n            try:\n                img = Image.open(src).convert("RGBA")\n                if img.width > 400:\n                    ratio = 400 / img.width\n                    img = img.resize((400, int(img.height * ratio)), Image.Resampling.LANCZOS)\n                border, bottom = 12, 26\n                nw = img.width + border * 2\n                nh = img.height + border + bottom\n                canvas = Image.new("RGBA", (nw, nh), (0, 0, 0, 0))\n                draw = ImageDraw.Draw(canvas)\n                draw.rectangle([0, 0, nw-1, nh-1], outline=(212, 175, 55, 255), width=border)\n                draw.rectangle([0, nh-bottom, nw-1, nh-1], fill=(20, 15, 8, 245))\n                canvas.paste(img, (border, border), img)\n                glow = canvas.filter(ImageFilter.GaussianBlur(6))\n                final = Image.alpha_composite(glow, canvas)\n                final.save(outfile)\n                return True\n            except Exception:\n                continue\n    return False\n'
