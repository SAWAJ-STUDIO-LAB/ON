          LF["C_content/C11_chapters.py"] = '"""C11."""\n\n\nclass ChapterGenerator:\n    def build(self, section_durations):\n        chapters = []\n        current = 0.0\n        for title, dur in section_durations.items():\n            m = int(current // 60)\n            s = int(current % 60)\n            chapters.append({"time_str": f"{m:02d}:{s:02d}", "seconds": current, "title": title})\n            current += dur\n        return chapters\n\n    def format_list(self, chapters):\n        return [f"{c[\'time_str\']} - {c[\'title\']}" for c in chapters]\n'
          LF["C_content/C12_subtitles.py"] = '"""C12."""\nimport os\n\n\ndef _fmt(sec):\n    h = int(sec // 3600)\n    m = int((sec % 3600) // 60)\n    s = int(sec % 60)\n    ms = int((sec - int(sec)) * 1000)\n    return f"{h:02d}:{m:02d}:{s:02d},{ms:03d}"\n\n\nclass SubtitleGenerator:\n    def create_srt(self, segments, output_path):\n        if not segments:\n            return False\n        try:\n            os.makedirs(os.path.dirname(output_path), exist_ok=True)\n            with open(output_path, "w", encoding="utf-8") as f:\n                for i, seg in enumerate(segments, 1):\n                    f.write(f"{i}\\n{_fmt(seg[\'start\'])} --> {_fmt(seg[\'end\'])}")\n                    f.write(f"\\n{seg[\'text\']}\\n\\n")\n            return True\n        except Exception:\n            return False\n\n    def from_text(self, text, total_duration, output_path, chunk_words=8):\n        if not text or total_duration <= 0:\n            return False\n        words = text.split()\n        chunks = [" ".join(words[i:i+chunk_words]) for i in range(0, len(words), chunk_words)]\n        if not chunks:\n            return False\n        seg_dur = total_duration / len(chunks)\n        segments = [{"start": i * seg_dur, "end": (i + 1) * seg_dur, "text": c} for i, c in enumerate(chunks)]\n        return self.create_srt(segments, output_path)\n'
