          UF["instagram/ig_short_main.py"] = '"""ig_short_main."""\nimport os\nimport time\nimport requests\n\n\ndef upload(video_path, caption="", direct_url=None):\n    token = os.environ.get("FACEBOOK_INSTAGRAM_META_TOKEN", "").strip()\n    ig_id = os.environ.get("INSTAGRAM_BUSINESS_ACCOUNT_ID", "").strip()\n    if not token or not ig_id or not direct_url:\n        return False\n    cont = requests.post(f"https://graph.facebook.com/v21.0/{ig_id}/media",\n                         data={"media_type": "REELS", "video_url": direct_url, "caption": caption, "access_token": token}, timeout=30).json()\n    cid = cont.get("id")\n    if not cid:\n        return False\n    for _ in range(45):\n        time.sleep(6)\n        st = requests.get(f"https://graph.facebook.com/v21.0/{cid}",\n                          params={"fields": "status_code", "access_token": token}, timeout=12).json()\n        if st.get("status_code") == "FINISHED":\n            break\n        if st.get("status_code") == "ERROR":\n            return False\n    pub = requests.post(f"https://graph.facebook.com/v21.0/{ig_id}/media_publish",\n                        data={"creation_id": cid, "access_token": token}, timeout=18).json()\n    return bool(pub.get("id"))\n'
