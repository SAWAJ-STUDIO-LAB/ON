name: 📤 Code Transfer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transfer:
    name: 🚀 Auto Structure + Code Transfer
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔨 Auto Create Folders + Files + Code
        run: |
          python << 'PYEOF'
          import os

          def write(base, rel, content):
              full = os.path.join(base, rel)
              os.makedirs(os.path.dirname(full) or base, exist_ok=True)
              with open(full, "w", encoding="utf-8") as f:
                  f.write(content)
              return 1

          def build(base, files, label):
              count = 0
              for rel, content in files.items():
                  count += write(base, rel, content)
              print(f"✅ {label}: {count} files")
              return count

          # ═══════════════════════════════════════════════════
          # 📖 STORY GENERATOR
          # ═══════════════════════════════════════════════════
          STORY = "sawajstudiobot/video_generator/fb_ig_story_video_generator"
          SF = {}

          # Output dirs
          SF["output/final/.gitkeep"] = ""
          SF["output/temp/.gitkeep"] = ""
          SF["__init__.py"] = '"""Story generator package."""\n'

          # ─── A_core ───
          SF["A_core/__init__.py"] = '"""A_core package."""\n'
          SF["A_core/A1_env_loader.py"] = '"""A1_env_loader — env var load."""\nimport os\n\n\ndef get_env(name, default=""):\n    """Get env var and strip whitespace."""\n    return os.environ.get(name, default).strip()\n'
          SF["A_core/A2_env_fallback.py"] = '"""A2_env_fallback — multi-name fallback."""\nimport os\n\n\ndef get_env_fallback(*names, default=""):\n    """Try multiple env names, return first non-empty."""\n    for name in names:\n        val = os.environ.get(name, "").strip()\n        if val:\n            return val\n    return default\n'
