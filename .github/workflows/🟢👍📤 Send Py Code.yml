          SF["C_content/C27_music_main.py"] = '"""C27_music_main."""\nimport os\nfrom A_core.A9_log_step import log_step\nfrom C_content.C22_music_freesound import fetch as fs_fetch\nfrom C_content.C23_music_pixabay import fetch as px_fetch\nfrom C_content.C24_music_bensound import fetch as bs_fetch\nfrom C_content.C25_music_process import process\nfrom C_content.C26_music_sine import generate\n\n\ndef get(base, outfile="music_soft.mp3"):\n    if os.environ.get("FREESOUND_API_KEY") and fs_fetch(base, outfile):\n        process(base, "music_raw.mp3", outfile)\n        return outfile\n    if px_fetch(base):\n        process(base, "music_raw.mp3", outfile)\n        return outfile\n    if bs_fetch(base):\n        process(base, "music_raw.mp3", outfile)\n        return outfile\n    generate(base, outfile)\n    return outfile\n'
          SF["C_content/C28_bg_scale_filter.py"] = '"""C28_bg_scale_filter."""\nTARGET_W, TARGET_H = 1080, 1920\nDARKEN_FILTER = "eq=contrast=1.10:brightness=0.02:saturation=1.12,vignette=PI/5"\n\n\ndef build():\n    return (f"scale=1200:2140:force_original_aspect_ratio=increase,"\n            f"crop={TARGET_W}:{TARGET_H},"\n            f"zoompan=z=\'min(zoom+0.0004,1.06)\':d=1:"\n            f"x=\'iw/2-(iw/zoom/2)\':y=\'ih/2-(ih/zoom/2)\':s={TARGET_W}x{TARGET_H},"\n            f"setsar=1,{DARKEN_FILTER}")\n'
          SF["C_content/C29_bg_pexels.py"] = '"""C29_bg_pexels."""\nimport os\nimport random\n\n\ndef fetch(base, total_dur, outfile):\n    key = os.environ.get("PEXELS_API_KEY")\n    if not key:\n        return False\n    queries = ["islamic architecture night", "mosque night", "night sky stars"]\n    for q in random.sample(queries, min(3, len(queries))):\n        try:\n            r = base.session.get("https://api.pexels.com/videos/search",\n                                 params={"query": q, "orientation": "portrait", "per_page": 6},\n                                 headers={"Authorization": key}, timeout=14)\n            if r.status_code != 200:\n                continue\n            vids = r.json().get("videos", [])\n            if not vids:\n                continue\n            video = random.choice(vids)\n            files = sorted(video.get("video_files", []), key=lambda x: x.get("width", 0), reverse=True)\n            if files and base.download(files[0].get("link"), "tmp_bg.mp4", 50000):\n                return True\n        except Exception:\n            continue\n    return False\n'
          SF["C_content/C30_bg_pixabay.py"] = '"""C30_bg_pixabay."""\nimport os\nimport random\n\n\ndef fetch(base):\n    key = os.environ.get("PIXABAY_API_KEY")\n    if not key:\n        return False\n    try:\n        r = base.session.get("https://pixabay.com/api/videos/",\n                             params={"key": key, "q": "mosque night", "orientation": "vertical",\n                                     "per_page": 10, "safesearch": "true"}, timeout=14)\n        if r.status_code != 200:\n            return False\n        hits = r.json().get("hits", [])\n        if not hits:\n            return False\n        hit = random.choice(hits)\n        v = hit.get("videos", {})\n        url = v.get("large", {}).get("url") or v.get("medium", {}).get("url")\n        if url and base.download(url, "tmp_bg.mp4", 50000):\n            return True\n    except Exception:\n        pass\n    return False\n'
          SF["C_content/C31_bg_process.py"] = '"""C31_bg_process."""\nimport os\nfrom C_content.C28_bg_scale_filter import build\n\n\ndef process(base, infile, outfile, duration):\n    cmd = (f\'ffmpeg -y -stream_loop -1 -i "{infile}" \'\n           f\'-vf "{build()}" -t {duration:.2f} -an \'\n           f\'-c:v libx264 -preset veryfast -crf 20 "{outfile}"\')\n    base.run_cmd(cmd)\n    try:\n        if os.path.exists(infile):\n            os.remove(infile)\n    except Exception:\n        pass\n'
