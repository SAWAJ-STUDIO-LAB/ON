      - name: 📊 Count Files
        id: count
        run: |
          S=$(find sawajstudiobot/video_generator/fb_ig_story_video_generator -name "*.py" -size +0c | wc -l)
          SH=$(find sawajstudiobot/video_generator/fb_ig_yt_short_video_generator -name "*.py" -size +0c | wc -l)
          L=$(find sawajstudiobot/video_generator/fb_yt_long_video_generator -name "*.py" -size +0c | wc -l)
          U=$(find sawajstudiobot/video_uploader -name "*.py" -size +0c | wc -l)
          echo "s=$S" >> $GITHUB_OUTPUT
          echo "sh=$SH" >> $GITHUB_OUTPUT
          echo "l=$L" >> $GITHUB_OUTPUT
          echo "u=$U" >> $GITHUB_OUTPUT

      - name: 📤 Commit
        run: |
          git config user.name "SawajBot"
          git config user.email "bot@sawajstudio.com"
          git add .
          git commit -m "✅ Auto structure + code transfer complete" || echo "No changes"
          git push

      - name: 📱 Telegram
        env:
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          S: ${{ steps.count.outputs.s }}
          SH: ${{ steps.count.outputs.sh }}
          L: ${{ steps.count.outputs.l }}
          U: ${{ steps.count.outputs.u }}
        run: |
          if [ -z "$TG" ] || [ -z "$CHAT" ]; then exit 0; fi
          MSG="✅ <b>STRUCTURE + CODE DONE</b>
          ━━━━━━━━━━━━━━━
          📖 Story:    <b>$S</b>
          🎬 Short:    <b>$SH</b>
          🎥 Long:     <b>$L</b>
          📤 Uploader: <b>$U</b>
          ━━━━━━━━━━━━━━━
          🕐 $(date -u '+%H:%M UTC')"
          curl -s -X POST "https://api.telegram.org/bot${TG}/sendMessage" \
            -d "chat_id=${CHAT}" -d "text=${MSG}" -d "parse_mode=HTML" -o /dev/null

      - name: ✅ Summary
        run: |
          echo "## ✅ Structure + Code Complete" >> $GITHUB_STEP_SUMMARY
          echo "| Module | Files |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 📖 Story | ${{ steps.count.outputs.s }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎬 Short | ${{ steps.count.outputs.sh }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎥 Long | ${{ steps.count.outputs.l }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📤 Uploader | ${{ steps.count.outputs.u }} |" >> $GITHUB_STEP_SUMMARY
