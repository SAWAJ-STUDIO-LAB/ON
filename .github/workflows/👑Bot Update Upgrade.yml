name: 👑 Bot Update Upgrade — KING

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'

permissions:
  contents: write

jobs:
  king:
    name: 👑 King Working
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Packages
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 👑 Run King
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_AI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_AI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_AI }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY_AI }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY_AI }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY_AI }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY_AI }}
        run: python "bot update upgrade/king.py"

      - name: 📤 Commit
        if: always()
        run: |
          git config user.name "SawajBot King"
          git config user.email "king@sawajstudio.com"
          git add -A
          git commit -m "👑 King upgraded the bot — $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "No changes"
          git push || echo "Push failed or nothing to push"

      - name: ✅ Summary
        if: always()
        run: |
          echo "## 👑 King Working Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Check **Telegram** for full report." >> $GITHUB_STEP_SUMMARY
          echo "- Check **Actions log** for details." >> $GITHUB_STEP_SUMMARY
