name: 👑 SawajStudioBot AI Developer

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode select karo'
        required: true
        default: 'analyze_and_fix'
        type: choice
        options:
          - analyze_and_fix
          - fix_bot_code_editor
          - fix_sawajstudiobot
          - full_upgrade

permissions:
  contents: write
  actions: write

jobs:
  ai_developer:
    name: 👑 AI Developer Working
    runs-on: ubuntu-latest
    timeout-minutes: 720

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TOKEN_GITHUB }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Requirements
        run: |
          pip install requests pyyaml

      - name: 💾 Create Backup Branch
        run: |
          BACKUP="backup-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BACKUP"
          git push origin "$BACKUP"
          git checkout main
          echo "✅ Backup branch created: $BACKUP"
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}

      - name: 👑 Run AI Developer Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_AI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_AI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_AI }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY_AI }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY_AI }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY_AI }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY_AI }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY_AI }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          MODE: ${{ inputs.mode }}
        run: |
          cat << 'EOFPY' > /tmp/ai_dev.py
          import os, re, ast, json, time, requests, sys
          from datetime import datetime

          BOT_ROOT = "sawajstudiobot"
          EDITOR_ROOT = "Bot_code editor"
          WORKFLOW_ROOT = ".github/workflows"

          SKIP = ("__pycache__", ".git", "output", "_work",
                  "_backups", "_logs", "venv", "node_modules",
                  "_temp_builder", ".pytest_cache")

          TIMEOUT = 600
          AIS = ["Gemini", "Groq", "OpenRouter", "Mistral",
                 "Cerebras", "NVIDIA", "Cohere"]

          # ═══════════════════════════════════════════
          # TELEGRAM
          # ═══════════════════════════════════════════
          def tg(msg, silent=False):
              t = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
              c = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
              if not t or not c: return
              try:
                  # Split message if too long
                  chunks = [msg[i:i+3800] for i in range(0, len(msg), 3800)]
                  for chunk in chunks:
                      requests.post(
                          f"https://api.telegram.org/bot{t}/sendMessage",
                          json={"chat_id": c, "text": chunk,
                                "parse_mode": "HTML",
                                "disable_web_page_preview": True,
                                "disable_notification": silent},
                          timeout=15)
              except Exception as e:
                  print(f"TG error: {e}")

          # ═══════════════════════════════════════════
          # SKIP CHECK
          # ═══════════════════════════════════════════
          def should_skip(path):
              p = path.replace("\\", "/")
              return any(s in p for s in SKIP)

          # ═══════════════════════════════════════════
          # SCAN FOLDER
          # ═══════════════════════════════════════════
          def scan_folder(root):
              files_data = {}
              tree_lines = [f"{root}/"]
              if not os.path.exists(root):
                  return files_data, "\n".join(tree_lines)

              for dirpath, dirs, fnames in os.walk(root):
                  dirs[:] = [d for d in dirs if not should_skip(
                      os.path.join(dirpath, d))]
                  rel_dir = os.path.relpath(dirpath, root)
                  depth = 0 if rel_dir == "." else rel_dir.count(os.sep) + 1
                  indent = "  " * depth
                  if rel_dir != ".":
                      tree_lines.append(f"{indent}├── {os.path.basename(dirpath)}/")

                  for fn in fnames:
                      full = os.path.join(dirpath, fn)
                      if should_skip(full): continue
                      if not (fn.endswith(".py") or fn.endswith(".yml")
                              or fn.endswith(".yaml")
                              or fn.endswith(".txt")
                              or fn.endswith(".md")
                              or fn.endswith(".json")
                              or fn.endswith(".toml")
                              or fn.endswith(".cfg")):
                          continue
                      rel = os.path.relpath(full, root)
                      try:
                          with open(full, "r", encoding="utf-8") as f:
                              content = f.read()
                      except Exception:
                          content = ""
                      files_data[rel] = content
                      tree_lines.append(f"{indent}   ├── {fn}")

              return files_data, "\n".join(tree_lines)

          # ═══════════════════════════════════════════
          # HTTP POST
          # ═══════════════════════════════════════════
          def post(url, headers, payload, timeout=TIMEOUT):
              try:
                  r = requests.post(url, headers=headers,
                                    json=payload, timeout=timeout)
                  if r.status_code == 200:
                      return r.json()
                  else:
                      print(f"HTTP {r.status_code}: {r.text[:200]}")
              except Exception as e:
                  print(f"POST error: {e}")
              return None

          # ═══════════════════════════════════════════
          # AI CALLS (with fallback)
          # ═══════════════════════════════════════════
          def call_ai(ai_name, prompt, max_tokens=16384):
              try:
                  if ai_name == "Gemini":
                      k = os.environ.get("GEMINI_API_KEY", "").strip()
                      if not k: return None
                      for model in ["gemini-2.0-flash-exp",
                                    "gemini-1.5-flash",
                                    "gemini-1.5-pro"]:
                          d = post(
                              f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={k}",
                              {"Content-Type": "application/json"},
                              {"contents": [{"parts": [{"text": prompt}]}],
                               "generationConfig": {
                                   "maxOutputTokens": max_tokens,
                                   "temperature": 0.3}})
                          if d and "candidates" in d:
                              try:
                                  return d["candidates"][0]["content"]["parts"][0]["text"]
                              except: pass

                  elif ai_name == "Groq":
                      k = os.environ.get("GROQ_API_KEY", "").strip()
                      if not k: return None
                      d = post("https://api.groq.com/openai/v1/chat/completions",
                               {"Authorization": f"Bearer {k}"},
                               {"model": "llama-3.3-70b-versatile",
                                "messages": [{"role": "user", "content": prompt}],
                                "max_tokens": min(max_tokens, 8000),
                                "temperature": 0.3})
                      if d and "choices" in d:
                          return d["choices"][0]["message"]["content"]

                  elif ai_name == "OpenRouter":
                      k = os.environ.get("OPENROUTER_API_KEY", "").strip()
                      if not k: return None
                      d = post("https://openrouter.ai/api/v1/chat/completions",
                               {"Authorization": f"Bearer {k}",
                                "HTTP-Referer": "https://github.com/SAWAJ-STUDIO-LAB",
                                "X-Title": "SawajStudioBot"},
                               {"model": "openai/gpt-4o-mini",
                                "messages": [{"role": "user", "content": prompt}],
                                "max_tokens": min(max_tokens, 8000),
                                "temperature": 0.3})
                      if d and "choices" in d:
                          return d["choices"][0]["message"]["content"]

                  elif ai_name == "Mistral":
                      k = os.environ.get("MISTRAL_API_KEY", "").strip()
                      if not k: return None
                      d = post("https://api.mistral.ai/v1/chat/completions",
                               {"Authorization": f"Bearer {k}"},
                               {"model": "mistral-small-latest",
                                "messages": [{"role": "user", "content": prompt}],
                                "max_tokens": min(max_tokens, 8000),
                                "temperature": 0.3})
                      if d and "choices" in d:
                          return d["choices"][0]["message"]["content"]

                  elif ai_name == "Cerebras":
                      k = os.environ.get("CEREBRAS_API_KEY", "").strip()
                      if not k: return None
                      d = post("https://api.cerebras.ai/v1/chat/completions",
                               {"Authorization": f"Bearer {k}"},
                               {"model": "llama-3.3-70b",
                                "messages": [{"role": "user", "content": prompt}],
                                "max_tokens": min(max_tokens, 8000),
                                "temperature": 0.3})
                      if d and "choices" in d:
                          return d["choices"][0]["message"]["content"]

                  elif ai_name == "NVIDIA":
                      k = os.environ.get("NVIDIA_API_KEY", "").strip()
                      if not k: return None
                      d = post("https://integrate.api.nvidia.com/v1/chat/completions",
                               {"Authorization": f"Bearer {k}"},
                               {"model": "meta/llama-3.3-70b-instruct",
                                "messages": [{"role": "user", "content": prompt}],
                                "max_tokens": min(max_tokens, 8000),
                                "temperature": 0.3})
                      if d and "choices" in d:
                          return d["choices"][0]["message"]["content"]

                  elif ai_name == "Cohere":
                      k = os.environ.get("COHERE_API_KEY", "").strip()
                      if not k: return None
                      d = post("https://api.cohere.com/v1/chat",
                               {"Authorization": f"Bearer {k}",
                                "Content-Type": "application/json"},
                               {"model": "command-r-plus",
                                "message": prompt})
                      if d and "text" in d:
                          return d["text"]

              except Exception as e:
                  print(f"AI {ai_name} error: {e}")
              return None

          # ═══════════════════════════════════════════
          # SAFE CODE WRITER
          # ═══════════════════════════════════════════
          def is_valid_python(code):
              """Check if Python code is syntactically valid."""
              try:
                  ast.parse(code)
                  return True
              except SyntaxError as e:
                  print(f"Syntax error: {e}")
                  return False

          def is_valid_yaml(code):
              """Check if YAML is valid."""
              try:
                  import yaml
                  yaml.safe_load(code)
                  return True
              except Exception as e:
                  print(f"YAML error: {e}")
                  return False

          def save_file(base_root, rel_path, content):
              """Save file with syntax validation."""
              # Security check
              if ".." in rel_path or rel_path.startswith("/"):
                  print(f"❌ Unsafe path: {rel_path}")
                  return False

              # Skip check
              if should_skip(rel_path):
                  print(f"⏭️  Skipping: {rel_path}")
                  return False

              # Syntax check
              if rel_path.endswith(".py"):
                  if not is_valid_python(content):
                      print(f"❌ Invalid Python: {rel_path}")
                      return False
              elif rel_path.endswith((".yml", ".yaml")):
                  if not is_valid_yaml(content):
                      print(f"❌ Invalid YAML: {rel_path}")
                      return False

              # Save
              full_path = os.path.join(base_root, rel_path)
              os.makedirs(os.path.dirname(full_path), exist_ok=True)
              try:
                  with open(full_path, "w", encoding="utf-8") as f:
                      f.write(content.rstrip() + "\n")
                  print(f"✅ Saved: {full_path}")
                  return True
              except Exception as e:
                  print(f"❌ Save error: {e}")
                  return False

          # ═══════════════════════════════════════════
          # PARSE AI RESPONSE
          # ═══════════════════════════════════════════
          def parse_ai_response(text):
              """Extract files from AI response using markers."""
              pattern = r"═══\s*FILE:\s*(.+?)\s*═══\s*\n(.*?)\n\s*═══\s*END FILE\s*═══"
              matches = re.findall(pattern, text, re.DOTALL)
              return [(p.strip(), c.strip()) for p, c in matches]

          # ═══════════════════════════════════════════
          # MAIN
          # ═══════════════════════════════════════════
          def main():
              mode = os.environ.get("MODE", "analyze_and_fix")
              start_time = time.time()

              tg(f"👑 <b>AI DEVELOPER STARTED</b>\n🎯 Mode: <b>{mode}</b>\n🕐 {datetime.now().strftime('%H:%M:%S')}", silent=True)

              # ───── SCAN ALL FOLDERS ─────
              editor_files, editor_tree = scan_folder(EDITOR_ROOT)
              bot_files, bot_tree = scan_folder(BOT_ROOT)
              wf_files, wf_tree = scan_folder(WORKFLOW_ROOT)

              total_files = len(editor_files) + len(bot_files) + len(wf_files)

              tg(f"""📊 <b>REPOSITORY SCAN COMPLETE</b>

          📁 <b>Bot_code editor/</b> — {len(editor_files)} files
          📁 <b>sawajstudiobot/</b> — {len(bot_files)} files
          📁 <b>.github/workflows/</b> — {len(wf_files)} files

          📦 <b>Total: {total_files} files</b>

          <b>EDITOR TREE:</b>
          <pre>{editor_tree[:1500]}</pre>

          <b>BOT TREE (first 40 lines):</b>
          <pre>{chr(10).join(bot_tree.split(chr(10))[:40])}</pre>
          """)

              # ───── MODE SELECTION ─────
              files_to_process = {}

              if mode == "fix_bot_code_editor":
                  files_to_process = {f"{EDITOR_ROOT}/{k}": v
                                      for k, v in editor_files.items()}
              elif mode == "fix_sawajstudiobot":
                  files_to_process = {f"{BOT_ROOT}/{k}": v
                                      for k, v in bot_files.items()}
              elif mode == "full_upgrade":
                  files_to_process = {
                      **{f"{EDITOR_ROOT}/{k}": v for k, v in editor_files.items()},
                      **{f"{BOT_ROOT}/{k}": v for k, v in bot_files.items()},
                      **{f"{WORKFLOW_ROOT}/{k}": v for k, v in wf_files.items()},
                  }
              else:  # analyze_and_fix
                  files_to_process = {
                      **{f"{BOT_ROOT}/{k}": v for k, v in bot_files.items()},
                  }

              if not files_to_process:
                  tg("⚠️ No files to process!")
                  return

              # ───── BATCH PROCESSING ─────
              file_items = list(files_to_process.items())
              BATCH_SIZE = 4
              total_updated = 0
              failed_batches = []

              tg(f"🚀 <b>Processing {len(file_items)} files in batches of {BATCH_SIZE}...</b>")

              for i in range(0, len(file_items), BATCH_SIZE):
                  batch = file_items[i:i+BATCH_SIZE]
                  batch_num = (i // BATCH_SIZE) + 1
                  total_batches = (len(file_items) + BATCH_SIZE - 1) // BATCH_SIZE

                  tg(f"📦 <b>Batch {batch_num}/{total_batches}</b> — Processing {len(batch)} files...", silent=True)

                  # Build bundled code
                  bundled = ""
                  for path, code in batch:
                      bundled += f"\n═══ FILE: {path} ═══\n"
                      bundled += code if code.strip() else "# [EMPTY FILE - WRITE FULL PRODUCTION CODE]"
                      bundled += "\n═══ END FILE ═══\n"

                  # Build prompt
                  prompt = f"""You are the LEAD AI ARCHITECT for "SawajStudioBot" — an automated Islamic video generation system.

          ═══════════════════════════════════════════
          YOUR MISSION
          ═══════════════════════════════════════════
          Analyze the files below, FIND ALL PROBLEMS, and FIX them with production-grade code.

          ═══════════════════════════════════════════
          WHAT TO LOOK FOR (PROBLEMS TO FIX)
          ═══════════════════════════════════════════
          1. ❌ Bugs, logic errors, edge cases
          2. ❌ Missing error handling / try-except
          3. ❌ Hardcoded values (should be config)
          4. ❌ Missing type hints
          5. ❌ Missing docstrings
          6. ❌ Bad variable names
          7. ❌ Duplicate code
          8. ❌ API failures without fallback
          9. ❌ Missing logging
          10. ❌ Security issues
          11. ❌ Performance bottlenecks
          12. ❌ Incomplete functions (pass / TODO)
          13. ❌ Wrong API URLs
          14. ❌ Missing imports
          15. ❌ Inconsistent code style

          ═══════════════════════════════════════════
          CRITICAL RULES
          ═══════════════════════════════════════════
          1. ✅ ZERO DELETION — keep ALL existing classes, functions, and logic
          2. ✅ ENHANCE — add error handling, type hints, logging, docstrings
          3. ✅ FIX BUGS — correct all issues you find
          4. ✅ EMPTY FILES — write complete production code
          5. ✅ RETURN ALL FILES — do not skip any file in this batch
          6. ✅ VALID SYNTAX — code must compile (Python: valid AST, YAML: valid YAML)
          7. ❌ NO PLACEHOLDERS — no "# ... rest of code" or "pass  # TODO"
          8. ❌ NO MARKDOWN FENCES — no ```python``` wrappers

          ═══════════════════════════════════════════
          PROJECT STRUCTURE
          ═══════════════════════════════════════════
          <bot_structure>
          {bot_tree[:3000]}
          </bot_structure>

          ═══════════════════════════════════════════
          FILES IN THIS BATCH ({len(batch)})
          ═══════════════════════════════════════════
          {bundled}

          ═══════════════════════════════════════════
          RESPONSE FORMAT (MANDATORY)
          ═══════════════════════════════════════════
          For EACH file, respond with:

          ═══ FILE: <relative/path/to/file.py> ═══
          <complete fixed code here>
          ═══ END FILE ═══

          Begin now. Return ALL {len(batch)} files."""

                  # Try each AI
                  success = False
                  response_text = None
                  used_ai = None

                  for ai in AIS:
                      print(f"  → Trying {ai}...")
                      res = call_ai(ai, prompt)
                      if res and len(res) > 100:
                          response_text = res
                          used_ai = ai
                          success = True
                          print(f"  ✅ {ai} responded ({len(res)} chars)")
                          break
                      else:
                          print(f"  ❌ {ai} failed")

                  if not success:
                      print(f"  ❌ All AIs failed for batch {batch_num}")
                      failed_batches.append(batch_num)
                      continue

                  # Parse response
                  parsed = parse_ai_response(response_text)
                  print(f"  📄 Parsed {len(parsed)} files from {used_ai}")

                  # Save each file
                  batch_saved = 0
                  for rel_path, code in parsed:
                      # Determine base root
                      if rel_path.startswith(EDITOR_ROOT):
                          base_root = "."
                          actual_path = rel_path[len(EDITOR_ROOT)+1:]
                      elif rel_path.startswith(BOT_ROOT):
                          base_root = "."
                          actual_path = rel_path[len(BOT_ROOT)+1:]
                      elif rel_path.startswith(".github/workflows"):
                          base_root = "."
                          actual_path = rel_path[len(".github/workflows")+1:]
                      else:
                          # Try to figure out
                          if rel_path.startswith("Bot_code editor"):
                              base_root = "."
                              actual_path = rel_path[len("Bot_code editor")+1:]
                          elif rel_path.startswith("sawajstudiobot"):
                              base_root = "."
                              actual_path = rel_path[len("sawajstudiobot")+1:]
                          else:
                              # Assume relative to BOT_ROOT
                              base_root = BOT_ROOT
                              actual_path = rel_path

                      # Save
                      target_root = base_root if base_root != "." else rel_path.split("/")[0]
                      inner_path = "/".join(rel_path.split("/")[1:]) if "/" in rel_path else rel_path

                      if save_file(target_root, inner_path, code):
                          batch_saved += 1
                          total_updated += 1

                  tg(f"✅ <b>Batch {batch_num}/{total_batches}</b> — {batch_saved}/{len(batch)} files saved via {used_ai}", silent=True)

              # ───── FINAL REPORT ─────
              elapsed = time.time() - start_time
              mins = int(elapsed // 60)
              secs = int(elapsed % 60)

              report = f"""🏁 <b>AI DEVELOPER COMPLETE</b>

          ═══════════════════════════════════════════
          📊 <b>RESULTS</b>
          ═══════════════════════════════════════════
          ✅ Files Updated: <b>{total_updated}</b>
          📦 Total Batches: <b>{total_batches}</b>
          ❌ Failed Batches: <b>{len(failed_batches)}</b>
          ⏱️ Time: <b>{mins}m {secs}s</b>

          ═══════════════════════════════════════════
          🎯 <b>MODE:</b> {mode}
          ═══════════════════════════════════════════
          """

              if failed_batches:
                  report += f"\n⚠️ Failed batch numbers: {failed_batches}"

              tg(report)

          if __name__ == "__main__":
              main()
          EOFPY
          python /tmp/ai_dev.py

      - name: 🔍 Show Changes
        if: always()
        run: |
          echo "═══════════════════════════════════"
          echo "📊 CHANGES SUMMARY"
          echo "═══════════════════════════════════"
          git diff --stat
          echo ""
          echo "═══════════════════════════════════"

      - name: 📤 Commit and Push Changes
        if: always()
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        run: |
          git config user.name "SawajBot AI Developer"
          git config user.email "ai.dev@sawajstudio.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "👑 AI Developer: Enhanced code (${{ inputs.mode }}) — $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin main || echo "❌ Push failed"
