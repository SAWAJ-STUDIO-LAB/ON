# ═══════════════════════════════════════════════════════════════════════
# SawajStudioBot — Story Video Pipeline (FB Story + IG Story + YT Shorts)
# ═══════════════════════════════════════════════════════════════════════
#
# 🎯 MODES:
#   • AUTO (schedule)  → Drive + FB Story + IG Story (YT skip by default)
#   • MANUAL           → Aap choose karein:
#                        1. drive_only  → Sirf Google Drive
#                        2. fb_ig       → Facebook Story + Instagram Story
#                        3. youtube     → YouTube Shorts
#                        4. all         → Drive + FB + IG + YT
#
# ⏰ Schedule: Every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
#
# 🔐 Safety:
#   • Manual mode mein CONFIRM_UPLOAD=true zaroori
#   • Secrets verification har run pe
# ═══════════════════════════════════════════════════════════════════════

name: 📖 Story Video (FB + IG + YT)

# ═══════════════════════════════════════════════════════════════════════
# 🎯 TRIGGERS
# ═══════════════════════════════════════════════════════════════════════

on:
  # ───── AUTO: Har 6 ghante ─────
  schedule:
    - cron: '0 */6 * * *'

  # ───── MANUAL: User choose kare ─────
  workflow_dispatch:
    inputs:
      upload_target:
        description: '🎯 Kahan upload karna hai?'
        required: true
        default: 'drive_only'
        type: choice
        options:
          - drive_only
          - fb_ig
          - youtube
          - all

      confirm_upload:
        description: '✅ CONFIRM — Tick karo warna Drive-only chalega'
        required: true
        default: false
        type: boolean

# ═══════════════════════════════════════════════════════════════════════
# 🔒 PERMISSIONS
# ═══════════════════════════════════════════════════════════════════════

permissions:
  contents: read

# ═══════════════════════════════════════════════════════════════════════
# 🚫 CONCURRENCY
# ═══════════════════════════════════════════════════════════════════════

concurrency:
  group: story-video-${{ github.ref }}
  cancel-in-progress: false

# ═══════════════════════════════════════════════════════════════════════
# 🌍 GLOBAL ENV
# ═══════════════════════════════════════════════════════════════════════

env:
  PYTHON_VERSION: '3.11'
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  FORCE_COLOR: '1'
  GENERATOR_DIR: 'sawajstudiobot/video_generator/fb_ig_story_video_generator'

# ═══════════════════════════════════════════════════════════════════════
# 🚀 JOBS
# ═══════════════════════════════════════════════════════════════════════

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # JOB 1: VALIDATE SETUP
  # ─────────────────────────────────────────────────────────────────────
  validate:
    name: 🔍 Validate Setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      upload_mode: ${{ steps.decide.outputs.upload_mode }}
      upload_target: ${{ steps.decide.outputs.upload_target }}
      confirmed: ${{ steps.decide.outputs.confirmed }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🎯 Decide Upload Mode
        id: decide
        run: |
          EVENT="${{ github.event_name }}"
          TARGET="${{ github.event.inputs.upload_target }}"
          CONFIRM="${{ github.event.inputs.confirm_upload }}"

          # ═══════════════════════════════════════════════════════
          # AUTO (schedule) → Mode = "auto", Target = "auto"
          # ═══════════════════════════════════════════════════════
          if [ "$EVENT" = "schedule" ]; then
            MODE="auto"
            TARGET="auto"
            CONFIRM="true"
            echo "🤖 AUTO MODE: Drive + FB Story + IG Story"

          # ═══════════════════════════════════════════════════════
          # MANUAL → Check confirmation
          # ═══════════════════════════════════════════════════════
          else
            [ -z "$TARGET" ] && TARGET="drive_only"

            if [ "$CONFIRM" != "true" ]; then
              echo "::warning::⚠️ CONFIRM tick nahi kiya → Drive-only mode"
              MODE="manual"
              TARGET="drive_only"
            else
              MODE="manual"
              echo "📤 Manual upload → $TARGET"
            fi
          fi

          echo "upload_mode=$MODE" >> $GITHUB_OUTPUT
          echo "upload_target=$TARGET" >> $GITHUB_OUTPUT
          echo "confirmed=$CONFIRM" >> $GITHUB_OUTPUT
          echo "✅ Final: Mode=$MODE | Target=$TARGET | Confirmed=$CONFIRM"

      - name: ✅ Verify Critical Files
        run: |
          GEN="${{ env.GENERATOR_DIR }}"
          MISSING=0

          for f in \
            "$GEN/G_entry/G2_run.py" \
            "$GEN/G_entry/G1_story_pipeline.py" \
            "$GEN/A_core/A1_config.py" \
            "$GEN/A_core/A5_base_pipeline.py" \
            "$GEN/A_core/A6_secrets_check.py" \
            "$GEN/E_audio/E1_voice_ducking.py" \
            "$GEN/E_audio/E3_mastering.py" \
            "sawajstudiobot/video_requirement/requirements.txt" \
          ; do
            if [ -f "$f" ]; then
              echo "  ✅ $f"
            else
              echo "  ❌ MISSING: $f"
              MISSING=$((MISSING + 1))
            fi
          done

          if [ $MISSING -gt 0 ]; then
            echo "::error::$MISSING critical file(s) missing!"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────
  # JOB 2: GENERATE + UPLOAD STORY VIDEO
  # ─────────────────────────────────────────────────────────────────────
  generate-story:
    name: 📖 Generate & Upload Story Video
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: ⚙️ Install system tools (ffmpeg, fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ffmpeg fonts-noto fonts-noto-cjk \
            fonts-noto-color-emoji wget curl

      - name: 💾 Cache fonts
        id: cache-fonts
        uses: actions/cache@v4
        with:
          path: ~/.fonts
          key: noto-fonts-v2-${{ runner.os }}

      - name: 🔤 Download Noto fonts (Hindi + Arabic + Latin)
        if: steps.cache-fonts.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.fonts && cd ~/.fonts
          declare -A FONTS=(
            ["NotoSans-Bold.ttf"]="https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSans/NotoSans-Bold.ttf"
            ["NotoSans-Regular.ttf"]="https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSans/NotoSans-Regular.ttf"
            ["NotoSansDevanagari-Bold.ttf"]="https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSansDevanagari/NotoSansDevanagari-Bold.ttf"
            ["NotoSansDevanagari-Regular.ttf"]="https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSansDevanagari/NotoSansDevanagari-Regular.ttf"
            ["NotoNaskhArabic-Bold.ttf"]="https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoNaskhArabic/NotoNaskhArabic-Bold.ttf"
            ["NotoNaskhArabic-Regular.ttf"]="https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoNaskhArabic/NotoNaskhArabic-Regular.ttf"
          )
          for name in "${!FONTS[@]}"; do
            wget -q -nc "${FONTS[$name]}" -O "$name" && echo "  ✅ $name"
          done
          fc-cache -f

      - name: 💾 Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: 📦 Install Python packages
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r sawajstudiobot/video_requirement/requirements.txt
          pip install edge-tts

      - name: ▶️ Run Story Pipeline
        env:
          # ───── Telegram ─────
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # ───── Facebook ─────
          FACEBOOK_META_TOKEN: ${{ secrets.FACEBOOK_META_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}

          # ───── Instagram ─────
          FACEBOOK_INSTAGRAM_META_TOKEN: ${{ secrets.FACEBOOK_INSTAGRAM_META_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}

          # ───── YouTube (optional) ─────
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          DAILY_HADEES_YT_PLAYLIST_ID: ${{ secrets.DAILY_HADEES_YT_PLAYLIST_ID }}

          # ───── Google Drive ─────
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GDRIVE_STORY_VIDEO_FOLDER_ID: ${{ secrets.GDRIVE_STORY_VIDEO_FOLDER_ID }}

          # ───── AI Providers ─────
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}

          # ───── TTS / Translation ─────
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}

          # ───── Media APIs ─────
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          HADITH_API_URL: ${{ secrets.HADITH_API_URL }}

          # ───── Runtime ─────
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          UPLOAD_TARGET: ${{ needs.validate.outputs.upload_target }}
          CONFIRM_UPLOAD: ${{ needs.validate.outputs.confirmed }}
        run: |
          echo "🎯 Event:     $GITHUB_EVENT_NAME"
          echo "🎯 Target:    $UPLOAD_TARGET"
          echo "🎯 Confirmed: $CONFIRM_UPLOAD"
          echo ""
          cd "$GENERATOR_DIR"
          python3 G_entry/G2_run.py 2>&1 | tee pipeline.log

      - name: 📋 Show log
        if: always()
        run: |
          if [ -f "${{ env.GENERATOR_DIR }}/pipeline.log" ]; then
            tail -250 "${{ env.GENERATOR_DIR }}/pipeline.log"
          fi

      - name: 🔍 Verify Output
        if: success()
        id: verify
        run: |
          FINAL_DIR="${{ env.GENERATOR_DIR }}/output/final"
          VIDEO=$(find "$FINAL_DIR" -name "*.mp4" -type f | head -1)

          if [ -z "$VIDEO" ]; then
            echo "::error::No video generated!"
            exit 1
          fi

          SIZE=$(du -h "$VIDEO" | cut -f1)
          DURATION=$(ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 "$VIDEO" 2>/dev/null || echo "?")

          echo "video_size=$SIZE" >> $GITHUB_OUTPUT
          echo "video_duration=$DURATION" >> $GITHUB_OUTPUT
          echo "✅ Video: $SIZE | ${DURATION}s"

      - name: 📤 Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-video-${{ github.run_number }}
          path: |
            ${{ env.GENERATOR_DIR }}/output/final/*.mp4
            ${{ env.GENERATOR_DIR }}/output/final/*.jpg
            ${{ env.GENERATOR_DIR }}/pipeline.log
          retention-days: 7
          if-no-files-found: warn
          compression-level: 0

      - name: 📊 Summary
        if: always()
        run: |
          {
            echo "# 📖 Story Video — Run #${{ github.run_number }}"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Status | ${{ job.status == 'success' && '✅' || '❌' }} |"
            echo "| Event | \`${{ github.event_name }}\` |"
            echo "| Mode | \`${{ needs.validate.outputs.upload_mode }}\` |"
            echo "| Target | \`${{ needs.validate.outputs.upload_target }}\` |"
            echo "| Confirmed | \`${{ needs.validate.outputs.confirmed }}\` |"
            if [ "${{ steps.verify.outcome }}" = "success" ]; then
              echo "| Size | ${{ steps.verify.outputs.video_size }} |"
              echo "| Duration | ${{ steps.verify.outputs.video_duration }}s |"
            fi
          } >> $GITHUB_STEP_SUMMARY
