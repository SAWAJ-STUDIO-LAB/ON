name: "Story Video Generator"

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: morning-story
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONUNBUFFERED: '1'
  FFMPEG_LOGLEVEL: 'error'

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Python Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/edge-tts
          key: ${{ runner.os }}-pip-story-v63

      - name: Cache Custom Fonts
        id: cache-fonts
        uses: actions/cache@v4
        with:
          path: ~/.fonts
          key: ${{ runner.os }}-custom-fonts-v63

      - name: Install System Packages
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto fonts-noto-core fonts-noto-extra fonts-dejavu-core fontconfig

      - name: Download Cinematic Fonts
        run: |
          set -euo pipefail
          mkdir -p ~/.fonts
          fetch_font() {
            local url="$1"; local out="$2"; local min="${3:-30000}"
            wget -q --tries=3 --timeout=25 "$url" -O "$out" 2>/dev/null || true
            local sz=$(stat -c%s "$out" 2>/dev/null || echo 0)
            if [ "$sz" -lt "$min" ]; then
              rm -f "$out"
            fi
          }
          if [ "${{ steps.cache-fonts.outputs.cache-hit }}" != "true" ]; then
            fetch_font "https://github.com/notofonts/noto-fonts/raw/main/hinted/ttf/NotoSans/NotoSans-Regular.ttf" ~/.fonts/NotoSans-Regular.ttf
            fetch_font "https://github.com/notofonts/noto-fonts/raw/main/hinted/ttf/NotoSans/NotoSans-Bold.ttf" ~/.fonts/NotoSans-Bold.ttf
            fetch_font "https://github.com/notofonts/noto-fonts/raw/main/hinted/ttf/NotoSerif/NotoSerif-Regular.ttf" ~/.fonts/NotoSerif-Regular.ttf
            fetch_font "https://github.com/notofonts/noto-fonts/raw/main/hinted/ttf/NotoSerifDevanagari/NotoSerifDevanagari-Regular.ttf" ~/.fonts/NotoSerifDevanagari-Regular.ttf
            fetch_font "https://github.com/notofonts/noto-fonts/raw/main/hinted/ttf/NotoNaskhArabic/NotoNaskhArabic-Regular.ttf" ~/.fonts/NotoNaskhArabic-Regular.ttf
            fetch_font "https://github.com/notofonts/noto-fonts/raw/main/hinted/ttf/NotoSerif/NotoSerif-Bold.ttf" ~/.fonts/NotoSerif-Bold.ttf
            fetch_font "https://github.com/notofonts/noto-fonts/raw/main/hinted/ttf/NotoSerifDevanagari/NotoSerifDevanagari-Bold.ttf" ~/.fonts/NotoSerifDevanagari-Bold.ttf
            fetch_font "https://github.com/notofonts/noto-fonts/raw/main/hinted/ttf/NotoNaskhArabic/NotoNaskhArabic-Bold.ttf" ~/.fonts/NotoNaskhArabic-Bold.ttf
            fetch_font "https://github.com/google/fonts/raw/main/ofl/amiri/Amiri-Regular.ttf" ~/.fonts/Amiri-Regular.ttf
            fetch_font "https://github.com/google/fonts/raw/main/ofl/amiri/Amiri-Bold.ttf" ~/.fonts/Amiri-Bold.ttf
            fetch_font "https://github.com/google/fonts/raw/main/ofl/hind/Hind-SemiBold.ttf" ~/.fonts/Hind-SemiBold.ttf
          fi
          fc-cache -f -v >/dev/null 2>&1 || true

      - name: Install Python Packages
        run: |
          set -euo pipefail
          pip install requests edge-tts mutagen Pillow \
            google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib pytz

      - name: Run Story Pipeline & Upload to Drive
        env:
          # API Keys
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          GEMINI_API_KEY_AI: ${{ secrets.GEMINI_API_KEY_AI }}
          GROQ_API_KEY_AI: ${{ secrets.GROQ_API_KEY_AI }}
          OPENROUTER_API_KEY_AI: ${{ secrets.OPENROUTER_API_KEY_AI }}
          MISTRAL_API_KEY_AI: ${{ secrets.MISTRAL_API_KEY_AI }}
          CEREBRAS_API_KEY_AI: ${{ secrets.CEREBRAS_API_KEY_AI }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          
          # Media APIs
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          
          # Telegram
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHANNEL_HANDLE: ${{ secrets.CHANNEL_HANDLE }}
          
          # Google Drive Credentials
          GDRIVE_STORY_VIDEO_FOLDER_ID: ${{ secrets.GDRIVE_STORY_VIDEO_FOLDER_ID }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: |
          cat > pipeline.py << 'PY_EOF'
          import os, re, time, random, subprocess, requests, sys, datetime, json
          import base64, shlex, glob, pytz
          from urllib.parse import quote as url_quote
          from mutagen.mp3 import MP3
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          IST = pytz.timezone("Asia/Kolkata")
          NOW = datetime.datetime.now(IST)
          DATE_STR = NOW.strftime("%d %B %Y")
          RUN_TAG = NOW.strftime("%Y%m%d_%H%M%S")
          DAY_NUM = NOW.timetuple().tm_yday
          session = requests.Session()

          def env(k, d=None): return os.environ.get(k, d)

          TG_TOKEN = env("TELEGRAM_BOT_TOKEN")
          TG_CHAT_ID = env("TELEGRAM_CHAT_ID")
          FFMPEG_LOGLEVEL = env("FFMPEG_LOGLEVEL", "error")
          CHANNEL_HANDLE = env("CHANNEL_HANDLE", "@YourChannel")

          SARVAM_API_KEY = env("SARVAM_API_KEY")
          GEMINI_API_KEY_AI = env("GEMINI_API_KEY_AI")
          GROQ_API_KEY_AI = env("GROQ_API_KEY_AI")
          OPENROUTER_API_KEY_AI = env("OPENROUTER_API_KEY_AI")
          MISTRAL_API_KEY_AI = env("MISTRAL_API_KEY_AI")
          CEREBRAS_API_KEY_AI = env("CEREBRAS_API_KEY_AI")
          DEEPL_API_KEY = env("DEEPL_API_KEY")
          ELEVENLABS_API_KEY = env("ELEVENLABS_API_KEY")
          
          PEXELS_API_KEY = env("PEXELS_API_KEY")
          PIXABAY_API_KEY = env("PIXABAY_API_KEY")
          JAMENDO_CLIENT_ID = env("JAMENDO_CLIENT_ID")
          HADITH_API_URL = "https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1"

          GDRIVE_STORY_VIDEO_FOLDER_ID = env("GDRIVE_STORY_VIDEO_FOLDER_ID")
          GOOGLE_DRIVE_CLIENT_ID = env("GOOGLE_DRIVE_CLIENT_ID")
          GOOGLE_DRIVE_CLIENT_SECRET = env("GOOGLE_DRIVE_CLIENT_SECRET")
          GOOGLE_DRIVE_REFRESH_TOKEN = env("GOOGLE_DRIVE_REFRESH_TOKEN")

          HADITH_INFO = {}
          C_GOLD, C_WHITE, C_GREEN, C_CYAN, C_AMBER = "&H0000D7FF&", "&H00FFFFFF&", "&H0050C878&", "&H0000FFFF&", "&H0000AAFF&"

          def send_tg(msg, preview=False):
              print(msg)
              if not (TG_TOKEN and TG_CHAT_ID): return
              try:
                  session.post(f"https://api.telegram.org/bot{TG_TOKEN}/sendMessage", json={"chat_id": TG_CHAT_ID, "text": msg, "parse_mode": "HTML"}, timeout=20)
              except: pass

          def run_cmd(cmd, check=True, timeout=900):
              try: r = subprocess.run(cmd, shell=True, capture_output=True, text=True, timeout=timeout)
              except subprocess.TimeoutExpired: 
                  if check: raise Exception("Timeout")
                  return None
              if r.returncode != 0 and check: raise Exception(f"FFmpeg Err: {r.stderr[:200]}")
              return r

          def sanitize(t):
              if not t: return ""
              t = re.sub(r"[\u200b-\u200f\ufeff\u202a-\u202e]", "", str(t))
              return t.replace('"', '').replace("'", "").replace("\n", " ").strip()

          def sanitize_ass(t): return sanitize(t).replace("\\", "\\\\").replace("{", "\\{").replace("}", "\\}")

          def get_dur(path):
              if not os.path.exists(path): return 0.0
              try: return MP3(path).info.length
              except: pass
              try:
                  r = subprocess.run(f'ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "{path}"', shell=True, capture_output=True, text=True, timeout=30)
                  return float(r.stdout.strip()) if r.stdout.strip() else 0.0
              except: return 0.0

          def http_get(url, timeout=25, **kw):
              hdrs = {"User-Agent": "Mozilla/5.0"}
              if "headers" in kw: hdrs.update(kw.pop("headers"))
              try:
                  r = session.get(url, timeout=timeout, headers=hdrs, **kw)
                  return r if 200 <= r.status_code < 300 else None
              except: return None

          def http_post(url, timeout=30, **kw):
              hdrs = {"User-Agent": "Mozilla/5.0"}
              if "headers" in kw: hdrs.update(kw.pop("headers"))
              try:
                  r = session.post(url, timeout=timeout, headers=hdrs, **kw)
                  return r if 200 <= r.status_code < 300 else None
              except: return None

          def download(url, path, min_size=8000):
              try:
                  r = session.get(url, timeout=60, stream=True, headers={"User-Agent": "Mozilla/5.0"})
                  if r.status_code == 200:
                      with open(path, "wb") as f:
                          for chunk in r.iter_content(1024*1024):
                              if chunk: f.write(chunk)
                      return os.path.getsize(path) > min_size
              except: pass
              return False

          # --- HADITH & TRANSLATION ---
          def fetch_hadith():
              books = [{"eng": "eng-bukhari", "ara": "ara-bukhari", "name": "Sahih al-Bukhari", "max": 7563},
                       {"eng": "eng-muslim", "ara": "ara-muslim", "name": "Sahih Muslim", "max": 7500}]
              for _ in range(15):
                  book = random.choice(books)
                  num = random.randint(1, book["max"])
                  r = http_get(f"{HADITH_API_URL}/editions/{book['eng']}/{num}.json")
                  if r:
                      hs = r.json().get("hadiths", [])
                      if hs and 45 <= len(sanitize(hs[0].get("text", ""))) <= 480:
                          eng = sanitize(hs[0].get("text", ""))
                          ar_r = http_get(f"{HADITH_API_URL}/editions/{book['ara']}/{num}.json")
                          ara = sanitize(ar_r.json().get("hadiths", [{}])[0].get("text", "")) if ar_r else ""
                          return {"collection": book["name"], "number": str(hs[0].get("hadithnumber") or num), "english": eng, "arabic": ara}
              return None

          def _llm_prompt(text): return f"Translate to Hindi (Devanagari). ONLY output translation:\n{text}"
          
          def _call_gemini(prompt):
              if not GEMINI_API_KEY_AI: return None
              r = http_post(f"https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={GEMINI_API_KEY_AI}", json={"contents": [{"parts": [{"text": prompt}]}]})
              return r.json().get("candidates", [{}])[0].get("content", {}).get("parts", [{}])[0].get("text", "").strip() if r else None

          def _call_groq(prompt):
              if not GROQ_API_KEY_AI: return None
              r = http_post("https://api.groq.com/openai/v1/chat/completions", headers={"Authorization": f"Bearer {GROQ_API_KEY_AI}"}, json={"model": "llama-3.3-70b-versatile", "messages": [{"role": "user", "content": prompt}], "temperature": 0.3})
              return r.json().get("choices", [{}])[0].get("message", {}).get("content", "").strip() if r else None

          def translate_text(text):
              if SARVAM_API_KEY:
                  r = http_post("https://api.sarvam.ai/translate", headers={"api-subscription-key": SARVAM_API_KEY}, json={"input": text, "source_language_code": "en-IN", "target_language_code": "hi-IN", "mode": "formal"})
                  if r and r.json().get("translated_text"): return r.json()["translated_text"]
              for fn in [lambda: _call_gemini(_llm_prompt(text)), lambda: _call_groq(_llm_prompt(text))]:
                  out = fn()
                  if out and len(out) > 10: return out
              return text

          def gen_ai(prompt, default):
              out = _call_groq(prompt) or _call_gemini(prompt)
              return out.strip().strip('"') if out else default

          # --- TTS ---
          def gen_tts(text, outfile):
              text = sanitize(text)
              if SARVAM_API_KEY:
                  r = http_post("https://api.sarvam.ai/text-to-speech", headers={"api-subscription-key": SARVAM_API_KEY}, json={"inputs": [text], "target_language_code": "hi-IN", "speaker": "meera"})
                  if r and r.json().get("audios"):
                      with open(outfile, "wb") as f: f.write(base64.b64decode(r.json()["audios"][0]))
                      if os.path.getsize(outfile) > 4000: return True
              tmp = outfile + ".txt"
              with open(tmp, "w", encoding="utf-8") as f: f.write(text)
              run_cmd(f'edge-tts --file "{tmp}" --write-media "{outfile}" --voice hi-IN-MadhurNeural', check=False)
              os.remove(tmp)
              return os.path.exists(outfile) and os.path.getsize(outfile) > 4000

          # --- MUSIC & VIDEO ---
          def get_music():
              urls = ["https://cdn.pixabay.com/download/audio/2022/03/15/audio_2c3a185195.mp3", "https://cdn.pixabay.com/download/audio/2021/08/09/audio_7e4e7c6d90.mp3"]
              for u in urls:
                  if download(u, "m.mp3", 50000):
                      run_cmd(f"ffmpeg -y -loglevel {FFMPEG_LOGLEVEL} -i m.mp3 -af \"volume=0.15\" -t 90 -c:a libmp3lame music.mp3")
                      return
              run_cmd(f"ffmpeg -y -loglevel {FFMPEG_LOGLEVEL} -f lavfi -i \"anullsrc=r=44100:cl=stereo\" -t 90 -c:a libmp3lame music.mp3")

          def get_bg(dur):
              topics = ["mosque architecture", "islamic calligraphy", "night sky stars", "desert sand dunes", "kaaba mecca", "islamic patterns"]
              random.shuffle(topics)
              urls = []
              if PEXELS_API_KEY:
                  for q in topics[:3]:
                      r = http_get(f"https://api.pexels.com/videos/search?query={url_quote(q)}&orientation=portrait&per_page=3", headers={"Authorization": PEXELS_API_KEY})
                      if r:
                          for v in r.json().get("videos", []):
                              if v.get("video_files"): urls.append(sorted(v["video_files"], key=lambda x: abs((x.get("width") or 0) - 1080))[0]["link"])
              if len(urls) < 3: urls.extend(["https://assets.mixkit.co/videos/preview/mixkit-stars-in-space-1610-large.mp4", "https://assets.mixkit.co/videos/preview/mixkit-white-clouds-in-a-blue-sky-2408-large.mp4"])
              
              vids = []
              for i, u in enumerate(urls):
                  if len(vids) >= 3: break
                  if download(u, f"v_{i}.mp4", 400_000):
                      run_cmd(f"ffmpeg -y -loglevel {FFMPEG_LOGLEVEL} -stream_loop -1 -i v_{i}.mp4 -vf \"scale=1200:2140:force_original_aspect_ratio=increase,crop=1080:1920,setpts=1.5*PTS,zoompan=z='min(zoom+0.0001,1.05)':d=1:s=1080x1920,setsar=1,eq=contrast=1.25:brightness=-0.1\" -t {dur/2} -an -r 30 -c:v libx264 -preset veryfast -crf 18 p_{i}.mp4", check=False)
                      if os.path.exists(f"p_{i}.mp4"): vids.append(f"p_{i}.mp4")
              
              if not vids: 
                  run_cmd(f"ffmpeg -y -loglevel {FFMPEG_LOGLEVEL} -f lavfi -i \"color=c=0x101828:s=1080x1920:d={dur}\" -r 30 -c:v libx264 bg.mp4")
                  return "bg.mp4"
              if len(vids) == 1:
                  run_cmd(f"ffmpeg -y -loglevel {FFMPEG_LOGLEVEL} -stream_loop -1 -i {vids[0]} -c:v libx264 -t {dur} -r 30 bg.mp4")
              else:
                  fc = "[0:v][1:v]xfade=transition=fade:duration=2:offset=20[outv]"
                  run_cmd(f"ffmpeg -y -loglevel {FFMPEG_LOGLEVEL} -i {vids[0]} -i {vids[1]} -filter_complex \"{fc}\" -map \"[outv]\" -t {dur} -r 30 -c:v libx264 bg.mp4")
              return "bg.mp4"

          # --- DRIVE UPLOAD ---
          def upload_drive(path):
              rid, cid, cs = GOOGLE_DRIVE_REFRESH_TOKEN, GOOGLE_DRIVE_CLIENT_ID, GOOGLE_DRIVE_CLIENT_SECRET
              if not (rid and cid and cs): return
              try:
                  creds = Credentials(token=None, refresh_token=rid, client_id=cid, client_secret=cs, token_uri="https://oauth2.googleapis.com/token")
                  service = build("drive", "v3", credentials=creds, cache_discovery=False)
                  meta = {"name": f"Day{DAY_NUM}_Hadith_{HADITH_INFO.get('number', '0')}_{RUN_TAG}.mp4"}
                  if GDRIVE_STORY_VIDEO_FOLDER_ID: meta["parents"] = [GDRIVE_STORY_VIDEO_FOLDER_ID.strip()]
                  up = service.files().create(body=meta, media_body=MediaFileUpload(path, mimetype="video/mp4", resumable=True), fields="webViewLink").execute()
                  service.permissions().create(fileId=up["id"], body={"type": "anyone", "role": "reader"}).execute()
                  if up.get("webViewLink"): send_tg(f'🎬 <b>DONE!</b>\n👁️ <a href="{up["webViewLink"]}">Download Video</a>', preview=True)
              except Exception as e: print(f"Drive Err: {e}")

          # --- MAIN ---
          def main():
              send_tg("🎬 <b>Starting Generation...</b>")
              h = fetch_hadith()
              if not h: raise Exception("No hadith")
              HADITH_INFO.update(h)
              
              hindi = translate_text(h["english"])
              hook = gen_ai(f"Viral Hindi hook max 6 words:\n{h['english'][:200]}", "Ye hadith aapki zindagi badal degi")
              take = gen_ai(f"Hindi takeaway max 10 words:\n{h['english'][:200]}", "Aaj se ye amal karein")

              gen_tts(hook, "h.mp3"); gen_tts("Bismillah. Assalamu Alaikum.", "i.mp3"); gen_tts(f"हदीस शरीफ। {hindi}", "m.mp3"); gen_tts(take, "t.mp3")
              
              hd, id, md, td = get_dur("h.mp3"), get_dur("i.mp3"), get_dur("m.mp3"), get_dur("t.mp3")
              total_raw = hd + id + md + td + 2
              atempo = f"atempo={total_raw/58:.4f}," if total_raw > 60 else ""

              for s, d in [("h.mp3", "hv.mp3"), ("i.mp3", "iv.mp3"), ("m.mp3", "mv.mp3"), ("t.mp3", "tv.mp3")]:
                  run_cmd(f'ffmpeg -y -loglevel {FFMPEG_LOGLEVEL} -i {s} -af "{atempo}volume=1.15" -c:a libmp3lame {d}')

              run_cmd(f"ffmpeg -y -loglevel {FFMPEG_LOGLEVEL} -i hv.mp3 -i iv.mp3 -i mv.mp3 -i tv.mp3 -filter_complex \"[0:a][1:a][2:a][3:a]concat=n=4:v=0:a=1[out]\" -map \"[out]\" fv.mp3")
              get_music()
              run_cmd(f"ffmpeg -y -loglevel {FFMPEG_LOGLEVEL} -i fv.mp3 -i music.mp3 -filter_complex \"[1:a]volume=0.15[bg];[0:a][bg]amix=inputs=2:duration=first[out]\" -map \"[out]\" final_a.mp3")

              total = get_dur("final_a.mp3")
              bg = get_bg(total)

              fonts = os.path.abspath(os.path.expanduser("~/.fonts"))
              ass = [
                  "[Script Info]", "ScriptType: v4.00+", "PlayResX: 1080", "PlayResY: 1920", "WrapStyle: 0", "ScaledBorderAndShadow: yes", "",
                  "[V4+ Styles]", "Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding",
                  f"Style: Badge,Hind,48,{C_WHITE},&H000000FF,&H00000000,&HFF000000,-1,0,0,0,105,105,1.0,0,1,4,2,7,30,30,0,1",
                  f"Style: Hook,Noto Serif,115,{C_AMBER},&H000000FF,&H00000000,&HFF000000,-1,0,0,0,105,105,1.5,0,1,8,5,5,40,40,0,1",
                  f"Style: Arabic,Amiri,95,{C_GOLD},&H000000FF,&H00000000,&HFF000000,-1,0,0,0,105,105,1.0,0,1,7,4,2,4,80,0,1",
                  f"Style: Hindi,Hind,105,{C_WHITE},&H000000FF,&H00000000,&HFF000000,-1,0,0,0,105,105,1.5,0,1,7,4,2,4,80,0,1",
                  f"Style: English,Noto Serif,75,{C_GREEN},&H000000FF,&H00000000,&HFF000000,-1,0,0,0,105,105,1.0,0,1,6,3,2,4,80,0,1",
                  f"Style: Takeaway,Hind,105,{C_CYAN},&H000000FF,&H00000000,&HFF000000,-1,0,0,0,105,105,1.5,0,1,8,5,5,40,40,0,1",
                  f"Style: CTA,Noto Serif,85,{C_GOLD},&H000000FF,&H00000000,&HFF000000,-1,0,0,0,105,105,1.0,0,1,7,5,5,40,40,0,1",
                  "[Events]", "Format: Layer,Start,End,Style,Name,MarginL,MarginR,MarginV,Effect,Text"
              ]
              
              def ts(t): return f"0:{int(t//60):02d}:{int(t%60):02d}.{min(99, int((t%1)*100)):02d}"
              
              ass.append(f"Dialogue: 1,{ts(0)},{ts(total)},Badge,,0,0,0,,{{\\an7\\pos(40,40)}}Day {DAY_NUM} / 365")
              ass.append(f"Dialogue: 1,{ts(0)},{ts(total)},Badge,,0,0,0,,{{\\an7\\pos(40,100)\\fs35\\1c{C_GOLD}}}Hadith #{h['number']}")
              
              hd2 = get_dur("hv.mp3"); id2 = get_dur("iv.mp3"); md2 = get_dur("mv.mp3")
              ass.append(f"Dialogue: 0,{ts(0)},{ts(hd2)},Hook,,0,0,0,,{{\\fad(300,300)\\pos(540,340)\\bord8\\shad5}}{sanitize_ass(hook)}")
              if h.get("arabic"): ass.append(f"Dialogue: 0,{ts(hd2+id2)},{ts(hd2+id2+md2)},Arabic,,0,0,0,,{{\\fad(300,300)\\an6\\pos(1000,1250)}}{sanitize_ass(h['arabic'])}")
              ass.append(f"Dialogue: 0,{ts(hd2+id2)},{ts(hd2+id2+md2)},Hindi,,0,0,0,,{{\\fad(300,300)\\an4\\pos(80,1450)}}{sanitize_ass(hindi)}")
              ass.append(f"Dialogue: 0,{ts(hd2+id2)},{ts(hd2+id2+md2)},English,,0,0,0,,{{\\fad(300,300)\\an4\\pos(80,1620)}}{sanitize_ass(h['english'])}")
              ass.append(f"Dialogue: 0,{ts(hd2+id2+md2)},{ts(total) },Takeaway,,0,0,0,,{{\\fad(300,300)\\pos(540,780)}}{sanitize_ass(take)}")
              ass.append(f"Dialogue: 0,{ts(total-3)},{ts(total)},CTA,,0,0,0,,{{\\fad(300,300)\\pos(540,700)}}Save & Follow\\N{{\\fs58}}{CHANNEL_HANDLE}")

              with open("s.ass", "w", encoding="utf-8") as f: f.write("\n".join(ass))

              f_cmd = f"[0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,eq=contrast=1.25:brightness=-0.1[bg];[bg]subtitles=s.ass:fontsdir={shlex.quote(fonts)},format=yuv420p[outv]"
              run_cmd(f"ffmpeg -y -loglevel {FFMPEG_LOGLEVEL} -i {bg} -i final_a.mp3 -filter_complex \"{f_cmd}\" -map \"[outv]\" -map 1:a -c:v libx264 -preset fast -crf 20 -c:a aac -t {total} -movflags +faststart final.mp4")

              upload_drive("final.mp4")

          if __name__ == "__main__":
              try: main()
              except Exception as e:
                  send_tg(f"❌ <b>FAILED:</b> {str(e)[:300]}")
                  sys.exit(1)
          PY_EOF
          python3 pipeline.py

      - name: Upload Artifact (Backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-video-${{ github.run_id }}
          path: |
            final.mp4
          retention-days: 3
          if-no-files-found: ignore
