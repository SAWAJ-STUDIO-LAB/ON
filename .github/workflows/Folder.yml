name: Create Social Media Folder Structure Automatically

on:
  workflow_dispatch: # Manual run karne ke liye

permissions:
  contents: write

jobs:
  setup-repository:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB }} # Aapka GitHub Secret Token

      - name: Create Social Media Folders and Files
        run: |
          # 1. Main Folders Banayein (social_media ke andar sabhi subfolders)
          mkdir -p .github/workflows
          mkdir -p social_media/fb_ig_story_video
          mkdir -p social_media/fb_ig_yt_short_video
          mkdir -p social_media/fb_yt_long_video

          # 2. fb_ig_story_video ke andar files banayein
          touch social_media/fb_ig_story_video/generator.py
          touch social_media/fb_ig_story_video/requirements.txt
          touch social_media/fb_ig_story_video/logo.png

          # 3. fb_ig_yt_short_video ke andar files banayein
          touch social_media/fb_ig_yt_short_video/generator.py
          touch social_media/fb_ig_yt_short_video/requirements.txt
          touch social_media/fb_ig_yt_short_video/logo.png

          # 4. fb_yt_long_video ke andar files banayein
          touch social_media/fb_yt_long_video/generator.py
          touch social_media/fb_yt_long_video/requirements.txt
          touch social_media/fb_yt_long_video/logo.png

          # 5. Workflows folder ke andar .yml files banayein
          touch .github/workflows/fb_ig_story_video.yml
          touch .github/workflows/fb_ig_yt_short_video.yml
          touch .github/workflows/fb_yt_long_video.yml

          # 6. Root Level Files Banayein
          touch requirements.txt
          touch .gitignore

          # README file mein description daalein
          echo "# Project ON" > README.md
          echo "Automated video generation repository under social_media directory." >> README.md

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Automated setup: Created social_media directory structure"
          git push
