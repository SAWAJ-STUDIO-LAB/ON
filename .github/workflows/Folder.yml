name: Create Project Structure Automatically

on:
  workflow_dispatch:

jobs:
  setup-repository:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB }}

      - name: Create Folders and Files
        run: |
          mkdir -p fb_ig_story_video
          mkdir -p fb_ig_yt_short_video
          mkdir -p fb_yt_long_video

          touch fb_ig_story_video/generator.py
          touch fb_ig_story_video/requirements.txt
          touch fb_ig_story_video/logo.png

          touch fb_ig_yt_short_video/generator.py
          touch fb_ig_yt_short_video/requirements.txt
          touch fb_ig_yt_short_video/logo.png

          touch fb_yt_long_video/generator.py
          touch fb_yt_long_video/requirements.txt
          touch fb_yt_long_video/logo.png

          touch .github/workflows/fb_ig_story_video.yml
          touch .github/workflows/fb_ig_yt_short_video.yml
          touch .github/workflows/fb_yt_long_video.yml

          touch requirements.txt
          touch .gitignore
          
          echo "# Project ON" > README.md
          echo "Automated video generation workflow repository." >> README.md

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Automated setup: Created complete directory structure and starter files"
          git push
