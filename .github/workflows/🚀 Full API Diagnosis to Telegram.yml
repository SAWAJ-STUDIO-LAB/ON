name: API Diagnosis
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Create Python Script
        run: |
          cat << 'EOF' > diagnose.py
          import os, requests, time

          TELEGRAM_BOT_TOKEN = os.getenv("TELEGRAM_BOT_TOKEN", "")
          TELEGRAM_CHAT_ID = os.getenv("TELEGRAM_CHAT_ID", "")

          report_chunks = []
          current_chunk = "🚀 *FULL API DIAGNOSIS REPORT*\n\n"

          def add_to_report(text):
              global current_chunk, report_chunks
              if len(current_chunk) + len(text) > 3500:
                  report_chunks.append(current_chunk)
                  current_chunk = ""
              current_chunk += text + "\n"

          def check_presence(name):
              val = os.getenv(name, "")
              if not val:
                  return f"❌ `{name}`: Missing/Empty"
              disp = f"{val[:4]}...{val[-4:]}" if len(val) > 8 else "Set"
              return f"✅ `{name}`: Present ({disp})"

          # 1. GEMINI TEST
          add_to_report("🧠 *AI Models*")
          g_key = os.getenv("GEMINI_API_KEY_A1")
          if g_key:
              try:
                  res = requests.get(f"https://generativelanguage.googleapis.com/v1beta/models?key={g_key}")
                  if res.status_code == 200:
                      models_count = len(res.json().get("models", []))
                      add_to_report(f"✅ `GEMINI_API_KEY_A1`: Active ({models_count} models)")
                  else:
                      add_to_report(f"❌ `GEMINI_API_KEY_A1`: Error {res.status_code}")
              except Exception as e:
                  add_to_report(f"❌ `GEMINI_API_KEY_A1`: Connection failed")
          else:
              add_to_report("❌ `GEMINI_API_KEY_A1`: Missing")

          # 2. TELEGRAM TEST
          add_to_report("\n📲 *Telegram Bot*")
          if TELEGRAM_BOT_TOKEN:
              try:
                  res = requests.get(f"https://api.telegram.org/bot{TELEGRAM_BOT_TOKEN}/getMe")
                  if res.status_code == 200:
                      b_name = res.json().get("result", {}).get("first_name", "Bot")
                      add_to_report(f"✅ `TELEGRAM_BOT`: Connected ({b_name})")
                  else:
                      add_to_report(f"❌ `TELEGRAM_BOT`: Invalid Token")
              except Exception as e:
                  add_to_report(f"❌ `TELEGRAM_BOT`: Connection failed")
          else:
              add_to_report("❌ `TELEGRAM_BOT_TOKEN`: Missing")

          # 3. OAUTH REFRESH TESTS
          add_to_report("\n☁️ *Google Drive & YouTube OAuth*")
          for name, client_id, secret, refresh in [
              ("G-DRIVE", os.getenv("GOOGLE_DRIVE_CLIENT_ID"), os.getenv("GOOGLE_DRIVE_CLIENT_SECRET"), os.getenv("GOOGLE_DRIVE_REFRESH_TOKEN")),
              ("YOUTUBE", os.getenv("YOUTUBE_CLIENT_ID"), os.getenv("YOUTUBE_CLIENT_SECRET"), os.getenv("YOUTUBE_REFRESH_TOKEN"))
          ]:
              if client_id and secret and refresh:
                  try:
                      res = requests.post("https://oauth2.googleapis.com/token", data={
                          "client_id": client_id, "client_secret": secret,
                          "refresh_token": refresh, "grant_type": "refresh_token"
                      })
                      if res.status_code == 200:
                          add_to_report(f"✅ `{name} OAUTH`: Refresh Success")
                      else:
                          add_to_report(f"❌ `{name} OAUTH`: Error {res.status_code}")
                  except Exception as e:
                      add_to_report(f"❌ `{name} OAUTH`: Connection failed")
              else:
                  add_to_report(f"⚠️ `{name} OAUTH`: Credentials missing")

          # 4. OTHER SECRETS CHECK
          add_to_report("\n🔐 *Secrets Presence Check*")
          all_keys = [
              "CEREBRAS_API_KEY_A1", "COHERE_API_KEY_A1", "COVER_API_KEY", "DAILY_YOUTUBE_YT_PLAYLIST_ID",
              "DEEPGRAM_API_KEY", "DEEPLL_API_KEY", "ELEVENLABS_API_KEY", "FACEBOOK_INSTAGRAM_META_TOKEN",
              "FACEBOOK_PAGE_ID", "FREESOUND_API_KEY", "GDRIVE_LONG_VIDEO_FOLDER_ID", "GDRIVE_SHORT_VIDEO_FOLDER_ID",
              "GDRIVE_STORY_VIDEO_FOLDER_ID", "GROQ_API_KEY_A1", "HADITH_API_URL", "HUGGINGFACE_API_KEY_A1",
              "INSTAGRAM_BUSINESS_ACCOUNT_ID", "JINA_API_KEY", "MISTRAL_API_KEY_A1", "OPENROUTER_API_KEY_A1",
              "OPENWEATHER_API_KEY", "PEXELS_API_KEY", "PIXABAY_API_KEY", "PRAYER_TIMES_API_URL",
              "QURAN_API_URL", "TAVILY_API_KEY_A1", "TOKEN_GITHUB"
          ]
          for k in all_keys:
              add_to_report(check_presence(k))

          if current_chunk:
              report_chunks.append(current_chunk)

          # SEND MESSAGES
          if TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID:
              for chunk in report_chunks:
                  requests.post(
                      f"https://api.telegram.org/bot{TELEGRAM_BOT_TOKEN}/sendMessage",
                      json={"chat_id": TELEGRAM_CHAT_ID, "text": chunk, "parse_mode": "Markdown"}
                  )
                  time.sleep(1)
          EOF

      - name: Run Script
        env:
          CEREBRAS_API_KEY_A1: ${{ secrets.CEREBRAS_API_KEY_A1 }}
          COHERE_API_KEY_A1: ${{ secrets.COHERE_API_KEY_A1 }}
          COVER_API_KEY: ${{ secrets.COVER_API_KEY }}
          DAILY_YOUTUBE_YT_PLAYLIST_ID: ${{ secrets.DAILY_YOUTUBE_YT_PLAYLIST_ID }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          DEEPLL_API_KEY: ${{ secrets.DEEPLL_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FACEBOOK_INSTAGRAM_META_TOKEN: ${{ secrets.FACEBOOK_INSTAGRAM_META_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          GDRIVE_LONG_VIDEO_FOLDER_ID: ${{ secrets.GDRIVE_LONG_VIDEO_FOLDER_ID }}
          GDRIVE_SHORT_VIDEO_FOLDER_ID: ${{ secrets.GDRIVE_SHORT_VIDEO_FOLDER_ID }}
          GDRIVE_STORY_VIDEO_FOLDER_ID: ${{ secrets.GDRIVE_STORY_VIDEO_FOLDER_ID }}
          GEMINI_API_KEY_A1: ${{ secrets.GEMINI_API_KEY_A1 }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GROQ_API_KEY_A1: ${{ secrets.GROQ_API_KEY_A1 }}
          HADITH_API_URL: ${{ secrets.HADITH_API_URL }}
          HUGGINGFACE_API_KEY_A1: ${{ secrets.HUGGINGFACE_API_KEY_A1 }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          MISTRAL_API_KEY_A1: ${{ secrets.MISTRAL_API_KEY_A1 }}
          OPENROUTER_API_KEY_A1: ${{ secrets.OPENROUTER_API_KEY_A1 }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PRAYER_TIMES_API_URL: ${{ secrets.PRAYER_TIMES_API_URL }}
          QURAN_API_URL: ${{ secrets.QURAN_API_URL }}
          TAVILY_API_KEY_A1: ${{ secrets.TAVILY_API_KEY_A1 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python diagnose.py
        
