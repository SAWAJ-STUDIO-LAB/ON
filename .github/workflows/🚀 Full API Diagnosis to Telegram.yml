name: 🚀 Telegram API & Secrets Full Diagnosis
​on:
workflow_dispatch:
​jobs:
diagnose-and-report:
runs-on: ubuntu-latest
steps:
- name: Checkout Code
uses: actions/checkout@v4
​- name: Setup Python
uses: actions/setup-python@v5
with:
python-version: '3.11'
​- name: Install Dependencies
run: pip install requests
​- name: Run Diagnosis and Send Telegram Report
env:
CEREBRAS_API_KEY_A1: ${{ secrets.CEREBRAS_API_KEY_A1 }}
COHERE_API_KEY_A1: ${{ secrets.COHERE_API_KEY_A1 }}
COVER_API_KEY: ${{ secrets.COVER_API_KEY }}
DAILY_HADITH_YT_PLAYLIST_ID: ${{ secrets.DAILY_HADITH_YT_PLAYLIST_ID }}
DAILY_YOUTUBE_YT_PLAYLIST_ID: ${{ secrets.DAILY_YOUTUBE_YT_PLAYLIST_ID }}
DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
DEEPLL_API_KEY: ${{ secrets.DEEPLL_API_KEY }}
ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
FACEBOOK_INSTAGRAM_META_TOKEN: ${{ secrets.FACEBOOK_INSTAGRAM_META_TOKEN }}
FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
GDRIVE_LONG_VIDEO_FOLDER_ID: ${{ secrets.GDRIVE_LONG_VIDEO_FOLDER_ID }}
GDRIVE_SHORT_VIDEO_FOLDER_ID: ${{ secrets.GDRIVE_SHORT_VIDEO_FOLDER_ID }}
GDRIVE_STORY_VIDEO_FOLDER_ID: ${{ secrets.GDRIVE_STORY_VIDEO_FOLDER_ID }}
GEMINI_API_KEY_A1: ${{ secrets.GEMINI_API_KEY_A1 }}
GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
GROQ_API_KEY_A1: ${{ secrets.GROQ_API_KEY_A1 }}
HADITH_API_URL: ${{ secrets.HADITH_API_URL }}
HUGGINGFACE_API_KEY_A1: ${{ secrets.HUGGINGFACE_API_KEY_A1 }}
INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
MISTRAL_API_KEY_A1: ${{ secrets.MISTRAL_API_KEY_A1 }}
OPENROUTER_API_KEY_A1: ${{ secrets.OPENROUTER_API_KEY_A1 }}
OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
PRAYER_TIMES_API_URL: ${{ secrets.PRAYER_TIMES_API_URL }}
QURAN_API_URL: ${{ secrets.QURAN_API_URL }}
TAVILY_API_KEY_A1: ${{ secrets.TAVILY_API_KEY_A1 }}
TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
run: |
cat << 'PYTHON_SCRIPT' > diagnose_all.py
import os
import requests
import time
​bot_token = os.getenv("TELEGRAM_BOT_TOKEN", "").strip()
chat_id = os.getenv("TELEGRAM_CHAT_ID", "").strip()
​chunks = []
curr = "📊 FULL API & SECRETS DIAGNOSIS REPORT\n\n"
​def add(line):
global curr, chunks
if len(curr) + len(line) > 3500:
chunks.append(curr)
curr = "📊 DIAGNOSIS REPORT (Continued)\n\n"
curr += line + "\n"
​def mask(val):
if not val:
return "Missing"
if len(val) <= 8:
return "Set"
return f"{val[:4]}...{val[-4:]}"
​# --- 1. AI & LLM APIS ---
add("🤖 AI & LLM APIs Diagnosis")
​# Gemini
k = os.getenv("GEMINI_API_KEY_A1")
if k:
try:
r = requests.get(f"https://generativelanguage.googleapis.com/v1beta/models?key={k}", timeout=10)
if r.status_code == 200:
m_count = len(r.json().get("models", []))
add(f"✅ GEMINI_API_KEY_A1: Active ({m_count} models accessible)")
else:
err = r.json().get("error", {}).get("message", r.text[:100])
add(f"❌ GEMINI_API_KEY_A1: HTTP {r.status_code} - {err}")
except Exception as e:
add(f"❌ GEMINI_API_KEY_A1: Network Error ({e})")
else:
add("❌ GEMINI_API_KEY_A1: Missing")
​# Groq
k = os.getenv("GROQ_API_KEY_A1")
if k:
try:
r = requests.get("https://api.groq.com/openai/v1/models", headers={"Authorization": f"Bearer {k}"}, timeout=10)
if r.status_code == 200:
add("✅ GROQ_API_KEY_A1: Active")
else:
add(f"❌ GROQ_API_KEY_A1: HTTP {r.status_code}")
except Exception as e:
add("❌ GROQ_API_KEY_A1: Network Error")
else:
add("❌ GROQ_API_KEY_A1: Missing")
​# Mistral
k = os.getenv("MISTRAL_API_KEY_A1")
if k:
try:
r = requests.get("https://api.mistral.ai/v1/models", headers={"Authorization": f"Bearer {k}"}, timeout=10)
if r.status_code == 200:
add("✅ MISTRAL_API_KEY_A1: Active")
else:
add(f"❌ MISTRAL_API_KEY_A1: HTTP {r.status_code}")
except Exception as e:
add("❌ MISTRAL_API_KEY_A1: Network Error")
else:
add("❌ MISTRAL_API_KEY_A1: Missing")
​# OpenRouter
k = os.getenv("OPENROUTER_API_KEY_A1")
if k:
try:
r = requests.get("https://openrouter.ai/api/v1/auth/key", headers={"Authorization": f"Bearer {k}"}, timeout=10)
if r.status_code == 200:
add("✅ OPENROUTER_API_KEY_A1: Active")
else:
add(f"❌ OPENROUTER_API_KEY_A1: HTTP {r.status_code}")
except Exception as e:
add("❌ OPENROUTER_API_KEY_A1: Network Error")
else:
add("❌ OPENROUTER_API_KEY_A1: Missing")
​# Cerebras
k = os.getenv("CEREBRAS_API_KEY_A1")
if k:
try:
r = requests.get("https://api.cerebras.ai/v1/models", headers={"Authorization": f"Bearer {k}"}, timeout=10)
if r.status_code == 200:
add("✅ CEREBRAS_API_KEY_A1: Active")
else:
add(f"❌ CEREBRAS_API_KEY_A1: HTTP {r.status_code}")
except Exception as e:
add("❌ CEREBRAS_API_KEY_A1: Network Error")
else:
add("❌ CEREBRAS_API_KEY_A1: Missing")
​# Cohere
k = os.getenv("COHERE_API_KEY_A1")
if k:
try:
r = requests.get("https://api.cohere.com/v1/models", headers={"Authorization": f"Bearer {k}"}, timeout=10)
if r.status_code == 200:
add("✅ COHERE_API_KEY_A1: Active")
else:
add(f"❌ COHERE_API_KEY_A1: HTTP {r.status_code}")
except Exception as e:
add("❌ COHERE_API_KEY_A1: Network Error")
else:
add("❌ COHERE_API_KEY_A1: Missing")
​# HuggingFace
k = os.getenv("HUGGINGFACE_API_KEY_A1")
if k:
try:
r = requests.get("https://huggingface.co/api/whoami-v2", headers={"Authorization": f"Bearer {k}"}, timeout=10)
if r.status_code == 200:
add("✅ HUGGINGFACE_API_KEY_A1: Active")
else:
add(f"❌ HUGGINGFACE_API_KEY_A1: HTTP {r.status_code}")
except Exception as e:
add("❌ HUGGINGFACE_API_KEY_A1: Network Error")
else:
add("❌ HUGGINGFACE_API_KEY_A1: Missing")
​# Tavily
k = os.getenv("TAVILY_API_KEY_A1")
if k:
try:
r = requests.post("https://api.tavily.com/search", json={"api_key": k, "query": "test"}, timeout=10)
if r.status_code == 200:
add("✅ TAVILY_API_KEY_A1: Active")
else:
add(f"❌ TAVILY_API_KEY_A1: HTTP {r.status_code}")
except Exception as e:
add("❌ TAVILY_API_KEY_A1: Network Error")
else:
add("❌ TAVILY_API_KEY_A1: Missing")
​# --- 2. OAUTH (GOOGLE DRIVE & YOUTUBE) ---
add("\n☁️ Google Drive & YouTube OAuth Diagnosis")
​# GDrive OAuth
gd_cid = os.getenv("GOOGLE_DRIVE_CLIENT_ID")
gd_sec = os.getenv("GOOGLE_DRIVE_CLIENT_SECRET")
gd_ref = os.getenv("GOOGLE_DRIVE_REFRESH_TOKEN")
if gd_cid and gd_sec and gd_ref:
try:
r = requests.post("https://oauth2.googleapis.com/token", data={
"client_id": gd_cid, "client_secret": gd_sec,
"refresh_token": gd_ref, "grant_type": "refresh_token"
}, timeout=10)
if r.status_code == 200:
add("✅ G-DRIVE OAUTH: Refresh Token Valid & Active")
else:
err = r.json().get("error_description", r.text[:100])
add(f"❌ G-DRIVE OAUTH: HTTP {r.status_code} - {err}")
except Exception as e:
add("❌ G-DRIVE OAUTH: Network Error")
else:
add("⚠️ G-DRIVE OAUTH: Client ID, Secret, or Refresh Token Missing")
​# YouTube OAuth
yt_cid = os.getenv("YOUTUBE_CLIENT_ID")
yt_sec = os.getenv("YOUTUBE_CLIENT_SECRET")
yt_ref = os.getenv("YOUTUBE_REFRESH_TOKEN")
if yt_cid and yt_sec and yt_ref:
try:
r = requests.post("https://oauth2.googleapis.com/token", data={
"client_id": yt_cid, "client_secret": yt_sec,
"refresh_token": yt_ref, "grant_type": "refresh_token"
}, timeout=10)
if r.status_code == 200:
add("✅ YOUTUBE OAUTH: Refresh Token Valid & Active")
else:
err = r.json().get("error_description", r.text[:100])
add(f"❌ YOUTUBE OAUTH: HTTP {r.status_code} - {err}")
except Exception as e:
add("❌ YOUTUBE OAUTH: Network Error")
else:
add("⚠️️ YOUTUBE OAUTH: Client ID, Secret, or Refresh Token Missing")
​# --- 3. MEDIA & UTILITY APIS ---
add("\n🎨 Media & Utility APIs Diagnosis")
​# Deepgram
k = os.getenv("DEEPGRAM_API_KEY")
if k:
try:
r = requests.get("https://api.deepgram.com/v1/projects", headers={"Authorization": f"Token {k}"}, timeout=10)
if r.status_code == 200:
add("✅ DEEPGRAM_API_KEY: Active")
else:
add(f"❌ DEEPGRAM_API_KEY: HTTP {r.status_code}")
except Exception as e:
add("❌ DEEPGRAM_API_KEY: Network Error")
else:
add("❌ DEEPGRAM_API_KEY: Missing")
​# ElevenLabs
k = os.getenv("ELEVENLABS_API_KEY")
if k:
try:
r = requests.get("https://api.elevenlabs.io/v1/user", headers={"xi-api-key": k}, timeout=10)
if r.status_code == 200:
add("✅ ELEVENLABS_API_KEY: Active")
else:
add(f"❌ ELEVENLABS_API_KEY: HTTP {r.status_code}")
except Exception as e:
add("❌ ELEVENLABS_API_KEY: Network Error")
else:
add("❌ ELEVENLABS_API_KEY: Missing")
​# Freesound
k = os.getenv("FREESOUND_API_KEY")
if k:
try:
r = requests.get(f"https://freesound.org/apiv2/search/text/?query=sound&token={k}", timeout=10)
if r.status_code == 200:
add("✅ FREESOUND_API_KEY: Active")
else:
add(f"❌ FREESOUND_API_KEY: HTTP {r.status_code}")
except Exception as e:
add("❌ FREESOUND_API_KEY: Network Error")
else:
add("❌ FREESOUND_API_KEY: Missing")
​# Pexels
k = os.getenv("PEXELS_API_KEY")
if k:
try:
r = requests.get("https://api.pexels.com/v1/search?query=test&per_page=1", headers={"Authorization": k}, timeout=10)
if r.status_code == 200:
add("✅ PEXELS_API_KEY: Active")
else:
add(f"❌ PEXELS_API_KEY: HTTP {r.status_code}")
except Exception as e:
add("❌ PEXELS_API_KEY: Network Error")
else:
add("❌ PEXELS_API_KEY: Missing")
​# Pixabay
k = os.getenv("PIXABAY_API_KEY")
if k:
try:
r = requests.get(f"https://pixabay.com/api/?key={k}&q=test", timeout=10)
if r.status_code == 200:
add("✅ PIXABAY_API_KEY: Active")
else:
add(f"❌ PIXABAY_API_KEY: HTTP {r.status_code}")
except Exception as e:
add("❌ PIXABAY_API_KEY: Network Error")
else:
add("❌ PIXABAY_API_KEY: Missing")
​# OpenWeather
k = os.getenv("OPENWEATHER_API_KEY")
if k:
try:
r = requests.get(f"https://api.openweathermap.org/data/2.5/weather?q=London&appid={k}", timeout=10)
if r.status_code == 200:
add("✅ OPENWEATHER_API_KEY: Active")
else:
add(f"❌ OPENWEATHER_API_KEY: HTTP {r.status_code}")
except Exception as e:
add("❌ OPENWEATHER_API_KEY: Network Error")
else:
add("❌ OPENWEATHER_API_KEY: Missing")
​# Meta / Facebook
meta_tok = os.getenv("FACEBOOK_INSTAGRAM_META_TOKEN")
if meta_tok:
try:
r = requests.get(f"https://graph.facebook.com/v18.0/me?access_token={meta_tok}", timeout=10)
if r.status_code == 200:
add("✅ FACEBOOK_INSTAGRAM_META_TOKEN: Active")
else:
add(f"❌ FACEBOOK_INSTAGRAM_META_TOKEN: HTTP {r.status_code}")
except Exception as e:
add("❌ FACEBOOK_INSTAGRAM_META_TOKEN: Network Error")
else:
add("❌ FACEBOOK_INSTAGRAM_META_TOKEN: Missing")
​# --- 4. API URLS & ENDPOINTS ---
add("\n🌐 API URLs & Endpoints Diagnosis")
​for url_name in ["HADITH_API_URL", "PRAYER_TIMES_API_URL", "QURAN_API_URL"]:
u = os.getenv(url_name)
if u:
try:
r = requests.get(u, timeout=10)
if r.status_code in [200, 201]:
add(f"✅ {url_name}: Reachable (HTTP {r.status_code})")
else:
add(f"⚠️ {url_name}: HTTP {r.status_code}")
except Exception as e:
add(f"❌ {url_name}: Connection Failed")
else:
add(f"❌ {url_name}: Missing")
​# --- 5. OTHER SECRETS & FOLDER IDS PRESENCE ---
add("\n🔐 Folder IDs & Other Secrets Presence Check")
​other_secrets = [
"COVER_API_KEY", "DEEPLL_API_KEY", "JINA_API_KEY", "TOKEN_GITHUB",
"FACEBOOK_PAGE_ID", "INSTAGRAM_BUSINESS_ACCOUNT_ID",
"DAILY_HADITH_YT_PLAYLIST_ID", "DAILY_YOUTUBE_YT_PLAYLIST_ID",
"GDRIVE_LONG_VIDEO_FOLDER_ID", "GDRIVE_SHORT_VIDEO_FOLDER_ID", "GDRIVE_STORY_VIDEO_FOLDER_ID"
]
​for sec in other_secrets:
val = os.getenv(sec, "").strip()
if val:
add(f"✅ {sec}: Present ({mask(val)})")
else:
add(f"❌ {sec}: Missing or Empty")
​# --- 6. TELEGRAM BOT VERIFICATION & SENDING ---
if bot_token:
try:
r = requests.get(f"https://api.telegram.org/bot{bot_token}/getMe", timeout=10)
if r.status_code == 200:
b_name = r.json().get("result", {}).get("first_name", "Bot")
add(f"\n📲 TELEGRAM_BOT_TOKEN: Valid Bot ({b_name})")
else:
add(f"\n❌ TELEGRAM_BOT_TOKEN: Invalid Token (HTTP {r.status_code})")
except Exception as e:
add("\n❌ TELEGRAM_BOT_TOKEN: Could not verify bot with Telegram")
else:
add("\n❌ TELEGRAM_BOT_TOKEN: Missing")
​if curr:
chunks.append(curr)
​# Send all chunks to Telegram
if bot_token and chat_id:
print(f"Sending {len(chunks)} report chunk(s) to Telegram...")
for idx, c in enumerate(chunks, 1):
try:
res = requests.post(
f"https://api.telegram.org/bot{bot_token}/sendMessage",
json={"chat_id": chat_id, "text": c, "parse_mode": "Markdown"},
timeout=15
)
if res.status_code == 200:
print(f"✅ Report Part {idx} sent successfully!")
else:
print(f"❌ Failed to send Part {idx}: HTTP {res.status_code} - {res.text}")
except Exception as err:
print(f"❌ Exception sending Telegram message: {err}")
time.sleep(1.5)
else:
print("❌ Telegram Bot Token or Chat ID is missing! Printing report to Actions log:\n")
for c in chunks:
print(c)
PYTHON_SCRIPT
​python diagnose_all.py
