name: 🤖Send_repo TG

on:
  workflow_dispatch:

jobs:
  bundle-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Latest Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Combine All Files into Single File (Without Folder Tree)
        run: |
          python3 - << 'EOF'
          import os
          import base64

          output_file = "all_code_combined.txt"

          # Clean up existing output file if present
          if os.path.exists(output_file):
              os.remove(output_file)

          IGNORE_DIRS = {".git", "__pycache__", "node_modules", "venv", "env", ".pytest_cache", ".idea", ".vscode"}
          IGNORE_FILES = {output_file, ".DS_Store"}

          # Binary / Image File Checker
          def is_binary_file(filepath):
              try:
                  with open(filepath, 'tr', encoding='utf-8') as f:
                      f.read(2048)
                      return False
              except UnicodeDecodeError:
                  return True

          # Collect All Current Files
          all_files = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in IGNORE_DIRS and not (d.startswith(".") and d != ".github")]
              for file in sorted(files):
                  if file not in IGNORE_FILES:
                      all_files.append(os.path.join(root, file))

          all_files.sort()

          # Write Everything into a Single File (Direct Files with Paths)
          with open(output_file, "w", encoding="utf-8") as outfile:
              outfile.write("================================================================================\n")
              outfile.write("                 COMPLETE REPOSITORY CODEBASE & MEDIA NOTE                      \n")
              outfile.write("================================================================================\n\n")

              success_count = 0
              for filepath in all_files:
                  relative_path = os.path.relpath(filepath, ".")
                  outfile.write("\n" + "─"*80 + "\n")
                  outfile.write(f"📄 FILE: {relative_path}\n")
                  outfile.write("─"*80 + "\n\n")
                  
                  if is_binary_file(filepath):
                      try:
                          with open(filepath, "rb") as bfile:
                              encoded = base64.b64encode(bfile.read()).decode('utf-8')
                              outfile.write(f"# [IMAGE/BINARY FILE EMBEDDED AS BASE64 DATA]\n")
                              outfile.write(f"data:application/octet-stream;base64,{encoded}\n\n")
                          success_count += 1
                      except Exception as e:
                          outfile.write(f"# [Error reading binary file]: {e}\n\n")
                  else:
                      try:
                          with open(filepath, "r", encoding="utf-8", errors="ignore") as infile:
                              outfile.write(infile.read())
                              outfile.write("\n\n")
                          success_count += 1
                      except Exception as e:
                          outfile.write(f"# [Error reading text file]: {e}\n\n")

          print(f"Successfully combined {success_count} files into {output_file}")
          EOF

      - name: Send Combined File to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Error: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret is missing!"
            exit 1
          fi

          curl -s -F chat_id="$TELEGRAM_CHAT_ID" \
               -F document=@all_code_combined.txt \
               -F caption="📦 Updated Repository Note (Direct Files with Paths) Delivered!" \
               https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument
