name: 👑 SawajStudioBot Developer

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  developer:
    name: 👑 Developer Working
    runs-on: ubuntu-latest
    timeout-minutes: 1440

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install
        run: pip install requests

      - name: 👑 Run Developer
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_AI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_AI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_AI }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY_AI }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY_AI }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY_AI }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY_AI }}
        run: |
          cat << 'EOFPY' > /tmp/dev.py
          import os, re, ast, json, time, requests
          from datetime import datetime

          BOT_ROOT = "sawajstudiobot"
          PROGRESS = "bot update upgrade/_king_progress.json"
          SKIP = ("__pycache__", ".git", "output", "_work", "_backups", "_logs", "venv", "node_modules",
                  "bot update upgrade", "Code editor", "_temp_builder")
          TIMEOUT = 300
          AIS = ["Groq", "Gemini", "OpenRouter", "Mistral", "Cerebras", "Cohere", "NVIDIA", "HuggingFace"]

          def tg(msg, silent=False):
              t = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
              c = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
              if not t or not c: return
              try:
                  requests.post(f"https://api.telegram.org/bot{t}/sendMessage",
                                json={"chat_id": c, "text": msg[:4000], "parse_mode": "HTML",
                                      "disable_web_page_preview": True, "disable_notification": silent},
                                timeout=15)
              except: pass

          def skip(path):
              p = path.replace("\\", "/")
              for s in SKIP:
                  if s in p: return True
              return False

          def scan():
              files = []
              folders = {}
              for root, dirs, fnames in os.walk(BOT_ROOT):
                  dirs[:] = [d for d in dirs if not skip(os.path.join(root, d))]
                  rel_dir = os.path.relpath(root, BOT_ROOT)
                  if rel_dir != ".":
                      folders[rel_dir] = 0
                  for fn in fnames:
                      full = os.path.join(root, fn)
                      if skip(full): continue
                      if fn.endswith(".py"):
                          rel = os.path.relpath(full, BOT_ROOT)
                          files.append(rel)
                          parent = os.path.dirname(rel)
                          if parent in folders:
                              folders[parent] += 1
              return sorted(files), folders

          def load_prog():
              if os.path.exists(PROGRESS):
                  try:
                      with open(PROGRESS) as f: return json.load(f)
                  except: pass
              return {"upgraded": {}, "new_files": []}

          def save_prog(d):
              os.makedirs(os.path.dirname(PROGRESS), exist_ok=True)
              with open(PROGRESS, "w") as f: json.dump(d, f, indent=2)

          def post(url, headers, payload, timeout=TIMEOUT):
              try:
                  r = requests.post(url, headers=headers, json=payload, timeout=timeout)
                  if r.status_code == 200: return r.json()
              except: pass
              return None

          def call_ai(ai, prompt):
              try:
                  if ai == "Groq":
                      k = os.environ.get("GROQ_API_KEY", "").strip()
                      if not k: return None
                      for m in ["llama-3.3-70b-versatile", "llama-3.1-8b-instant"]:
                          d = post("https://api.groq.com/openai/v1/chat/completions",
                                   {"Authorization": f"Bearer {k}"},
                                   {"model": m, "messages": [{"role": "user", "content": prompt}],
                                    "max_tokens": 8000, "temperature": 0.2})
                          if d and "choices" in d: return d["choices"][0]["message"]["content"]
                  elif ai == "Gemini":
                      k = os.environ.get("GEMINI_API_KEY", "").strip()
                      if not k: return None
                      for m in ["gemini-2.0-flash", "gemini-1.5-flash"]:
                          d = post(f"https://generativelanguage.googleapis.com/v1beta/models/{m}:generateContent?key={k}",
                                   {}, {"contents": [{"parts": [{"text": prompt}]}],
                                        "generationConfig": {"maxOutputTokens": 8000, "temperature": 0.2}})
                          if d and "candidates" in d:
                              try: return d["candidates"][0]["content"]["parts"][0]["text"]
                              except: pass
                  elif ai == "OpenRouter":
                      k = os.environ.get("OPENROUTER_API_KEY", "").strip()
                      if not k: return None
                      d = post("https://openrouter.ai/api/v1/chat/completions",
                               {"Authorization": f"Bearer {k}"},
                               {"model": "openai/gpt-4o-mini",
                                "messages": [{"role": "user", "content": prompt}],
                                "max_tokens": 8000, "temperature": 0.2})
                      if d and "choices" in d: return d["choices"][0]["message"]["content"]
                  elif ai == "Mistral":
                      k = os.environ.get("MISTRAL_API_KEY", "").strip()
                      if not k: return None
                      d = post("https://api.mistral.ai/v1/chat/completions",
                               {"Authorization": f"Bearer {k}"},
                               {"model": "mistral-small-latest",
                                "messages": [{"role": "user", "content": prompt}],
                                "max_tokens": 8000, "temperature": 0.2})
                      if d and "choices" in d: return d["choices"][0]["message"]["content"]
                  elif ai == "Cerebras":
                      k = os.environ.get("CEREBRAS_API_KEY", "").strip()
                      if not k: return None
                      d = post("https://api.cerebras.ai/v1/chat/completions",
                               {"Authorization": f"Bearer {k}"},
                               {"model": "llama-3.3-70b",
                                "messages": [{"role": "user", "content": prompt}],
                                "max_tokens": 8000, "temperature": 0.2})
                      if d and "choices" in d: return d["choices"][0]["message"]["content"]
                  elif ai == "Cohere":
                      k = os.environ.get("COHERE_API_KEY", "").strip()
                      if not k: return None
                      d = post("https://api.cohere.com/v1/chat",
                               {"Authorization": f"Bearer {k}"},
                               {"model": "command-r-plus-08-2024", "message": prompt})
                      if d and "text" in d: return d["text"]
                  elif ai == "NVIDIA":
                      k = os.environ.get("NVIDIA_API_KEY", "").strip()
                      if not k: return None
                      d = post("https://integrate.api.nvidia.com/v1/chat/completions",
                               {"Authorization": f"Bearer {k}"},
                               {"model": "meta/llama-3.3-70b-instruct",
                                "messages": [{"role": "user", "content": prompt}],
                                "max_tokens": 8000, "temperature": 0.2})
                      if d and "choices" in d: return d["choices"][0]["message"]["content"]
                  elif ai == "HuggingFace":
                      k = os.environ.get("HUGGINGFACE_API_KEY", "").strip()
                      if not k: return None
                      d = post("https://api-inference.huggingface.co/models/meta-llama/Meta-Llama-3.1-8B-Instruct/v1/chat/completions",
                               {"Authorization": f"Bearer {k}"},
                               {"model": "meta-llama/Meta-Llama-3.1-8B-Instruct",
                                "messages": [{"role": "user", "content": prompt}],
                                "max_tokens": 4000, "temperature": 0.2})
                      if d and "choices" in d:
                          try: return d["choices"][0]["message"]["content"]
                          except: pass
              except: pass
              return None

          def build_folder_tree(folders):
              lines = []
              for f, count in sorted(folders.items()):
                  lines.append(f"{f}/ ({count} files)")
              return "\n".join(lines)

          def upgrade_one(rel, idx, total, folders):
              full = os.path.join(BOT_ROOT, rel)
              try:
                  with open(full, "r", encoding="utf-8") as f:
                      code = f.read()
              except Exception as e:
                  tg(f"❌ <b>[{idx}/{total}]</b> <code>{rel}</code>\nRead error: {str(e)[:100]}")
                  return False, rel, None, 0

              folder_tree = build_folder_tree(folders)
              parent_folder = os.path.dirname(rel)

              prompt = f"""You are the MASTER AI DEVELOPER of SawajStudioBot — a WORLD #1 Islamic video automation bot.

          FULL PROJECT STRUCTURE:
          {folder_tree}

          THIS FILE:
          Path: {rel}
          Folder: {parent_folder}
          Size: {len(code)} chars

          TASK:
          1. Analyze this file
          2. Tell me WHAT needs upgrading (be specific)
          3. Provide the UPGRADED version

          RULES:
          - Keep ALL existing functionality (never remove logic)
          - Add error handling, logging, docstrings, type hints
          - Remove any copyright text
          - Add new features if helpful
          - If a new file is needed, say: ═══ NEW FILE: path ═══ <code> ═══ END ═══
          - NEVER DELETE anything

          RETURN FORMAT:
          ═══ FILE: {rel} ═══
          <upgraded code>
          ═══ END ═══

          === CURRENT CODE ===
          {code}
          """

              start = (idx - 1) % len(AIS)
              ordered = AIS[start:] + AIS[:start]

              for ai in ordered:
                  print(f"  [{idx}/{total}] Trying {ai} for {rel}")
                  res = call_ai(ai, prompt)
                  if not res:
                      continue

                  if "═══ FILE:" not in res:
                      continue

                  m = re.search(r"═══ FILE: .+? ═══\s*\n(.*?)\n═══ END ═══", res, re.DOTALL)
                  if not m:
                      continue

                  new_code = m.group(1).strip()

                  try:
                      ast.parse(new_code)
                  except SyntaxError:
                      continue

                  with open(full, "w", encoding="utf-8") as f:
                      f.write(new_code + "\n")

                  new_files = re.findall(r"═══ NEW FILE: (.+?) ═══\s*\n(.*?)\n═══ END ═══", res, re.DOTALL)
                  created = 0
                  for nf_path, nf_code in new_files:
                      nf_path = nf_path.strip()
                      if not nf_path or ".." in nf_path: continue
                      nf_full = os.path.join(BOT_ROOT, nf_path)
                      os.makedirs(os.path.dirname(nf_full) or ".", exist_ok=True)
                      try:
                          ast.parse(nf_code.strip())
                          with open(nf_full, "w", encoding="utf-8") as f:
                              f.write(nf_code.strip() + "\n")
                          created += 1
                          tg(f"🆕 <b>NEW FILE</b>: <code>{nf_path}</code>")
                      except: pass

                  size_before = len(code)
                  size_after = len(new_code)
                  diff = size_after - size_before
                  sign = "+" if diff >= 0 else ""

                  tg(
                      f"✅ <b>[{idx}/{total}] UPGRADED</b>\n"
                      f"📄 <code>{rel}</code>\n"
                      f"🤖 AI: <b>{ai}</b>\n"
                      f"📊 {size_before}→{size_after} ({sign}{diff})\n"
                      f"🆕 New files: {created}"
                  )
                  return True, rel, ai, created

              tg(
                  f"⚠️ <b>[{idx}/{total}] SKIPPED</b>\n"
                  f"📄 <code>{rel}</code>\n"
                  f"🤖 All 8 AI failed"
              )
              return False, rel, None, 0

          def main():
              files, folders = scan()
              if not files:
                  tg("⚠️ No files in sawajstudiobot")
                  return

              prog = load_prog()
              files = sorted(files, key=lambda f: prog["upgraded"].get(f, {}).get("time", "0"))
              total = len(files)
              tg(
                  f"👑 <b>DEVELOPER STARTED</b>\n"
                  f"📁 {total} files to upgrade\n"
                  f"🎯 One-by-one, no limit\n"
                  f"🚫 No delete, only add/modify"
              )
              ok, fail, new_total = 0, 0, 0

              for idx, rel in enumerate(files, 1):
                  try:
                      status, r, ai, created = upgrade_one(rel, idx, total, folders)
                      if status:
                          ok += 1
                          new_total += created
                          prog["upgraded"][rel] = {
                              "time": datetime.now().strftime("%Y-%m-%d %H:%M:%S"),
                              "ai": ai
                          }
                          if ok % 5 == 0:
                              save_prog(prog)
                      else:
                          fail += 1
                  except Exception as e:
                      fail += 1
                      tg(f"❌ <b>[{idx}/{total}]</b> <code>{rel}</code>\n{str(e)[:100]}")

              save_prog(prog)
              tg(
                  f"🏁 <b>DEVELOPER COMPLETE</b>\n"
                  f"✅ Upgraded: <b>{ok}</b>\n"
                  f"❌ Failed: <b>{fail}</b>\n"
                  f"🆕 New files: <b>{new_total}</b>\n"
                  f"📁 Total processed: <b>{total}</b>"
              )

          if __name__ == "__main__":
              main()
          EOFPY
          python /tmp/dev.py

      - name: 📤 Commit
        if: always()
        run: |
          git config user.name "SawajBot Dev"
          git config user.email "dev@sawajstudio.com"
          git add -A
          git commit -m "👑 Developer upgrade — $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "No changes"
          git push || echo "Push failed"
