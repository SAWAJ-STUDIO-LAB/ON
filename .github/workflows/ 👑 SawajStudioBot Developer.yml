name: 👑 SawajStudioBot Autonomous Developer

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  developer:
    name: 👑 Autonomous Developer Working
    runs-on: ubuntu-latest
    timeout-minutes: 1440

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Requirements
        run: pip install requests

      - name: 👑 Run Autonomous Developer Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_AI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_AI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_AI }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY_AI }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY_AI }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY_AI }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY_AI }}
        run: |
          cat << 'EOFPY' > /tmp/dev.py
          import os, re, ast, json, time, requests
          from datetime import datetime

          BOT_ROOT = "sawajstudiobot"
          PROGRESS = "bot update upgrade/_king_progress.json"
          SKIP = ("__pycache__", ".git", "output", "_work", "_backups", "_logs", "venv", "node_modules",
                  "bot update upgrade", "Code editor", "_temp_builder")
          TIMEOUT = 300
          AIS = ["Groq", "Gemini", "OpenRouter", "Mistral", "Cerebras", "Cohere", "NVIDIA", "HuggingFace"]

          def tg(msg, silent=False):
              t = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
              c = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
              if not t or not c: return
              try:
                  requests.post(f"https://api.telegram.org/bot{t}/sendMessage",
                                json={"chat_id": c, "text": msg[:4000], "parse_mode": "HTML",
                                      "disable_web_page_preview": True, "disable_notification": silent},
                                timeout=15)
              except: pass

          def skip(path):
              p = path.replace("\\", "/")
              for s in SKIP:
                  if s in p: return True
              return False

          def scan():
              files = []
              folders = {}
              for root, dirs, fnames in os.walk(BOT_ROOT):
                  dirs[:] = [d for d in dirs if not skip(os.path.join(root, d))]
                  rel_dir = os.path.relpath(root, BOT_ROOT)
                  if rel_dir != ".":
                      folders[rel_dir] = []
                  for fn in fnames:
                      full = os.path.join(root, fn)
                      if skip(full): continue
                      if fn.endswith(".py"):
                          rel = os.path.relpath(full, BOT_ROOT)
                          files.append(rel)
                          parent = os.path.dirname(rel)
                          if parent in folders:
                              folders[parent].append(fn)
              return sorted(files), folders

          def load_prog():
              if os.path.exists(PROGRESS):
                  try:
                      with open(PROGRESS) as f: return json.load(f)
                  except: pass
              return {"upgraded": {}, "new_files": []}

          def save_prog(d):
              os.makedirs(os.path.dirname(PROGRESS), exist_ok=True)
              with open(PROGRESS, "w") as f: json.dump(d, f, indent=2)

          def post(url, headers, payload, timeout=TIMEOUT):
              try:
                  r = requests.post(url, headers=headers, json=payload, timeout=timeout)
                  if r.status_code == 200: return r.json()
              except: pass
              return None

          def call_ai(ai, prompt):
              try:
                  if ai == "Groq":
                      k = os.environ.get("GROQ_API_KEY", "").strip()
                      if not k: return None
                      for m in ["llama-3.3-70b-versatile", "llama-3.1-8b-instant"]:
                          d = post("https://api.groq.com/openai/v1/chat/completions",
                                   {"Authorization": f"Bearer {k}"},
                                   {"model": m, "messages": [{"role": "user", "content": prompt}],
                                    "max_tokens": 8000, "temperature": 0.2})
                          if d and "choices" in d: return d["choices"][0]["message"]["content"]
                  elif ai == "Gemini":
                      k = os.environ.get("GEMINI_API_KEY", "").strip()
                      if not k: return None
                      for m in ["gemini-2.5-pro", "gemini-2.0-flash", "gemini-1.5-flash"]:
                          d = post(f"https://generativelanguage.googleapis.com/v1beta/models/{m}:generateContent?key={k}",
                                   {"Content-Type": "application/json"},
                                   {"contents": [{"parts": [{"text": prompt}]}],
                                    "generationConfig": {"maxOutputTokens": 8000, "temperature": 0.2}})
                          if d and "candidates" in d:
                              try: return d["candidates"][0]["content"]["parts"][0]["text"]
                              except: pass
                  elif ai == "OpenRouter":
                      k = os.environ.get("OPENROUTER_API_KEY", "").strip()
                      if not k: return None
                      d = post("https://openrouter.ai/api/v1/chat/completions",
                               {"Authorization": f"Bearer {k}"},
                               {"model": "openai/gpt-4o-mini",
                                "messages": [{"role": "user", "content": prompt}],
                                "max_tokens": 8000, "temperature": 0.2})
                      if d and "choices" in d: return d["choices"][0]["message"]["content"]
                  elif ai == "Mistral":
                      k = os.environ.get("MISTRAL_API_KEY", "").strip()
                      if not k: return None
                      d = post("https://api.mistral.ai/v1/chat/completions",
                               {"Authorization": f"Bearer {k}"},
                               {"model": "mistral-small-latest",
                                "messages": [{"role": "user", "content": prompt}],
                                "max_tokens": 8000, "temperature": 0.2})
                      if d and "choices" in d: return d["choices"][0]["message"]["content"]
                  elif ai == "Cerebras":
                      k = os.environ.get("CEREBRAS_API_KEY", "").strip()
                      if not k: return None
                      d = post("https://api.cerebras.ai/v1/chat/completions",
                               {"Authorization": f"Bearer {k}"},
                               {"model": "llama-3.3-70b",
                                "messages": [{"role": "user", "content": prompt}],
                                "max_tokens": 8000, "temperature": 0.2})
                      if d and "choices" in d: return d["choices"][0]["message"]["content"]
                  elif ai == "Cohere":
                      k = os.environ.get("COHERE_API_KEY", "").strip()
                      if not k: return None
                      d = post("https://api.cohere.com/v1/chat",
                               {"Authorization": f"Bearer {k}"},
                               {"model": "command-r-plus-08-2024", "message": prompt})
                      if d and "text" in d: return d["text"]
                  elif ai == "NVIDIA":
                      k = os.environ.get("NVIDIA_API_KEY", "").strip()
                      if not k: return None
                      d = post("https://integrate.api.nvidia.com/v1/chat/completions",
                               {"Authorization": f"Bearer {k}"},
                               {"model": "meta/llama-3.3-70b-instruct",
                                "messages": [{"role": "user", "content": prompt}],
                                "max_tokens": 8000, "temperature": 0.2})
                      if d and "choices" in d: return d["choices"][0]["message"]["content"]
                  elif ai == "HuggingFace":
                      k = os.environ.get("HUGGINGFACE_API_KEY", "").strip()
                      if not k: return None
                      d = post("https://api-inference.huggingface.co/models/meta-llama/Meta-Llama-3.1-8B-Instruct/v1/chat/completions",
                               {"Authorization": f"Bearer {k}"},
                               {"model": "meta-llama/Meta-Llama-3.1-8B-Instruct",
                                "messages": [{"role": "user", "content": prompt}],
                                "max_tokens": 4000, "temperature": 0.2})
                      if d and "choices" in d:
                          try: return d["choices"][0]["message"]["content"]
                          except: pass
              except Exception as e:
                  print(f"Error calling {ai}: {e}")
              return None

          def build_tree(folders, files):
              lines = [f"{BOT_ROOT}/"]
              for folder in sorted(folders.keys()):
                  depth = folder.count(os.sep)
                  indent = "  " * depth
                  name = os.path.basename(folder)
                  fcount = len(folders[folder])
                  lines.append(f"{indent}├── {name}/ ({fcount} files)")
              return "\n".join(lines)

          def get_siblings(rel, folders):
              parent = os.path.dirname(rel)
              return folders.get(parent, [])

          def parse_ai_response(response, current_file_rel):
              main_code = None
              main_match = re.search(r"═══ FILE:\s*(.+?)\s*═══\s*\n(.*?)\n\s*═══ END", response, re.DOTALL)
              if main_match:
                  main_code = main_match.group(2).strip()
              else:
                  code_blocks = re.findall(r"```(?:python)?\n(.*?)\n```", response, re.DOTALL)
                  if code_blocks: main_code = code_blocks[0].strip()

              new_files = {}
              new_matches = re.findall(r"═══ NEW FILE:\s*(.+?)\s*═══\s*\n(.*?)\n\s*═══ END", response, re.DOTALL)
              for path, code in new_matches:
                  path = path.strip()
                  code = code.strip()
                  if path and code and ".." not in path:
                      new_files[path] = code

              return main_code, new_files

          def upgrade_one(rel, idx, total, folders):
              full = os.path.join(BOT_ROOT, rel)
              try:
                  with open(full, "r", encoding="utf-8") as f:
                      code = f.read()
              except Exception:
                  tg(f"❌ <b>[{idx}/{total}]</b> <code>{rel}</code> — read error")
                  return False, rel, None, 0

              tree = build_tree(folders, [])
              parent = os.path.dirname(rel)
              siblings = get_siblings(rel, folders)
              siblings_str = ", ".join(siblings[:15])
              
              prompt = f"""You are the AUTONOMOUS LEAD DEVELOPER & ARCHITECT for "SawajStudioBot".
          You fully own this project. You write the code, you control the structure, and you upgrade it to WORLD-CLASS standards.

          1️⃣ PROJECT ARCHITECTURE (FOLDER STRUCTURE):
          {tree}

          2️⃣ CURRENT TASK:
          - Current File Location: {rel}
          - Folder: {parent}/
          - Siblings in this folder: {siblings_str}

          3️⃣ CRITICAL RULES (STRICTLY FOLLOW - ZERO DELETION POLICY):
          1. 🚫 DO NOT DELETE ANY EXISTING CODE. You MUST KEEP ALL existing imports, variables, functions, classes, and logic exactly as they are. 
          2. UPGRADE & ENHANCE: Add robust error handling (try-except), type hints, logging, and professional docstrings. Make the code production-ready.
          3. 🚫 DO NOT SUMMARIZE. Write the FULL, complete code. Do not write "rest of the code here". You must return the FULL upgraded file code.
          4. CREATE NEW FILES IF NEEDED: If you want to add new features, utilities, or split code for better architecture, you CAN create new files.

          RETURN FORMAT (EXACT):
          You must return the updated code for the current file:
          ═══ FILE: {rel} ═══
          <full upgraded python code here (old code + your new improvements)>
          ═══ END ═══

          (Optional) If you want to add NEW files to the project, use this format for each new file:
          ═══ NEW FILE: folder/path/new_feature.py ═══
          <new python code here>
          ═══ END ═══

          CURRENT CODE OF {rel}:
          {code if code.strip() else "# Empty file - Please generate world-class boilerplate for this file based on its name and location."}
          """

              start = (idx - 1) % len(AIS)
              ordered = AIS[start:] + AIS[:start]

              for ai in ordered:
                  print(f"  [{idx}/{total}] {ai} processing {rel}...")
                  res = call_ai(ai, prompt)
                  if not res: continue

                  main_code, new_files = parse_ai_response(res, rel)
                  if not main_code or len(main_code) < 20: continue

                  if len(code) > 50 and len(main_code) < (len(code) * 0.85):
                      print(f"  [!] Rejected {ai} output for {rel}: Code shrunk too much. Suspected deletion.")
                      continue

                  try:
                      ast.parse(main_code)
                  except SyntaxError: continue

                  with open(full, "w", encoding="utf-8") as f:
                      f.write(main_code + "\n")

                  created_count = 0
                  new_file_msg = ""

                  for nf_path, nf_code in new_files.items():
                      try:
                          ast.parse(nf_code)
                          nf_full = os.path.join(BOT_ROOT, nf_path)
                          os.makedirs(os.path.dirname(nf_full), exist_ok=True)
                          with open(nf_full, "w", encoding="utf-8") as f:
                              f.write(nf_code + "\n")
                          created_count += 1
                          new_file_msg += f"\n🆕 Created: <code>{nf_path}</code>"
                      except: pass

                  msg = f"✅ <b>[{idx}/{total}]</b>\n📄 <code>{rel}</code>\n🤖 {ai}\n📊 Size: {len(code)} → {len(main_code)}"
                  if created_count > 0:
                      msg += new_file_msg
                  tg(msg)

                  return True, rel, ai, created_count

              tg(f"⚠️ <b>[{idx}/{total}]</b> <code>{rel}</code> — All AIs failed or deleted code")
              return False, rel, None, 0

          def main():
              files, folders = scan()
              if not files:
                  tg("⚠️ No files found to process.")
                  return

              tree = build_tree(folders, files)
              tg(f"👑 <b>AUTONOMOUS DEVELOPER STARTED</b>\n📁 Target Files: <b>{len(files)}</b>\n📂 Folders: <b>{len(folders)}</b>\n\n<b>PROJECT STRUCTURE:</b>\n<pre>{tree[:3500]}</pre>")

              prog = load_prog()
              files = sorted(files, key=lambda f: prog["upgraded"].get(f, {}).get("time", "0"))
              total = len(files)

              ok, fail, total_new = 0, 0, 0

              for idx, rel in enumerate(files, 1):
                  try:
                      status, r, ai, new_count = upgrade_one(rel, idx, total, folders)
                      if status:
                          ok += 1
                          total_new += new_count
                          prog["upgraded"][rel] = {"time": datetime.now().strftime("%Y-%m-%d %H:%M:%S"), "ai": ai}
                          if ok % 5 == 0: save_prog(prog)
                      else:
                          fail += 1
                  except Exception as e:
                      fail += 1
                      tg(f"❌ <b>[{idx}/{total}]</b> <code>{rel}</code>\n{str(e)[:100]}")

              save_prog(prog)
              tg(f"🏁 <b>DEVELOPER COMPLETE</b>\n✅ Upgraded: <b>{ok}</b> files\n🆕 New Files Created: <b>{total_new}</b>\n❌ Failed/Skipped: <b>{fail}</b>\n📁 Total Processed: <b>{total}</b>")

          if __name__ == "__main__":
              main()
          EOFPY
          python /tmp/dev.py

      - name: 📤 Commit and Push Changes
        if: always()
        run: |
          git config user.name "SawajBot Developer AI"
          git config user.email "ai.dev@sawajstudio.com"
          git add -A
          git commit -m "👑 Autonomous Developer Upgrade: 100% Code Preserved & Enhanced — $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "No changes to commit"
          git push || echo "Push failed"
