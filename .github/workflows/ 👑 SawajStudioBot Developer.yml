name: 👑 SawajStudioBot Developer 

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  developer:
    name: 👑 Personal Developer Working
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Packages
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 👑 Run Personal Developer
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_AI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_AI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_AI }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY_AI }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY_AI }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY_AI }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY_AI }}
        run: |
          cat > /tmp/developer.py << 'ENDOFSCRIPT'
          import os
          import re
          import ast
          import json
          import time
          import shutil
          import requests
          from datetime import datetime

          BOT_ROOT = "sawajstudiobot"
          WORK = "bot update upgrade/_work"
          BACKUP = "bot update upgrade/_backups"
          LOG_DIR = "bot update upgrade/_logs"
          PROGRESS_FILE = "bot update upgrade/_king_progress.json"
          ROOT_SKIP = "bot update upgrade"
          TEXT_EXT = {".py", ".txt", ".md", ".json", ".yml", ".yaml", ".toml", ".cfg", ".ini", ".env", ".example"}
          TIMEOUT = 180
          MAX_TOKENS = 8000

          ALL_AIS = [
              "OpenRouter", "Groq", "Gemini", "Mistral",
              "Cerebras", "Cohere", "NVIDIA", "HuggingFace"
          ]

          # Priority order (important files first)
          PRIORITY_KEYWORDS = [
              "config", "logger", "telegram", "entry", "main", "run",
              "generator", "uploader", "core", "A1_", "A2_", "A3_",
              "G_entry", "video_generator", "video_uploader"
          ]

          def tg_send(msg, silent=False):
              token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
              chat = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
              if not token or not chat:
                  return False
              try:
                  r = requests.post(
                      f"https://api.telegram.org/bot{token}/sendMessage",
                      json={"chat_id": chat, "text": msg[:4000],
                            "parse_mode": "HTML",
                            "disable_web_page_preview": True,
                            "disable_notification": silent},
                      timeout=15)
                  return r.status_code == 200
              except Exception:
                  return False

          def is_skipped(full_path):
              parts = full_path.replace("\\", "/").split("/")
              for p in parts:
                  if p in ("__pycache__", ".git", "output", "_work", "_backups", "_logs", "venv", "node_modules"):
                      return True
              if ROOT_SKIP in full_path:
                  return True
              if "Code editor" in full_path or "_temp_builder" in full_path:
                  return True
              return False

          def scan_all():
              files = []
              folders = set()
              for root, dirs, fnames in os.walk(BOT_ROOT):
                  dirs[:] = [d for d in dirs if not is_skipped(os.path.join(root, d))]
                  rel_dir = os.path.relpath(root, BOT_ROOT)
                  if rel_dir != ".":
                      folders.add(rel_dir)
                  for fn in fnames:
                      full = os.path.join(root, fn)
                      if is_skipped(full):
                          continue
                      ext = os.path.splitext(fn)[1].lower()
                      if ext in TEXT_EXT or fn.startswith(".env"):
                          rel = os.path.relpath(full, BOT_ROOT)
                          files.append(rel)
              return sorted(files), sorted(folders)

          def priority_sort(files):
              def score(f):
                  f_lower = f.lower()
                  for i, kw in enumerate(PRIORITY_KEYWORDS):
                      if kw in f_lower:
                          return i
                  return 999
              return sorted(files, key=score)

          def build_structure_text(folders, files):
              lines = ["═══ FULL PROJECT STRUCTURE ═══"]
              for f in folders:
                  lines.append(f"{f}/")
              lines.append("")
              lines.append("═══ ALL FILES ═══")
              for f in files:
                  lines.append(f)
              lines.append("═══ END STRUCTURE ═══")
              return "\n".join(lines)

          def load_progress():
              if os.path.exists(PROGRESS_FILE):
                  try:
                      with open(PROGRESS_FILE, "r", encoding="utf-8") as f:
                          return json.load(f)
                  except:
                      pass
              return {"upgraded": {}, "last_run": None, "total_upgrades": 0}

          def save_progress(data):
              os.makedirs(os.path.dirname(PROGRESS_FILE), exist_ok=True)
              with open(PROGRESS_FILE, "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2)

          def _post(url, headers, payload, timeout=TIMEOUT, retries=2):
              for attempt in range(1, retries + 1):
                  try:
                      r = requests.post(url, headers=headers, json=payload, timeout=timeout)
                      if r.status_code == 200:
                          return r.json()
                      if r.status_code in (429, 500, 502, 503, 504):
                          time.sleep(attempt * 4)
                          continue
                      return None
                  except Exception:
                      time.sleep(3)
              return None

          def call_ai(ai_name, prompt, max_tokens=MAX_TOKENS):
              if ai_name == "OpenRouter":
                  key = os.environ.get("OPENROUTER_API_KEY", "").strip()
                  if not key: return None
                  d = _post("https://openrouter.ai/api/v1/chat/completions",
                            {"Authorization": f"Bearer {key}"},
                            {"model": "openai/gpt-4o-mini",
                             "messages": [{"role": "user", "content": prompt}],
                             "max_tokens": max_tokens, "temperature": 0.2})
                  return d["choices"][0]["message"]["content"] if d else None

              if ai_name == "Groq":
                  key = os.environ.get("GROQ_API_KEY", "").strip()
                  if not key: return None
                  for model in ["llama-3.3-70b-versatile", "llama-3.1-70b-versatile", "llama-3.1-8b-instant"]:
                      d = _post("https://api.groq.com/openai/v1/chat/completions",
                                {"Authorization": f"Bearer {key}"},
                                {"model": model,
                                 "messages": [{"role": "user", "content": prompt}],
                                 "max_tokens": min(max_tokens, 8000), "temperature": 0.2})
                      if d: return d["choices"][0]["message"]["content"]
                  return None

              if ai_name == "Gemini":
                  key = os.environ.get("GEMINI_API_KEY", "").strip()
                  if not key: return None
                  for model in ["gemini-2.0-flash", "gemini-1.5-flash", "gemini-1.5-pro"]:
                      d = _post(
                          f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={key}",
                          {},
                          {"contents": [{"parts": [{"text": prompt}]}],
                           "generationConfig": {"maxOutputTokens": max_tokens, "temperature": 0.2}})
                      if d:
                          try:
                              return d["candidates"][0]["content"]["parts"][0]["text"]
                          except: continue
                  return None

              if ai_name == "Mistral":
                  key = os.environ.get("MISTRAL_API_KEY", "").strip()
                  if not key: return None
                  for model in ["mistral-small-latest", "open-mistral-7b"]:
                      d = _post("https://api.mistral.ai/v1/chat/completions",
                                {"Authorization": f"Bearer {key}"},
                                {"model": model,
                                 "messages": [{"role": "user", "content": prompt}],
                                 "max_tokens": min(max_tokens, 8000), "temperature": 0.2})
                      if d: return d["choices"][0]["message"]["content"]
                  return None

              if ai_name == "Cerebras":
                  key = os.environ.get("CEREBRAS_API_KEY", "").strip()
                  if not key: return None
                  for model in ["llama-3.3-70b", "llama3.1-70b"]:
                      d = _post("https://api.cerebras.ai/v1/chat/completions",
                                {"Authorization": f"Bearer {key}"},
                                {"model": model,
                                 "messages": [{"role": "user", "content": prompt}],
                                 "max_tokens": min(max_tokens, 8000), "temperature": 0.2})
                      if d: return d["choices"][0]["message"]["content"]
                  return None

              if ai_name == "Cohere":
                  key = os.environ.get("COHERE_API_KEY", "").strip()
                  if not key: return None
                  for model in ["command-r-plus-08-2024", "command-r-plus"]:
                      d = _post("https://api.cohere.com/v1/chat",
                                {"Authorization": f"Bearer {key}"},
                                {"model": model, "message": prompt})
                      if d: return d.get("text")
                  return None

              if ai_name == "NVIDIA":
                  key = os.environ.get("NVIDIA_API_KEY", "").strip()
                  if not key: return None
                  for model in ["meta/llama-3.3-70b-instruct", "meta/llama-3.1-70b-instruct"]:
                      d = _post("https://integrate.api.nvidia.com/v1/chat/completions",
                                {"Authorization": f"Bearer {key}"},
                                {"model": model,
                                 "messages": [{"role": "user", "content": prompt}],
                                 "max_tokens": min(max_tokens, 8000), "temperature": 0.2})
                      if d: return d["choices"][0]["message"]["content"]
                  return None

              if ai_name == "HuggingFace":
                  key = os.environ.get("HUGGINGFACE_API_KEY", "").strip()
                  if not key: return None
                  for model in ["meta-llama/Meta-Llama-3.1-8B-Instruct", "mistralai/Mistral-7B-Instruct-v0.3"]:
                      d = _post(
                          f"https://api-inference.huggingface.co/models/{model}/v1/chat/completions",
                          {"Authorization": f"Bearer {key}"},
                          {"model": model,
                           "messages": [{"role": "user", "content": prompt}],
                           "max_tokens": 4000, "temperature": 0.2})
                      if d:
                          try: return d["choices"][0]["message"]["content"]
                          except: continue
                  return None
              return None

          def make_prompt(structure, filepath, code):
              return f"""You are the WORLD #1 Personal AI Developer of SawajStudioBot.

          Your only mission is to make this Islamic Video Generation + Social Media Automation Studio the absolute WORLD NUMBER 1 project.

          PROJECT CONTEXT:
          - This is a professional multi-module system that generates Islamic content videos (Hadith, Stories) for Facebook, Instagram and YouTube (Story, Shorts, Long).
          - It has deep modular structure: A_core, B_graphics, C_content, D_video, E_audio, F_drive, G_entry, uploaders etc.
          - Never delete any existing functionality.
          - Always improve, never break.

          FULL PROJECT STRUCTURE (for deep understanding):
          {structure}

          CURRENT FILE YOU MUST UPGRADE:
          ═══ FILE: {filepath} ═══
          {code}
          ═══ END ═══

          YOUR RULES (STRICT):
          1. Return ONLY the upgraded version of this file (and any new files if needed)
          2. Use exact format:
             ═══ FILE: {filepath} ═══
             <full upgraded code>
             ═══ END ═══
          3. You are allowed to create new helper/feature files if it makes the system better:
             ═══ NEW FILE: path/to/new_file.py ═══
             <code>
             ═══ END ═══
          4. Fix every bug, improve error handling, add type hints, docstrings, logging, fallbacks
          5. Make code clean, production-ready, highly modular and world-class
          6. NEVER remove any existing feature or logic
          7. Think like a senior architect who wants this studio to be the best in the world
          8. Return ONLY the code blocks — no explanations

          Now upgrade this file to World #1 level:"""

          def apply_response(text):
              modified = 0
              new_files = 0
              changed_files = []

              for rel, code in re.findall(r"═══ NEW FILE: (.+?) ═══\n(.*?)\n═══ END ═══", text, re.DOTALL):
                  rel = rel.strip()
                  if not rel or ".." in rel: continue
                  full = os.path.join(BOT_ROOT, rel)
                  os.makedirs(os.path.dirname(full) or ".", exist_ok=True)
                  with open(full, "w", encoding="utf-8") as f:
                      f.write(code.rstrip() + "\n")
                  new_files += 1
                  changed_files.append(f"NEW: {rel}")

              for rel, code in re.findall(r"═══ FILE: (.+?) ═══\n(.*?)\n═══ END ═══", text, re.DOTALL):
                  rel = rel.strip()
                  if not rel or ".." in rel: continue
                  full = os.path.join(BOT_ROOT, rel)
                  os.makedirs(os.path.dirname(full) or ".", exist_ok=True)
                  with open(full, "w", encoding="utf-8") as f:
                      f.write(code.rstrip() + "\n")
                  modified += 1
                  changed_files.append(rel)

              return modified, new_files, changed_files

          def backup():
              ts = datetime.now().strftime("%Y-%m-%d_%H-%M-%S")
              dest = f"{BACKUP}/{ts}"
              os.makedirs(dest, exist_ok=True)
              try:
                  shutil.copytree(BOT_ROOT, f"{dest}/sawajstudiobot")
                  return dest
              except Exception:
                  return None

          def check_syntax(filepath):
              if not filepath.endswith(".py"):
                  return True
              full = os.path.join(BOT_ROOT, filepath)
              try:
                  with open(full, "r", encoding="utf-8") as f:
                      ast.parse(f.read())
                  return True
              except SyntaxError:
                  return False
              except Exception:
                  return True

          def main():
              ts = datetime.now().strftime("%Y-%m-%d %H:%M:%S")
              print("═" * 60)
              print("👑 SAWAJSTUDIOBOT PERSONAL DEVELOPER")
              print("═" * 60)

              tg_send(
                  f"👑 <b>PERSONAL DEVELOPER STARTED</b>\n"
                  f"🕐 {ts}\n"
                  f"🎯 Mission: Make SawajStudioBot World #1\n"
                  f"📂 Mode: One File At A Time + Smart Priority",
                  silent=True
              )

              os.makedirs(WORK, exist_ok=True)
              os.makedirs(LOG_DIR, exist_ok=True)

              print("\n📁 SCANNING PROJECT...")
              files, folders = scan_all()
              files = priority_sort(files)
              print(f"   Total Files: {len(files)}")
              print(f"   Total Folders: {len(folders)}")

              if not files:
                  tg_send("⚠️ No files found in sawajstudiobot")
                  return

              print("\n💾 CREATING BACKUP...")
              backup_path = backup()
              print(f"   {backup_path}")

              structure = build_structure_text(folders, files)
              progress = load_progress()

              total = len(files)
              success = 0
              failed = 0
              new_created = 0

              for idx, rel in enumerate(files, 1):
                  print(f"\n[{idx}/{total}] → {rel}")

                  full = os.path.join(BOT_ROOT, rel)
                  try:
                      with open(full, "r", encoding="utf-8") as f:
                          code = f.read()
                  except Exception as e:
                      print(f"   ❌ Read error: {e}")
                      failed += 1
                      continue

                  prompt = make_prompt(structure, rel, code)
                  upgraded = False
                  used_ai = None

                  for ai in ALL_AIS:
                      print(f"   🤖 {ai}...")
                      try:
                          res = call_ai(ai, prompt)
                          if res and ("═══ FILE:" in res or "═══ NEW FILE:" in res):
                              modified, newf, changed = apply_response(res)
                              if modified > 0 or newf > 0:
                                  # Check syntax of main file
                                  if check_syntax(rel):
                                      success += 1
                                      new_created += newf
                                      used_ai = ai
                                      upgraded = True

                                      # Update progress
                                      progress["upgraded"][rel] = {
                                          "time": ts,
                                          "ai": ai,
                                          "new_files": newf
                                      }
                                      progress["total_upgrades"] = progress.get("total_upgrades", 0) + 1
                                      progress["last_run"] = ts
                                      save_progress(progress)

                                      print(f"   ✅ Upgraded by {ai} | New files: {newf}")
                                      tg_send(
                                          f"✅ <b>[{idx}/{total}]</b>\n"
                                          f"<code>{rel}</code>\n"
                                          f"🤖 <b>{ai}</b>\n"
                                          f"🆕 New files: {newf}"
                                      )
                                      break
                                  else:
                                      print(f"   ⚠️ Syntax broken by {ai}, trying next AI...")
                          else:
                              print(f"   ⚠️ Invalid response")
                      except Exception as e:
                          print(f"   ❌ {ai} error: {str(e)[:70]}")

                  if not upgraded:
                      failed += 1
                      print(f"   ❌ Could not upgrade")
                      tg_send(f"❌ <b>[{idx}/{total}]</b> Failed\n<code>{rel}</code>")

                  time.sleep(1.2)

              # Final Report
              final = (
                  "👑 <b>PERSONAL DEVELOPER SESSION COMPLETE</b>\n"
                  "━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n"
                  f"📅 {ts}\n\n"
                  f"📁 Total Files Processed: <b>{total}</b>\n"
                  f"✅ Successfully Upgraded: <b>{success}</b>\n"
                  f"❌ Failed: <b>{failed}</b>\n"
                  f"🆕 New Files Created: <b>{new_created}</b>\n"
                  f"💾 Backup: <code>{backup_path or 'N/A'}</code>\n\n"
                  "🎯 Mission: World #1 continues...\n"
                  "━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n"
                  "👑 <b>SawajStudioBot Developer</b>"
              )
              tg_send(final)

              print("\n" + "═" * 60)
              print(f"👑 DONE | Success: {success} | Failed: {failed} | New: {new_created}")
              print("═" * 60)

          if __name__ == "__main__":
              main()
          ENDOFSCRIPT

          python /tmp/developer.py
          rm -f /tmp/developer.py

      - name: 📤 Commit Changes
        if: always()
        run: |
          git config user.name "SawajStudioBot Developer"
          git config user.email "developer@sawajstudio.com"
          git add -A
          git commit -m "👑 Personal Developer Upgrade — $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "No changes"
          git push || echo "Push failed"

      - name: ✅ Summary
        if: always()
        run: |
          echo "## 👑 SawajStudioBot Personal Developer Complete" >> $GITHUB_STEP_SUMMARY
          echo "Check Telegram for live file-by-file updates." >> $GITHUB_STEP_SUMMARY
