name: 👑 SawajStudioBot Autonomous Developer

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  developer:
    name: 👑 Autonomous Developer Working (Fast Batch Mode)
    runs-on: ubuntu-latest
    timeout-minutes: 1440

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Requirements
        run: pip install requests

      - name: 👑 Run Autonomous Developer Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_AI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_AI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_AI }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY_AI }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY_AI }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY_AI }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY_AI }}
        run: |
          cat << 'EOFPY' > /tmp/dev.py
          import os, re, ast, json, time, requests
          from datetime import datetime

          BOT_ROOT = "sawajstudiobot"
          PROGRESS = "bot update upgrade/_king_progress.json"
          SKIP = ("__pycache__", ".git", "output", "_work", "_backups", "_logs", "venv", "node_modules",
                  "bot update upgrade", "Code editor", "_temp_builder")
          TIMEOUT = 400
          AIS = ["Gemini", "Groq", "OpenRouter", "Mistral", "Cerebras", "NVIDIA"]

          def tg(msg, silent=False):
              t = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
              c = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
              if not t or not c: return
              try:
                  requests.post(f"https://api.telegram.org/bot{t}/sendMessage",
                                json={"chat_id": c, "text": msg[:4000], "parse_mode": "HTML",
                                      "disable_web_page_preview": True, "disable_notification": silent},
                                timeout=15)
              except: pass

          def skip(path):
              p = path.replace("\\", "/")
              for s in SKIP:
                  if s in p: return True
              return False

          def scan():
              files_data = {}
              folders = {}
              for root, dirs, fnames in os.walk(BOT_ROOT):
                  dirs[:] = [d for d in dirs if not skip(os.path.join(root, d))]
                  rel_dir = os.path.relpath(root, BOT_ROOT)
                  if rel_dir != ".":
                      folders[rel_dir] = []
                  for fn in fnames:
                      full = os.path.join(root, fn)
                      if skip(full): continue
                      if fn.endswith(".py"):
                          rel = os.path.relpath(full, BOT_ROOT)
                          try:
                              with open(full, "r", encoding="utf-8") as f:
                                  code_content = f.read()
                          except:
                              code_content = ""
                          files_data[rel] = code_content
                          parent = os.path.dirname(rel)
                          if parent in folders:
                              folders[parent].append(fn)
              return files_data, folders

          def post(url, headers, payload, timeout=TIMEOUT):
              try:
                  r = requests.post(url, headers=headers, json=payload, timeout=timeout)
                  if r.status_code == 200: return r.json()
              except: pass
              return None

          def call_ai(ai, prompt):
              try:
                  if ai == "Gemini":
                      k = os.environ.get("GEMINI_API_KEY", "").strip()
                      if not k: return None
                      for m in ["gemini-2.5-pro", "gemini-2.0-flash", "gemini-1.5-flash"]:
                          d = post(f"https://generativelanguage.googleapis.com/v1beta/models/{m}:generateContent?key={k}",
                                   {"Content-Type": "application/json"},
                                   {"contents": [{"parts": [{"text": prompt}]}],
                                    "generationConfig": {"maxOutputTokens": 16384, "temperature": 0.2}})
                          if d and "candidates" in d:
                              try: return d["candidates"][0]["content"]["parts"][0]["text"]
                              except: pass
                  elif ai == "Groq":
                      k = os.environ.get("GROQ_API_KEY", "").strip()
                      if not k: return None
                      d = post("https://api.groq.com/openai/v1/chat/completions",
                               {"Authorization": f"Bearer {k}"},
                               {"model": "llama-3.3-70b-versatile", "messages": [{"role": "user", "content": prompt}],
                                "max_tokens": 8000, "temperature": 0.2})
                      if d and "choices" in d: return d["choices"][0]["message"]["content"]
                  elif ai == "OpenRouter":
                      k = os.environ.get("OPENROUTER_API_KEY", "").strip()
                      if not k: return None
                      d = post("https://openrouter.ai/api/v1/chat/completions",
                               {"Authorization": f"Bearer {k}"},
                               {"model": "openai/gpt-4o-mini", "messages": [{"role": "user", "content": prompt}],
                                "max_tokens": 8000, "temperature": 0.2})
                      if d and "choices" in d: return d["choices"][0]["message"]["content"]
                  elif ai == "Mistral":
                      k = os.environ.get("MISTRAL_API_KEY", "").strip()
                      if not k: return None
                      d = post("https://api.mistral.ai/v1/chat/completions",
                               {"Authorization": f"Bearer {k}"},
                               {"model": "mistral-small-latest", "messages": [{"role": "user", "content": prompt}],
                                "max_tokens": 8000, "temperature": 0.2})
                      if d and "choices" in d: return d["choices"][0]["message"]["content"]
                  elif ai == "Cerebras":
                      k = os.environ.get("CEREBRAS_API_KEY", "").strip()
                      if not k: return None
                      d = post("https://api.cerebras.ai/v1/chat/completions",
                               {"Authorization": f"Bearer {k}"},
                               {"model": "llama-3.3-70b", "messages": [{"role": "user", "content": prompt}],
                                "max_tokens": 8000, "temperature": 0.2})
                      if d and "choices" in d: return d["choices"][0]["message"]["content"]
                  elif ai == "NVIDIA":
                      k = os.environ.get("NVIDIA_API_KEY", "").strip()
                      if not k: return None
                      d = post("https://api.nvidia.com/v1/chat/completions",
                               {"Authorization": f"Bearer {k}"},
                               {"model": "meta/llama-3.3-70b-instruct", "messages": [{"role": "user", "content": prompt}],
                                "max_tokens": 8000, "temperature": 0.2})
                      if d and "choices" in d: return d["choices"][0]["message"]["content"]
              except Exception as e:
                  print(f"Error calling {ai}: {e}")
              return None

          def build_tree(folders):
              lines = [f"{BOT_ROOT}/"]
              for folder in sorted(folders.keys()):
                  depth = folder.count(os.sep)
                  indent = "  " * depth
                  name = os.path.basename(folder)
                  lines.append(f"{indent}├── {name}/")
              return "\n".join(lines)

          def main():
              files_data, folders = scan()
              if not files_data:
                  tg("⚠️ No files found to process.")
                  return

              tree = build_tree(folders)
              tg(f"👑 <b>AUTONOMOUS DEVELOPER STARTED (FAST BATCH)</b>\n📁 Total Files: <b>{len(files_data)}</b>\n\n<b>STRUCTURE:</b>\n<pre>{tree[:3000]}</pre>")

              # Group files into batches of 4-5 files so it's super fast, doesn't hit token limits, and processes everything accurately!
              file_items = list(files_data.items())
              batch_size = 5
              total_updated = 0

              for i in range(0, len(file_items), batch_size):
                  batch = file_items[i:i + batch_size]
                  bundled_code = ""
                  for rel_path, code in batch:
                      bundled_code += f"\n\n═══ FILE: {rel_path} ═══\n{code if code.strip() else '# [EMPTY FILE - WRITE PRODUCTION CODE]'}\n═══ END FILE ═══"

                  prompt = f"""You are the LEAD ARCHITECT for "SawajStudioBot".
          Upgrade the following batch of files to world-class standards.

          CRITICAL RULES:
          1. ZERO DELETION: Keep all existing logic, classes, and functions intact. Enhance them with error handling, type hints, and logging.
          2. NO SKIPPING: You must return all files in this batch.
          3. EMPTY FILES: If any file is empty, write full production code for it.

          PROJECT STRUCTURE:
          {tree}

          FILES IN THIS BATCH:
          {bundled_code}

          RESPONSE FORMAT (MANDATORY FOR EACH FILE):
          ═══ FILE: relative/path/to/file.py ═══
          <complete python code>
          ═══ END FILE ═══
          """

                  success = False
                  response_text = None
                  used_ai = None

                  for ai in AIS:
                      res = call_ai(ai, prompt)
                      if res and len(res) > 50:
                          response_text = res
                          used_ai = ai
                          success = True
                          break

                  if success and response_text:
                      matches = re.findall(r"═══ FILE:\s*(.+?)\s*═══\s*\n(.*?)\n\s*═══ END FILE", response_text, re.DOTALL)
                      for path, code in matches:
                          path = path.strip()
                          code = code.strip()
                          if path and code and ".." not in path:
                              full_path = os.path.join(BOT_ROOT, path)
                              os.makedirs(os.path.dirname(full_path), exist_ok=True)
                              try:
                                  with open(full_path, "w", encoding="utf-8") as f:
                                      f.write(code + "\n")
                                  total_updated += 1
                              except: pass

              tg(f"🏁 <b>DEVELOPER COMPLETE</b>\n✅ Total Files Upgraded & Saved: <b>{total_updated}</b>")

          if __name__ == "__main__":
              main()
          EOFPY
          python /tmp/dev.py

      - name: 📤 Commit and Push Changes
        if: always()
        run: |
          git config user.name "SawajBot Developer AI"
          git config user.email "ai.dev@sawajstudio.com"
          git add -A
          git commit -m "👑 Autonomous Developer Batch Upgrade: All Files Enhanced — $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "No changes to commit"
          git push || echo "Push failed"
