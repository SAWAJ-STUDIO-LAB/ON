name: 👑 SawajStudioBot Developer

on:
  workflow_dispatch:
  repository_dispatch:
    types: [continue-upgrade]

permissions:
  contents: write
  actions: write

jobs:
  developer:
    name: 👑 Fast Developer
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install
        run: pip install requests

      - name: 👑 Run Fast Developer
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_AI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_AI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_AI }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY_AI }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY_AI }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY_AI }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY_AI }}
        run: |
          cat << 'EOFPY' > /tmp/dev.py
          import os, re, ast, json, time, requests
          from datetime import datetime
          from concurrent.futures import ThreadPoolExecutor, as_completed

          BOT_ROOT = "sawajstudiobot"
          PROGRESS = "bot update upgrade/_king_progress.json"
          SKIP = ("__pycache__", ".git", "output", "_work", "_backups", "_logs", "venv", "node_modules",
                  "bot update upgrade", "Code editor", "_temp_builder")
          TIMEOUT = 45
          WORKERS = 8
          AIS = ["Groq", "Gemini", "OpenRouter", "Mistral", "Cerebras", "Cohere", "NVIDIA", "HuggingFace"]

          def tg(msg, silent=True):
              t = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
              c = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
              if not t or not c: return
              try:
                  requests.post(f"https://api.telegram.org/bot{t}/sendMessage",
                                json={"chat_id": c, "text": msg[:4000], "parse_mode": "HTML",
                                      "disable_web_page_preview": True, "disable_notification": silent},
                                timeout=10)
              except: pass

          def skip(path):
              p = path.replace("\\", "/")
              for s in SKIP:
                  if s in p: return True
              return False

          def scan():
              files = []
              for root, dirs, fnames in os.walk(BOT_ROOT):
                  dirs[:] = [d for d in dirs if not skip(os.path.join(root, d))]
                  for fn in fnames:
                      full = os.path.join(root, fn)
                      if skip(full): continue
                      if fn.endswith(".py"):
                          files.append(os.path.relpath(full, BOT_ROOT))
              return sorted(files)

          def load_prog():
              if os.path.exists(PROGRESS):
                  try:
                      with open(PROGRESS) as f: return json.load(f)
                  except: pass
              return {"upgraded": {}}

          def save_prog(d):
              os.makedirs(os.path.dirname(PROGRESS), exist_ok=True)
              with open(PROGRESS, "w") as f: json.dump(d, f, indent=2)

          def post(url, headers, payload, timeout=TIMEOUT):
              try:
                  r = requests.post(url, headers=headers, json=payload, timeout=timeout)
                  if r.status_code == 200: return r.json()
              except: pass
              return None

          def call_ai(ai, prompt):
              try:
                  if ai == "Groq":
                      k = os.environ.get("GROQ_API_KEY", "").strip()
                      if not k: return None
                      for m in ["llama-3.3-70b-versatile", "llama-3.1-8b-instant"]:
                          d = post("https://api.groq.com/openai/v1/chat/completions",
                                   {"Authorization": f"Bearer {k}"},
                                   {"model": m, "messages": [{"role": "user", "content": prompt}],
                                    "max_tokens": 8000, "temperature": 0.2})
                          if d and "choices" in d: return d["choices"][0]["message"]["content"]
                  elif ai == "Gemini":
                      k = os.environ.get("GEMINI_API_KEY", "").strip()
                      if not k: return None
                      for m in ["gemini-2.0-flash", "gemini-1.5-flash"]:
                          d = post(f"https://generativelanguage.googleapis.com/v1beta/models/{m}:generateContent?key={k}",
                                   {}, {"contents": [{"parts": [{"text": prompt}]}],
                                        "generationConfig": {"maxOutputTokens": 8000, "temperature": 0.2}})
                          if d and "candidates" in d:
                              try: return d["candidates"][0]["content"]["parts"][0]["text"]
                              except: pass
                  elif ai == "OpenRouter":
                      k = os.environ.get("OPENROUTER_API_KEY", "").strip()
                      if not k: return None
                      d = post("https://openrouter.ai/api/v1/chat/completions",
                               {"Authorization": f"Bearer {k}"},
                               {"model": "openai/gpt-4o-mini",
                                "messages": [{"role": "user", "content": prompt}],
                                "max_tokens": 8000, "temperature": 0.2})
                      if d and "choices" in d: return d["choices"][0]["message"]["content"]
                  elif ai == "Mistral":
                      k = os.environ.get("MISTRAL_API_KEY", "").strip()
                      if not k: return None
                      d = post("https://api.mistral.ai/v1/chat/completions",
                               {"Authorization": f"Bearer {k}"},
                               {"model": "mistral-small-latest",
                                "messages": [{"role": "user", "content": prompt}],
                                "max_tokens": 8000, "temperature": 0.2})
                      if d and "choices" in d: return d["choices"][0]["message"]["content"]
                  elif ai == "Cerebras":
                      k = os.environ.get("CEREBRAS_API_KEY", "").strip()
                      if not k: return None
                      d = post("https://api.cerebras.ai/v1/chat/completions",
                               {"Authorization": f"Bearer {k}"},
                               {"model": "llama-3.3-70b",
                                "messages": [{"role": "user", "content": prompt}],
                                "max_tokens": 8000, "temperature": 0.2})
                      if d and "choices" in d: return d["choices"][0]["message"]["content"]
                  elif ai == "Cohere":
                      k = os.environ.get("COHERE_API_KEY", "").strip()
                      if not k: return None
                      d = post("https://api.cohere.com/v1/chat",
                               {"Authorization": f"Bearer {k}"},
                               {"model": "command-r-plus-08-2024", "message": prompt})
                      if d and "text" in d: return d["text"]
                  elif ai == "NVIDIA":
                      k = os.environ.get("NVIDIA_API_KEY", "").strip()
                      if not k: return None
                      d = post("https://integrate.api.nvidia.com/v1/chat/completions",
                               {"Authorization": f"Bearer {k}"},
                               {"model": "meta/llama-3.3-70b-instruct",
                                "messages": [{"role": "user", "content": prompt}],
                                "max_tokens": 8000, "temperature": 0.2})
                      if d and "choices" in d: return d["choices"][0]["message"]["content"]
                  elif ai == "HuggingFace":
                      k = os.environ.get("HUGGINGFACE_API_KEY", "").strip()
                      if not k: return None
                      d = post("https://api-inference.huggingface.co/models/meta-llama/Meta-Llama-3.1-8B-Instruct/v1/chat/completions",
                               {"Authorization": f"Bearer {k}"},
                               {"model": "meta-llama/Meta-Llama-3.1-8B-Instruct",
                                "messages": [{"role": "user", "content": prompt}],
                                "max_tokens": 4000, "temperature": 0.2})
                      if d and "choices" in d:
                          try: return d["choices"][0]["message"]["content"]
                          except: pass
              except: pass
              return None

          def upgrade(rel, idx, total):
              full = os.path.join(BOT_ROOT, rel)
              try:
                  with open(full, "r", encoding="utf-8") as f: code = f.read()
              except: return False, rel, None

              prompt = f"""You are the MASTER AI DEVELOPER of SawajStudioBot.
          Upgrade this file: add error handling, logging, docstrings, fix bugs, remove copyright text.
          Never remove core logic.
          Keep format: ═══ FILE: {rel} ═══  <code>  ═══ END ═══
          Return ONLY the code.

          FILE: {rel}
          CODE:
          {code}"""

              start = (idx - 1) % len(AIS)
              for ai in AIS[start:] + AIS[:start]:
                  res = call_ai(ai, prompt)
                  if res and "═══ FILE:" in res:
                      m = re.search(r"═══ FILE: .+? ═══\s*\n(.*?)\n═══ END ═══", res, re.DOTALL)
                      if m:
                          new_code = m.group(1).strip()
                          try:
                              ast.parse(new_code)
                              with open(full, "w", encoding="utf-8") as f:
                                  f.write(new_code + "\n")
                              tg(f"⚡ <b>[{idx}/{total}]</b> ✅ <code>{rel}</code>\n🤖 {ai}")
                              return True, rel, ai
                          except: pass
              tg(f"⚠️ <b>[{idx}/{total}]</b> ❌ <code>{rel}</code>", silent=True)
              return False, rel, None

          def main():
              files = scan()
              if not files:
                  tg("⚠️ No files in sawajstudiobot")
                  return

              prog = load_prog()
              files = sorted(files, key=lambda f: prog["upgraded"].get(f, {}).get("time", "0"))
              total = len(files)
              tg(f"👑 <b>FAST RUN</b> — {total} files, {WORKERS} workers, 8 AI")

              ok, fail = 0, 0
              with ThreadPoolExecutor(max_workers=WORKERS) as ex:
                  futures = {ex.submit(upgrade, f, i, total): f for i, f in enumerate(files, 1)}
                  for fut in as_completed(futures):
                      try:
                          status, rel, ai = fut.result()
                          if status:
                              ok += 1
                              prog["upgraded"][rel] = {"time": datetime.now().strftime("%Y-%m-%d %H:%M:%S"), "ai": ai}
                              if ok % 10 == 0:
                                  save_prog(prog)
                          else: fail += 1
                      except: fail += 1
              save_prog(prog)
              tg(f"🏁 <b>DONE</b> — ✅ {ok} upgraded, ⏳ {fail} pending")

          if __name__ == "__main__":
              main()
          EOFPY
          python /tmp/dev.py

      - name: 📤 Commit
        if: always()
        run: |
          git config user.name "SawajBot Dev"
          git config user.email "dev@sawajstudio.com"
          git add -A
          git commit -m "👑 Fast upgrade — $(date -u '+%H:%M UTC')" || echo "No changes"
          git push || echo "Push failed"

      - name: 🔄 Self-Trigger
        if: always()
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB || github.token }}
        run: gh workflow run "👑 SawajStudioBot Developer" || echo "Trigger skip"
