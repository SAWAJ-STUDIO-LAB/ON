name: 🏗️ Build Sawaj Studio Structure

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-studio-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.10'

jobs:
  build:
    name: 🏗️ Build Structure
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ═══════════════════════════════════════════════════════════
      # ① CHECKOUT
      # ═══════════════════════════════════════════════════════════
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB }}

      # ═══════════════════════════════════════════════════════════
      # ② SETUP PYTHON
      # ═══════════════════════════════════════════════════════════
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ═══════════════════════════════════════════════════════════
      # ③ BUILD FOLDERS + FILES
      # ═══════════════════════════════════════════════════════════
      - name: 🏗️ Build Structure
        id: build
        run: |
          python3 <<'PYEOF'
          import os

          ROOT = "Sawaj_studio"

          files = []

          # ─── WORKFLOWS ───
          files += [
              ".github/workflows/story.yml",
              ".github/workflows/short.yml",
              ".github/workflows/long.yml",
              ".github/workflows/report.yml",
              ".github/workflows/clean.yml",
          ]

          # ─── SCRIPTS (khali) ───
          files += [
              "scripts/code_config.py",
              "scripts/code_logger.py",
              "scripts/code_telegram.py",
              "scripts/code_utils.py",
              "scripts/code_pipeline.py",
              "scripts/code_secrets.py",
              "scripts/code_fonts.py",
              "scripts/code_graphics.py",
              "scripts/code_content.py",
              "scripts/code_workers.py",
              "scripts/code_uploaders.py",
          ]

          # ─── DOCS ───
          files += [
              f"{ROOT}/docs/1_setup/installation.md",
              f"{ROOT}/docs/1_setup/environment.md",
              f"{ROOT}/docs/1_setup/deployment.md",
              f"{ROOT}/docs/2_architecture/overview.md",
              f"{ROOT}/docs/2_architecture/factory.md",
              f"{ROOT}/docs/2_architecture/workers.md",
              f"{ROOT}/docs/2_architecture/uploaders.md",
              f"{ROOT}/docs/3_api/hadith_api.md",
              f"{ROOT}/docs/3_api/ai_providers.md",
              f"{ROOT}/docs/3_api/uploads.md",
              f"{ROOT}/docs/4_changelog/v1.0.0.md",
              f"{ROOT}/docs/4_changelog/roadmap.md",
          ]

          # ─── GENERATOR A-Z ───
          modules = {
              "1_config": ["1_env_loader.py","2_secret_reader.py","3_path_builder.py","4_mode_decider.py","5_folder_creator.py","6_default_settings.py","7_platform_config.py","8_worker_selector.py","9_validation.py"],
              "2_logger": ["1_console_logger.py","2_file_logger.py","3_timestamp.py","4_log_levels.py","5_error_tracker.py","6_step_logger.py","7_api_logger.py","8_buffer.py"],
              "3_telegram": ["1_bot_sender.py","2_message_builder.py","3_html_formatter.py","4_document_sender.py","5_error_report.py","6_summary_sender.py","7_chunk_splitter.py"],
              "4_utils": ["1_sanitizer.py","2_file_helper.py","3_time_helper.py","4_random_helper.py","5_json_helper.py","6_hash_helper.py","7_text_cleaner.py"],
              "5_base_pipeline": ["1_http_session.py","2_downloader.py","3_cleanup.py","4_cmd_runner.py","5_retry_handler.py","6_progress_tracker.py"],
              "6_secrets_check": ["1_env_checker.py","2_api_tester.py","3_fallback_checker.py","4_health_report.py","5_critical_checker.py"],
              "7_fonts": ["1_font_loader.py","2_font_cache.py","3_path_finder.py","4_fallback_font.py","5_hindi_font.py","6_arabic_font.py","7_english_font.py"],
              "8_text_wrap": ["1_line_breaker.py","2_width_measure.py","3_center_align.py","4_multiline_draw.py","5_shadow_effect.py","6_auto_resize.py"],
              "9_sparkles": ["1_sparkle_draw.py","2_star_shape.py","3_glow_effect.py","4_animation.py","5_burst_effect.py"],
              "10_progress_bar": ["1_bar_draw.py","2_gradient_fill.py","3_glow_dot.py","4_section_marker.py","5_track_draw.py"],
              "11_badge": ["1_badge_draw.py","2_auto_font.py","3_gradient_bg.py","4_corner_accent.py","5_border_draw.py"],
              "12_bullets": ["1_word_sync.py","2_fade_effect.py","3_hindi_bullet.py","4_arabic_bullet.py","5_english_bullet.py","6_bullet_draw.py"],
              "13_watermark": ["1_static_watermark.py","2_floating_logo.py","3_position_calc.py","4_opacity_control.py","5_text_watermark.py"],
              "14_arabesque": ["1_pattern_draw.py","2_rotation.py","3_opacity_control.py","4_border_draw.py"],
              "15_god_rays": ["1_ray_draw.py","2_blur_effect.py","3_rotation.py","4_gradient.py","5_wedge_shape.py"],
              "16_star_field": ["1_star_draw.py","2_twinkle_effect.py","3_random_position.py","4_sine_wave.py"],
              "17_ember": ["1_ember_draw.py","2_rising_motion.py","3_glow_effect.py","4_wrap_around.py","5_pulse_alpha.py"],
              "18_vignette": ["1_ring_band.py","2_radial_gradient.py","3_breathing_pulse.py","4_corner_darken.py"],
              "19_hadith": ["1_hadith_fetch.py","2_word_filter.py","3_arabic_fetch.py","4_fallback.py","5_api_rotator.py"],
              "20_ai_provider": ["1_openrouter.py","2_groq.py","3_gemini.py","4_mistral.py","5_cerebras.py","6_cohere.py","7_fallback_chain.py"],
              "21_translator": ["1_deepl.py","2_ai_translator.py","3_hindi_target.py","4_fallback.py"],
              "22_tts": ["1_elevenlabs.py","2_edge_tts.py","3_gtts.py","4_voice_engine.py","5_async_runner.py","6_size_validator.py"],
              "23_music": ["1_freesound.py","2_pixabay_cdn.py","3_bensound.py","4_generated_sine.py","5_volume_mixer.py"],
              "24_background": ["1_pexels.py","2_pixabay.py","3_gradient_fallback.py","4_zoompan.py","5_color_grade.py"],
              "25_logo_processor": ["1_logo_finder.py","2_logo_resize.py","3_border_add.py","4_glow_effect.py","5_avatar_save.py"],
              "26_thumbnail": ["1_thumb_draw.py","2_gradient_bg.py","3_title_text.py","4_label_text.py","5_lang_lines.py","6_logo_overlay.py","7_cta_text.py"],
          }

          files.append(f"{ROOT}/generator/__init__.py")
          for mod, fl in modules.items():
              files.append(f"{ROOT}/generator/{mod}/__init__.py")
              for f in fl:
                  files.append(f"{ROOT}/generator/{mod}/{f}")

          # ─── WORKERS ───
          workers = ["worker_story", "worker_short", "worker_long"]
          worker_subs = {
              "1_pipeline": ["1_pipeline_steps.py","2_step_orchestrator.py"],
              "3_intro": ["1_intro_draw.py"],
              "4_main_content": ["1_main_draw.py"],
              "5_outro": ["1_outro_draw.py"],
              "6_frames": ["1_frame_generator.py"],
              "7_composer": ["1_final_compose.py"],
              "8_run": ["1_main.py"],
          }

          for w in workers:
              files.append(f"{ROOT}/generator/{w}/__init__.py")
              files.append(f"{ROOT}/generator/{w}/2_config/__init__.py")
              short = w.replace("worker_", "")
              files.append(f"{ROOT}/generator/{w}/2_config/1_{short}_settings.py")
              files.append(f"{ROOT}/generator/{w}/2_config/2_{short}_template.json")
              for sub, fl in worker_subs.items():
                  files.append(f"{ROOT}/generator/{w}/{sub}/__init__.py")
                  for f in fl:
                      files.append(f"{ROOT}/generator/{w}/{sub}/{f}")

          # ─── UPLOADERS ───
          uploaders = {
              "1_youtube_upload": {
                  "1_auth": ["1_oauth.py"],
                  "2_client": ["1_client_builder.py"],
                  "3_short": ["1_short_uploader.py"],
                  "4_long": ["1_long_uploader.py"],
                  "5_thumbnail": ["1_thumbnail_set.py"],
                  "6_playlist": ["1_playlist_add.py"],
                  "7_chapters": ["1_chapters_add.py"],
              },
              "2_facebook_upload": {
                  "1_auth": ["1_auth.py"],
                  "2_story": ["1_story_uploader.py"],
                  "3_short": ["1_short_uploader.py"],
                  "4_long": ["1_long_uploader.py"],
                  "5_video_stories": ["1_video_stories.py"],
              },
              "3_instagram_upload": {
                  "1_auth": ["1_auth.py"],
                  "2_story": ["1_story_uploader.py"],
                  "3_reel": ["1_reel_uploader.py"],
                  "4_container": ["1_container.py"],
                  "5_publish": ["1_publish.py"],
                  "6_status_poll": ["1_status_poll.py"],
              },
          }

          files.append(f"{ROOT}/uploader/__init__.py")
          for up, subs in uploaders.items():
              files.append(f"{ROOT}/uploader/{up}/__init__.py")
              for sub, fl in subs.items():
                  files.append(f"{ROOT}/uploader/{up}/{sub}/__init__.py")
                  for f in fl:
                      files.append(f"{ROOT}/uploader/{up}/{sub}/{f}")

          # ─── ASSETS ───
          assets = ["1_emoji","2_photo","3_icon","4_sticker","5_effect","6_sound","7_font","8_logo"]
          files.append(f"{ROOT}/assets/__init__.py")
          for a in assets:
              files.append(f"{ROOT}/assets/{a}/__init__.py")
              files.append(f"{ROOT}/assets/{a}/.gitkeep")

          # ═══════════════════════════════════════════════════════
          # CREATE
          # ═══════════════════════════════════════════════════════
          created_f = 0
          created_d = 0
          skipped = 0

          for path in files:
              folder = os.path.dirname(path)
              if folder and not os.path.exists(folder):
                  os.makedirs(folder, exist_ok=True)
                  created_d += 1

              if not os.path.exists(path):
                  with open(path, "w", encoding="utf-8") as f:
                      if path.endswith(".py"):
                          f.write('"""\nSawaj Studio Module\n"""\n')
                      elif path.endswith(".json"):
                          f.write("{}\n")
                      elif path.endswith(".md"):
                          name = os.path.basename(path).replace(".md", "")
                          f.write(f"# {name}\n")
                      elif path.endswith(".yml"):
                          f.write("# TODO\n")
                      else:
                          f.write("")
                  created_f += 1
              else:
                  skipped += 1

          print("=" * 60)
          print(f"📁 Folders created: {created_d}")
          print(f"📄 Files created:   {created_f}")
          print(f"⏭️  Skipped:         {skipped}")
          print(f"📦 Total:           {len(files)}")
          print("=" * 60)
          PYEOF

      # ═══════════════════════════════════════════════════════════
      # ④ COMMIT + PUSH
      # ═══════════════════════════════════════════════════════════
      - name: 📤 Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ${{ github.ref_name }} || true
          git add .
          if git diff --cached --quiet; then
            echo "✅ No changes"
          else
            git commit -m "🏗️ Build Sawaj Studio structure [skip ci]"
            git push origin HEAD
            echo "✅ Pushed"
          fi

      # ═══════════════════════════════════════════════════════════
      # ⑤ TREE REPORT
      # ═══════════════════════════════════════════════════════════
      - name: 🌳 Tree Report
        if: always()
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tree
          tree Sawaj_studio/ -L 8 --dirsfirst > structure_report.txt 2>/dev/null || true
          echo "📋 Report: $(wc -l < structure_report.txt) lines"

      # ═══════════════════════════════════════════════════════════
      # ⑥ TELEGRAM REPORT
      # ═══════════════════════════════════════════════════════════
      - name: 📱 Telegram Report
        if: always()
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "⚠️ Telegram secrets missing"
            exit 0
          fi

          FOLDERS=$(find Sawaj_studio/ -type d 2>/dev/null | wc -l)
          FILES=$(find Sawaj_studio/ -type f 2>/dev/null | wc -l)

          curl -s -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d chat_id="$TG_CHAT" \
            -d parse_mode="HTML" \
            -d text="🏗️ <b>SAWAJ STUDIO BUILD COMPLETE</b>

          ━━━━━━━━━━━━━━━━━━━━━━━
          📁 Folders: <b>$FOLDERS</b>
          📄 Files: <b>$FILES</b>
          ━━━━━━━━━━━━━━━━━━━━━━━

          🔢 Run: #${{ github.run_number }}
          👤 Actor: ${{ github.actor }}

          📎 Report below 👇" \
            || true

          if [ -f structure_report.txt ]; then
            curl -s -F chat_id="$TG_CHAT" \
                 -F document=@"structure_report.txt" \
                 -F caption="🌳 Sawaj Studio Structure" \
                 "https://api.telegram.org/bot$TG_TOKEN/sendDocument" \
              || true
          fi

      # ═══════════════════════════════════════════════════════════
      # ⑦ SUMMARY
      # ═══════════════════════════════════════════════════════════
      - name: 📊 Summary
        if: always()
        run: |
          {
            echo "# 🏗️ Sawaj Studio Structure Built"
            echo ""
            echo "| Metric | Count |"
            echo "|--------|-------|"
            echo "| Folders | $(find Sawaj_studio/ -type d 2>/dev/null | wc -l) |"
            echo "| Files | $(find Sawaj_studio/ -type f 2>/dev/null | wc -l) |"
            echo "| Python | $(find Sawaj_studio/ -name '*.py' 2>/dev/null | wc -l) |"
          } >> $GITHUB_STEP_SUMMARY
