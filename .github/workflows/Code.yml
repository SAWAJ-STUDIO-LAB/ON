name: "🔧 Setup Bot Structure"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Setup Script
        env:
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
        run: python setup_bot.py

      - name: Commit & Push
        run: |
          git config user.name "SAWAJ-STUDIO-LAB"
          git config user.email "bot@sawajstudio.local"
          git add .
          git diff --staged --quiet || git commit -m "🤖 Auto-generated structure"
          git push
