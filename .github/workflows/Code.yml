# ==================== CTA BUTTONS ====================
def create_cta_frames(fps, total, intro, voice_dur, cta_start, has_logo, font_big, font_btn):
    """Generate CTA button frames"""
    buttons = [("LIKE", (255, 90, 90)), ("SUBSCRIBE", (255, 55, 55)),
               ("COMMENT", (80, 180, 255)), ("FOLLOW", (100, 220, 120)),
               ("SHARE", (255, 185, 55))]
    logo_w, logo_h = 220, 95
    max_x, max_y = 1080 - logo_w, 1920 - logo_h

    for fi in range(int(total * fps)):
        t = fi / fps
        img = Image.new("RGBA", (1080, 1920), (0, 0, 0, 0))
        draw = ImageDraw.Draw(img)

        if t < intro:
            a = min(1.0, t / 0.5)
            draw.text((540, 870), "SAWAJ STUDIO", fill=(220, 190, 120, int(255 * a)),
                      font=font_big, anchor="mm")
            draw.text((540, 960), "Islamic Shorts", fill=(180, 160, 130, int(200 * a)),
                      font=font_btn, anchor="mm")
        elif t < intro + voice_dur:
            mt = t - intro
            if has_logo:
                try:
                    if mt >= cta_start - 0.2:
                        logo = Image.open("avatar.png").convert("RGBA").resize((650, 270),
                                                                               Image.Resampling.LANCZOS)
                        img.paste(logo, ((1080 - 650) // 2, 450), logo)
                    else:
                        logo = Image.open("avatar.png").convert("RGBA").resize((logo_w, logo_h),
                                                                               Image.Resampling.LANCZOS)
                        x = abs((int(mt * 200) + 60) % (2 * max_x) - max_x)
                        y = abs((int(mt * 150) + 120) % (2 * max_y) - max_y)
                        img.paste(logo, (x, y), logo)
                except:
                    pass
            for idx, (label, col) in enumerate(buttons):
                start = cta_start + 0.25 + (idx * 0.38)
                if mt >= start:
                    y = 870 + idx * 140
                    draw.rounded_rectangle([180, y - 48, 900, y + 48], radius=26,
                                           fill=(12, 12, 20, 170))
                    draw.rounded_rectangle([180, y - 48, 900, y + 48], radius=26,
                                           outline=col + (240,), width=4)
                    draw.ellipse([250 - 15, y - 15, 250 + 15, y + 15], fill=col + (255,))
                    chars = int((mt - start) / 0.045)
                    disp = label[:chars] + (
                        "|" if chars < len(label) and int(mt / 0.25) % 2 == 0 else "")
                    draw.text((560, y - 1), disp, fill=(255, 255, 255, 255), font=font_btn,
                              anchor="mm")
        else:
            ot = t - (intro + voice_dur)
            a = min(1.0, ot / 0.55)
            draw.text((540, 850), "JazakAllah Khair", fill=(220, 190, 120, int(255 * a)),
                      font=font_big, anchor="mm")
            draw.text((540, 940), "Follow for more", fill=(180, 160, 130, int(210 * a)),
                      font=font_btn, anchor="mm")
            if has_logo:
                try:
                    logo = Image.open("avatar.png").convert("RGBA").resize((190, 80),
                                                                           Image.Resampling.LANCZOS)
                    img.paste(logo, (445, 1030), logo)
                except:
                    pass
        img.save(f"p_frames/frame_{fi:05d}.png")


