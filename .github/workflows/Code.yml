            upload_youtube(final, yt_title, yt_desc,
                           ["Shorts", "Hadith", "Islamic Shorts", "SawajStudio"])
            upload_facebook_instagram(final, direct, fb_caption, ig_caption, is_story=False)

        cleanup(
            ["p1_raw.mp3", "p2_raw.mp3", "p_sawal_raw.mp3", "p_jawab_raw.mp3", "p3_raw.mp3",
             "p1.mp3", "p2.mp3", "p_sawal.mp3", "p_jawab.mp3", "p_tick.mp3", "p3.mp3",
             "p_voice_raw.mp3", "p_voice.mp3", "p_subs.ass", "tmp.mp4", "music_raw.mp3",
             "cta_ding.mp3", "cta_whoosh.mp3", "cta_sfx.mp3"],
            ["p_frames"])

    elif VIDEO_TYPE == "long":
        send_tg("🎬 <b>Starting LONG Video Generation...</b>")
        result = generate_short_video(long=True)
        final, total, h, hindi, meaning, sawal, jawab, shayari = result

        report_api_status()
        drive_link, direct = upload_drive(final, "Long_Hadith",
                                          os.environ.get("DRIVE_LONG_FOLDER_ID"))

        if SHOULD_POST_SOCIAL and (META_TOKEN or os.environ.get("YOUTUBE_CLIENT_ID")):
            send_tg("📱 Social upload starting...")

            yt_title = f"{h['collection']} #{h['number']} | पूर्ण हदीस शरीफ़ | Full Long Hadith"
            yt_desc = f"📖 पूर्ण हदीस शरीफ़\n{hindi}\n\n✨ मतलब:\n{meaning}\n\n❓ {sawal}\n💬 {jawab}\n\n✒️ {shayari}\n\n❤️ Like | 🔔 Subscribe | 💬 Comment\n\n#Hadith #FullHadith #IslamicVideo #SawajStudio"
            fb_caption = f"📖 पूर्ण हदीस शरीफ़\n\n{hindi}\n\n✨ मतलब:\n{meaning}\n\n❓ {sawal}\n💬 {jawab}\n\n✒️ {shayari}\n\n❤️ लाइक | 🔔 फॉलो | 💬 आमीन\n\n#Hadith #HadeesSharif #SawajStudio"
            ig_caption = f"📖 पूर्ण हदीस शरीफ़\n\n{hindi}\n\n✨ मतलब:\n{meaning}\n\n❓ {sawal}\n💬 {jawab}\n\n✒️\n{shayari}\n\n.\n.\n.\n❤️ Like | 🔔 Follow | 💬 आमीन\n\n#Hadith #IslamicReels #SawajStudio"

            upload_youtube(final, yt_title, yt_desc,
                           ["Hadith", "Full Hadith", "Islamic Video", "SawajStudio"])

            # Instagram only if video is short enough
            if total <= 90:
                upload_facebook_instagram(final, direct, fb_caption, ig_caption, is_story=False)
            else:
                send_tg("ℹ️ Instagram skipped: Long video Reels limit se zyada hai")

        cleanup(
            ["p1_raw.mp3", "p2_raw.mp3", "p_sawal_raw.mp3", "p_jawab_raw.mp3", "p3_raw.mp3",
             "p1.mp3", "p2.mp3", "p_sawal.mp3", "p_jawab.mp3", "p_tick.mp3", "p3.mp3",
             "p_voice_raw.mp3", "p_voice.mp3", "p_subs.ass", "tmp.mp4", "music_raw.mp3",
             "cta_ding.mp3", "cta_whoosh.mp3", "cta_sfx.mp3"],
            ["p_frames"])

    else:
        send_tg(f"❌ Unknown video type: {VIDEO_TYPE}")
        sys.exit(1)

    report_api_status()

    elapsed = time.time() - start_time
    send_tg(f"🎉 <b>ALL DONE!</b> ({elapsed / 60:.1f} minutes)")


if __name__ == "__main__":
