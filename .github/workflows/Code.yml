name: Create Social Media Folders and Generator Script

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup-repository:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB }}

      - name: Create Structure and Generator Script
        run: |
          # Folders banayein
          mkdir -p .github/workflows
          mkdir -p social_media/fb_ig_story_video
          mkdir -p social_media/fb_ig_yt_short_video
          mkdir -p social_media/fb_yt_long_video

          # Single Python script content in a common file
          cat << 'EOF' > social_media/generator.py
#!/usr/bin/env python3
"""
SAWAJ STUDIO - Unified Video Generator
Supports: Story, Short Video, Long Video
"""

import os
import re
import time
import random
import subprocess
import shutil
import sys
from concurrent.futures import ThreadPoolExecutor

import requests
from mutagen.mp3 import MP3
from PIL import Image, ImageDraw, ImageFont, ImageFilter
from google.oauth2.credentials import Credentials
from googleapiclient.discovery import build
from googleapiclient.http import MediaFileUpload
from requests.adapters import HTTPAdapter
from urllib3.util.retry import Retry

# ==================== CONFIGURATION ====================
VIDEO_TYPE = os.environ.get("VIDEO_TYPE", "short").lower()
SHOULD_POST_SOCIAL = str(os.environ.get("SHOULD_POST_SOCIAL", "false")).lower() == "true"

TG_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN")
TG_CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID")
META_TOKEN = os.environ.get("FACEBOOK_INSTAGRAM_META_TOKEN", "").strip()

# ==================== SESSION ====================
session = requests.Session()
retry = Retry(total=5, backoff_factor=1.5, status_forcelist=[429, 500, 502, 503, 504])
session.mount("https://", HTTPAdapter(max_retries=retry))

# ==================== API STATUS TRACKER ====================
api_status = {
    "AI": {}, "TTS": {}, "Music": {}, "Background": {},
    "Translation": {}, "Hadith": {}, "Drive": {},
    "YouTube": {}, "Facebook": {}, "Instagram": {},
    "Facebook Story": {}, "Instagram Story": {}
}


# ==================== UTILITY FUNCTIONS ====================
def send_tg(msg):
    """Send Telegram message"""
    if TG_TOKEN and TG_CHAT_ID:
        try:
            session.post(
                f"https://api.telegram.org/bot{TG_TOKEN}/sendMessage",
                json={"chat_id": TG_CHAT_ID, "text": msg, "parse_mode": "HTML",
                      "disable_web_page_preview": True},
                timeout=12
            )
        except:
            pass
    print(msg)


def run_cmd(cmd):
    """Run shell command"""
    print(f"[CMD] {cmd[:140]}...")
    subprocess.run(cmd, shell=True, check=True)


def sanitize(t):
    """Sanitize text"""
    if not t:
        return ""
    t = re.sub(r'[\u200b-\u200f\ufeff\u202a-\u202e]', '', str(t))
    return t.replace('"', '').replace("'", '').replace('\n', ' ').strip()


def report_api_status():
    """Report API status to Telegram"""
    lines = ["📊 <b>API STATUS REPORT</b>\n"]
    for section, status in api_status.items():
        if not status:
            continue
        lines.append(f"<b>{section}:</b>")
        for name, result in status.items():
            icon = "✅" if result == "success" else "❌" if "failed" in str(result) else "⏸️"
            lines.append(f"  {icon} {name} → {result}")
    send_tg("\n".join(lines))


def download(url, path):
    """Download file"""
    try:
        r = session.get(url, timeout=35)
        if r.status_code == 200 and len(r.content) > 12000:
            with open(path, "wb") as f:
                f.write(r.content)
            return True
    except:
        pass
    return False


# ==================== AI PROVIDERS ====================
def call_ai(prompt, max_tokens=420, task="general"):
    """Call AI with multi-provider fallback"""
    providers = []

    if os.environ.get("OPENROUTER_API_KEY"):
        providers.append(("OpenRouter", "https://openrouter.ai/api/v1/chat/completions",
                          {"Authorization": f"Bearer {os.environ['OPENROUTER_API_KEY']}"},
                          "openai/gpt-4o-mini"))
    if os.environ.get("GROQ_API_KEY"):
        providers.append(("Groq", "https://api.groq.com/openai/v1/chat/completions",
                          {"Authorization": f"Bearer {os.environ['GROQ_API_KEY']}"},
                          "llama-3.3-70b-versatile"))
    if os.environ.get("GEMINI_API_KEY"):
        providers.append(("Gemini", None, None, None))
    if os.environ.get("MISTRAL_API_KEY"):
        providers.append(("Mistral", "https://api.mistral.ai/v1/chat/completions",
                          {"Authorization": f"Bearer {os.environ['MISTRAL_API_KEY']}"},
                          "mistral-small-latest"))
    if os.environ.get("CEREBRAS_API_KEY"):
        providers.append(("Cerebras", "https://api.cerebras.ai/v1/chat/completions",
                          {"Authorization": f"Bearer {os.environ['CEREBRAS_API_KEY']}"},
                          "llama3.1-8b"))
    if os.environ.get("COHERE_API_KEY"):
        providers.append(("Cohere", "https://api.cohere.com/v1/chat",
                          {"Authorization": f"Bearer {os.environ['COHERE_API_KEY']}"},
                          "command-r-plus"))
    if os.environ.get("HUGGINGFACE_API_KEY"):
        providers.append(("HuggingFace",
                          "https://api-inference.huggingface.co/models/meta-llama/Meta-Llama-3-8B-Instruct",
                          {"Authorization": f"Bearer {os.environ['HUGGINGFACE_API_KEY']}"}, None))

    for name, url, headers, model in providers:
        try:
            if name == "Gemini":
                r = session.post(
                    f"https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={os.environ['GEMINI_API_KEY']}",
                    json={"contents": [{"parts": [{"text": prompt}]}]}, timeout=45)
                if r.status_code == 200:
                    text = r.json()["candidates"][0]["content"]["parts"][0]["text"].strip()
                    api_status["AI"][f"{name}({task})"] = "success"
                    return text
            elif name == "Cohere":
                r = session.post(url, headers={**headers, "Content-Type": "application/json"},
                                 json={"model": model, "message": prompt}, timeout=45)
                if r.status_code == 200:
                    api_status["AI"][f"{name}({task})"] = "success"
                    return r.json()["text"].strip()
            elif name == "HuggingFace":
                r = session.post(url, headers={**headers, "Content-Type": "application/json"},
                                 json={"inputs": prompt,
                                       "parameters": {"max_new_tokens": max_tokens, "temperature": 0.7}},
                                 timeout=50)
                if r.status_code == 200:
                    data = r.json()
                    if isinstance(data, list) and data:
                        text = data[0].get("generated_text", "").replace(prompt, "").strip()
                        if text:
                            api_status["AI"][f"{name}({task})"] = "success"
                            return text
            else:
                payload = {"model": model, "messages": [{"role": "user", "content": prompt}],
                           "temperature": 0.7, "max_tokens": max_tokens}
                r = session.post(url, headers={**headers, "Content-Type": "application/json"},
                                 json=payload, timeout=45)
                if r.status_code == 200:
                    api_status["AI"][f"{name}({task})"] = "success"
                    return r.json()["choices"][0]["message"]["content"].strip()
            api_status["AI"][f"{name}({task})"] = "failed"
        except Exception as e:
            api_status["AI"][f"{name}({task})"] = f"failed ({str(e)[:35]})"
    return None


def deepl(text):
    """Translate using DeepL"""
    key = os.environ.get("DEEPL_API_KEY")
    if not key:
        api_status["Translation"]["DeepL"] = "hold (no key)"
        return None
    try:
        r = session.post("https://api-free.deepl.com/v2/translate",
                         headers={"Authorization": f"DeepL-Auth-Key {key}"},
                         data={"text": text, "target_lang": "HI"}, timeout=30)
        if r.status_code == 200:
            api_status["Translation"]["DeepL"] = "success"
            return r.json()["translations"][0]["text"]
        api_status["Translation"]["DeepL"] = "failed"
    except:
        api_status["Translation"]["DeepL"] = "failed"
    return None


# ==================== TTS ====================
def gen_tts(text, outfile, rate="-7%"):
    """Generate TTS audio"""
    text = sanitize(text)
    el = os.environ.get("ELEVENLABS_API_KEY")
    if el:
        try:
            r = session.post(
                "https://api.elevenlabs.io/v1/text-to-speech/pNInz6obpgDQGcFmaJgB",
                headers={"Accept": "audio/mpeg", "Content-Type": "application/json",
                         "xi-api-key": el},
                json={"text": text, "model_id": "eleven_multilingual_v2",
                      "voice_settings": {"stability": 0.42, "similarity_boost": 0.82,
                                         "style": 0.35, "use_speaker_boost": True}},
                timeout=70)
            if r.status_code == 200 and len(r.content) > 5000:
                with open(outfile, "wb") as f:
                    f.write(r.content)
                api_status["TTS"]["ElevenLabs"] = "success"
                return True
            api_status["TTS"]["ElevenLabs"] = "failed"
        except:
            api_status["TTS"]["ElevenLabs"] = "failed"
    try:
        tmp = outfile + ".txt"
        with open(tmp, "w", encoding="utf-8") as f:
            f.write(text)
        run_cmd(
            f'edge-tts --file "{tmp}" --write-media "{outfile}" --voice hi-IN-MadhurNeural --rate={rate} --pitch=-2Hz --volume=+8%')
        if os.path.exists(tmp):
            os.remove(tmp)
        api_status["TTS"]["edge-tts"] = "success"
        return True
    except:
        api_status["TTS"]["edge-tts"] = "failed"
        return False


# ==================== MUSIC ====================
def get_music(duration=110, volume=0.22):
    """Get background music"""
    MUSIC_VOL = volume
    fs = os.environ.get("FREESOUND_API_KEY")
    if fs:
        try:
            r = session.get("https://freesound.org/apiv2/search/text/", params={
                "query": "soft ambient meditation islamic peaceful",
                "filter": f"duration:[25 TO {duration + 50}]",
                "fields": "id,name,previews", "page_size": 8, "token": fs}, timeout=14)
            if r.status_code == 200 and r.json().get("results"):
                s = random.choice(r.json()["results"])
                p = s.get("previews", {}).get("preview-hq-mp3") or s.get("previews", {}).get(
                    "preview-lq-mp3")
                if p and download(p, "music_raw.mp3"):
                    run_cmd(
                        f'ffmpeg -y -i music_raw.mp3 -af "volume={MUSIC_VOL},afade=t=in:st=0:d=2,afade=t=out:st=90:d=5" -t {duration} music_soft.mp3')
                    api_status["Music"]["Freesound"] = "success"
                    return
            api_status["Music"]["Freesound"] = "failed"
        except:
            api_status["Music"]["Freesound"] = "failed"

    for u in [
        "https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=soft-ambient-112191.mp3",
        "https://cdn.pixabay.com/download/audio/2022/03/24/audio_4f3b5c5e3d.mp3?filename=peaceful-background-112194.mp3"
    ]:
        if download(u, "music_raw.mp3"):
            run_cmd(
                f'ffmpeg -y -i music_raw.mp3 -af "volume={MUSIC_VOL},afade=t=in:st=0:d=2,afade=t=out:st=90:d=5" -t {duration} music_soft.mp3')
            api_status["Music"]["Pixabay-CDN"] = "success"
            return

    run_cmd(
        f'ffmpeg -y -f lavfi -i "sine=frequency=110:duration={duration}" -af "afade=t=in:st=0:d=2.5,afade=t=out:st={duration - 10}:d=6,volume=0.12" music_soft.mp3')
    api_status["Music"]["Generated-Sine"] = "success (fallback)"


# ==================== BACKGROUND ====================
def get_bg(dur):
    """Get background video"""
    DARKEN = "eq=contrast=1.10:brightness=0.02:saturation=1.12,vignette=PI/5"
    out = "bg.mp4"
    pk = os.environ.get("PEXELS_API_KEY")
    if pk:
        for q in random.sample(
                ["islamic architecture night", "mosque night", "night sky stars", "desert night",
                 "kaaba night"], 4):
            try:
                r = session.get(
                    f"https://api.pexels.com/videos/search?query={q}&orientation=portrait&per_page=6",
                    headers={"Authorization": pk}, timeout=14)
                if r.status_code == 200 and r.json().get("videos"):
                    v = random.choice(r.json()["videos"])
                    files = sorted(v.get("video_files", []), key=lambda x: x.get("width", 0),
                                   reverse=True)
                    if files and download(files[0]["link"], "tmp.mp4"):
                        run_cmd(
                            f'ffmpeg -y -stream_loop -1 -i tmp.mp4 -vf "scale=1200:2140:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z=\'min(zoom+0.0004,1.06)\':d=1:x=\'iw/2-(iw/zoom/2)\':y=\'ih/2-(ih/zoom/2)\':s=1080x1920,setsar=1,{DARKEN}" -t {dur:.2f} -an -c:v libx264 -preset veryfast -crf 18 {out}')
                        api_status["Background"]["Pexels"] = "success"
                        return out
            except:
                pass
        api_status["Background"]["Pexels"] = "failed"

    px = os.environ.get("PIXABAY_API_KEY")
    if px:
        try:
            r = session.get(
                f"https://pixabay.com/api/videos/?key={px}&q=mosque+night&orientation=vertical&per_page=8",
                timeout=14)
            if r.status_code == 200 and r.json().get("hits"):
                h = random.choice(r.json()["hits"])
                u = h.get("videos", {}).get("large", {}).get("url") or h.get("videos", {}).get(
                    "medium", {}).get("url")
                if u and download(u, "tmp.mp4"):
                    run_cmd(
                        f'ffmpeg -y -stream_loop -1 -i tmp.mp4 -vf "scale=1200:2140:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z=\'min(zoom+0.0004,1.06)\':d=1:x=\'iw/2-(iw/zoom/2)\':y=\'ih/2-(ih/zoom/2)\':s=1080x1920,setsar=1,{DARKEN}" -t {dur:.2f} -an -c:v libx264 -preset veryfast -crf 18 {out}')
                    api_status["Background"]["Pixabay"] = "success"
                    return out
            api_status["Background"]["Pixabay"] = "failed"
        except:
            api_status["Background"]["Pixabay"] = "failed"

    c0 = f"{random.randint(10, 30):02x}{random.randint(8, 25):02x}{random.randint(25, 55):02x}"
    c1 = f"{random.randint(10, 30):02x}{random.randint(8, 25):02x}{random.randint(25, 55):02x}"
    run_cmd(
        f'ffmpeg -y -f lavfi -i "gradients=s=1080x1920:c0=0x{c0}:c1=0x{c1}:speed=0.006" -t {dur:.2f} -c:v libx264 -preset veryfast {out}')
    api_status["Background"]["Generated-Gradient"] = "success (fallback)"
    return out


# ==================== LOGO ====================
def make_logo():
    """Create logo image"""
    for src in ["logo.png", "logo.jpg", "assets/logo.png", "assets/logo.jpg"]:
        if os.path.exists(src):
            try:
                img = Image.open(src).convert("RGBA")
                border, bottom = 10, 22
                nw, nh = img.width + border * 2, img.height + border + bottom
                canvas = Image.new("RGBA", (nw, nh), (0, 0, 0, 0))
                draw = ImageDraw.Draw(canvas)
                draw.rectangle([0, 0, nw - 1, nh - 1], outline=(212, 175, 55, 255),
                               width=border)
                draw.rectangle([0, nh - bottom, nw - 1, nh - 1], fill=(20, 15, 8, 240))
                canvas.paste(img, (border, border), img)
                glow = canvas.filter(ImageFilter.GaussianBlur(4))
                Image.alpha_composite(glow, canvas).save("avatar.png")
                return True
            except:
                pass
    try:
        canvas = Image.new("RGBA", (400, 170), (0, 0, 0, 0))
        draw = ImageDraw.Draw(canvas)
        draw.rounded_rectangle([6, 6, 394, 164], radius=16, fill=(16, 12, 6, 245),
                               outline=(212, 175, 55, 255), width=5)
        try:
            fnt = ImageFont.truetype(os.path.expanduser("~/.fonts/NotoSans-Bold.ttf"), 44)
        except:
            fnt = ImageFont.load_default()
        draw.text((200, 65), "SAWAJ", fill=(230, 200, 130, 255), font=fnt, anchor="mm")
        draw.text((200, 115), "STUDIO", fill=(200, 170, 110, 255), font=fnt, anchor="mm")
        canvas.save("avatar.png")
        return True
    except:
        return False


# ==================== GOOGLE DRIVE ====================
def upload_drive(path, prefix, folder_id=None):
    """Upload to Google Drive"""
    try:
        creds = Credentials(
            None,
            refresh_token=os.environ.get("GOOGLE_DRIVE_REFRESH_TOKEN"),
            client_id=os.environ.get("GOOGLE_DRIVE_CLIENT_ID"),
            client_secret=os.environ.get("GOOGLE_DRIVE_CLIENT_SECRET"),
            token_uri="https://oauth2.googleapis.com/token"
        )
        service = build("drive", "v3", credentials=creds, cache_discovery=False)
        meta = {"name": f"{prefix}_{int(time.time())}.mp4"}
        if folder_id:
            meta["parents"] = [folder_id]
        up = service.files().create(
            body=meta,
            media_body=MediaFileUpload(path, mimetype="video/mp4", resumable=True),
            fields="id"
        ).execute()
        did = up.get("id")
        service.permissions().create(
            fileId=did, body={"type": "anyone", "role": "reader"}
        ).execute()
        link = f"https://drive.google.com/file/d/{did}/view"
        direct = f"https://drive.google.com/uc?export=download&id={did}"
        api_status["Drive"]["Google Drive"] = "success"
        send_tg(f"✅ Drive: {link}")
        return link, direct
    except Exception as e:
        api_status["Drive"]["Google Drive"] = f"failed ({str(e)[:50]})"
        send_tg(f"❌ Drive: {e}")
        return None, None


# ==================== HADITH ====================
def fetch_hadith(long=False):
    """Fetch Hadith from API"""
    books = [
        {"eng": "eng-bukhari", "ara": "ara-bukhari", "name": "Sahih al-Bukhari", "max": 7000},
        {"eng": "eng-muslim", "ara": "ara-muslim", "name": "Sahih Muslim", "max": 5000},
        {"eng": "eng-abudawud", "ara": "ara-abudawud", "name": "Sunan Abu Dawud", "max": 4000},
        {"eng": "eng-tirmidhi", "ara": "ara-tirmidhi", "name": "Jami at-Tirmidhi", "max": 3500},
    ]
    bases = []
    if os.environ.get("HADITH_API_URL"):
        bases.append(os.environ["HADITH_API_URL"].rstrip("/"))
    bases += ["https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1",
              "https://raw.githubusercontent.com/fawazahmed0/hadith-api/1"]

    max_attempts = 30 if long else 1
    for _ in range(max_attempts):
        book = random.choice(books)
        num = random.randint(1, book["max"])
        for base in bases:
            try:
                url = f"{base}/editions/{book['eng']}/{num}.json"
                r = session.get(url, timeout=15)
                if r.status_code != 200:
                    continue
                data = r.json()
                hs = data.get("hadiths", [])
                if not hs:
                    continue
                eng = sanitize(hs[0].get("text", ""))
                if long and len(eng) < 200:
                    continue
                if not long and len(eng) < 30:
                    continue
                ara = ""
                try:
                    ar = session.get(url.replace(book["eng"], book["ara"]), timeout=10)
                    if ar.status_code == 200:
                        ad = ar.json().get("hadiths", [])
                        if ad:
                            ara = sanitize(ad[0].get("text", ""))
                except:
                    pass
                api_status["Hadith"][f"{book['name']} #{num}"] = "success"
                send_tg(f"✅ Hadith → {book['name']} #{hs[0].get('hadithnumber') or num}")
                return {"collection": book["name"],
                        "number": str(hs[0].get("hadithnumber") or num),
                        "english": eng, "arabic": ara}
            except:
                pass

    api_status["Hadith"]["fallback"] = "success (hardcoded)"
    if long:
        return {
            "collection": "Sahih al-Bukhari", "number": "1",
            "english": "The reward of deeds depends upon the intentions and every person will get the reward according to what he has intended. So whoever emigrated for worldly benefits or for a woman to marry, his emigration was for what he emigrated for.",
            "arabic": "إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى فَمَنْ كَانَتْ هِجْرَتُهُ إِلَى دُنْيَا يُصِيبُهَا أَوْ إِلَى امْرَأَةٍ يَنْكِحُهَا فَهِجْرَتُهُ إِلَى مَا هَاجَرَ إِلَيْهِ"
        }
    return {
        "collection": "Sahih al-Bukhari", "number": "1",
        "english": "The reward of deeds depends upon the intentions and every person will get the reward according to what he has intended.",
        "arabic": "إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى"
    }


# ==================== SUBTITLE HELPERS ====================
def ts(t):
    """Time string for ASS"""
    return f"0:{int(t // 60):02d}:{t % 60:05.2f}"


def typed(text, style, start, end):
    """Generate word-by-word typed subtitles"""
    words = sanitize(text).split()
    if not words:
        return ""
    wd = (end - start) / max(len(words), 1)
    out, t = "", start
    for w in words:
        out += f"Dialogue: 0,{ts(t)},{ts(t + wd)},{style},,0,0,0,,{w}\n"
        t += wd
    return out


