# ==================== SOCIAL UPLOAD ====================
def upload_youtube(final, title, description, tags):
    """Upload to YouTube"""
    if not os.environ.get("YOUTUBE_CLIENT_ID") or not os.environ.get("YOUTUBE_REFRESH_TOKEN"):
        api_status["YouTube"]["Upload"] = "skipped (no credentials)"
        return None

    try:
        yt_creds = Credentials(
            None,
            refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
            client_id=os.environ["YOUTUBE_CLIENT_ID"],
            client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
            token_uri="https://oauth2.googleapis.com/token"
        )
        yt = build("youtube", "v3", credentials=yt_creds, cache_discovery=False)
        body = {
            "snippet": {
                "title": title[:100],
                "description": description,
                "tags": tags,
                "categoryId": "22"
            },
            "status": {"privacyStatus": "public", "selfDeclaredMadeForKids": False}
        }
        req = yt.videos().insert(
            part="snippet,status",
            body=body,
            media_body=MediaFileUpload(final, chunksize=-1, resumable=True,
                                       mimetype="video/mp4")
        )
        resp = None
        while resp is None:
            _, resp = req.next_chunk()
        vid = resp.get("id")
        api_status["YouTube"]["Upload"] = "success"
        send_tg(f"✅ YouTube → https://youtu.be/{vid}")

        playlist_id = os.environ.get("DAILY_HADEES_YT_PLAYLIST_ID") or os.environ.get(
            "PLAYLIST_ID")
        if vid and playlist_id:
            try:
                yt.playlistItems().insert(
                    part="snippet",
                    body={"snippet": {"playlistId": playlist_id.strip(),
                                      "resourceId": {"kind": "youtube#video", "videoId": vid}}}
                ).execute()
                send_tg("✅ Added to YouTube Playlist!")
            except Exception as pe:
                send_tg(f"⚠️ Playlist: {str(pe)[:90]}")
        return vid
    except Exception as e:
        api_status["YouTube"]["Upload"] = f"failed ({str(e)[:40]})"
        send_tg(f"❌ YouTube: {e}")
        return None


