def generate_short_video(long=False):
    """Generate Short or Long video"""
    video_name = "LONG HADITH" if long else "SHORT VIDEO"
    send_tg(f"📘 <b>{video_name} STARTED</b>")

    h = fetch_hadith(long=long)

    if long:
        hindi = deepl(h['english']) or call_ai(
            f"Is English Hadith ka soft accurate COMPLETE Hindi tarjuma likho. Sirf tarjuma. Kuch mat katna.\n\n{h['english']}",
            max_tokens=600, task="hindi") or h['english']
    else:
        hindi = deepl(h['english']) or call_ai(
            f"Is English Hadith ka soft accurate Hindi tarjuma likho. Sirf tarjuma. Koi extra baat mat likho.\n\n{h['english']}",
            task="hindi") or "अमल का दारोमदार नीयतों पर है।"
    hindi = sanitize(re.sub(r'^```.*?```', '', hindi, flags=re.DOTALL))

    meaning = call_ai(
        f"Is Hadith ka short soft Hindi matlab ({'4-6' if long else '2-3'} lines). Sirf matlab. Soft aur dil ko chuene wala.\n\n{hindi}",
        max_tokens=400 if long else 300, task="meaning") or "इस हदीस में नीयत की अहमियत बताई गई है।"
    meaning = sanitize(re.sub(r'^```.*?```', '', meaning, flags=re.DOTALL))

    sawal = call_ai(
        f"""Is Hadith par ek bahut accha, soft aur interactive quiz-style sawal banao.
        Rules: Hindi mein, 1 short clear question, soft tone. Sirf sawal.
        Hadith: {hindi}""", task="sawal") or "इस हदीस से हमें क्या सीख मिलती है?"
    sawal = sanitize(re.sub(r'^```.*?```', '', sawal, flags=re.DOTALL))

    jawab = call_ai(
        f"""Is sawal ka soft, short aur dil ko chuene wala jawab do (2-3 lines).
        Sirf jawab.
        Sawal: {sawal}
        Hadith: {hindi}""", task="jawab") or "अमल का दारोमदार नीयतों पर है।"
    jawab = sanitize(re.sub(r'^```.*?```', '', jawab, flags=re.DOTALL))

    shayari = call_ai(
        "एक छोटी सुंदर नरम उर्दू शायरी (25-35 शब्द)। हदीस के पैग़ाम के मुताबिक़। लाइक सब्सक्राइब कमेंट फॉलो की बात नर्मी से। Sawaj Studio नाम। सिर्फ शायरी।\n\n" + hindi[
                                                                                                                          :180],
        160, task="shayari") or "दिल से पैग़ाम लेकर आए हैं، لائک سبسکرائب کمنٹ فالو سے Sawaj Studio سے جڑ جایئے۔"
    shayari = sanitize(re.sub(r'^```.*?```', '', shayari, flags=re.DOTALL))

    report_api_status()

    # Generate TTS
    rate = "-9%" if long else "-7%"
    with ThreadPoolExecutor(max_workers=5) as ex:
        ex.submit(gen_tts, f"हदीस शरीफ। {hindi}", "p1_raw.mp3", rate)
        ex.submit(gen_tts, f"इसका मतलब। {meaning}", "p2_raw.mp3", rate)
        ex.submit(gen_tts, sawal, "p_sawal_raw.mp3", "-8%")
        ex.submit(gen_tts, jawab, "p_jawab_raw.mp3", "-8%")
        ex.submit(gen_tts, shayari, "p3_raw.mp3", "-8%")
    time.sleep(1.5)

    run_cmd(
        'ffmpeg -y -i p1_raw.mp3 -af "atempo=0.88,loudnorm=I=-16:TP=-1.5:LRA=11,volume=1.35" p1.mp3')
