    ig_id = os.environ.get("INSTAGRAM_BUSINESS_ACCOUNT_ID", "").strip()

    try:
        acc = session.get("https://graph.facebook.com/v21.0/me/accounts",
                          params={"access_token": page_token, "limit": 40}, timeout=15).json()
        if acc.get("data"):
            for p in acc["data"]:
                if not page_id or p["id"] == page_id:
                    page_id = p["id"]
                    if p.get("access_token"):
                        page_token = p["access_token"]
                    break
    except:
        pass

    if not page_id:
        send_tg("❌ Facebook Page ID not found")
        return

    # Facebook
    if is_story:
        # Facebook Story
        try:
            f_size = os.path.getsize(final)
            start = session.post(
                f"https://graph.facebook.com/v21.0/{page_id}/video_stories",
                data={"upload_phase": "start", "file_size": f_size, "access_token": page_token},
                timeout=30).json()
            v_id = start.get("video_id")
            v_url = start.get("upload_url")
            if v_id and v_url:
                with open(final, "rb") as f:
                    up_res = session.post(v_url,
                                          headers={"Authorization": f"OAuth {page_token}",
                                                   "offset": "0", "file_size": str(f_size)},
                                          data=f.read(), timeout=180)
                if up_res.status_code in (200, 201):
                    finish = session.post(
                        f"https://graph.facebook.com/v21.0/{page_id}/video_stories",
                        data={"upload_phase": "finish", "video_id": v_id,
                              "access_token": page_token}, timeout=30).json()
                    if finish.get("success") or finish.get("post_id"):
                        api_status["Facebook Story"]["Upload"] = "success"
                        send_tg("✅ <b>Facebook Story LIVE!</b>")
                    else:
                        api_status["Facebook Story"]["Upload"] = "failed"
        except Exception as e:
            api_status["Facebook Story"]["Upload"] = f"failed ({str(e)[:40]})"
            send_tg(f"❌ Facebook Story: {str(e)[:100]}")
    else:
        # Facebook Video
        try:
            with open(final, "rb") as f:
                res = session.post(
                    f"https://graph.facebook.com/v21.0/{page_id}/videos",
                    data={"access_token": page_token, "description": fb_caption,
                          "published": "true"},
                    files={"source": f}, timeout=400).json()
            if res.get("id"):
                api_status["Facebook"]["Upload"] = "success"
                send_tg(f"✅ Facebook → {res['id']}")
            else:
                api_status["Facebook"]["Upload"] = "failed"
                send_tg(f"❌ Facebook Error: {str(res)[:120]}")
        except Exception as e:
            api_status["Facebook"]["Upload"] = f"failed ({str(e)[:40]})"
            send_tg(f"❌ Facebook: {str(e)[:90]}")

    # Instagram
    if not ig_id:
        try:
            ig_info = session.get(f"https://graph.facebook.com/v21.0/{page_id}",
                                  params={"fields": "instagram_business_account",
                                          "access_token": page_token}, timeout=12).json()
            ig_id = ig_info.get("instagram_business_account", {}).get("id")
        except:
            pass

    if not ig_id:
        api_status["Instagram"]["Upload"] = "skipped (no IG ID)"
        return

    media_type = "STORIES" if is_story else "REELS"
    status_key = "Instagram Story" if is_story else "Instagram"

    try:
        c_id = None
        if direct and not is_story:
            cont = session.post(
                f"https://graph.facebook.com/v21.0/{ig_id}/media",
                data={"media_type": media_type, "video_url": direct, "caption": ig_caption,
                      "access_token": page_token}, timeout=35).json()
            c_id = cont.get("id")

        if not c_id:
            cont = session.post(
                f"https://graph.facebook.com/v21.0/{ig_id}/media",
                data={"media_type": media_type, "upload_type": "resumable",
                      "access_token": page_token}, timeout=40).json()
            c_id = cont.get("id")
            if c_id:
                upload_url = cont.get("uri") or f"https://rupload.facebook.com/ig-api-upload/v21.0/{c_id}"
                file_size = os.path.getsize(final)
                with open(final, "rb") as f:
                    video_bytes = f.read()
                headers = {"Authorization": f"OAuth {page_token}", "offset": "0",
                           "file_size": str(file_size), "Content-Type": "application/octet-stream"}
                session.post(upload_url, headers=headers, data=video_bytes, timeout=180)

        if c_id:
            for _ in range(45):
                time.sleep(6)
                st = session.get(f"https://graph.facebook.com/v21.0/{c_id}",
                                 params={"fields": "status_code",
                                         "access_token": page_token}, timeout=12).json()
                if st.get("status_code") == "FINISHED":
                    pub = session.post(
                        f"https://graph.facebook.com/v21.0/{ig_id}/media_publish",
                        data={"creation_id": c_id, "access_token": page_token},
                        timeout=18).json()
                    if pub.get("id"):
                        api_status[status_key]["Upload"] = "success"
                        send_tg(f"✅ Instagram {'Story' if is_story else 'Reel'} → {pub['id']}")
                    break
                elif st.get("status_code") == "ERROR":
                    api_status[status_key]["Upload"] = "failed (processing)"
                    break
    except Exception as e:
        api_status[status_key]["Upload"] = f"failed ({str(e)[:40]})"
        send_tg(f"❌ Instagram: {str(e)[:90]}")


# ==================== CLEANUP ====================
def cleanup(files, dirs):
    """Clean up temporary files"""
    for f in files:
        if os.path.exists(f):
            os.remove(f)
    for d in dirs:
        shutil.rmtree(d, ignore_errors=True)


# ==================== MAIN ====================
def main():
    """Main entry point"""
    start_time = time.time()

    if VIDEO_TYPE == "story":
        send_tg("🎬 <b>Starting STORY Video Generation...</b>")
        final, total = generate_story_video()

        report_api_status()
        drive_link, direct = upload_drive(final, "Story",
                                          os.environ.get("DRIVE_STORY_FOLDER_ID"))

        if META_TOKEN and SHOULD_POST_SOCIAL:
            send_tg("📱 <b>Uploading Story to Facebook + Instagram...</b>")
            upload_facebook_instagram(final, direct, "", "", is_story=True)

        cleanup(
            ["s_raw.mp3", "s_v.mp3", "s_voice.mp3", "s_subs.ass", "tmp.mp4", "music_raw.mp3"],
            ["s_frames"])

    elif VIDEO_TYPE == "short":
