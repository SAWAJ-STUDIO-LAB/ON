        if t < intro:
            a = min(1.0, t / 0.5)
            draw.text((540, 870), "SAWAJ STUDIO", fill=(220, 190, 120, int(255 * a)),
                      font=font_big, anchor="mm")
            draw.text((540, 960), "Morning Story", fill=(180, 160, 130, int(200 * a)),
