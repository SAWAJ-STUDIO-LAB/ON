name: Test NVIDIA API Key

on:
  workflow_dispatch: # Manual button click karke run karne ke liye
  push:
    branches: [ main ]

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - name: Test NVIDIA API Connection
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $NVIDIA_API_KEY" https://integrate.api.nvidia.com/v1/models)
          
          if [ "$response" -eq 200 ]; then
            echo "✅ Success! NVIDIA API Key bilkul sahi kaam kar rahi hai."
          else
            echo "❌ Failed! HTTP Status Code: $response"
            echo "Secret key check karein ya dekhein ki name 'NVIDIA_API_KEY' sahi hai ya nahi."
            exit 1
          fi
