def clean_code(code):
    code = re.sub(r"^```(?:python|yaml|yml|json)?\s*\n", "", code, flags=re.IGNORECASE)
    code = re.sub(r"\n```\s*$", "", code)
    return code.strip()


def parse_response(text):
    result = {"updates": [], "creates": [], "folders": [], "deletes": [], "splits": []}

    pattern_upd = r"===\s*FILE:\s*(.+?)\s*===\s*\n(.*?)\n\s*===\s*END FILE\s*==="
    for path, code in re.findall(pattern_upd, text, re.DOTALL):
        result["updates"].append((path.strip(), clean_code(code)))

    pattern_create = r"===\s*CREATE FILE:\s*(.+?)\s*===\s*\n(.*?)\n\s*===\s*END FILE\s*==="
    for path, code in re.findall(pattern_create, text, re.DOTALL):
        result["creates"].append((path.strip(), clean_code(code)))

    pattern_folder = r"===\s*CREATE FOLDER:\s*(.+?)\s*==="
    for path in re.findall(pattern_folder, text):
        result["folders"].append(path.strip())

    pattern_del = r"===\s*DELETE FILE:\s*(.+?)\s*==="
    for path in re.findall(pattern_del, text):
        result["deletes"].append(path.strip())

    pattern_split = r"===\s*SPLIT FILE:\s*(.+?)\s*===\s*\n(.*?)\n\s*===\s*END SPLIT\s*==="
    for orig, body in re.findall(pattern_split, text, re.DOTALL):
        parts = []
        sub = r"===\s*INTO FILE:\s*(.+?)\s*===\s*\n(.*?)\n\s*===\s*END FILE\s*==="
        for p_path, p_code in re.findall(sub, body, re.DOTALL):
            parts.append((p_path.strip(), clean_code(p_code)))
        if parts:
            result["splits"].append((orig.strip(), parts))

    return result


def main():
    print("=" * 60)
    print("SAWAJ AI DEVELOPER")
    print("=" * 60)

    print("")
    print("[CHECK] API Keys:")
    for name, key in KEYS.items():
        print("  " + name + ": " + ("SET (" + key[:8] + "...)" if key else "MISSING"))

    print("")
    print("[CHECK] Telegram:")
    print("  TOKEN: " + ("SET" if os.environ.get("TELEGRAM_BOT_TOKEN") else "MISSING"))
    print("  CHAT_ID: " + ("SET" if os.environ.get("TELEGRAM_CHAT_ID") else "MISSING"))

    start = time.time()
    tg("Sawaj AI Developer Started", silent=True)

    print("")
    print("[SCAN] Scanning folders...")
    all_files, tree_view = scan_all()
    print("  Files: " + str(len(all_files)))

    if not all_files:
        print("  NO FILES FOUND")
        return

    folder_batches = get_folder_batches(all_files)
    total_batches = len(folder_batches)
    print("  Folders: " + str(total_batches))

    bot_count = sum(1 for k in all_files if k.startswith(ROOT_FOLDER + "/"))
    wf_count = sum(1 for k in all_files if k.startswith(WORKFLOW_FOLDER + "/"))

    tg("Scan Complete\n\nsawajstudiobot/ - " + str(bot_count) + " files\n.github/workflows/ - " + str(wf_count) + " files\n\nTotal: " + str(len(all_files)) + " files\nTotal Folders: " + str(total_batches))

    stats = {"updated": 0, "cancelled": 0, "invalid": 0, "created_files": 0, "created_folders": 0, "deleted": 0, "splits": 0}
    ai_used = {}
    failed_batches = []
    error_details = []

    print("")
    print("[PROCESS] Starting " + str(total_batches) + " folders...")

    for bnum, (folder_name, batch) in enumerate(folder_batches, 1):
        print("")
        print("[Batch " + str(bnum) + "/" + str(total_batches) + "] " + folder_name + "/")
        print("  Files: " + str(len(batch)))

        group = AI_GROUPS[(bnum - 1) % len(AI_GROUPS)]
        print("  AI Group: " + str(group))

        prompt = build_prompt(batch, folder_name, tree_view, bnum, total_batches)
        print("  Prompt: " + str(len(prompt)) + " chars")

        response, used_ai = call_ai(group, prompt)

        if not response:
            print("  BATCH FAILED")
            failed_batches.append(bnum)
            error_details.append("Batch " + str(bnum) + " (" + folder_name + "): all AIs failed")
            continue

        ai_used[used_ai] = ai_used.get(used_ai, 0) + 1
        print("  SUCCESS via " + used_ai)

        ops = parse_response(response)
        print("  Updates: " + str(len(ops["updates"])) + " | Creates: " + str(len(ops["creates"])))

        for path, code in ops["updates"]:
            orig = find_original_path(path, all_files)
            old = all_files.get(orig, "")
            result = update_file(orig, code, old)
            if result == "saved":
                stats["updated"] += 1
            elif result == "cancelled":
                stats["cancelled"] += 1
            elif result == "failed":
                stats["invalid"] += 1

        for path, code in ops["creates"]:
            if create_new_file(path, code):
                stats["created_files"] += 1

        for path in ops["folders"]:
            if create_new_folder(path):
                stats["created_folders"] += 1

        for path in ops["deletes"]:
            if delete_file(path):
                stats["deleted"] += 1

        for orig, parts in ops["splits"]:
            for p_path, p_code in parts:
                if create_new_file(p_path, p_code):
                    stats["created_files"] += 1
            if delete_file(orig):
                stats["deleted"] += 1
            stats["splits"] += 1

        tg("Batch " + str(bnum) + "/" + str(total_batches) + "\n" + folder_name + "/\nUpdated: " + str(len(ops["updates"])) + " | Created: " + str(len(ops["creates"])) + "\nAI: " + used_ai, silent=True)

    elapsed = time.time() - start
    mins = int(elapsed // 60)
    secs = int(elapsed % 60)

    ai_summary = "\n".join("  " + ai + ": " + str(cnt) + " folders" for ai, cnt in sorted(ai_used.items(), key=lambda x: -x[1]))
    if not ai_summary:
        ai_summary = "  (NONE - all AIs failed)"

    print("")
    print("=" * 60)
    print("DONE in " + str(mins) + "m " + str(secs) + "s")
    print("=" * 60)

    final_msg = "Sawaj AI Developer Complete\n\n"
    final_msg += "RESULTS\n"
    final_msg += "Total Folders: " + str(total_batches) + "\n"
    final_msg += "Files Updated: " + str(stats["updated"]) + "\n"
    final_msg += "Cancelled: " + str(stats["cancelled"]) + "\n"
    final_msg += "Invalid: " + str(stats["invalid"]) + "\n"
    final_msg += "New Files: " + str(stats["created_files"]) + "\n"
    final_msg += "New Folders: " + str(stats["created_folders"]) + "\n"
    final_msg += "Deleted: " + str(stats["deleted"]) + "\n"
    final_msg += "Splits: " + str(stats["splits"]) + "\n"
    final_msg += "Failed: " + str(len(failed_batches)) + "\n"
    final_msg += "Time: " + str(mins) + "m " + str(secs) + "s\n\n"
    final_msg += "AI USAGE\n" + ai_summary

    if error_details:
        final_msg += "\n\nERRORS:\n" + "\n".join(error_details[:5])

    tg(final_msg)


if __name__ == "__main__":
    main()
ENDOFPYTHON

