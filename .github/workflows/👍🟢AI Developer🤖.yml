name: Sawaj AI Developer

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sawaj-ai-developer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TOKEN_GITHUB }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet requests pyyaml pyflakes

      - name: Create Backup
        run: |
          BACKUP="backup-$(date +%Y%m%d-%H%M%S)"
          git push origin "HEAD:refs/heads/$BACKUP" || true
          git ls-remote --heads origin 'backup-*' | awk '{print $2}' | sed 's#refs/heads/##' | sort | head -n -10 | xargs -r -I{} git push origin --delete {} || true

      - name: Write AI Developer Script
        run: |
          cat > /tmp/ai_dev.py << 'ENDOFPYTHON'
          #!/usr/bin/env python3
          """Sawaj AI Developer v3 - manual, fully automatic, multi-AI voting upgrader.

          One manual run does everything:

          1. Every file is sent to ALL configured AIs, one file at a time.
          2. Each AI sends back a short report plus its complete upgraded version of
             the file (it may also create new files; one file = one system).
          3. Every proposal is checked automatically (syntax, no deleted logic, no broken
             imports, no placeholder output, workflow safety, ...).
          4. All AIs then VOTE on the valid proposals (or KEEP the original).
             The proposal with the most votes is written back to the SAME location.
          5. Progress is saved, so a run that hits the time limit continues next time.
          """
          from __future__ import annotations

          import ast
          import difflib
          import functools
          import hashlib
          import json
          import os
          import random
          import re
          import sys
          import time
          import tomllib
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone
          from typing import Any, Callable, Dict, List, Optional, Set, Tuple

          import requests

          try:
              import yaml
          except ImportError:  # pragma: no cover
              yaml = None


          # --------------------------------------------------------------------------
          # Configuration
          # --------------------------------------------------------------------------
          def env_str(name: str, default: str = "") -> str:
              return os.environ.get(name, default).strip()


          def env_bool(name: str, default: bool = False) -> bool:
              val = os.environ.get(name)
              if val is None or not val.strip():
                  return default
              return val.strip().lower() in ("1", "true", "yes", "on")


          def env_int(name: str, default: int) -> int:
              try:
                  return int(env_str(name) or default)
              except ValueError:
                  return default


          ROOT_FOLDER = env_str("ROOT_FOLDER", "sawajstudiobot")
          WORKFLOW_FOLDER = ".github/workflows"
          SELF_FILENAME = "sawaj_ai_developer.yml"
          SELF_NAME_RE = re.compile(r"(?m)^name:\s*Sawaj AI Developer\s*$")
          STATE_PATH = ROOT_FOLDER + "/_logs/ai_developer_state.json"

          # Defaults are "do everything". Env overrides exist only for local testing.
          DRY_RUN = env_bool("DRY_RUN", False)
          ALLOW_DELETE = env_bool("ALLOW_DELETE", True)
          INCLUDE_WORKFLOWS = env_bool("INCLUDE_WORKFLOWS", True)
          MAX_FILES = env_int("MAX_FILES", 0)
          MAX_RUNTIME_MIN = env_int("MAX_RUNTIME_MIN", 330)
          REQUEST_DELAY = env_int("REQUEST_DELAY", 2)

          SKIP_DIRS = {
              "__pycache__", ".git", "output", "_work", "_backups", "_logs", "venv",
              ".venv", "node_modules", "_temp_builder", ".pytest_cache", ".mypy_cache",
          }
          PROCESS_EXTENSIONS = (
              ".py", ".yml", ".yaml", ".json", ".toml", ".cfg", ".md", ".txt", ".ini",
          )

          MAX_FILE_CHARS = 70000
          MIN_FILE_CHARS = 40
          MAX_CREATES_PER_FILE = 6
          AI_TIMEOUT = 300

          KEYS: Dict[str, str] = {
              "Gemini": env_str("GEMINI_API_KEY"),
              "Groq": env_str("GROQ_API_KEY"),
              "OpenRouter": env_str("OPENROUTER_API_KEY"),
              "Mistral": env_str("MISTRAL_API_KEY"),
              "Cerebras": env_str("CEREBRAS_API_KEY"),
              "NVIDIA": env_str("NVIDIA_API_KEY"),
              "Cohere": env_str("COHERE_API_KEY"),
              "HuggingFace": env_str("HUGGINGFACE_API_KEY"),
          }

          GEMINI_MODELS = [
              m.strip()
              for m in env_str(
                  "GEMINI_MODELS", "gemini-2.5-flash,gemini-2.5-pro,gemini-2.0-flash"
              ).split(",")
              if m.strip()
          ]
          GEMINI_MAX_OUT = 32768
          COHERE_MODEL = env_str("COHERE_MODEL", "command-a-03-2025")

          OPENAI_COMPAT: Dict[str, Dict[str, Any]] = {
              "Groq": {
                  "url": "https://api.groq.com/openai/v1/chat/completions",
                  "model": env_str("GROQ_MODEL", "llama-3.3-70b-versatile"),
                  "max_out": 8000,
              },
              "OpenRouter": {
                  "url": "https://openrouter.ai/api/v1/chat/completions",
                  "model": env_str("OPENROUTER_MODEL", "openai/gpt-4o-mini"),
                  "max_out": 16000,
                  "headers": {
                      "HTTP-Referer": "https://github.com/SAWAJ-STUDIO-LAB",
                      "X-Title": "SawajAIDev",
                  },
              },
              "Mistral": {
                  "url": "https://api.mistral.ai/v1/chat/completions",
                  "model": env_str("MISTRAL_MODEL", "mistral-large-latest"),
                  "max_out": 16000,
              },
              "Cerebras": {
                  "url": "https://api.cerebras.ai/v1/chat/completions",
                  "model": env_str("CEREBRAS_MODEL", "llama-3.3-70b"),
                  "max_out": 8000,
              },
              "NVIDIA": {
                  "url": "https://integrate.api.nvidia.com/v1/chat/completions",
                  "model": env_str("NVIDIA_MODEL", "meta/llama-3.3-70b-instruct"),
                  "max_out": 4096,
              },
              "HuggingFace": {
                  "url": "https://router.huggingface.co/v1/chat/completions",
                  "model": env_str("HUGGINGFACE_MODEL", "meta-llama/Llama-3.3-70B-Instruct"),
                  "max_out": 4000,
              },
          }

          SENSITIVE_NAME_RE = re.compile(
              r"(^|[_\-.])(token|tokens|secret|secrets|credential|credentials|"
              r"client_secret|service_account|id_rsa|cookies?)([_\-.]|$)|^\.env",
              re.IGNORECASE,
          )
          SECRET_RES = [
              re.compile(p)
              for p in (
                  r"AIza[0-9A-Za-z_\-]{35}",
                  r"\bsk-[A-Za-z0-9_\-]{20,}",
                  r"\bgh[pousr]_[A-Za-z0-9]{30,}",
                  r"\bxox[abprs]-[A-Za-z0-9\-]{10,}",
                  r"\b\d{8,10}:[A-Za-z0-9_\-]{35}\b",
                  r"-----BEGIN (?:RSA |EC |OPENSSH |)?PRIVATE KEY-----",
                  r"\"(?:refresh_token|client_secret|private_key)\"\s*:\s*\"[^\"]{8,}\"",
                  r"\bya29\.[0-9A-Za-z_\-]{20,}",
                  r"\bgsk_[A-Za-z0-9]{20,}",
                  r"\bnvapi-[A-Za-z0-9_\-]{20,}",
                  r"\bhf_[A-Za-z0-9]{30,}",
              )
          ]
          PLACEHOLDER_RE = re.compile(
              r"(?i)(rest of (the )?(code|file)|\.\.\.\s*\(?(unchanged|existing|same)|"
              r"#\s*\.\.\.|\[\s*empty file\s*\]|existing code here|your code here)"
          )
          SERIOUS_FLAKES = {
              "UndefinedName", "UndefinedLocal", "UndefinedExport", "DuplicateArgument",
              "ReturnOutsideFunction", "YieldOutsideFunction", "ContinueOutsideLoop",
              "BreakOutsideLoop", "DefaultExceptNotLast", "TwoStarredExpressions",
          }
          SECRETS_REF_RE = re.compile(r"secrets\.([A-Za-z0-9_]+)")
          HEREDOC_RES = [
              re.compile(
                  r"cat\s*>\s*(\S+\.py)\s*<<\s*['\"]?(\w+)['\"]?[^\n]*\n(.*?)\n[ \t]*\2[ \t]*(?:\n|$)",
                  re.DOTALL,
              ),
              re.compile(
                  r"python3?\s+-\s*<<\s*['\"]?(\w+)['\"]?[^\n]*\n(.*?)\n[ \t]*\1[ \t]*(?:\n|$)",
                  re.DOTALL,
              ),
          ]

          DISABLED: Set[str] = set()
          COOLDOWN: Dict[str, float] = {}
          STATS: Dict[str, int] = {
              "files_seen": 0, "updated": 0, "created": 0, "deleted": 0, "kept": 0,
              "failed": 0, "rejected_proposals": 0, "resumed_skipped": 0,
          }
          WINS: Dict[str, int] = {}
          REPORT: List[Dict[str, Any]] = []
          JOURNAL: Dict[str, Optional[str]] = {}  # path -> original content (None = new)


          def log(msg: str = "") -> None:
              print(msg, flush=True)


          def redact(text: Any) -> str:
              out = str(text)
              secrets = [v for v in KEYS.values() if v]
              secrets.append(env_str("TELEGRAM_BOT_TOKEN"))
              for secret in secrets:
                  if secret:
                      out = out.replace(secret, "***")
              return out


          def sha(text: Optional[str]) -> str:
              return hashlib.sha1((text or "").encode("utf-8")).hexdigest()


          # --------------------------------------------------------------------------
          # Telegram
          # --------------------------------------------------------------------------
          def tg(msg: str, silent: bool = False) -> None:
              token = env_str("TELEGRAM_BOT_TOKEN")
              chat_id = env_str("TELEGRAM_CHAT_ID")
              if not token or not chat_id:
                  return
              msg = redact(msg)
              chunks = [msg[i:i + 3800] for i in range(0, len(msg), 3800)][:3]
              for chunk in chunks:
                  try:
                      requests.post(
                          "https://api.telegram.org/bot" + token + "/sendMessage",
                          json={
                              "chat_id": chat_id,
                              "text": chunk,
                              "disable_web_page_preview": True,
                              "disable_notification": silent,
                          },
                          timeout=15,
                      )
                  except requests.RequestException:
                      pass


          # --------------------------------------------------------------------------
          # AI providers
          # --------------------------------------------------------------------------
          SYSTEM_PROMPT = (
              "You are a meticulous senior Python engineer. Follow the requested output "
              "format exactly and never truncate files."
          )


          def http_post(
              url: str, headers: Dict[str, str], payload: Dict[str, Any],
              timeout: int = AI_TIMEOUT,
          ) -> Tuple[Optional[Dict[str, Any]], str, bool]:
              """POST JSON. Returns (data, error, retryable)."""
              try:
                  r = requests.post(url, headers=headers, json=payload, timeout=timeout)
              except requests.Timeout:
                  return None, "TIMEOUT", True
              except requests.RequestException as exc:
                  return None, "NETWORK: " + type(exc).__name__, True
              if r.status_code == 200:
                  try:
                      return r.json(), "", False
                  except ValueError:
                      return None, "BAD_JSON", True
              retry = r.status_code in (408, 409, 425, 429) or r.status_code >= 500
              return None, "HTTP %d: %s" % (r.status_code, redact(r.text[:150])), retry


          def call_gemini(prompt: str) -> Tuple[Optional[str], str, bool]:
              last_err = "NO_MODELS"
              for model in GEMINI_MODELS:
                  url = (
                      "https://generativelanguage.googleapis.com/v1beta/models/"
                      + model + ":generateContent"
                  )
                  data, err, _ = http_post(
                      url,
                      {"Content-Type": "application/json", "x-goog-api-key": KEYS["Gemini"]},
                      {
                          "systemInstruction": {"parts": [{"text": SYSTEM_PROMPT}]},
                          "contents": [{"role": "user", "parts": [{"text": prompt}]}],
                          "generationConfig": {
                              "maxOutputTokens": GEMINI_MAX_OUT,
                              "temperature": 0.2,
                          },
                      },
                  )
                  if data:
                      try:
                          parts = data["candidates"][0]["content"]["parts"]
                          text = "".join(p.get("text", "") for p in parts)
                          if text.strip():
                              return text, "", False
                          err = "EMPTY_OR_BLOCKED"
                      except (KeyError, IndexError, TypeError):
                          err = "BAD_RESPONSE_SHAPE"
                  last_err = model + ": " + err
              return None, last_err, False


          def call_openai_compat(name: str, prompt: str) -> Tuple[Optional[str], str, bool]:
              cfg = OPENAI_COMPAT[name]
              headers = {"Authorization": "Bearer " + KEYS[name]}
              headers.update(cfg.get("headers", {}))
              data, err, retry = http_post(
                  cfg["url"],
                  headers,
                  {
                      "model": cfg["model"],
                      "messages": [
                          {"role": "system", "content": SYSTEM_PROMPT},
                          {"role": "user", "content": prompt},
                      ],
                      "max_tokens": cfg["max_out"],
                      "temperature": 0.2,
                  },
              )
              if data:
                  try:
                      text = data["choices"][0]["message"]["content"]
                      if text and text.strip():
                          return text, "", False
                  except (KeyError, IndexError, TypeError):
                      pass
                  return None, "BAD_RESPONSE_SHAPE", False
              return None, err, retry


          def call_cohere(prompt: str) -> Tuple[Optional[str], str, bool]:
              data, err, retry = http_post(
                  "https://api.cohere.com/v2/chat",
                  {"Authorization": "Bearer " + KEYS["Cohere"], "Content-Type": "application/json"},
                  {
                      "model": COHERE_MODEL,
                      "messages": [
                          {"role": "system", "content": SYSTEM_PROMPT},
                          {"role": "user", "content": prompt},
                      ],
                      "max_tokens": 4000,
                      "temperature": 0.2,
                  },
              )
              if data:
                  try:
                      blocks = data["message"]["content"]
                      text = "".join(b.get("text", "") for b in blocks if b.get("type") == "text")
                      if text.strip():
                          return text, "", False
                  except (KeyError, TypeError, AttributeError):
                      pass
                  return None, "BAD_RESPONSE_SHAPE", False
              return None, err, retry


          PROVIDERS: Dict[str, Dict[str, Any]] = {
              "Gemini": {"fn": call_gemini, "max_out": GEMINI_MAX_OUT},
              "Cohere": {"fn": call_cohere, "max_out": 4000},
          }
          for _name, _cfg in OPENAI_COMPAT.items():
              PROVIDERS[_name] = {
                  "fn": functools.partial(call_openai_compat, _name),
                  "max_out": _cfg["max_out"],
              }


          def call_provider(name: str, prompt: str) -> Tuple[Optional[str], str]:
              """Call one provider with retry/backoff. Returns (text, status)."""
              fn: Callable[[str], Tuple[Optional[str], str, bool]] = PROVIDERS[name]["fn"]
              last = ""
              for attempt, delay in enumerate((0, 10, 30), 1):
                  if delay:
                      time.sleep(delay)
                  try:
                      text, err, retry = fn(prompt)
                  except Exception as exc:  # provider code must never kill the run
                      text, err, retry = None, type(exc).__name__, False
                  if text and text.strip():
                      return text, "OK"
                  last = redact(err or "EMPTY")
                  log("    FAIL %s (try %d) - %s" % (name, attempt, last))
                  if last.startswith(("HTTP 401", "HTTP 403", "HTTP 404")):
                      DISABLED.add(name)
                      log("    %s disabled for this run" % name)
                      break
                  if not retry:
                      break
                  if last.startswith("HTTP 429") and attempt == 3:
                      COOLDOWN[name] = time.time() + 180
              return None, last


          def active_providers() -> List[str]:
              now = time.time()
              return [
                  n for n in PROVIDERS
                  if KEYS.get(n) and n not in DISABLED and COOLDOWN.get(n, 0) <= now
              ]


          # --------------------------------------------------------------------------
          # Python analysis helpers (cached)
          # --------------------------------------------------------------------------
          @functools.lru_cache(maxsize=4096)
          def _parse_cached(code: str) -> Optional[ast.AST]:
              try:
                  return ast.parse(code)
              except (SyntaxError, ValueError):
                  return None


          def defined_names(code: str) -> Set[str]:
              names: Set[str] = set()
              tree = _parse_cached(code)
              if tree is None:
                  return names
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                      names.add(node.name)
              for node in tree.body:  # type: ignore[attr-defined]
                  targets: List[ast.expr] = []
                  if isinstance(node, ast.Assign):
                      targets = list(node.targets)
                  elif isinstance(node, ast.AnnAssign):
                      targets = [node.target]
                  for t in targets:
                      if isinstance(t, ast.Name) and t.id.isupper():
                          names.add(t.id)
              return names


          def serious_flakes(code: str) -> int:
              try:
                  from pyflakes.checker import Checker
                  tree = _parse_cached(code)
                  if tree is None:
                      return 0
                  return sum(
                      1 for m in Checker(tree, "candidate.py").messages
                      if m.__class__.__name__ in SERIOUS_FLAKES
                  )
              except Exception:
                  return 0


          @functools.lru_cache(maxsize=4096)
          def import_records(code: str) -> Tuple[Tuple[str, int, Tuple[str, ...]], ...]:
              tree = _parse_cached(code)
              if tree is None:
                  return ()
              recs: List[Tuple[str, int, Tuple[str, ...]]] = []
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for a in node.names:
                          recs.append((a.name, 0, ()))
                  elif isinstance(node, ast.ImportFrom):
                      recs.append((node.module or "", node.level, tuple(a.name for a in node.names)))
              return tuple(recs)


          @functools.lru_cache(maxsize=4096)
          def bindings_of(code: str) -> Optional[frozenset]:
              """Top-level names a module exposes. None = unknown (wildcards etc.)."""
              tree = _parse_cached(code)
              if tree is None:
                  return None
              names: Set[str] = set()

              def add_targets(node: Optional[ast.AST]) -> None:
                  if node is None:
                      return
                  for n in ast.walk(node):
                      if isinstance(n, ast.Name):
                          names.add(n.id)

              def visit(stmts: List[ast.stmt]) -> None:
                  for s in stmts:
                      if isinstance(s, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                          names.add(s.name)
                      elif isinstance(s, ast.Import):
                          for a in s.names:
                              names.add((a.asname or a.name).split(".")[0])
                      elif isinstance(s, ast.ImportFrom):
                          for a in s.names:
                              names.add("*" if a.name == "*" else (a.asname or a.name))
                      elif isinstance(s, ast.Assign):
                          for t in s.targets:
                              add_targets(t)
                      elif isinstance(s, (ast.AnnAssign, ast.AugAssign)):
                          add_targets(s.target)
                      elif isinstance(s, (ast.For, ast.AsyncFor)):
                          add_targets(s.target)
                          visit(s.body)
                          visit(s.orelse)
                      elif isinstance(s, (ast.With, ast.AsyncWith)):
                          for item in s.items:
                              add_targets(item.optional_vars)
                          visit(s.body)
                      elif isinstance(s, (ast.If, ast.While)):
                          visit(s.body)
                          visit(s.orelse)
                      elif isinstance(s, ast.Try):
                          visit(s.body)
                          visit(s.orelse)
                          visit(s.finalbody)
                          for h in s.handlers:
                              visit(h.body)

              visit(tree.body)  # type: ignore[attr-defined]
              if "*" in names or "__getattr__" in names:
                  return None
              return frozenset(names)


          # --------------------------------------------------------------------------
          # Virtual file tree and import resolution (script style AND package style)
          # --------------------------------------------------------------------------
          class Tree:
              def __init__(self, paths: Set[str]):
                  self.files: Set[str] = set(paths)
                  self.dirs: Set[str] = set()
                  for p in self.files:
                      d = os.path.dirname(p)
                      while d and d not in self.dirs:
                          self.dirs.add(d)
                          d = os.path.dirname(d)

              def with_changes(self, changes: Dict[str, Optional[str]]) -> "Tree":
                  paths = set(self.files)
                  for p, c in changes.items():
                      if c is None:
                          paths.discard(p)
                      else:
                          paths.add(p)
                  return Tree(paths)

              def locate(self, base: str, parts: List[str]) -> Optional[Tuple[str, str]]:
                  if not parts:
                      return ("pkg", base) if (base == "" or base in self.dirs) else None
                  path = "/".join([x for x in [base] + parts if x])
                  if path + ".py" in self.files:
                      return ("file", path + ".py")
                  if path in self.dirs:
                      return ("pkg", path)
                  return None


          def ancestor_dirs(rel: str) -> List[str]:
              out: List[str] = []
              d = os.path.dirname(rel)
              while True:
                  out.append(d)
                  if not d:
                      break
                  d = os.path.dirname(d)
              return out


          def resolve_module(tree: Tree, importer: str, module: str, level: int) -> Optional[Tuple[str, str]]:
              parts = [p for p in module.split(".") if p]
              if level > 0:
                  base = os.path.dirname(importer)
                  for _ in range(level - 1):
                      base = os.path.dirname(base)
                  return tree.locate(base, parts)
              for base in ancestor_dirs(importer):
                  res = tree.locate(base, parts)
                  if res:
                      return res
              return None


          def is_internal(tree: Tree, importer: str, module: str, level: int) -> bool:
              if level > 0:
                  return True
              first = module.split(".")[0]
              if not first:
                  return False
              return any(tree.locate(b, [first]) for b in ancestor_dirs(importer))


          def import_errors(path: str, code: str, tree: Tree, contents: Dict[str, str]) -> Set[str]:
              errs: Set[str] = set()
              for module, level, names in import_records(code):
                  if not is_internal(tree, path, module, level):
                      continue
                  res = resolve_module(tree, path, module, level)
                  if res is None:
                      errs.add("%s: cannot resolve '%s%s'" % (path, "." * level, module))
                      continue
                  kind, target = res
                  if "*" in names:
                      continue
                  for n in names:
                      if kind == "file":
                          src = contents.get(target)
                          b = bindings_of(src) if src is not None else None
                          if b is not None and n not in b:
                              errs.add("%s: '%s' not found in %s" % (path, n, target))
                      else:
                          if tree.locate(target, [n]):
                              continue
                          init = target + "/__init__.py"
                          src = contents.get(init)
                          b = bindings_of(src) if src is not None else None
                          if b is not None and n not in b:
                              errs.add("%s: '%s' not found in package %s" % (path, n, target))
              return errs


          def import_targets(path: str, code: str, tree: Tree) -> Set[str]:
              out: Set[str] = set()
              for module, level, names in import_records(code):
                  if not is_internal(tree, path, module, level):
                      continue
                  res = resolve_module(tree, path, module, level)
                  if not res:
                      continue
                  kind, target = res
                  if kind == "file":
                      out.add(target)
                  else:
                      init = target + "/__init__.py"
                      if init in tree.files:
                          out.add(init)
                      for n in names:
                          sub = tree.locate(target, [n])
                          if sub and sub[0] == "file":
                              out.add(sub[1])
              return out


          def dependents(target: str, contents: Dict[str, str], tree: Tree) -> List[str]:
              return [
                  p for p, c in contents.items()
                  if p.endswith(".py") and p != target and target in import_targets(p, c, tree)
              ]


          def link_check(
              changes: Dict[str, Optional[str]], contents: Dict[str, str], tree: Tree
          ) -> List[str]:
              """Return NEW import errors that the proposed changes would introduce."""
              contents2 = dict(contents)
              for p, c in changes.items():
                  if c is None:
                      contents2.pop(p, None)
                  else:
                      contents2[p] = c
              tree2 = tree.with_changes(changes)
              affected: Set[str] = set()
              for p, c in changes.items():
                  if p.endswith(".py"):
                      if c is not None:
                          affected.add(p)
                      affected.update(dependents(p, contents, tree))
              before: Set[str] = set()
              after: Set[str] = set()
              for p in affected:
                  if p in contents:
                      before |= import_errors(p, contents[p], tree, contents)
                  if p in contents2:
                      after |= import_errors(p, contents2[p], tree2, contents2)
              return sorted(after - before)


          # --------------------------------------------------------------------------
          # Validation of a single proposed file
          # --------------------------------------------------------------------------
          def workflow_signature(data: Any) -> Optional[Dict[str, Any]]:
              if not isinstance(data, dict):
                  return None
              trigger = data.get("on", data.get(True))
              jobs = data.get("jobs") or {}
              sig: Dict[str, Any] = {"on": json.dumps(trigger, sort_keys=True, default=str), "jobs": {}}
              for jname, job in jobs.items():
                  steps = []
                  if isinstance(job, dict):
                      steps = job.get("steps") or []
                  sig["jobs"][jname] = [
                      (s.get("name"), str(s.get("uses", "")).split("@")[0])
                      for s in steps if isinstance(s, dict)
                  ]
              return sig


          def check_workflow(old: str, new: str) -> Tuple[bool, str]:
              if yaml is None:
                  return True, ""
              try:
                  new_data = yaml.safe_load(new)
              except Exception:
                  return False, "invalid YAML"
              if not isinstance(new_data, dict) or "jobs" not in new_data:
                  return False, "not a workflow"
              if "on" not in new_data and True not in new_data:
                  return False, "workflow has no trigger"
              try:
                  old_data = yaml.safe_load(old)
              except Exception:
                  old_data = None
              if old_data is not None:
                  if workflow_signature(old_data) != workflow_signature(new_data):
                      return False, "workflow steps/triggers changed"
                  if not set(SECRETS_REF_RE.findall(new)) <= set(SECRETS_REF_RE.findall(old)):
                      return False, "new secret reference"
              for job in (new_data.get("jobs") or {}).values():
                  if not isinstance(job, dict):
                      continue
                  for step in job.get("steps") or []:
                      run = step.get("run") if isinstance(step, dict) else None
                      if not isinstance(run, str):
                          continue
                      for rx in HEREDOC_RES:
                          for m in rx.finditer(run):
                              body = m.group(rx.groups)
                              try:
                                  ast.parse(body)
                              except SyntaxError as exc:
                                  return False, "embedded python broken (line %s)" % exc.lineno
              return True, ""


          def check_candidate(
              rel: str, old: str, new: str, extra_defs: Optional[Set[str]] = None
          ) -> Tuple[bool, str]:
              """Decide whether proposed content for `rel` may replace `old`."""
              extra_defs = extra_defs or set()
              if not new or not new.strip():
                  return False, "empty output"
              if PLACEHOLDER_RE.search(new) and not PLACEHOLDER_RE.search(old):
                  return False, "placeholder / lazy output"
              if len(old) > 500 and len(new) > 3 * len(old):
                  return False, "output grew more than 3x"
              if rel.endswith(".py"):
                  if _parse_cached(new) is None:
                      return False, "syntax error"
                  if old.strip():
                      lost = defined_names(old) - defined_names(new) - extra_defs
                      if lost:
                          return False, "removed definitions: " + ", ".join(sorted(lost)[:5])
                      if len(old) > 300 and len(new) < 0.4 * len(old):
                          return False, "output far shorter than original"
                  if serious_flakes(new) > serious_flakes(old):
                      return False, "introduces undefined names"
                  return True, ""
              if rel.endswith((".yml", ".yaml")):
                  if rel.startswith(WORKFLOW_FOLDER + "/"):
                      ok, why = check_workflow(old, new)
                      if not ok:
                          return False, why
                  elif yaml is not None:
                      try:
                          yaml.safe_load(new)
                      except Exception:
                          return False, "invalid YAML"
              elif rel.endswith(".json"):
                  try:
                      json.loads(new)
                  except ValueError:
                      return False, "invalid JSON"
              elif rel.endswith(".toml"):
                  try:
                      tomllib.loads(new)
                  except tomllib.TOMLDecodeError:
                      return False, "invalid TOML"
              if len(old) > 200 and len(new) < 0.5 * len(old):
                  return False, "output far shorter than original"
              return True, ""


          # --------------------------------------------------------------------------
          # Scanning
          # --------------------------------------------------------------------------
          def is_skipped(path: str) -> bool:
              parts = [p for p in path.replace("\\", "/").split("/") if p]
              if any(p in SKIP_DIRS for p in parts):
                  return True
              return bool(parts) and parts[-1] == SELF_FILENAME


          def looks_sensitive(rel: str, content: str) -> bool:
              base = os.path.basename(rel).lower()
              if not base.endswith(".py") and SENSITIVE_NAME_RE.search(base):
                  return True
              return any(p.search(content) for p in SECRET_RES)


          def scan_folder(
              root: str, skipped: Dict[str, List[str]], all_paths: Set[str]
          ) -> Dict[str, str]:
              files: Dict[str, str] = {}
              if not os.path.isdir(root):
                  return files
              for dirpath, dirs, fnames in os.walk(root):
                  dirs[:] = sorted(d for d in dirs if not is_skipped(os.path.join(dirpath, d)))
                  for fn in sorted(fnames):
                      full = os.path.join(dirpath, fn)
                      rel = full.replace(os.sep, "/")
                      if is_skipped(rel):
                          continue
                      all_paths.add(rel)
                      if not fn.endswith(PROCESS_EXTENSIONS):
                          continue
                      try:
                          with open(full, "r", encoding="utf-8") as fh:
                              content = fh.read()
                      except (OSError, UnicodeDecodeError):
                          skipped["unreadable"].append(rel)
                          continue
                      if root == WORKFLOW_FOLDER and (
                          not fn.endswith((".yml", ".yaml")) or SELF_NAME_RE.search(content)
                      ):
                          continue
                      if len(content.strip()) < MIN_FILE_CHARS:
                          continue
                      if len(content) > MAX_FILE_CHARS:
                          skipped["too_large"].append(rel)
                          continue
                      if looks_sensitive(rel, content):
                          skipped["sensitive"].append(rel)
                          continue
                      files[rel] = content
              return files


          def scan_all() -> Tuple[Dict[str, str], Set[str], Dict[str, List[str]]]:
              skipped: Dict[str, List[str]] = {"sensitive": [], "too_large": [], "unreadable": []}
              all_paths: Set[str] = set()
              files = scan_folder(ROOT_FOLDER, skipped, all_paths)
              if INCLUDE_WORKFLOWS:
                  files.update(scan_folder(WORKFLOW_FOLDER, skipped, all_paths))
              return files, all_paths, skipped


          def project_index(files: Dict[str, str], focus: str, limit: int = 10000) -> str:
              def common(a: str, b: str) -> int:
                  n = 0
                  for x, y in zip(a.split("/"), b.split("/")):
                      if x != y:
                          break
                      n += 1
                  return n

              lines: List[str] = []
              for path in sorted((p for p in files if p.endswith(".py")), key=lambda p: (-common(p, focus), p)):
                  tree = _parse_cached(files[path])
                  if tree is None:
                      lines.append(path + ": (syntax error)")
                      continue
                  items: List[str] = []
                  for node in tree.body:  # type: ignore[attr-defined]
                      if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                          args = ", ".join(a.arg for a in node.args.args)
                          items.append("def %s(%s)" % (node.name, args))
                      elif isinstance(node, ast.ClassDef):
                          methods = [
                              n.name for n in node.body
                              if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))
                          ]
                          items.append("class %s[%s]" % (node.name, ",".join(methods[:8])))
                      elif isinstance(node, ast.Assign):
                          for t in node.targets:
                              if isinstance(t, ast.Name) and t.id.isupper():
                                  items.append(t.id)
                  lines.append("%s: %s" % (path, "; ".join(items[:20])))
              return "\n".join(lines)[:limit]


          # --------------------------------------------------------------------------
          # Prompts
          # --------------------------------------------------------------------------
          def build_analysis_prompt(
              rel: str, code: str, files: Dict[str, str], tree: Tree, idx: int, total: int
          ) -> str:
              listing = "\n".join(
                  sorted(p for p in tree.files if p.endswith((".py", ".yml", ".yaml", ".toml", ".md", ".txt")))
              )[:5000]
              p: List[str] = [
                  "You are the LEAD AI ARCHITECT for SawajStudioBot, a video generation and "
                  "upload automation pipeline that runs inside GitHub Actions.",
                  "",
                  "YOUR JOB: review ONLY this one file, find every real problem and return a "
                  "short report plus the complete upgraded file. Other AIs review the same "
                  "file; the best proposal wins a vote.",
                  "",
                  "=== PROJECT FILES ===",
                  listing,
                  "",
                  "=== PUBLIC API OF THE PROJECT (other files depend on these names) ===",
                  project_index(files, rel),
                  "",
                  "=== WHAT TO FIX ===",
                  "Bugs and logic errors; missing try/except around I/O and network; missing "
                  "type hints and docstrings; hardcoded values (move to constants/env); "
                  "missing logging; incomplete functions; wrong or deprecated API URLs; "
                  "missing imports; unclear local variable names; duplicate code; API calls "
                  "without retry/fallback; security problems (never print secrets); "
                  "performance problems; inconsistent style.",
                  "",
                  "=== HARD RULES ===",
                  "- ZERO DELETION of working logic. Never remove or rename any function, "
                  "class or UPPER_CASE constant; other files import them.",
                  "- Keep the EXACT existing import style (for example `from A_core.A3_telegram "
                  "import x`). Never invent modules that do not exist.",
                  "- ONE FILE = ONE SYSTEM. If this file mixes several unrelated systems you "
                  "may move one into a NEW file (snake_case name, same folder or a new "
                  "folder). Then this file must still expose the same public names, "
                  "importing them from the new file.",
                  "- You may CREATE new files and folders when the project clearly needs "
                  "them. Never create a second copy of something that already exists.",
                  "- Delete this file ONLY if it is broken or dead and nothing imports it.",
                  "- Return the COMPLETE file. Never write '...', 'rest of code' or "
                  "'unchanged' placeholders.",
                  "- Never add, remove or edit secrets or API keys.",
                  "- For config/data files (json, toml, txt, md, requirements) fix only clear "
                  "errors. Never change data values or dependency versions.",
                  "- Workflow YAML: fix real bugs only. Do NOT add or remove steps, triggers, "
                  "actions or secrets.",
                  "- No markdown fences around code.",
                  "",
                  "=== RESPONSE FORMAT (exactly) ===",
                  "=== REPORT ===",
                  "- one short line per problem found / fix made, in simple Hindi (max 10 lines)",
                  "=== END REPORT ===",
                  "=== FILE: %s ===" % rel,
                  "(complete upgraded code)",
                  "=== END FILE ===",
                  "Optional extra files:",
                  "=== CREATE FILE: path/to/new_file.py ===",
                  "(complete code)",
                  "=== END FILE ===",
                  "If the file is already good, reply with the REPORT block and then the "
                  "single line: NO_CHANGES",
                  "If the file must be deleted, reply with the REPORT block and then the "
                  "single line: === DELETE THIS FILE ===",
                  "",
                  "=== FILE %d/%d: %s ===" % (idx, total, rel),
                  code,
                  "=== END OF INPUT FILE ===",
              ]
              return "\n".join(p)


          RE_REPORT = re.compile(r"^===\s*REPORT\s*===\s*$")
          RE_END_REPORT = re.compile(r"^===\s*END REPORT\s*===\s*$")
          RE_UPDATE = re.compile(r"^===\s*FILE:\s*(.+?)\s*===\s*$")
          RE_CREATE = re.compile(r"^===\s*CREATE FILE:\s*(.+?)\s*===\s*$")
          RE_END_FILE = re.compile(r"^===\s*END FILE\s*===\s*$")
          RE_DELETE_SELF = re.compile(r"^===\s*DELETE THIS FILE\s*===\s*$")


          def clean_code(code: str) -> str:
              lines = code.replace("\r\n", "\n").split("\n")
              while lines and not lines[0].strip():
                  lines.pop(0)
              while lines and not lines[-1].strip():
                  lines.pop()
              if lines and re.match(r"^```[\w+\-]*\s*$", lines[0]):
                  lines.pop(0)
              if lines and re.match(r"^```\s*$", lines[-1]):
                  lines.pop()
              return "\n".join(lines).strip("\n")


          def parse_proposal(text: str) -> Dict[str, Any]:
              """Line based parser. Unterminated (truncated) blocks are discarded."""
              res: Dict[str, Any] = {
                  "report": "", "files": [], "creates": [], "delete": False,
                  "no_changes": False, "truncated": [],
              }
              cur: Optional[Dict[str, Any]] = None
              in_report = False
              report: List[str] = []
              for raw in text.replace("\r\n", "\n").split("\n"):
                  line = raw.rstrip()
                  if in_report:
                      if RE_END_REPORT.match(line):
                          in_report = False
                      else:
                          report.append(line)
                      continue
                  if cur is not None:
                      if RE_END_FILE.match(line):
                          code = clean_code("\n".join(cur["lines"]))
                          (res["files"] if cur["kind"] == "update" else res["creates"]).append(
                              (cur["path"], code)
                          )
                          cur = None
                      else:
                          cur["lines"].append(raw)
                      continue
                  if RE_REPORT.match(line):
                      in_report = True
                      continue
                  m = RE_UPDATE.match(line)
                  if m:
                      cur = {"kind": "update", "path": m.group(1), "lines": []}
                      continue
                  m = RE_CREATE.match(line)
                  if m:
                      cur = {"kind": "create", "path": m.group(1), "lines": []}
                      continue
                  if RE_DELETE_SELF.match(line):
                      res["delete"] = True
                  elif line.strip() == "NO_CHANGES":
                      res["no_changes"] = True
              if cur is not None:
                  res["truncated"].append(cur["path"])
              res["report"] = "\n".join(l for l in report if l.strip())[:900]
              return res


          # --------------------------------------------------------------------------
          # Proposal evaluation
          # --------------------------------------------------------------------------
          def normalize_path(p: str) -> str:
              p = p.strip().strip("`'\"").replace("\\", "/")
              while p.startswith("./"):
                  p = p[2:]
              return p.lstrip("/")


          def resolve_new_path(p: str, rel: str) -> str:
              p = normalize_path(p)
              if p.startswith((ROOT_FOLDER + "/", WORKFLOW_FOLDER + "/")):
                  return p
              return (os.path.dirname(rel) + "/" + p).lstrip("/")


          def allowed_write_path(rel: str, creating: bool = False) -> bool:
              if not rel or rel.startswith("/") or ".." in rel.split("/"):
                  return False
              if is_skipped(rel):
                  return False
              in_bot = rel.startswith(ROOT_FOLDER + "/")
              in_wf = (
                  INCLUDE_WORKFLOWS
                  and rel.startswith(WORKFLOW_FOLDER + "/")
                  and "/" not in rel[len(WORKFLOW_FOLDER) + 1:]
              )
              if not (in_bot or in_wf):
                  return False
              if in_wf and (creating or not rel.endswith((".yml", ".yaml"))):
                  return False
              if not rel.endswith(PROCESS_EXTENSIONS):
                  return False
              base = os.path.basename(rel).lower()
              if not base.endswith(".py") and SENSITIVE_NAME_RE.search(base):
                  return False
              real = os.path.realpath(rel)
              return real.startswith(os.path.realpath(".") + os.sep)


          def can_delete(rel: str, contents: Dict[str, str], tree: Tree) -> Tuple[bool, str]:
              if not ALLOW_DELETE:
                  return False, "delete not allowed"
              if rel.startswith(WORKFLOW_FOLDER) or os.path.basename(rel) == "__init__.py":
                  return False, "this file may not be deleted"
              code = contents.get(rel, "")
              if "__main__" in code:
                  return False, "entry point script may not be deleted"
              deps = dependents(rel, contents, tree)
              if deps:
                  return False, "file is imported by %s" % deps[0]
              needle = os.path.basename(rel)
              for other, text in contents.items():
                  if other != rel and needle in text:
                      return False, "file name is referenced in %s" % other
              return True, ""


          def evaluate_proposal(
              rel: str, prop: Dict[str, Any], contents: Dict[str, str], tree: Tree
          ) -> Tuple[Optional[Dict[str, Optional[str]]], str]:
              """Return (changes, reason). changes is None when the proposal is unusable."""
              old = contents[rel]
              changes: Dict[str, Optional[str]] = {}
              new_defs: Set[str] = set()
              notes: List[str] = []

              for path, code in prop["creates"][:MAX_CREATES_PER_FILE]:
                  p = resolve_new_path(path, rel)
                  if p in tree.files or p in contents or not allowed_write_path(p, creating=True):
                      notes.append("new file %s not allowed" % os.path.basename(p))
                      continue
                  ok, why = check_candidate(p, "", code)
                  if not ok:
                      notes.append("new file %s: %s" % (os.path.basename(p), why))
                      continue
                  changes[p] = code
                  if p.endswith(".py"):
                      new_defs |= defined_names(code)

              update: Optional[str] = None
              for path, code in prop["files"]:
                  if normalize_path(path) == rel or resolve_new_path(path, rel) == rel:
                      update = code
                      break
              if update is None and len(prop["files"]) == 1:
                  update = prop["files"][0][1]

              if prop["delete"]:
                  ok, why = can_delete(rel, contents, tree)
                  if not ok:
                      return None, why
                  changes[rel] = None
              elif update is not None and update.strip() != old.strip():
                  if not allowed_write_path(rel):
                      return None, "file is not writable"
                  ok, why = check_candidate(rel, old, update, new_defs)
                  if not ok:
                      return None, why
                  changes[rel] = update

              if not changes:
                  return None, "no change"
              errs = link_check(changes, contents, tree)
              if errs:
                  return None, "broken imports: " + "; ".join(errs[:2])
              return changes, "; ".join(notes)


          # --------------------------------------------------------------------------
          # Voting
          # --------------------------------------------------------------------------
          def diff_text(old: str, new: Optional[str], limit: int = 5000) -> str:
              if new is None:
                  return "(file would be DELETED)"
              diff = "".join(
                  difflib.unified_diff(
                      old.splitlines(True), new.splitlines(True), "original", "proposal", n=2
                  )
              )
              return diff[:limit] + ("\n...(diff truncated)" if len(diff) > limit else "")


          def describe_proposal(rel: str, old: str, changes: Dict[str, Optional[str]], report: str) -> str:
              out: List[str] = ["Report: " + (report.replace("\n", " ") or "(none)")[:500]]
              if rel in changes:
                  out.append("Changes to %s:\n%s" % (rel, diff_text(old, changes[rel])))
              for p, c in changes.items():
                  if p != rel and c is not None:
                      head = "\n".join(c.splitlines()[:25])
                      out.append("NEW FILE %s (%d lines):\n%s" % (p, len(c.splitlines()), head[:1500]))
              return "\n".join(out)


          def cast_vote(
              judge: str, rel: str, options: List[Tuple[str, str]]
          ) -> Tuple[str, Optional[str]]:
              """options: (author, description). Returns (judge, chosen author | 'KEEP' | None)."""
              order = list(options)
              random.shuffle(order)
              letters = "ABCDEFGH"
              lines = [
                  "You are an impartial senior reviewer. Several engineers proposed upgrades "
                  "for the file `%s`." % rel,
                  "Choose the option that gives the largest REAL improvement (bug fixes, "
                  "reliability, clarity) with the LEAST risk of breaking behaviour.",
                  "Choose KEEP if no proposal is clearly better and safe.",
                  "",
                  "OPTION KEEP: leave the original file unchanged.",
              ]
              for i, (_, desc) in enumerate(order):
                  lines += ["", "OPTION %s:" % letters[i], desc]
              lines += ["", "Reply with ONE line only: VOTE: <KEEP or letter> - short reason"]
              text, _ = call_provider(judge, "\n".join(lines))
              if not text:
                  return judge, None
              m = re.search(r"VOTE:\s*\**\s*(KEEP|[A-H])\b", text, re.IGNORECASE)
              if not m:
                  return judge, None
              choice = m.group(1).upper()
              if choice == "KEEP":
                  return judge, "KEEP"
              idx = letters.find(choice)
              if 0 <= idx < len(order):
                  return judge, order[idx][0]
              return judge, None


          def run_vote(
              rel: str, old: str, valid: Dict[str, Dict[str, Optional[str]]], reports: Dict[str, str]
          ) -> Tuple[str, Dict[str, int]]:
              # identical proposals from several AIs become ONE option (votes must not split)
              reps: Dict[str, str] = {}
              for a, ch in valid.items():
                  sig = json.dumps({k: (sha(v) if v is not None else None) for k, v in sorted(ch.items())})
                  reps.setdefault(sig, a)
              valid = {a: valid[a] for a in reps.values()}
              options = [(a, describe_proposal(rel, old, ch, reports.get(a, ""))) for a, ch in valid.items()]
              judges = active_providers()
              tally: Dict[str, int] = {"KEEP": 0}
              for a in valid:
                  tally[a] = 0
              if not judges:
                  return "KEEP", tally
              with ThreadPoolExecutor(max_workers=len(judges)) as ex:
                  futs = [ex.submit(cast_vote, j, rel, options) for j in judges]
                  for f in as_completed(futs):
                      _, choice = f.result()
                      if choice in tally:
                          tally[choice] += 1
              best = max(tally.values())
              if best == 0:
                  return "KEEP", tally
              leaders = [k for k, v in tally.items() if v == best]
              if "KEEP" in leaders:
                  return "KEEP", tally
              if len(leaders) == 1:
                  return leaders[0], tally
              # tie between proposals: prefer the smallest change (safest)
              def size(author: str) -> int:
                  ch = valid[author]
                  return sum(len(c or "") for c in ch.values())
              return sorted(leaders, key=size)[0], tally


          # --------------------------------------------------------------------------
          # File pipeline
          # --------------------------------------------------------------------------
          def write_file(rel: str, code: str, contents: Dict[str, str], tree: Tree) -> None:
              if rel not in JOURNAL:
                  JOURNAL[rel] = contents.get(rel)
              if not DRY_RUN:
                  os.makedirs(os.path.dirname(rel) or ".", exist_ok=True)
                  with open(rel, "w", encoding="utf-8", newline="\n") as fh:
                      fh.write(code.rstrip() + "\n")
              contents[rel] = code.rstrip() + "\n"
              tree.files.add(rel)
              d = os.path.dirname(rel)
              while d and d not in tree.dirs:
                  tree.dirs.add(d)
                  d = os.path.dirname(d)


          def remove_file(rel: str, contents: Dict[str, str], tree: Tree) -> None:
              if rel not in JOURNAL:
                  JOURNAL[rel] = contents.get(rel)
              if not DRY_RUN and os.path.exists(rel):
                  os.remove(rel)
              contents.pop(rel, None)
              tree.files.discard(rel)


          def analyse_file(
              rel: str, idx: int, total: int, contents: Dict[str, str], tree: Tree
          ) -> Dict[str, Any]:
              old = contents[rel]
              entry: Dict[str, Any] = {
                  "file": rel, "result": "failed", "winner": "", "votes": {},
                  "reports": {}, "rejected": {},
              }
              prompt = build_analysis_prompt(rel, old, contents, tree, idx, total)
              need = int(len(old) / 3.0) + 1500
              analysts = [n for n in active_providers() if PROVIDERS[n]["max_out"] >= need]
              if not analysts:
                  analysts = sorted(active_providers(), key=lambda n: -PROVIDERS[n]["max_out"])[:2]
              if not analysts:
                  entry["rejected"]["all"] = "no active AI provider"
                  return entry

              log("  asking %d AIs: %s" % (len(analysts), ", ".join(analysts)))
              texts: Dict[str, Optional[str]] = {}
              with ThreadPoolExecutor(max_workers=len(analysts)) as ex:
                  futs = {ex.submit(call_provider, n, prompt): n for n in analysts}
                  for f in as_completed(futs):
                      texts[futs[f]] = f.result()[0]

              valid: Dict[str, Dict[str, Optional[str]]] = {}
              reports: Dict[str, str] = {}
              answered = 0
              for name in analysts:
                  text = texts.get(name)
                  if not text:
                      entry["rejected"][name] = "no answer"
                      continue
                  answered += 1
                  prop = parse_proposal(text)
                  reports[name] = prop["report"]
                  entry["reports"][name] = prop["report"]
                  if prop["truncated"] and not prop["files"] and not prop["creates"]:
                      entry["rejected"][name] = "output truncated"
                      continue
                  if prop["no_changes"] and not prop["files"] and not prop["creates"] and not prop["delete"]:
                      continue  # this AI says the file is fine
                  changes, why = evaluate_proposal(rel, prop, contents, tree)
                  if changes is None:
                      if why != "no change":
                          entry["rejected"][name] = why
                          STATS["rejected_proposals"] += 1
                      continue
                  valid[name] = changes
              if answered == 0:
                  return entry

              if not valid:
                  entry["result"] = "kept"
                  entry["winner"] = "KEEP"
                  log("  no valid proposal -> KEEP")
                  return entry

              log("  %d valid proposals -> voting" % len(valid))
              winner, tally = run_vote(rel, old, valid, reports)
              entry["votes"] = tally
              entry["winner"] = winner
              log("  votes: %s -> winner: %s" % (tally, winner))
              if winner == "KEEP":
                  entry["result"] = "kept"
                  return entry

              changes = valid[winner]
              kind = "updated"
              for path, code in changes.items():
                  if code is None:
                      remove_file(path, contents, tree)
                      kind = "deleted"
                  else:
                      write_file(path, code, contents, tree)
                      if path != rel:
                          STATS["created"] += 1
              if kind == "updated" and rel not in changes:
                  kind = "created"
              entry["result"] = kind
              entry["files"] = sorted(changes)
              WINS[winner] = WINS.get(winner, 0) + 1
              return entry


          # --------------------------------------------------------------------------
          # State, verification, reports
          # --------------------------------------------------------------------------
          def load_state() -> Dict[str, Any]:
              try:
                  with open(STATE_PATH, "r", encoding="utf-8") as fh:
                      st = json.load(fh)
                  if isinstance(st, dict) and isinstance(st.get("done"), dict):
                      return st
              except (OSError, ValueError):
                  pass
              return {"complete": True, "done": {}}


          def save_state(state: Dict[str, Any]) -> None:
              if DRY_RUN:
                  return
              try:
                  os.makedirs(os.path.dirname(STATE_PATH), exist_ok=True)
                  state["updated"] = datetime.now(timezone.utc).isoformat()
                  with open(STATE_PATH, "w", encoding="utf-8") as fh:
                      json.dump(state, fh, indent=1, ensure_ascii=False)
              except OSError:
                  pass


          def final_verify() -> List[str]:
              """Re-read every touched file from disk and roll back anything broken."""
              if DRY_RUN:
                  return []
              reverted: List[str] = []
              for rel, original in sorted(JOURNAL.items()):
                  if not os.path.exists(rel):
                      continue
                  try:
                      with open(rel, "r", encoding="utf-8") as fh:
                          text = fh.read()
                      if rel.endswith(".py"):
                          compile(text, rel, "exec")
                      elif rel.endswith((".yml", ".yaml")) and yaml is not None:
                          yaml.safe_load(text)
                      elif rel.endswith(".json"):
                          json.loads(text)
                      continue
                  except Exception:
                      pass
                  if original is None:
                      os.remove(rel)
                  else:
                      with open(rel, "w", encoding="utf-8", newline="\n") as fh:
                          fh.write(original)
                  reverted.append(rel)
              return reverted


          def write_reports(elapsed: float, reverted: List[str], skipped: Dict[str, List[str]]) -> None:
              try:
                  with open("/tmp/sawaj_ai_report.json", "w", encoding="utf-8") as fh:
                      json.dump(
                          {
                              "finished": datetime.now(timezone.utc).isoformat(),
                              "dry_run": DRY_RUN, "seconds": int(elapsed),
                              "stats": STATS, "wins": WINS, "skipped": skipped,
                              "reverted": reverted, "files": REPORT,
                          },
                          fh, indent=2, ensure_ascii=False,
                      )
              except OSError:
                  pass
              summary = env_str("GITHUB_STEP_SUMMARY")
              if not summary:
                  return
              lines = ["## Sawaj AI Developer", "", "| Metric | Count |", "|---|---|"]
              lines += ["| %s | %d |" % (k, v) for k, v in STATS.items()]
              if WINS:
                  lines += ["", "**Votes won:** " + ", ".join("%s %d" % kv for kv in sorted(WINS.items(), key=lambda x: -x[1]))]
              lines += ["", "### Files", "", "| File | Result | Winner | Votes |", "|---|---|---|---|"]
              for r in REPORT[:300]:
                  lines.append("| `%s` | %s | %s | %s |" % (
                      r["file"], r["result"], r.get("winner", ""),
                      json.dumps(r.get("votes", {}), ensure_ascii=False)))
              if any(skipped.values()):
                  lines += ["", "### Skipped", ""]
                  for k, v in skipped.items():
                      if v:
                          lines.append("- **%s**: %s" % (k, ", ".join("`%s`" % x for x in v[:20])))
              try:
                  with open(summary, "a", encoding="utf-8") as fh:
                      fh.write("\n".join(lines) + "\n")
              except OSError:
                  pass


          def main() -> int:
              t0 = time.time()
              log("=" * 60)
              log("SAWAJ AI DEVELOPER v3 (voting)" + ("  [DRY RUN]" if DRY_RUN else ""))
              log("=" * 60)
              for name in PROVIDERS:
                  log("  %s: %s" % (name, "SET" if KEYS.get(name) else "MISSING"))
              if not active_providers():
                  log("No API keys configured.")
                  tg("Sawaj AI Developer: no API keys configured")
                  return 1

              contents, all_paths, skipped = scan_all()
              tree = Tree(all_paths)
              baseline_errors: Set[str] = set()
              for p, c in contents.items():
                  if p.endswith(".py"):
                      baseline_errors |= import_errors(p, c, tree, contents)
              log("[SCAN] files: %d | import problems already present: %d" % (len(contents), len(baseline_errors)))
              for kind, lst in skipped.items():
                  if lst:
                      log("  skipped %s: %s" % (kind, ", ".join(lst[:10])))
              if not contents:
                  log("NO FILES FOUND")
                  tg("Sawaj AI Developer: no files found in %s/" % ROOT_FOLDER)
                  return 0

              state = load_state()
              if state.get("complete", True):
                  state = {"complete": False, "done": {}}
                  resumed = False
              else:
                  resumed = True
              done: Dict[str, str] = state["done"]

              order = sorted(contents, key=lambda p: (p.startswith(WORKFLOW_FOLDER), p))
              todo = [p for p in order if not (resumed and done.get(p) == sha(contents[p]))]
              STATS["resumed_skipped"] = len(order) - len(todo)
              if MAX_FILES:
                  todo = todo[:MAX_FILES]
              total = len(todo)
              tg("Sawaj AI Developer started\nfiles to review: %d%s\nAIs active: %s\nsensitive files skipped: %d" % (
                  total, " (continuing previous run)" if resumed else "",
                  ", ".join(active_providers()), len(skipped["sensitive"])), silent=True)

              digest: List[str] = []
              stopped_early = False
              for i, rel in enumerate(todo, 1):
                  if time.time() - t0 > MAX_RUNTIME_MIN * 60:
                      log("runtime guard reached - stopping, next run will continue")
                      stopped_early = True
                      break
                  if not active_providers():
                      log("no AI provider left - stopping")
                      stopped_early = True
                      break
                  log("")
                  log("[%d/%d] %s" % (i, total, rel))
                  STATS["files_seen"] += 1
                  entry = analyse_file(rel, i, total, contents, tree)
                  REPORT.append(entry)
                  res = entry["result"]
                  if res == "failed":
                      STATS["failed"] += 1
                  else:
                      if res in ("updated", "created"):
                          STATS["updated"] += 1
                      elif res == "deleted":
                          STATS["deleted"] += 1
                      elif res == "kept":
                          STATS["kept"] += 1
                      done[rel] = sha(contents.get(rel))
                  digest.append("%s %s (%s)" % (
                      {"updated": "UPDATED", "created": "NEW", "deleted": "DELETED",
                       "kept": "ok", "failed": "FAILED"}.get(res, res),
                      os.path.basename(rel), entry.get("winner", "")))
                  if len(digest) >= 10:
                      tg("Progress %d/%d\n%s" % (i, total, "\n".join(digest)), silent=True)
                      digest = []
                      save_state(state)
                  time.sleep(REQUEST_DELAY)

              if digest:
                  tg("Progress\n" + "\n".join(digest), silent=True)

              reverted = final_verify()
              new_errors: Set[str] = set()
              for p, c in contents.items():
                  if p.endswith(".py"):
                      new_errors |= import_errors(p, c, tree, contents)
              broken_now = sorted(new_errors - baseline_errors)

              state["complete"] = (not stopped_early) and STATS["failed"] == 0 and not MAX_FILES
              if state["complete"]:
                  state["done"] = {}
              save_state(state)

              elapsed = time.time() - t0
              mins, secs = int(elapsed // 60), int(elapsed % 60)
              write_reports(elapsed, reverted, skipped)

              wins = ", ".join("%s %d" % kv for kv in sorted(WINS.items(), key=lambda x: -x[1])) or "-"
              msg = (
                  "Sawaj AI Developer finished%s\n\n"
                  "Files reviewed: %d\nUpdated: %d\nNew files: %d\nDeleted: %d\n"
                  "Kept as is: %d\nFailed (retry next run): %d\n"
                  "Unsafe proposals blocked: %d\nReverted: %d\n"
                  "Votes won: %s\nTime: %dm %ds\n%s"
              ) % (
                  " (DRY RUN)" if DRY_RUN else "",
                  STATS["files_seen"], STATS["updated"], STATS["created"], STATS["deleted"],
                  STATS["kept"], STATS["failed"], STATS["rejected_proposals"], len(reverted),
                  wins, mins, secs,
                  "STOPPED EARLY - run again to continue" if stopped_early else "All files done",
              )
              if broken_now:
                  msg += "\n\nNEW import problems:\n" + "\n".join(broken_now[:6])
              if skipped["sensitive"]:
                  msg += "\n\nFiles with secrets (never sent to AI):\n" + "\n".join(skipped["sensitive"][:8])
              log("")
              log(msg)
              tg(msg)
              return 1 if STATS["files_seen"] and STATS["failed"] == STATS["files_seen"] else 0


          if __name__ == "__main__":
              sys.exit(main())
          ENDOFPYTHON

      - name: Run AI Developer
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_AI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_AI }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_AI }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY_AI }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY_AI }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY_AI }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY_AI }}
        run: python3 /tmp/ai_dev.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sawaj-ai-report
          path: /tmp/sawaj_ai_report.json
          if-no-files-found: ignore

      - name: Commit and Push
        if: always()
        run: |
          git config user.name "Sawaj AI Developer"
          git config user.email "ai.dev@sawajstudio.com"

          push_with_retry() {
            for i in 1 2 3; do
              if git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
                return 0
              fi
              sleep 5
            done
            return 1
          }

          # 1) bot code first, so a workflow-permission problem can never block it
          if [ -e sawajstudiobot ]; then git add -A -- sawajstudiobot; fi
          if ! git diff --cached --quiet; then
            git commit -m "Sawaj AI Developer: upgrade - $(date -u '+%Y-%m-%d %H:%M UTC')"
            push_with_retry || { echo "Push failed"; exit 1; }
          else
            echo "No bot code changes"
          fi

          # 2) workflow files (needs a token with the workflow permission)
          if [ -e .github/workflows ]; then git add -A -- .github/workflows; fi
          if ! git diff --cached --quiet; then
            git commit -m "Sawaj AI Developer: workflow fixes - $(date -u '+%Y-%m-%d %H:%M UTC')"
            push_with_retry || echo "Workflow push failed - TOKEN_GITHUB needs the workflow permission"
          else
            echo "No workflow changes"
          fi
