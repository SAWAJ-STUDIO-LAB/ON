        {"model": "meta-llama/Llama-3.1-8B-Instruct",
         "messages": [{"role": "user", "content": prompt}],
         "max_tokens": min(MAX_OUTPUT_TOKENS, 4000),
         "temperature": 0.3})
    if d and "choices" in d:
        return d["choices"][0]["message"]["content"], "OK"
    return None, err


AI_FUNCS = {
    "Gemini": call_gemini, "Groq": call_groq,
    "OpenRouter": call_openrouter, "Mistral": call_mistral,
    "Cerebras": call_cerebras, "NVIDIA": call_nvidia,
    "Cohere": call_cohere, "HuggingFace": call_huggingface,
}


def call_ai(group, prompt):
    for ai_name in group:
        fn = AI_FUNCS.get(ai_name)
        if not fn:
            continue
        print("    Trying " + ai_name + "...")
        try:
            res, status = fn(prompt)
            if res and len(res) > 50:
                print("    SUCCESS " + ai_name + " (" + str(len(res)) + " chars)")
                return res, ai_name
            print("    FAIL " + ai_name + " - " + str(status))
        except Exception as e:
            print("    FAIL " + ai_name + " - " + str(e)[:80])
    return None, None


def valid_python(code):
    try:
        ast.parse(code)
        return True
    except Exception:
        return False


def valid_yaml(code):
    try:
        import yaml
        yaml.safe_load(code)
        return True
    except Exception:
        return False


def validate(rel_path, code):
    if rel_path.endswith(".py"):
        return valid_python(code)
    if rel_path.endswith((".yml", ".yaml")):
        return valid_yaml(code)
    return True


def quality_score(code):
    if not code or len(code) < 10:
        return 0
    s = 0.0
    s += min(len(code), 20000) / 100
    s += code.count('"""') * 5
    s += code.count("try:") * 8
    s += code.count("except") * 8
    s += code.count("-> ") * 3
    s += code.count(": str") * 2
    s += code.count(": int") * 2
    s += code.count(": bool") * 2
    s += code.count(": Dict") * 2
    s += code.count(": List") * 2
    s += code.count(": Optional") * 2
    s += code.count("logging.") * 2
    s += code.count("class ") * 5
    s += code.count("def ") * 3
    s += code.count("import ") * 2
    s += code.count("if __name__") * 5
    s += code.count("raise ") * 3
    s -= code.count("pass\n") * 3
    s -= code.count("TODO") * 5
    s -= code.count("FIXME") * 5
    s -= code.count("# ...") * 10
    return max(0.0, s)


def skip(path):
    p = path.replace("\\", "/")
    for s in SKIP_DIRS:
        if s in p:
            return True
    if SELF_FILENAME in p:
        return True
    return False


def scan_folder(root):
    files_data = {}
    tree_lines = ["  " + root + "/"]
    if not os.path.exists(root):
        return files_data, "\n".join(tree_lines)

    for dirpath, dirs, fnames in os.walk(root):
        dirs[:] = [d for d in dirs if not skip(os.path.join(dirpath, d))]
        rel_dir = os.path.relpath(dirpath, root)
        depth = 0 if rel_dir == "." else rel_dir.count(os.sep) + 1
        indent = "  " * (depth + 1)
        if rel_dir != ".":
            tree_lines.append(indent + os.path.basename(dirpath) + "/")

        for fn in sorted(fnames):
            full = os.path.join(dirpath, fn)
            if skip(full):
                continue
            if not fn.endswith(PROCESS_EXTENSIONS):
                continue
            rel = os.path.relpath(full, root)
            try:
                with open(full, "r", encoding="utf-8") as f:
                    content = f.read()
            except Exception:
                content = ""
            files_data[rel] = content
            tree_lines.append(indent + fn)

    return files_data, "\n".join(tree_lines)


def scan_all():
    bot_files, bot_tree = scan_folder(ROOT_FOLDER)
    wf_files, wf_tree = scan_folder(WORKFLOW_FOLDER)

    all_files = {}
    for k, v in bot_files.items():
        all_files[ROOT_FOLDER + "/" + k] = v
    for k, v in wf_files.items():
        all_files[WORKFLOW_FOLDER + "/" + k] = v

    tree_view = bot_tree + "\n\n" + wf_tree
    return all_files, tree_view


def get_folder_batches(all_files):
    folders = {}
    for path, code in all_files.items():
        folder = os.path.dirname(path)
        if folder not in folders:
            folders[folder] = []
        folders[folder].append((path, code))

    sorted_folders = sorted(folders.keys())
    return [(f, folders[f]) for f in sorted_folders]


def find_original_path(returned, original_files):
    returned = returned.strip().lstrip("/")
    if returned in original_files:
        return returned
    for orig in original_files.keys():
        if orig.endswith(returned) or orig.endswith("/" + returned):
            return orig
    for root in [ROOT_FOLDER, WORKFLOW_FOLDER]:
        test = root + "/" + returned
        if test in original_files:
            return test
    if returned.endswith((".yml", ".yaml")):
        return WORKFLOW_FOLDER + "/" + returned
    return ROOT_FOLDER + "/" + returned


def safe_write(rel_path, code):
    if ".." in rel_path or rel_path.startswith("/"):
        return False
    if skip(rel_path):
        return False
    if not validate(rel_path, code):
        return False
    try:
        dir_name = os.path.dirname(rel_path)
        if dir_name:
            os.makedirs(dir_name, exist_ok=True)
        with open(rel_path, "w", encoding="utf-8") as f:
            f.write(code.rstrip() + "\n")
        return True
    except Exception:
        return False


def update_file(rel_path, new_code, old_code):
    if quality_score(new_code) <= quality_score(old_code):
        return "cancelled"
    if safe_write(rel_path, new_code):
        return "saved"
    return "failed"


def create_new_file(rel_path, code):
    return safe_write(rel_path, code)


def create_new_folder(rel_path):
    try:
        if ".." in rel_path or rel_path.startswith("/"):
            return False
        os.makedirs(rel_path, exist_ok=True)
        gitkeep = os.path.join(rel_path, ".gitkeep")
        if not os.path.exists(gitkeep):
            with open(gitkeep, "w") as f:
                f.write("")
        return True
    except Exception:
        return False


def delete_file(rel_path):
    try:
        if ".." in rel_path or rel_path.startswith("/"):
            return False
        if os.path.exists(rel_path):
            os.remove(rel_path)
            return True
    except Exception:
        pass
    return False


def bundle(batch):
    out = ""
    for path, code in batch:
        out += "\n=== FILE: " + path + " ===\n"
        out += code if code.strip() else "# [EMPTY FILE]"
        out += "\n=== END FILE ===\n"
    return out


