name: 👍🟢AI Developer🤖.yml

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 1440

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TOKEN_GITHUB }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests pyyaml

      - name: Create Backup
        run: |
          BACKUP="backup-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BACKUP"
          git push origin "$BACKUP" || true
          git checkout main

      - name: Write AI Developer Script
        run: |
          cat > /tmp/ai_dev.py << 'ENDOFPYTHON'
import os
import re
import ast
import json
import time
import requests
from datetime import datetime

ROOT_FOLDER = "sawajstudiobot"
WORKFLOW_FOLDER = ".github/workflows"
SELF_FILENAME = "sawaj_ai_developer.yml"

SKIP_DIRS = (
    "__pycache__", ".git", "output", "_work", "_backups",
    "_logs", "venv", "node_modules", "_temp_builder",
    ".pytest_cache",
)

PROCESS_EXTENSIONS = (
    ".py", ".yml", ".yaml", ".json", ".toml",
    ".cfg", ".md", ".txt", ".ini",
)

AI_GROUPS = [
    ["Gemini", "Groq", "OpenRouter", "Mistral"],
    ["Cerebras", "NVIDIA", "Cohere", "HuggingFace"],
]

AI_TIMEOUT = 300
MAX_OUTPUT_TOKENS = 16384

KEYS = {
    "Gemini":      os.environ.get("GEMINI_API_KEY", "").strip(),
    "Groq":        os.environ.get("GROQ_API_KEY", "").strip(),
    "OpenRouter":  os.environ.get("OPENROUTER_API_KEY", "").strip(),
    "Mistral":     os.environ.get("MISTRAL_API_KEY", "").strip(),
    "Cerebras":    os.environ.get("CEREBRAS_API_KEY", "").strip(),
    "NVIDIA":      os.environ.get("NVIDIA_API_KEY", "").strip(),
    "Cohere":      os.environ.get("COHERE_API_KEY", "").strip(),
    "HuggingFace": os.environ.get("HUGGINGFACE_API_KEY", "").strip(),
}


def tg(msg, silent=False):
    token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
    chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
    if not token or not chat_id:
        return
    chunks = [msg[i:i+3800] for i in range(0, len(msg), 3800)]
    for chunk in chunks:
        try:
            requests.post(
                "https://api.telegram.org/bot" + token + "/sendMessage",
                json={
                    "chat_id": chat_id,
                    "text": chunk,
                    "parse_mode": "HTML",
                    "disable_web_page_preview": True,
                    "disable_notification": silent,
                },
                timeout=15)
        except Exception:
            pass


def http_post(url, headers, payload, timeout=AI_TIMEOUT):
    try:
        r = requests.post(url, headers=headers, json=payload, timeout=timeout)
        if r.status_code == 200:
            return r.json(), ""
        err = "HTTP " + str(r.status_code) + ": " + r.text[:150]
        return None, err
    except requests.Timeout:
        return None, "TIMEOUT"
    except Exception as e:
        return None, str(e)[:100]


def call_gemini(prompt):
    k = KEYS["Gemini"]
    if not k:
        return None, "NO_KEY"
    models = ["gemini-1.5-flash", "gemini-1.5-flash-latest", "gemini-1.5-pro"]
    for m in models:
        url = "https://generativelanguage.googleapis.com/v1beta/models/" + m + ":generateContent?key=" + k
        d, err = http_post(url,
            {"Content-Type": "application/json"},
            {"contents": [{"parts": [{"text": prompt}]}],
             "generationConfig": {"maxOutputTokens": MAX_OUTPUT_TOKENS, "temperature": 0.3}})
        if d and "candidates" in d:
            try:
                text = d["candidates"][0]["content"]["parts"][0]["text"]
                if text and len(text) > 50:
                    return text, "OK"
            except Exception:
                pass
        print("      gemini/" + m + " -> " + str(err))
    return None, "ALL_MODELS_FAILED"


def call_groq(prompt):
    k = KEYS["Groq"]
    if not k:
        return None, "NO_KEY"
    d, err = http_post("https://api.groq.com/openai/v1/chat/completions",
        {"Authorization": "Bearer " + k},
        {"model": "llama-3.3-70b-versatile",
         "messages": [{"role": "user", "content": prompt}],
         "max_tokens": min(MAX_OUTPUT_TOKENS, 8000),
         "temperature": 0.3})
    if d and "choices" in d:
        return d["choices"][0]["message"]["content"], "OK"
    return None, err


