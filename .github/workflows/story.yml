name: 💻 Generate All Code

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-code-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 💻 Generate Code
        run: |
          python3 <<'PYEOF'
          import os

          ROOT = "Sawaj_studio"
          CODE = {}

          # ═══════════════════════════════════════════════════════
          # 1_CONFIG
          # ═══════════════════════════════════════════════════════
          CODE[f"{ROOT}/generator/1_config/1_env_loader.py"] = '''"""
🔧 Env Loader
"""
import os


def load_env(env_path=".env"):
    if not os.path.exists(env_path):
        return False
    try:
        with open(env_path, "r", encoding="utf-8") as f:
            for line in f:
                line = line.strip()
                if not line or line.startswith("#") or "=" not in line:
                    continue
                k, v = line.split("=", 1)
                k = k.strip()
                v = v.strip().strip('"').strip("'")
                if k and k not in os.environ:
                    os.environ[k] = v
        return True
    except Exception:
        return False


def get_env(key, default=""):
    return os.environ.get(key, default).strip()
'''

          CODE[f"{ROOT}/generator/1_config/2_secret_reader.py"] = '''"""
🔑 Secret Reader
"""
import os


def read_secret(*names, default=""):
    for name in names:
        val = os.environ.get(name, "").strip()
        if val and val.lower() not in ("none", "null", "undefined"):
            return val
    return default


def has_secret(*names):
    return bool(read_secret(*names))


def mask_secret(value):
    if not value:
        return "(empty)"
    if len(value) <= 8:
        return "***"
    return value[:4] + "***" + value[-4:]
