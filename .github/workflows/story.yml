name: 📖 Story Video (FB + IG)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: story-video-${{ github.ref }}
  cancel-in-progress: false

jobs:
  story:
    name: 📖 Story Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install System
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto fonts-noto-cjk \
            fonts-noto-color-emoji wget curl

      - name: 🔤 Download Fonts
        run: |
          mkdir -p ~/.fonts && cd ~/.fonts
          wget -q -nc "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSans/NotoSans-Bold.ttf" || true
          wget -q -nc "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSansDevanagari/NotoSansDevanagari-Bold.ttf" || true
          wget -q -nc "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoNaskhArabic/NotoNaskhArabic-Bold.ttf" || true
          fc-cache -f

      - name: 📦 Install Python
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install requests Pillow mutagen
          pip install edge-tts gTTS
          pip install google-auth google-auth-oauthlib google-api-python-client
          pip install numpy

      - name: 🔬 Secrets Test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENROUTER_API_KEY_AI: ${{ secrets.OPENROUTER_API_KEY_AI }}
          GROQ_API_KEY_AI: ${{ secrets.GROQ_API_KEY_AI }}
          GEMINI_API_KEY_AI: ${{ secrets.GEMINI_API_KEY_AI }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python3 <<'PYEOF'
          import os
          import requests
          ok = 0
          fail = 0
          msg_lines = ["🔬 <b>STORY — SECRETS TEST</b>\n"]
          tests = [
              ("OPENROUTER_API_KEY_AI", "https://openrouter.ai/api/v1/models", "bearer"),
              ("GROQ_API_KEY_AI", "https://api.groq.com/openai/v1/models", "bearer"),
              ("GEMINI_API_KEY_AI", "https://generativelanguage.googleapis.com/v1beta/models?key={KEY}", "raw"),
              ("ELEVENLABS_API_KEY", "https://api.elevenlabs.io/v1/user", "xi"),
              ("PEXELS_API_KEY", "https://api.pexels.com/v1/search?query=test&per_page=1", "raw"),
              ("TELEGRAM_BOT_TOKEN", "https://api.telegram.org/bot{KEY}/getMe", "raw"),
          ]
          for name, url, auth in tests:
              key = os.environ.get(name, "").strip()
              if not key:
                  msg_lines.append("⏭️ " + name + " — Not set")
                  continue
              try:
                  if auth == "bearer":
                      r = requests.get(url, headers={"Authorization": "Bearer " + key}, timeout=10)
                  elif auth == "xi":
                      r = requests.get(url, headers={"xi-api-key": key}, timeout=10)
                  elif "{KEY}" in url:
                      r = requests.get(url.replace("{KEY}", key), timeout=10)
                  else:
                      r = requests.get(url, headers={"Authorization": key}, timeout=10)
                  if r.status_code == 200:
                      msg_lines.append("✅ " + name)
                      ok += 1
                  else:
                      msg_lines.append("❌ " + name + " — HTTP " + str(r.status_code))
                      fail += 1
              except Exception as e:
                  msg_lines.append("❌ " + name + " — " + str(e)[:40])
                  fail += 1
          msg_lines.append("\n✅ OK: " + str(ok) + "  ❌ Fail: " + str(fail))
          msg = "\n".join(msg_lines)
          print(msg)
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if token and chat:
              try:
                  requests.post("https://api.telegram.org/bot" + token + "/sendMessage",
                                json={"chat_id": chat, "text": msg[:4000], "parse_mode": "HTML"},
                                timeout=20)
              except Exception:
                  pass
          PYEOF

      - name: 🎬 Run Story Pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_AI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_AI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_AI }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY_AI }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY_AI }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY_AI }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          FACEBOOK_META_TOKEN: ${{ secrets.FACEBOOK_INSTAGRAM_META_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_INSTAGRAM_META_TOKEN: ${{ secrets.FACEBOOK_INSTAGRAM_META_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GDRIVE_STORY_VIDEO_FOLDER_ID: ${{ secrets.GDRIVE_STORY_VIDEO_FOLDER_ID }}
          HADITH_API_URL: ${{ secrets.HADITH_API_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          cd Sawaj_studio/generator/worker_story/8_run
          python3 1_main.py 2>&1 | tee ../../../../pipeline.log || true

      - name: 📱 Final Report
        if: always()
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then exit 0; fi
          curl -s -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d chat_id="$TG_CHAT" \
            -d parse_mode="HTML" \
            -d text="📖 <b>STORY VIDEO DONE</b>

          📊 Status: ${{ job.status }}
          🔢 Run: #${{ github.run_number }}
          🕐 $(date '+%H:%M:%S UTC')" || true
