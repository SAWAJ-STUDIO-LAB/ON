          # ═══════════════════════════════════════════════════════
          # WRITE ALL FILES
          # ═══════════════════════════════════════════════════════
          written = 0
          skipped = 0

          for path, code in CODE.items():
              folder = os.path.dirname(path)
              if folder:
                  os.makedirs(folder, exist_ok=True)

              if os.path.exists(path):
                  try:
                      size = os.path.getsize(path)
                      with open(path, "r", encoding="utf-8") as f:
                          content = f.read()
                      if size > 100 and "Sawaj Studio Module" not in content:
                          skipped += 1
                          continue
                  except Exception:
                      pass

              with open(path, "w", encoding="utf-8") as f:
                  f.write(code.strip() + "\n")
              written += 1

          print("=" * 60)
          print("💻 Code written: " + str(written))
          print("⏭️  Skipped:     " + str(skipped))
          print("=" * 60)
          PYEOF

      - name: 📤 Commit & Push
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "✅ No changes"
          else
            git commit -m "💻 Generate code [skip ci]"
            git push origin HEAD
            echo "✅ Pushed"
          fi

      - name: 📱 Telegram Report
        if: always()
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Telegram secrets missing"
            exit 0
          fi
          PY=$(find Sawaj_studio/ -name '*.py' -size +10c 2>/dev/null | wc -l)
          FO=$(find Sawaj_studio/ -type d 2>/dev/null | wc -l)
          FI=$(find Sawaj_studio/ -type f 2>/dev/null | wc -l)

          curl -s -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d chat_id="$TG_CHAT" \
            -d parse_mode="HTML" \
            -d text="💻 <b>CODE GENERATION COMPLETE</b>

          ═══════════════════════════
          🐍 Python with code: $PY
          📁 Folders: $FO
