name: Multi-Method Secrets Diagnosis

on:
  workflow_dispatch:

jobs:
  diagnose-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Multi-Method Diagnosis
        env:
          CEREBRAS_API_KEY_A1: ${{ secrets.CEREBRAS_API_KEY_A1 }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          COHERE_API_KEY_A1: ${{ secrets.COHERE_API_KEY_A1 }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          COVER_API_KEY: ${{ secrets.COVER_API_KEY }}
          DAILY_HADITH_YT_PLAYLIST_ID: ${{ secrets.DAILY_HADITH_YT_PLAYLIST_ID }}
          DAILY_YOUTUBE_YT_PLAYLIST_ID: ${{ secrets.DAILY_YOUTUBE_YT_PLAYLIST_ID }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          DEEPLL_API_KEY: ${{ secrets.DEEPLL_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FACEBOOK_INSTAGRAM_META_TOKEN: ${{ secrets.FACEBOOK_INSTAGRAM_META_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          GDRIVE_LONG_VIDEO_FOLDER_ID: ${{ secrets.GDRIVE_LONG_VIDEO_FOLDER_ID }}
          GDRIVE_SHORT_VIDEO_FOLDER_ID: ${{ secrets.GDRIVE_SHORT_VIDEO_FOLDER_ID }}
          GDRIVE_STORY_VIDEO_FOLDER_ID: ${{ secrets.GDRIVE_STORY_VIDEO_FOLDER_ID }}
          GEMINI_API_KEY_A1: ${{ secrets.GEMINI_API_KEY_A1 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GROQ_API_KEY_A1: ${{ secrets.GROQ_API_KEY_A1 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HADITH_API_URL: ${{ secrets.HADITH_API_URL }}
          HUGGINGFACE_API_KEY_A1: ${{ secrets.HUGGINGFACE_API_KEY_A1 }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          MISTRAL_API_KEY_A1: ${{ secrets.MISTRAL_API_KEY_A1 }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY_A1: ${{ secrets.OPENROUTER_API_KEY_A1 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PRAYER_TIMES_API_URL: ${{ secrets.PRAYER_TIMES_API_URL }}
          QURAN_API_URL: ${{ secrets.QURAN_API_URL }}
          TAVILY_API_KEY_A1: ${{ secrets.TAVILY_API_KEY_A1 }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          cat << 'EOF' > full_diagnosis.py
          import os
          import json
          import time
          import urllib.request
          import urllib.parse

          bot_token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()

          chunks = []
          curr_text = "🔬 <b>FULL MULTI-METHOD SECRETS DIAGNOSIS REPORT</b>\n\n"

          def esc(t):
              return str(t).replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;')

          def add_line(line):
              global curr_text, chunks
              if len(curr_text) + len(line) > 3200:
                  chunks.append(curr_text)
                  curr_text = "🔬 <b>DIAGNOSIS REPORT (Continued)</b>\n\n"
              curr_text += line + "\n"

          def get_secret(*names):
              for name in names:
                  val = os.environ.get(name, "").strip()
                  if val:
                      return val, name
              return "", names[0]

          def test_http(url, headers=None, data=None, method="GET"):
              if headers is None:
                  headers = {}
              if "User-Agent" not in headers:
                  headers["User-Agent"] = "Mozilla/5.0 SecretsDiagnostic/2.0"
              req = urllib.request.Request(url, headers=headers, data=data, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=12) as response:
                      return response.status, response.read().decode('utf-8', errors='ignore')
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode('utf-8', errors='ignore')
              except Exception as e:
                  return 0, str(e)

          def mask_val(v):
              if not v:
                  return "❌ Missing"
              if len(v) <= 8:
                  return "✅ Present"
              return f"✅ Present ({esc(v[:4])}...{esc(v[-4:])})"

          # --- 1. AI & LLM APIS DEEP DIAGNOSIS ---
          add_line("🤖 <b>1. AI & LLM Models Ping Diagnosis</b>")

          # Gemini
          val, name = get_secret("GEMINI_API_KEY_A1", "GEMINI_API_KEY")
          if val:
              st, body = test_http(f"https://generativelanguage.googleapis.com/v1beta/models?key={val}")
              if st == 200:
                  add_line(f"✅ <code>{esc(name)}</code>: Live & Valid (HTTP 200)")
              else:
                  add_line(f"⚠️ <code>{esc(name)}</code>: Value Set, API Error (HTTP {st})")
          else:
              add_line(f"❌ <code>GEMINI_API_KEY_A1</code> / <code>GEMINI_API_KEY</code>: Missing in Env")

          # Groq
          val, name = get_secret("GROQ_API_KEY_A1", "GROQ_API_KEY")
          if val:
              st, body = test_http("https://api.groq.com/openai/v1/models", headers={"Authorization": f"Bearer {val}"})
              if st == 200:
                  add_line(f"✅ <code>{esc(name)}</code>: Live & Valid (HTTP 200)")
              else:
                  add_line(f"⚠️ <code>{esc(name)}</code>: Value Set, API Error (HTTP {st})")
          else:
              add_line(f"❌ <code>GROQ_API_KEY_A1</code> / <code>GROQ_API_KEY</code>: Missing in Env")

          # Mistral
          val, name = get_secret("MISTRAL_API_KEY_A1", "MISTRAL_API_KEY")
          if val:
              st, body = test_http("https://api.mistral.ai/v1/models", headers={"Authorization": f"Bearer {val}"})
              if st == 200:
                  add_line(f"✅ <code>{esc(name)}</code>: Live & Valid (HTTP 200)")
              else:
                  add_line(f"⚠️ <code>{esc(name)}</code>: Value Set, API Error (HTTP {st})")
          else:
              add_line(f"❌ <code>MISTRAL_API_KEY_A1</code> / <code>MISTRAL_API_KEY</code>: Missing in Env")

          # OpenRouter
          val, name = get_secret("OPENROUTER_API_KEY_A1", "OPENROUTER_API_KEY")
          if val:
              st, body = test_http("https://openrouter.ai/api/v1/auth/key", headers={"Authorization": f"Bearer {val}"})
              if st == 200:
                  add_line(f"✅ <code>{esc(name)}</code>: Live & Valid (HTTP 200)")
              else:
                  add_line(f"⚠️ <code>{esc(name)}</code>: Value Set, API Error (HTTP {st})")
          else:
              add_line(f"❌ <code>OPENROUTER_API_KEY_A1</code> / <code>OPENROUTER_API_KEY</code>: Missing in Env")

          # Cerebras
          val, name = get_secret("CEREBRAS_API_KEY_A1", "CEREBRAS_API_KEY")
          if val:
              st, body = test_http("https://api.cerebras.ai/v1/models", headers={"Authorization": f"Bearer {val}"})
              if st == 200:
                  add_line(f"✅ <code>{esc(name)}</code>: Live & Valid (HTTP 200)")
              else:
                  add_line(f"⚠️ <code>{esc(name)}</code>: Value Set, API Error (HTTP {st})")
          else:
              add_line(f"❌ <code>CEREBRAS_API_KEY_A1</code> / <code>CEREBRAS_API_KEY</code>: Missing in Env")

          # Cohere
          val, name = get_secret("COHERE_API_KEY_A1", "COHERE_API_KEY")
          if val:
              st, body = test_http("https://api.cohere.com/v1/models", headers={"Authorization": f"Bearer {val}"})
              if st == 200:
                  add_line(f"✅ <code>{esc(name)}</code>: Live & Valid (HTTP 200)")
              else:
                  add_line(f"⚠️ <code>{esc(name)}</code>: Value Set, API Error (HTTP {st})")
          else:
              add_line(f"❌ <code>COHERE_API_KEY_A1</code> / <code>COHERE_API_KEY</code>: Missing in Env")

          # HuggingFace
          val, name = get_secret("HUGGINGFACE_API_KEY_A1", "HUGGINGFACE_API_KEY")
          if val:
              st, body = test_http("https://huggingface.co/api/whoami-v2", headers={"Authorization": f"Bearer {val}"})
              if st == 200:
                  add_line(f"✅ <code>{esc(name)}</code>: Live & Valid (HTTP 200)")
              else:
                  add_line(f"⚠️ <code>{esc(name)}</code>: Value Set, API Error (HTTP {st})")
          else:
              add_line(f"❌ <code>HUGGINGFACE_API_KEY_A1</code> / <code>HUGGINGFACE_API_KEY</code>: Missing in Env")

          # Tavily
          val, name = get_secret("TAVILY_API_KEY_A1", "TAVILY_API_KEY")
          if val:
              pdata = json.dumps({"api_key": val, "query": "test"}).encode('utf-8')
              st, body = test_http("https://api.tavily.com/search", headers={"Content-Type": "application/json"}, data=pdata, method="POST")
              if st == 200:
                  add_line(f"✅ <code>{esc(name)}</code>: Live & Valid (HTTP 200)")
              else:
                  add_line(f"⚠️ <code>{esc(name)}</code>: Value Set, API Error (HTTP {st})")
          else:
              add_line(f"❌ <code>TAVILY_API_KEY_A1</code> / <code>TAVILY_API_KEY</code>: Missing in Env")

          # --- 2. OAUTH & STORAGE ---
          add_line("\n☁️ <b>2. OAuth & Cloud Storage Testing</b>")

          # Google Drive OAuth
          gd_c = os.environ.get("GOOGLE_DRIVE_CLIENT_ID", "").strip()
          gd_s = os.environ.get("GOOGLE_DRIVE_CLIENT_SECRET", "").strip()
          gd_r = os.environ.get("GOOGLE_DRIVE_REFRESH_TOKEN", "").strip()
          if gd_c and gd_s and gd_r:
              pdata = urllib.parse.urlencode({"client_id": gd_c, "client_secret": gd_s, "refresh_token": gd_r, "grant_type": "refresh_token"}).encode('utf-8')
              st, body = test_http("https://oauth2.googleapis.com/token", headers={"Content-Type": "application/x-www-form-urlencoded"}, data=pdata, method="POST")
              if st == 200:
                  add_line("✅ <code>GOOGLE DRIVE OAUTH</code>: Refresh Token Exchanged Successfully")
              else:
                  add_line(f"❌ <code>GOOGLE DRIVE OAUTH</code>: Exchange Failed (HTTP {st})")
          else:
              add_line("⚠️ <code>GOOGLE DRIVE OAUTH</code>: Missing Client ID/Secret/Refresh Token")

          # YouTube OAuth
          yt_c = os.environ.get("YOUTUBE_CLIENT_ID", "").strip()
          yt_s = os.environ.get("YOUTUBE_CLIENT_SECRET", "").strip()
          yt_r = os.environ.get("YOUTUBE_REFRESH_TOKEN", "").strip()
          if yt_c and yt_s and yt_r:
              pdata = urllib.parse.urlencode({"client_id": yt_c, "client_secret": yt_s, "refresh_token": yt_r, "grant_type": "refresh_token"}).encode('utf-8')
              st, body = test_http("https://oauth2.googleapis.com/token", headers={"Content-Type": "application/x-www-form-urlencoded"}, data=pdata, method="POST")
              if st == 200:
                  add_line("✅ <code>YOUTUBE OAUTH</code>: Refresh Token Exchanged Successfully")
              else:
                  add_line(f"❌ <code>YOUTUBE OAUTH</code>: Exchange Failed (HTTP {st})")
          else:
              add_line("⚠️ <code>YOUTUBE OAUTH</code>: Missing Client ID/Secret/Refresh Token")

          # --- 3. MEDIA & TRANSLATION APIS ---
          add_line("\n🎨 <b>3. Media, Audio & Translation APIs</b>")

          # DeepL
          val, name = get_secret("DEEPL_API_KEY", "DEEPLL_API_KEY")
          if val:
              st1, _ = test_http("https://api-free.deepl.com/v2/usage", headers={"Authorization": f"DeepL-Auth-Key {val}"})
              st2, _ = test_http("https://api.deepl.com/v2/usage", headers={"Authorization": f"DeepL-Auth-Key {val}"})
              if st1 == 200 or st2 == 200:
                  add_line(f"✅ <code>{esc(name)}</code>: Active DeepL Key")
              else:
                  add_line(f"⚠️ <code>{esc(name)}</code>: Key Present, Auth Failed (Free HTTP {st1}, Pro HTTP {st2})")
          else:
              add_line("❌ <code>DEEPL_API_KEY</code>: Missing")

          # ElevenLabs
          val, name = get_secret("ELEVENLABS_API_KEY")
          if val:
              st, _ = test_http("https://api.elevenlabs.io/v1/user", headers={"xi-api-key": val})
              if st == 200:
                  add_line(f"✅ <code>{esc(name)}</code>: Active Key")
              else:
                  add_line(f"⚠️ <code>{esc(name)}</code>: Auth Error HTTP {st}")
          else:
              add_line("❌ <code>ELEVENLABS_API_KEY</code>: Missing")

          # Deepgram
          val, name = get_secret("DEEPGRAM_API_KEY")
          if val:
              st, _ = test_http("https://api.deepgram.com/v1/projects", headers={"Authorization": f"Token {val}"})
              if st == 200:
                  add_line(f"✅ <code>{esc(name)}</code>: Active Key")
              else:
                  add_line(f"⚠️ <code>{esc(name)}</code>: Auth Error HTTP {st}")
          else:
              add_line("❌ <code>DEEPGRAM_API_KEY</code>: Missing")

          # Coverr / Cover
          val, name = get_secret("COVERR_API_KEY", "COVER_API_KEY")
          if val:
              add_line(f"✅ <code>{esc(name)}</code>: Key Set ({mask_val(val)})")
          else:
              add_line("❌ <code>COVERR_API_KEY</code> / <code>COVER_API_KEY</code>: Missing")

          # Daily Hadith / YouTube Playlist
          val, name = get_secret("DAILY_HADITH_YT_PLAYLIST_ID", "DAILY_YOUTUBE_YT_PLAYLIST_ID")
          if val:
              add_line(f"✅ <code>{esc(name)}</code>: ID Set ({esc(val)})")
          else:
              add_line("❌ <code>DAILY_HADITH_YT_PLAYLIST_ID</code>: Missing")

          # --- 4. ALL REPOSITORY SECRETS PRESENCE CHECK ---
          add_line("\n📋 <b>4. Complete Repository Secrets Audit</b>")

          secret_maps = [
              ("CEREBRAS_API_KEY_A1", ["CEREBRAS_API_KEY_A1", "CEREBRAS_API_KEY"]),
              ("COHERE_API_KEY_A1", ["COHERE_API_KEY_A1", "COHERE_API_KEY"]),
              ("COVERR_API_KEY", ["COVERR_API_KEY", "COVER_API_KEY"]),
              ("DAILY_HADITH_YT_PLAYLIST_ID", ["DAILY_HADITH_YT_PLAYLIST_ID", "DAILY_YOUTUBE_YT_PLAYLIST_ID"]),
              ("DEEPGRAM_API_KEY", ["DEEPGRAM_API_KEY"]),
              ("DEEPL_API_KEY", ["DEEPL_API_KEY", "DEEPLL_API_KEY"]),
              ("ELEVENLABS_API_KEY", ["ELEVENLABS_API_KEY"]),
              ("FACEBOOK_INSTAGRAM_META_TOKEN", ["FACEBOOK_INSTAGRAM_META_TOKEN"]),
              ("FACEBOOK_PAGE_ID", ["FACEBOOK_PAGE_ID"]),
              ("FREESOUND_API_KEY", ["FREESOUND_API_KEY"]),
              ("GDRIVE_LONG_VIDEO_FOLDER_ID", ["GDRIVE_LONG_VIDEO_FOLDER_ID"]),
              ("GDRIVE_SHORT_VIDEO_FOLDER_ID", ["GDRIVE_SHORT_VIDEO_FOLDER_ID"]),
              ("GDRIVE_STORY_VIDEO_FOLDER_ID", ["GDRIVE_STORY_VIDEO_FOLDER_ID"]),
              ("GEMINI_API_KEY_A1", ["GEMINI_API_KEY_A1", "GEMINI_API_KEY"]),
              ("GOOGLE_DRIVE_CLIENT_ID", ["GOOGLE_DRIVE_CLIENT_ID"]),
              ("GOOGLE_DRIVE_CLIENT_SECRET", ["GOOGLE_DRIVE_CLIENT_SECRET"]),
              ("GOOGLE_DRIVE_REFRESH_TOKEN", ["GOOGLE_DRIVE_REFRESH_TOKEN"]),
              ("GROQ_API_KEY_A1", ["GROQ_API_KEY_A1", "GROQ_API_KEY"]),
              ("HADITH_API_URL", ["HADITH_API_URL"]),
              ("HUGGINGFACE_API_KEY_A1", ["HUGGINGFACE_API_KEY_A1", "HUGGINGFACE_API_KEY"]),
              ("INSTAGRAM_BUSINESS_ACCOUNT_ID", ["INSTAGRAM_BUSINESS_ACCOUNT_ID"]),
              ("JINA_API_KEY", ["JINA_API_KEY"]),
              ("MISTRAL_API_KEY_A1", ["MISTRAL_API_KEY_A1", "MISTRAL_API_KEY"]),
              ("OPENROUTER_API_KEY_A1", ["OPENROUTER_API_KEY_A1", "OPENROUTER_API_KEY"]),
              ("OPENWEATHER_API_KEY", ["OPENWEATHER_API_KEY"]),
              ("PEXELS_API_KEY", ["PEXELS_API_KEY"]),
              ("PIXABAY_API_KEY", ["PIXABAY_API_KEY"]),
              ("PRAYER_TIMES_API_URL", ["PRAYER_TIMES_API_URL"]),
              ("QURAN_API_URL", ["QURAN_API_URL"]),
              ("TAVILY_API_KEY_A1", ["TAVILY_API_KEY_A1", "TAVILY_API_KEY"]),
              ("TELEGRAM_BOT_TOKEN", ["TELEGRAM_BOT_TOKEN"]),
              ("TELEGRAM_CHAT_ID", ["TELEGRAM_CHAT_ID"]),
              ("TOKEN_GITHUB", ["TOKEN_GITHUB"]),
              ("YOUTUBE_CLIENT_ID", ["YOUTUBE_CLIENT_ID"]),
              ("YOUTUBE_CLIENT_SECRET", ["YOUTUBE_CLIENT_SECRET"]),
              ("YOUTUBE_REFRESH_TOKEN", ["YOUTUBE_REFRESH_TOKEN"])
          ]

          for label, aliases in secret_maps:
              val, matched_alias = get_secret(*aliases)
              if val:
                  add_line(f"• <code>{esc(matched_alias)}</code>: {mask_val(val)}")
              else:
                  add_line(f"• <code>{esc(label)}</code>: ❌ Missing")

          if curr_text:
              chunks.append(curr_text)

          # --- TELEGRAM SENDER ---
          if bot_token and chat_id:
              print(f"Sending {len(chunks)} message chunk(s) to Telegram...")
              for idx, chunk in enumerate(chunks, start=1):
                  pdata = urllib.parse.urlencode({
                      "chat_id": chat_id,
                      "text": chunk,
                      "parse_mode": "HTML"
                  }).encode('utf-8')
                  st, res = test_http(
                      f"https://api.telegram.org/bot{bot_token}/sendMessage",
                      headers={"Content-Type": "application/x-www-form-urlencoded"},
                      data=pdata,
                      method="POST"
                  )
                  if st == 200:
                      print(f"Part {idx} sent successfully!")
                  else:
                      print(f"Error sending part {idx}: HTTP {st} -> {res}")
                  time.sleep(1)
          else:
              print("TELEGRAM CREDENTIALS MISSING. Report Output:")
              for chunk in chunks:
                  print(chunk)
          EOF

          python full_diagnosis.py
