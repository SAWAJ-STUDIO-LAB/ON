name: API Diagnosis
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Full Secrets Diagnosis
        env:
          CEREBRAS_API_KEY_A1: ${{ secrets.CEREBRAS_API_KEY_A1 }}
          COHERE_API_KEY_A1: ${{ secrets.COHERE_API_KEY_A1 }}
          COVER_API_KEY: ${{ secrets.COVER_API_KEY }}
          DAILY_YOUTUBE_YT_PLAYLIST_ID: ${{ secrets.DAILY_YOUTUBE_YT_PLAYLIST_ID }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          DEEPLL_API_KEY: ${{ secrets.DEEPLL_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FACEBOOK_INSTAGRAM_META_TOKEN: ${{ secrets.FACEBOOK_INSTAGRAM_META_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          GDRIVE_LONG_VIDEO_FOLDER_ID: ${{ secrets.GDRIVE_LONG_VIDEO_FOLDER_ID }}
          GDRIVE_SHORT_VIDEO_FOLDER_ID: ${{ secrets.GDRIVE_SHORT_VIDEO_FOLDER_ID }}
          GDRIVE_STORY_VIDEO_FOLDER_ID: ${{ secrets.GDRIVE_STORY_VIDEO_FOLDER_ID }}
          GEMINI_API_KEY_A1: ${{ secrets.GEMINI_API_KEY_A1 }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GROQ_API_KEY_A1: ${{ secrets.GROQ_API_KEY_A1 }}
          HADITH_API_URL: ${{ secrets.HADITH_API_URL }}
          HUGGINGFACE_API_KEY_A1: ${{ secrets.HUGGINGFACE_API_KEY_A1 }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          MISTRAL_API_KEY_A1: ${{ secrets.MISTRAL_API_KEY_A1 }}
          OPENROUTER_API_KEY_A1: ${{ secrets.OPENROUTER_API_KEY_A1 }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PRAYER_TIMES_API_URL: ${{ secrets.PRAYER_TIMES_API_URL }}
          QURAN_API_URL: ${{ secrets.QURAN_API_URL }}
          TAVILY_API_KEY_A1: ${{ secrets.TAVILY_API_KEY_A1 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python3 -c "
          import os, json, time, urllib.request, urllib.parse

          bot_token = os.environ.get('TELEGRAM_BOT_TOKEN', '').strip()
          chat_id = os.environ.get('TELEGRAM_CHAT_ID', '').strip()

          chunks = []
          curr = '📊 *FULL REPOSITORY SECRETS DIAGNOSIS REPORT*\n\n'

          def add(line):
              global curr, chunks
              if len(curr) + len(line) > 3500:
                  chunks.append(curr)
                  curr = '📊 *DIAGNOSIS REPORT (Continued)*\n\n'
              curr += line + '\n'

          def mask(val):
              if not val:
                  return '❌ Missing'
              if len(val) <= 8:
                  return '✅ Set'
              return f'✅ Set ({val[:4]}...{val[-4:]})'

          def test_url(url, headers=None, data=None, method='GET'):
              req = urllib.request.Request(url, headers=headers or {}, data=data, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      return resp.status, resp.read().decode('utf-8', errors='ignore')
              except Exception as e:
                  return getattr(e, 'code', 0), str(e)

          # 1. TELEGRAM BOT
          add('*1. TELEGRAM BOT AUTH TEST*')
          if bot_token:
              st, body = test_url(f'https://api.telegram.org/bot{bot_token}/getMe')
              if st == 200:
                  add('✅ TELEGRAM_BOT: Valid Token')
              else:
                  add(f'❌ TELEGRAM_BOT: Status {st}')
          else:
              add('❌ TELEGRAM_BOT_TOKEN: Missing')

          # 2. GEMINI AI
          add('\n*2. AI APIs DIAGNOSIS*')
          g_key = os.environ.get('GEMINI_API_KEY_A1', '').strip()
          if g_key:
              st, body = test_url(f'https://generativelanguage.googleapis.com/v1beta/models?key={g_key}')
              if st == 200:
                  add('✅ GEMINI_API_KEY_A1: Active & Valid')
              else:
                  add(f'❌ GEMINI_API_KEY_A1: Status {st}')
          else:
              add('❌ GEMINI_API_KEY_A1: Missing')

          # 3. GOOGLE DRIVE OAUTH
          add('\n*3. OAUTH REFRESH TESTS*')
          gd_c = os.environ.get('GOOGLE_DRIVE_CLIENT_ID', '').strip()
          gd_s = os.environ.get('GOOGLE_DRIVE_CLIENT_SECRET', '').strip()
          gd_r = os.environ.get('GOOGLE_DRIVE_REFRESH_TOKEN', '').strip()
          if gd_c and gd_s and gd_r:
              payload = urllib.parse.urlencode({
                  'client_id': gd_c, 'client_secret': gd_s,
                  'refresh_token': gd_r, 'grant_type': 'refresh_token'
              }).encode('utf-8')
              st, body = test_url('https://oauth2.googleapis.com/token', headers={'Content-Type': 'application/x-www-form-urlencoded'}, data=payload, method='POST')
              if st == 200:
                  add('✅ GOOGLE DRIVE OAUTH: Refresh Token Valid')
              else:
                  add(f'❌ GOOGLE DRIVE OAUTH: Status {st}')
          else:
              add('⚠️ GOOGLE DRIVE OAUTH: Credentials Incomplete')

          # 4. YOUTUBE OAUTH
          yt_c = os.environ.get('YOUTUBE_CLIENT_ID', '').strip()
          yt_s = os.environ.get('YOUTUBE_CLIENT_SECRET', '').strip()
          yt_r = os.environ.get('YOUTUBE_REFRESH_TOKEN', '').strip()
          if yt_c and yt_s and yt_r:
              payload = urllib.parse.urlencode({
                  'client_id': yt_c, 'client_secret': yt_s,
                  'refresh_token': yt_r, 'grant_type': 'refresh_token'
              }).encode('utf-8')
              st, body = test_url('https://oauth2.googleapis.com/token', headers={'Content-Type': 'application/x-www-form-urlencoded'}, data=payload, method='POST')
              if st == 200:
                  add('✅ YOUTUBE OAUTH: Refresh Token Valid')
              else:
                  add(f'❌ YOUTUBE OAUTH: Status {st}')
          else:
              add('⚠️ YOUTUBE OAUTH: Credentials Incomplete')

          # 5. ALL SECRETS PRESENCE
          add('\n*4. ALL SECRETS PRESENCE CHECK*')
          all_keys = [
              'CEREBRAS_API_KEY_A1', 'COHERE_API_KEY_A1', 'COVER_API_KEY', 'DAILY_YOUTUBE_YT_PLAYLIST_ID',
              'DEEPGRAM_API_KEY', 'DEEPLL_API_KEY', 'ELEVENLABS_API_KEY', 'FACEBOOK_INSTAGRAM_META_TOKEN',
              'FACEBOOK_PAGE_ID', 'FREESOUND_API_KEY', 'GDRIVE_LONG_VIDEO_FOLDER_ID', 'GDRIVE_SHORT_VIDEO_FOLDER_ID',
              'GDRIVE_STORY_VIDEO_FOLDER_ID', 'GROQ_API_KEY_A1', 'HADITH_API_URL', 'HUGGINGFACE_API_KEY_A1',
              'INSTAGRAM_BUSINESS_ACCOUNT_ID', 'JINA_API_KEY', 'MISTRAL_API_KEY_A1', 'OPENROUTER_API_KEY_A1',
              'OPENWEATHER_API_KEY', 'PEXELS_API_KEY', 'PIXABAY_API_KEY', 'PRAYER_TIMES_API_URL',
              'QURAN_API_URL', 'TAVILY_API_KEY_A1', 'TOKEN_GITHUB'
          ]
          for k in all_keys:
              add(f'{k}: {mask(os.environ.get(k, \"\"))}')

          if curr:
              chunks.append(curr)

          # SEND TO TELEGRAM
          if bot_token and chat_id:
              for chunk in chunks:
                  p = urllib.parse.urlencode({'chat_id': chat_id, 'text': chunk, 'parse_mode': 'Markdown'}).encode('utf-8')
                  test_url(f'https://api.telegram.org/bot{bot_token}/sendMessage', headers={'Content-Type': 'application/x-www-form-urlencoded'}, data=p, method='POST')
                  time.sleep(1)
          "
