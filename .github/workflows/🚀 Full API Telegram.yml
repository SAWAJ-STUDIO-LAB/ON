name: API Diagnosis to Telegram
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Diagnosis and Send Telegram
        env:
          CEREBRAS_API_KEY_A1: ${{ secrets.CEREBRAS_API_KEY_A1 }}
          COHERE_API_KEY_A1: ${{ secrets.COHERE_API_KEY_A1 }}
          COVER_API_KEY: ${{ secrets.COVER_API_KEY }}
          DAILY_YOUTUBE_YT_PLAYLIST_ID: ${{ secrets.DAILY_YOUTUBE_YT_PLAYLIST_ID }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          DEEPLL_API_KEY: ${{ secrets.DEEPLL_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FACEBOOK_INSTAGRAM_META_TOKEN: ${{ secrets.FACEBOOK_INSTAGRAM_META_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          GDRIVE_LONG_VIDEO_FOLDER_ID: ${{ secrets.GDRIVE_LONG_VIDEO_FOLDER_ID }}
          GDRIVE_SHORT_VIDEO_FOLDER_ID: ${{ secrets.GDRIVE_SHORT_VIDEO_FOLDER_ID }}
          GDRIVE_STORY_VIDEO_FOLDER_ID: ${{ secrets.GDRIVE_STORY_VIDEO_FOLDER_ID }}
          GEMINI_API_KEY_A1: ${{ secrets.GEMINI_API_KEY_A1 }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GROQ_API_KEY_A1: ${{ secrets.GROQ_API_KEY_A1 }}
          HADITH_API_URL: ${{ secrets.HADITH_API_URL }}
          HUGGINGFACE_API_KEY_A1: ${{ secrets.HUGGINGFACE_API_KEY_A1 }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          MISTRAL_API_KEY_A1: ${{ secrets.MISTRAL_API_KEY_A1 }}
          OPENROUTER_API_KEY_A1: ${{ secrets.OPENROUTER_API_KEY_A1 }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PRAYER_TIMES_API_URL: ${{ secrets.PRAYER_TIMES_API_URL }}
          QURAN_API_URL: ${{ secrets.QURAN_API_URL }}
          TAVILY_API_KEY_A1: ${{ secrets.TAVILY_API_KEY_A1 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python3 -c "
          import os, time, urllib.request, urllib.parse, json

          bot_token = os.environ.get('TELEGRAM_BOT_TOKEN', '').strip()
          chat_id = os.environ.get('TELEGRAM_CHAT_ID', '').strip()

          chunks = []
          curr = '📊 <b>FULL REPOSITORY SECRETS DIAGNOSIS REPORT</b>\n\n'

          def add(line):
              global curr, chunks
              if len(curr) + len(line) > 3200:
                  chunks.append(curr)
                  curr = '📊 <b>DIAGNOSIS REPORT (Continued)</b>\n\n'
              curr += line + '\n'

          def mask(val):
              if not val:
                  return '❌ Missing'
              if len(val) <= 8:
                  return '✅ Present'
              return f'✅ Present ({val[:4]}...{val[-4:]})'

          def send_tg(text):
              if not bot_token or not chat_id:
                  print('❌ Telegram Token ya Chat ID missing hai!')
                  return
              url = f'https://api.telegram.org/bot{bot_token}/sendMessage'
              data = urllib.parse.urlencode({'chat_id': chat_id, 'text': text, 'parse_mode': 'HTML'}).encode('utf-8')
              req = urllib.request.Request(url, data=data, method='POST')
              try:
                  with urllib.request.urlopen(req) as resp:
                      print('✅ Telegram Message Sent Successfully!')
              except Exception as e:
                  print(f'❌ Telegram Send Error: {e}')

          # 1. AI APIs DIAGNOSIS
          add('🧠 <b>1. AI APIs DIAGNOSIS</b>')
          g_key = os.environ.get('GEMINI_API_KEY_A1', '').strip()
          if g_key:
              try:
                  url = f'https://generativelanguage.googleapis.com/v1beta/models?key={g_key}'
                  req = urllib.request.Request(url)
                  with urllib.request.urlopen(req) as resp:
                      add('✅ <code>GEMINI_API_KEY_A1</code>: Active & Valid')
              except Exception as e:
                  add(f'❌ <code>GEMINI_API_KEY_A1</code>: Error ({e})')
          else:
              add('❌ <code>GEMINI_API_KEY_A1</code>: Missing')

          # 2. GOOGLE DRIVE OAUTH
          add('\n☁️ <b>2. OAUTH REFRESH TESTS</b>')
          gd_c = os.environ.get('GOOGLE_DRIVE_CLIENT_ID', '').strip()
          gd_s = os.environ.get('GOOGLE_DRIVE_CLIENT_SECRET', '').strip()
          gd_r = os.environ.get('GOOGLE_DRIVE_REFRESH_TOKEN', '').strip()
          if gd_c and gd_s and gd_r:
              payload = urllib.parse.urlencode({
                  'client_id': gd_c, 'client_secret': gd_s,
                  'refresh_token': gd_r, 'grant_type': 'refresh_token'
              }).encode('utf-8')
              req = urllib.request.Request('https://oauth2.googleapis.com/token', data=payload, headers={'Content-Type': 'application/x-www-form-urlencoded'}, method='POST')
              try:
                  with urllib.request.urlopen(req) as resp:
                      add('✅ <code>GOOGLE DRIVE OAUTH</code>: Refresh Token Active')
              except Exception as e:
                  add(f'❌ <code>GOOGLE DRIVE OAUTH</code>: Failed ({e})')
          else:
              add('⚠️ <code>GOOGLE DRIVE OAUTH</code>: Credentials Incomplete')

          # 3. YOUTUBE OAUTH
          yt_c = os.environ.get('YOUTUBE_CLIENT_ID', '').strip()
          yt_s = os.environ.get('YOUTUBE_CLIENT_SECRET', '').strip()
          yt_r = os.environ.get('YOUTUBE_REFRESH_TOKEN', '').strip()
          if yt_c and yt_s and yt_r:
              payload = urllib.parse.urlencode({
                  'client_id': yt_c, 'client_secret': yt_s,
                  'refresh_token': yt_r, 'grant_type': 'refresh_token'
              }).encode('utf-8')
              req = urllib.request.Request('https://oauth2.googleapis.com/token', data=payload, headers={'Content-Type': 'application/x-www-form-urlencoded'}, method='POST')
              try:
                  with urllib.request.urlopen(req) as resp:
                      add('✅ <code>YOUTUBE OAUTH</code>: Refresh Token Active')
              except Exception as e:
                  add(f'❌ <code>YOUTUBE OAUTH</code>: Failed ({e})')
          else:
              add('⚠️ <code>YOUTUBE OAUTH</code>: Credentials Incomplete')

          # 4. ALL SECRETS PRESENCE
          add('\n🔐 <b>3. ALL SECRETS PRESENCE CHECK</b>')
          all_keys = [
              'CEREBRAS_API_KEY_A1', 'COHERE_API_KEY_A1', 'COVER_API_KEY', 'DAILY_YOUTUBE_YT_PLAYLIST_ID',
              'DEEPGRAM_API_KEY', 'DEEPLL_API_KEY', 'ELEVENLABS_API_KEY', 'FACEBOOK_INSTAGRAM_META_TOKEN',
              'FACEBOOK_PAGE_ID', 'FREESOUND_API_KEY', 'GDRIVE_LONG_VIDEO_FOLDER_ID', 'GDRIVE_SHORT_VIDEO_FOLDER_ID',
              'GDRIVE_STORY_VIDEO_FOLDER_ID', 'GROQ_API_KEY_A1', 'HADITH_API_URL', 'HUGGINGFACE_API_KEY_A1',
              'INSTAGRAM_BUSINESS_ACCOUNT_ID', 'JINA_API_KEY', 'MISTRAL_API_KEY_A1', 'OPENROUTER_API_KEY_A1',
              'OPENWEATHER_API_KEY', 'PEXELS_API_KEY', 'PIXABAY_API_KEY', 'PRAYER_TIMES_API_URL',
              'QURAN_API_URL', 'TAVILY_API_KEY_A1', 'TOKEN_GITHUB'
          ]
          for k in all_keys:
              add(f'<code>{k}</code>: {mask(os.environ.get(k, \"\"))}')

          if curr:
              chunks.append(curr)

          # SEND ALL CHUNKS TO TELEGRAM
          for chunk in chunks:
              send_tg(chunk)
              time.sleep(1)
          "
