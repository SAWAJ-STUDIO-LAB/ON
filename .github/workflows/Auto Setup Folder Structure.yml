              "Sawaj_studio/assets/sticker/__init__.py",
              "Sawaj_studio/assets/effect/sparkle.mp4",
              "Sawaj_studio/assets/effect/glow.mp4",
              "Sawaj_studio/assets/effect/__init__.py",
              "Sawaj_studio/assets/sound/whoosh.mp3",
              "Sawaj_studio/assets/sound/ding.mp3",
              "Sawaj_studio/assets/sound/chime.mp3",
              "Sawaj_studio/assets/sound/__init__.py",
              "Sawaj_studio/assets/font/NotoSans-Bold.ttf",
              "Sawaj_studio/assets/font/NotoSansDevanagari-Bold.ttf",
              "Sawaj_studio/assets/font/NotoNaskhArabic-Bold.ttf",
              "Sawaj_studio/assets/font/__init__.py",
              "Sawaj_studio/assets/logo/logo.png",
              "Sawaj_studio/assets/logo/avatar.png",
              "Sawaj_studio/assets/logo/watermark.png",
              "Sawaj_studio/assets/logo/__init__.py",
              "Sawaj_studio/assets/__init__.py"
          ]

          for path in file_list:
              dir_name = os.path.dirname(path)
              if dir_name:
                  os.makedirs(dir_name, exist_ok=True)
              if not os.path.exists(path):
                  with open(path, "w") as f:
                      if path.endswith(".py"):
                          f.write("# -*- coding: utf-8 -*-\n")
                      elif path.endswith(".json"):
                          f.write("{}\n")
                      elif path.endswith(".md"):
                          f.write("# " + os.path.basename(path) + "\n")
                      else:
                          f.write("")
          '

      - name: Commit and Push to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-generated project directory structure and files" || echo "No changes to commit"
          git push origin HEAD

      - name: Send Report to Telegram
        if: always()
        run: |
          sudo apt-get update && sudo apt-get install -y tree
          
          # Generate folder structure layout
          STRUCTURE_TREE=$(tree Sawaj_studio/ --noreport | head -c 3800)
          
          CAPTION="<b>Sawaj Studio Folder Structure Status:</b>%0A%0A<code>${STRUCTURE_TREE}</code>"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=HTML" \
            -d "text=${CAPTION}"
