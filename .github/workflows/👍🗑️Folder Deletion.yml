name: 📋 List All Files and Send to Telegram

on:
  workflow_dispatch:
    inputs:
      target_dir:
        description: '📁 Directory to scan (e.g. Sawaj_studio or .)'
        required: true
        type: string
        default: 'Sawaj_studio'

permissions:
  contents: read

jobs:
  list-repository-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Generate Complete File List
        run: |
          python3 <<'PY'
          import os

          target_dir = "${{ github.event.inputs.target_dir }}"
          output_file = "repository_files_report.txt"

          print(f"Scanning directory: {target_dir}")

          file_list = []
          for root, dirs, files in os.walk(target_dir):
              for file in files:
                  full_path = os.path.join(root, file)
                  file_list.append(full_path)

          # Sort files alphabetically
          file_list.sort()

          with open(output_file, "w", encoding="utf-8") as f:
              f.write("=" * 60 + "\n")
              f.write(f"📁 SAWAJ STUDIO - REPOSITORY FILE LIST\n")
              f.write("=" * 60 + "\n\n")
              for idx, path in enumerate(file_list, 1):
                  f.write(f"{idx}. {path}\n")

          print(f"Total files found: {len(file_list)}")
          PY

      - name: 📱 Send File List to Telegram
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "⚠️ Telegram secrets missing, skipping"
            exit 0
          fi

          if [ ! -f repository_files_report.txt ]; then
            echo "⚠️ Report file missing"
            exit 0
          fi

          curl -s -F chat_id="$TG_CHAT" \
               -F document=@"repository_files_report.txt" \
               -F caption="📋 <b>Sawaj Studio File List Report</b>%0A✅ Sabhi files ki list document file mein bhej di gayi hai.%0A🔢 Run: #${{ github.run_number }}" \
               -F parse_mode="HTML" \
               "https://api.telegram.org/bot$TG_TOKEN/sendDocument" \
            && echo "✅ Telegram document sent successfully" \
            || echo "⚠️ Telegram failed"
