name: 🗑️ Safe File & Folder Deletion Manager

on:
  workflow_dispatch:
    inputs:
      target_paths:
        description: '📝 Paths to Delete (Comma or newline separated paths e.g. folder/subfolder or file.py)'
        required: true
        type: string
        default: 'Sawaj_studio/generator/temp_module.py'
      send_telegram:
        description: '📱 Send deletion report to Telegram?'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  delete-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB }}

      - name: 🗑️ Safely Process and Delete Selected Paths
        run: |
          python3 <<'PY'
          import os
          import glob
          import shutil

          raw_input_paths = """${{ github.event.inputs.target_paths }}"""
          paths_to_check = [p.strip() for p in raw_input_paths.replace(",", "\n").split("\n") if p.strip()]

          deleted_count = 0
          skipped_count = 0
          deleted_items = []

          print("=" * 60)
          print("🗑️ SAWAJ STUDIO - SAFE DELETION MANAGER")
          print("=" * 60)

          # Dangerous root paths jinko galti se bhi delete hone se rokna hai
          PROTECTED_PATHS = ["", ".", "/", "Sawaj_studio", "Sawaj_studio/", ".github", "src", "docs"]

          for target in paths_to_check:
              # Normalize path
              target = os.path.normpath(target)

              # Safety check: Prevent deleting core/root directories
              if target in PROTECTED_PATHS or target.lower() in [p.lower() for p in PROTECTED_PATHS]:
                  print(f"🛑 BLOCKED (Protected Path): {target} cannot be deleted.")
                  skipped_count += 1
                  continue

              matched_files = glob.glob(target, recursive=True)
              
              if not matched_files and os.path.exists(target):
                  matched_files = [target]

              if matched_files:
                  for path in matched_files:
                      # Additional inner safety check
                      if os.path.normpath(path) in [os.path.normpath(p) for p in PROTECTED_PATHS]:
                          print(f"🛑 BLOCKED: Attempt to delete protected item -> {path}")
                          continue

                      try:
                          if os.path.isdir(path):
                              shutil.rmtree(path)
                              print(f"📁 Deleted Folder Directory: {path}")
                          elif os.path.isfile(path):
                              os.remove(path)
                              print(f"📄 Deleted File: {path}")
                          
                          deleted_items.append(path)
                          deleted_count += 1
                      except Exception as e:
                          print(f"❌ Failed to delete {path}: {e}")
              else:
                  print(f"⚠️ Path not found: {target}")
                  skipped_count += 1

          print("=" * 60)
          print(f"✅ Successfully deleted items: {deleted_count}")
          print(f"⚠️ Skipped / Protected / Not found: {skipped_count}")
          print("=" * 60)

          with open("/tmp/deleted_summary.txt", "w") as f:
              f.write("\n".join(deleted_items) if deleted_items else "No items deleted.")
          PY

      - name: 📤 Commit & Push Deletions
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "✅ No changes to commit."
          else
            git commit -m "🗑️ Safely deleted selected files/folders via workflow [skip ci]"
            git push origin HEAD
            echo "✅ Pushed deletions successfully!"
          fi

      - name: 📱 Send Deletion Report to Telegram
        if: always() && github.event.inputs.send_telegram == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "⚠️ Telegram secrets missing, skipping"
            exit 0
          fi

          DELETED_LIST=$(cat /tmp/deleted_summary.txt 2>/dev/null || echo "None")

          curl -s -F chat_id="$TG_CHAT" \
               -F caption="🗑️ <b>Sawaj Studio Safe Deletion Report</b>%0A%0A<b>Deleted Items:</b>%0A<code>$DELETED_LIST</code>%0A%0A🔢 Run: #${{ github.run_number }}" \
               -F parse_mode="HTML" \
               "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            && echo "✅ Telegram notification sent" \
            || echo "⚠️ Telegram failed"
