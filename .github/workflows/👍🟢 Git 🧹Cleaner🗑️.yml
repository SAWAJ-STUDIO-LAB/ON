name: 👍🟢Git🗑️Cleaner🧹

on:
  workflow_dispatch: # Agar aap kabhi manual run karna chahein (bina kisi prompt ke direct chalega)
  
  # Yeh section dusre workflows ke complete hone par isko automatic trigger karega
  workflow_run:
    workflows: 
      - "KING — One File At A Time (Full Upgrade)"
      - "Full Secrets API testing"
      - "Bot Update Upgrade — KING (Single YAML + Telegram File)"
    types:
      - completed

jobs:
  clean-history:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Automatically Clean Completed Workflow Runs
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}
          REPO: ${{ github.repository }}
        run: |
          echo "🔍 Dusra workflow complete ho chuka hai. Ab safai shuru ho rahi hai..."
          
          # Sirf 'completed' (success, failed, cancelled) runs ko hi uthayega.
          # Running ya Queued workflows ekdum safe rahenge.
          RUN_IDS=$(gh api "repos/$REPO/actions/runs?status=completed&per_page=100" --paginate --jq '.workflow_runs[].id' || true)
          
          if [ -z "$RUN_IDS" ]; then
            echo "✅ Koi completed history nahi mili. Sab clean hai!"
            exit 0
          fi
          
          TOTAL_RUNS=$(echo "$RUN_IDS" | wc -w)
          echo "🚨 Total $TOTAL_RUNS completed runs delete hone ja rahe hain."
          
          SUCCESS_COUNT=0
          
          for ID in $RUN_IDS; do
            echo "🗑️ Deleting run ID: $ID..."
            if gh api -X DELETE "repos/$REPO/actions/runs/$ID" --silent; then
              SUCCESS_COUNT=$((SUCCESS_COUNT+1))
            fi
            # GitHub API ko safe rakhne ke liye chota sa pause
            sleep 0.2
          done
          
          echo "====================================================="
          echo "🎉 Successfully $SUCCESS_COUNT runs ki history delete kar di gayi hai!"
          echo "====================================================="
