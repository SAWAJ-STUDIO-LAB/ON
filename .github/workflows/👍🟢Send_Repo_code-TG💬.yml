name: 👍🟢Send Repo code TG📤

on:
  workflow_dispatch:
    inputs:
      target_folder:
        type: choice
        description: 'Aapko telegram par kaun sa folder structure bhejna hai?'
        required: true
        default: 'fb_ig_story'
        options:
          - 'fb_ig_story'
          - 'fb_ig_yt_short'
          - 'fb_yt_long'
          - 'all_complete_repo'

jobs:
  bundle-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Combine Files based on User Selection
        env:
          TARGET_FOLDER: ${{ inputs.target_folder }}
        run: |
          python3 - << 'EOF'
          import os
          import base64

          target = os.environ.get("TARGET_FOLDER", "all_complete_repo")
          output_file = f"{target}_code_combined.txt"

          # Basic Ignore Folders
          BASE_IGNORE = {".git", "__pycache__", "node_modules", "venv", "env"}
          IGNORE_DIRS = set(BASE_IGNORE)

          # Generator Directory Mapping
          GENERATOR_MAPPING = {
              "fb_ig_story": "fb_ig_story_video_generator",
              "fb_ig_yt_short": "fb_ig_yt_short_video_generator",
              "fb_yt_long": "fb_yt_long_video_generator"
          }

          # Target ke hisab se baaki generator folders ko filter/ignore karna
          if target in GENERATOR_MAPPING:
              for key, folder_name in GENERATOR_MAPPING.items():
                  if key != target:
                      IGNORE_DIRS.add(folder_name)

          IGNORE_FILES = {
              output_file,
              "all_code_combined.txt",
              "fb_ig_story_code_combined.txt",
              "fb_ig_yt_short_code_combined.txt",
              "fb_yt_long_code_combined.txt",
              "all_complete_repo_code_combined.txt"
          }

          # 1. Folder Tree View Generator
          def build_tree(start_dir="."):
              lines = [f"📂 REPOSITORY STRUCTURE ({target.upper()})", "==================================================", "."]
              
              def _walk(directory, prefix=""):
                  try:
                      entries = sorted(os.listdir(directory))
                  except Exception:
                      return
                  
                  filtered = []
                  for e in entries:
                      if e in IGNORE_FILES or e in IGNORE_DIRS:
                          continue
                      path = os.path.join(directory, e)
                      if os.path.isdir(path):
                          if e.startswith(".") and e != ".github":
                              continue
                      filtered.append(e)

                  count = len(filtered)
                  for i, entry in enumerate(filtered):
                      path = os.path.join(directory, entry)
                      is_last = (i == count - 1)
                      connector = "└── " if is_last else "├── "
                      if os.path.isdir(path):
                          lines.append(f"{prefix}{connector}{entry}/")
                          new_prefix = prefix + ("    " if is_last else "│   ")
                          _walk(path, new_prefix)
                      else:
                          lines.append(f"{prefix}{connector}{entry}")

              _walk(start_dir)
              return "\n".join(lines)

          # 2. Binary / Image File Checker
          def is_binary_file(filepath):
              try:
                  with open(filepath, 'tr', encoding='utf-8') as f:
                      f.read(2048)
                      return False
              except UnicodeDecodeError:
                  return True

          # 3. Collect All Selected Files
          all_files = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in IGNORE_DIRS and not (d.startswith(".") and d != ".github")]
              for file in sorted(files):
                  if file not in IGNORE_FILES:
                      all_files.append(os.path.join(root, file))

          all_files.sort()
          tree_view = build_tree(".")

          # 4. Write Everything into Single File Note
          with open(output_file, "w", encoding="utf-8") as outfile:
              outfile.write("================================================================================\n")
              outfile.write(f"           CODEBASE & MEDIA DIRECTORY NOTE [{target.upper()}]                   \n")
              outfile.write("================================================================================\n\n")
              outfile.write(tree_view)
              outfile.write("\n\n" + "="*80 + "\n")
              outfile.write("                             FULL FILE CONTENTS                                 \n")
              outfile.write("="*80 + "\n\n")

              success_count = 0
              for filepath in all_files:
                  relative_path = os.path.relpath(filepath, ".")
                  outfile.write("\n" + "─"*80 + "\n")
                  outfile.write(f"📄 FILE: {relative_path}\n")
                  outfile.write("─"*80 + "\n\n")
                  
                  if is_binary_file(filepath):
                      try:
                          with open(filepath, "rb") as bfile:
                              encoded = base64.b64encode(bfile.read()).decode('utf-8')
                              outfile.write(f"# [IMAGE/BINARY FILE EMBEDDED AS BASE64 DATA]\n")
                              outfile.write(f"data:application/octet-stream;base64,{encoded}\n\n")
                          success_count += 1
                      except Exception as e:
                          outfile.write(f"# [Error reading binary file]: {e}\n\n")
                  else:
                      try:
                          with open(filepath, "r", encoding="utf-8", errors="ignore") as infile:
                              outfile.write(infile.read())
                              outfile.write("\n\n")
                          success_count += 1
                      except Exception as e:
                          outfile.write(f"# [Error reading text file]: {e}\n\n")

          print(f"Successfully combined {success_count} files into {output_file}")
          EOF

      - name: Send Selected File to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_FOLDER: ${{ inputs.target_folder }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Error: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret is missing!"
            exit 1
          fi

          FILE_NAME="${TARGET_FOLDER}_code_combined.txt"

          curl -s -F chat_id="$TELEGRAM_CHAT_ID" \
               -F document=@$FILE_NAME \
               -F caption="📦 Telegram Delivery: [$TARGET_FOLDER] Folder & Code Structure!" \
               https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument
