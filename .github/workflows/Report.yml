name: Full_Secrets APi Report

on:
  workflow_dispatch:
    inputs:
      send_telegram:
        description: 'Send full report to Telegram'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

jobs:
  diagnose-all-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout (optional)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Full Diagnosis
        id: diagnosis
        env:
          # === AI / LLM Keys ===
          CEREBRAS_API_KEY_AI: ${{ secrets.CEREBRAS_API_KEY_AI }}
          COHERE_API_KEY_AI: ${{ secrets.COHERE_API_KEY_AI }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GEMINI_API_KEY_AI: ${{ secrets.GEMINI_API_KEY_AI }}
          GROQ_API_KEY_AI: ${{ secrets.GROQ_API_KEY_AI }}
          HUGGINGFACE_API_KEY_AI: ${{ secrets.HUGGINGFACE_API_KEY_AI }}
          MISTRAL_API_KEY_AI: ${{ secrets.MISTRAL_API_KEY_AI }}
          OPENROUTER_API_KEY_AI: ${{ secrets.OPENROUTER_API_KEY_AI }}
          TAVILY_API_KEY_AI: ${{ secrets.TAVILY_API_KEY_AI }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

          # === Media / Content APIs ===
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}

          # === Social / Meta ===
          FACEBOOK_INSTAGRAM_META_TOKEN: ${{ secrets.FACEBOOK_INSTAGRAM_META_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}

          # === Google Drive / YouTube OAuth ===
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GDRIVE_LONG_VIDEO_FOLDER_ID: ${{ secrets.GDRIVE_LONG_VIDEO_FOLDER_ID }}
          GDRIVE_SHORT_VIDEO_FOLDER_ID: ${{ secrets.GDRIVE_SHORT_VIDEO_FOLDER_ID }}
          GDRIVE_STORY_VIDEO_FOLDER_ID: ${{ secrets.GDRIVE_STORY_VIDEO_FOLDER_ID }}
          DAILY_HADEES_YT_PLAYLIST_ID: ${{ secrets.DAILY_HADEES_YT_PLAYLIST_ID }}

          # === Telegram ===
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # === Other ===
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
          HADITH_API_URL: ${{ secrets.HADITH_API_URL }}
          PRAYER_TIMES_API_URL: ${{ secrets.PRAYER_TIMES_API_URL }}
          QURAN_API_URL: ${{ secrets.QURAN_API_URL }}

          SEND_TELEGRAM: ${{ github.event.inputs.send_telegram }}

        run: |
          python << 'PYTHON_SCRIPT'
          import os, requests
          from datetime import datetime, timezone

          results = []
          summary = {"total": 0, "ok": 0, "fail": 0, "warn": 0, "skip": 0}

          def mask_val(val):
              if not val: return "MISSING"
              val = str(val).strip()
              if len(val) <= 8: return "****"
              return val[:4] + "..." + val[-4:]

          def add_result(name, status, detail, http_code=None):
              summary["total"] += 1
              summary[status] += 1
              emoji = {"ok": "✅", "fail": "❌", "warn": "⚠️", "skip": "⏭️"}.get(status, "❓")
              results.append({"name": name, "status": status, "emoji": emoji,
                              "detail": detail[:180] if detail else "", "code": http_code})
              print(f"{emoji} {name}: {status.upper()} | {detail[:120]}")

          def safe_get(url, headers=None, params=None, timeout=12):
              try:
                  return requests.get(url, headers=headers or {}, params=params or {}, timeout=timeout)
              except Exception as e:
                  return type('o', (object,), {'status_code': 0, 'text': str(e), 'json': lambda: {}})()

          def safe_post(url, headers=None, json_data=None, data=None, timeout=12):
              try:
                  return requests.post(url, headers=headers or {}, json=json_data, data=data, timeout=timeout)
              except Exception as e:
                  return type('o', (object,), {'status_code': 0, 'text': str(e), 'json': lambda: {}})()

          def has_value(key):
              val = os.environ.get(key, "").strip()
              return bool(val) and val.lower() not in ("", "none", "null", "undefined")

          # ===== AI / LLM =====
          if has_value("CEREBRAS_API_KEY_AI"):
              r = safe_get("https://api.cerebras.ai/v1/models", headers={"Authorization": f"Bearer {os.environ['CEREBRAS_API_KEY_AI']}"})
              add_result("CEREBRAS_API_KEY_AI", "ok" if r.status_code == 200 else "fail",
                         f"Models: {len(r.json().get('data', []))}" if r.status_code == 200 else f"HTTP {r.status_code}", r.status_code)
          else: add_result("CEREBRAS_API_KEY_AI", "skip", "Empty")

          if has_value("COHERE_API_KEY_AI"):
              r = safe_post("https://api.cohere.com/v1/check-api-key", headers={"Authorization": f"Bearer {os.environ['COHERE_API_KEY_AI']}"})
              if r.status_code == 200 and r.json().get("valid"): add_result("COHERE_API_KEY_AI", "ok", "Key valid & active")
              elif r.status_code == 200: add_result("COHERE_API_KEY_AI", "fail", "Key invalid")
              else: add_result("COHERE_API_KEY_AI", "fail", f"HTTP {r.status_code}", r.status_code)
          else: add_result("COHERE_API_KEY_AI", "skip", "Empty")

          if has_value("DEEPGRAM_API_KEY"):
              r = safe_get("https://api.deepgram.com/v1/auth/token", headers={"Authorization": f"Token {os.environ['DEEPGRAM_API_KEY']}"})
              add_result("DEEPGRAM_API_KEY", "ok" if r.status_code == 200 else "fail",
                         "Credentials valid" if r.status_code == 200 else f"HTTP {r.status_code}", r.status_code)
          else: add_result("DEEPGRAM_API_KEY", "skip", "Empty")

          if has_value("DEEPL_API_KEY"):
              r = safe_get("https://api-free.deepl.com/v2/usage", headers={"Authorization": f"DeepL-Auth-Key {os.environ['DEEPL_API_KEY']}"})
              if r.status_code == 200:
                  d = r.json(); add_result("DEEPL_API_KEY", "ok", f"Usage: {d.get('character_count','?')}/{d.get('character_limit','?')}")
              else: add_result("DEEPL_API_KEY", "fail", f"HTTP {r.status_code}", r.status_code)
          else: add_result("DEEPL_API_KEY", "skip", "Empty")

          if has_value("ELEVENLABS_API_KEY"):
              r = safe_get("https://api.elevenlabs.io/v1/user", headers={"xi-api-key": os.environ['ELEVENLABS_API_KEY']})
              if r.status_code == 200:
                  t = r.json().get('subscription', {}).get('tier', '?'); add_result("ELEVENLABS_API_KEY", "ok", f"Tier: {t}")
              else: add_result("ELEVENLABS_API_KEY", "fail", f"HTTP {r.status_code}", r.status_code)
          else: add_result("ELEVENLABS_API_KEY", "skip", "Empty")

          if has_value("GEMINI_API_KEY_AI"):
              r = safe_get(f"https://generativelanguage.googleapis.com/v1beta/models?key={os.environ['GEMINI_API_KEY_AI']}")
              if r.status_code == 200:
                  add_result("GEMINI_API_KEY_AI", "ok", f"{len(r.json().get('models', []))} models")
              else: add_result("GEMINI_API_KEY_AI", "fail", f"HTTP {r.status_code}", r.status_code)
          else: add_result("GEMINI_API_KEY_AI", "skip", "Empty")

          if has_value("GROQ_API_KEY_AI"):
              r = safe_get("https://api.groq.com/openai/v1/models", headers={"Authorization": f"Bearer {os.environ['GROQ_API_KEY_AI']}"})
              if r.status_code == 200:
                  add_result("GROQ_API_KEY_AI", "ok", f"{len(r.json().get('data', []))} models")
              else: add_result("GROQ_API_KEY_AI", "fail", f"HTTP {r.status_code}", r.status_code)
          else: add_result("GROQ_API_KEY_AI", "skip", "Empty")

          if has_value("HUGGINGFACE_API_KEY_AI"):
              r = safe_get("https://huggingface.co/api/whoami-v2", headers={"Authorization": f"Bearer {os.environ['HUGGINGFACE_API_KEY_AI']}"})
              if r.status_code == 200:
                  u = r.json().get('name', 'ok'); add_result("HUGGINGFACE_API_KEY_AI", "ok", f"User: {u}")
              else: add_result("HUGGINGFACE_API_KEY_AI", "fail", f"HTTP {r.status_code}", r.status_code)
          else: add_result("HUGGINGFACE_API_KEY_AI", "skip", "Empty")

          if has_value("MISTRAL_API_KEY_AI"):
              r = safe_get("https://api.mistral.ai/v1/models", headers={"Authorization": f"Bearer {os.environ['MISTRAL_API_KEY_AI']}"})
              if r.status_code == 200:
                  add_result("MISTRAL_API_KEY_AI", "ok", f"{len(r.json().get('data', []))} models")
              else: add_result("MISTRAL_API_KEY_AI", "fail", f"HTTP {r.status_code}", r.status_code)
          else: add_result("MISTRAL_API_KEY_AI", "skip", "Empty")

          if has_value("OPENROUTER_API_KEY_AI"):
              r = safe_get("https://openrouter.ai/api/v1/auth/key", headers={"Authorization": f"Bearer {os.environ['OPENROUTER_API_KEY_AI']}"})
              if r.status_code == 200:
                  d = r.json().get('data', {}); add_result("OPENROUTER_API_KEY_AI", "ok", f"Label: {d.get('label','ok')}")
              else: add_result("OPENROUTER_API_KEY_AI", "fail", f"HTTP {r.status_code}", r.status_code)
          else: add_result("OPENROUTER_API_KEY_AI", "skip", "Empty")

          if has_value("TAVILY_API_KEY_AI"):
              r = safe_post("https://api.tavily.com/search", json_data={"api_key": os.environ['TAVILY_API_KEY_AI'], "query": "test", "max_results": 1})
              add_result("TAVILY_API_KEY_AI", "ok" if r.status_code == 200 else "fail",
                         "Search OK" if r.status_code == 200 else f"HTTP {r.status_code}", r.status_code)
          else: add_result("TAVILY_API_KEY_AI", "skip", "Empty")

          if has_value("JINA_API_KEY"):
              r = safe_get("https://api.jina.ai/v1/models", headers={"Authorization": f"Bearer {os.environ['JINA_API_KEY']}"})
              if r.status_code == 200: add_result("JINA_API_KEY", "ok", "Valid")
              else:
                  r2 = safe_post("https://api.jina.ai/v1/embeddings",
                                 headers={"Authorization": f"Bearer {os.environ['JINA_API_KEY']}", "Content-Type": "application/json"},
                                 json_data={"model": "jina-embeddings-v2-base-en", "input": ["test"]})
                  add_result("JINA_API_KEY", "ok" if r2.status_code == 200 else "fail",
                             "Embeddings OK" if r2.status_code == 200 else f"HTTP {r.status_code}/{r2.status_code}", r2.status_code)
          else: add_result("JINA_API_KEY", "skip", "Empty")

          if has_value("NVIDIA_API_KEY"):
              r = safe_get("https://integrate.api.nvidia.com/v1/models", headers={"Authorization": f"Bearer {os.environ['NVIDIA_API_KEY']}"})
              if r.status_code == 200:
                  add_result("NVIDIA_API_KEY", "ok", f"{len(r.json().get('data', []))} models available")
              else: add_result("NVIDIA_API_KEY", "fail", f"HTTP {r.status_code}", r.status_code)
          else: add_result("NVIDIA_API_KEY", "skip", "Empty")

          # ===== MEDIA =====
          if has_value("COVERR_API_KEY"):
              r = safe_get("https://api.coverr.co/videos", headers={"Authorization": f"Bearer {os.environ['COVERR_API_KEY']}"}, params={"page_size": 1})
              add_result("COVERR_API_KEY", "ok" if r.status_code == 200 else "fail", "Valid" if r.status_code == 200 else f"HTTP {r.status_code}", r.status_code)
          else: add_result("COVERR_API_KEY", "skip", "Empty")

          if has_value("FREESOUND_API_KEY"):
              r = safe_get("https://freesound.org/apiv2/search/text/", params={"query": "test", "token": os.environ['FREESOUND_API_KEY'], "page_size": 1})
              add_result("FREESOUND_API_KEY", "ok" if r.status_code == 200 else "fail", "Valid" if r.status_code == 200 else f"HTTP {r.status_code}", r.status_code)
          else: add_result("FREESOUND_API_KEY", "skip", "Empty")

          if has_value("PEXELS_API_KEY"):
              r = safe_get("https://api.pexels.com/v1/search", headers={"Authorization": os.environ['PEXELS_API_KEY']}, params={"query": "nature", "per_page": 1})
              add_result("PEXELS_API_KEY", "ok" if r.status_code == 200 else "fail", "Valid" if r.status_code == 200 else f"HTTP {r.status_code}", r.status_code)
          else: add_result("PEXELS_API_KEY", "skip", "Empty")

          if has_value("PIXABAY_API_KEY"):
              r = safe_get("https://pixabay.com/api/", params={"key": os.environ['PIXABAY_API_KEY'], "q": "nature", "per_page": 3})
              add_result("PIXABAY_API_KEY", "ok" if r.status_code == 200 else "fail", "Valid" if r.status_code == 200 else f"HTTP {r.status_code}", r.status_code)
          else: add_result("PIXABAY_API_KEY", "skip", "Empty")

          if has_value("OPENWEATHER_API_KEY"):
              r = safe_get("https://api.openweathermap.org/data/2.5/weather", params={"q": "London", "appid": os.environ['OPENWEATHER_API_KEY']})
              if r.status_code == 200: add_result("OPENWEATHER_API_KEY", "ok", f"City: {r.json().get('name','?')}")
              else: add_result("OPENWEATHER_API_KEY", "fail", f"HTTP {r.status_code}", r.status_code)
          else: add_result("OPENWEATHER_API_KEY", "skip", "Empty")

          # ===== META =====
          if has_value("FACEBOOK_INSTAGRAM_META_TOKEN"):
              r = safe_get("https://graph.facebook.com/v19.0/me", params={"access_token": os.environ['FACEBOOK_INSTAGRAM_META_TOKEN'], "fields": "id,name"})
              if r.status_code == 200: add_result("FACEBOOK_INSTAGRAM_META_TOKEN", "ok", f"ID: {r.json().get('id','?')}")
              else: add_result("FACEBOOK_INSTAGRAM_META_TOKEN", "fail", f"HTTP {r.status_code}", r.status_code)
          else: add_result("FACEBOOK_INSTAGRAM_META_TOKEN", "skip", "Empty")

          if has_value("FACEBOOK_PAGE_ID"):
              if has_value("FACEBOOK_INSTAGRAM_META_TOKEN"):
                  r = safe_get(f"https://graph.facebook.com/v19.0/{os.environ['FACEBOOK_PAGE_ID']}", params={"access_token": os.environ['FACEBOOK_INSTAGRAM_META_TOKEN'], "fields": "id,name"})
                  if r.status_code == 200: add_result("FACEBOOK_PAGE_ID", "ok", f"Page: {r.json().get('name', r.json().get('id'))}")
                  else: add_result("FACEBOOK_PAGE_ID", "fail", f"HTTP {r.status_code}", r.status_code)
              else: add_result("FACEBOOK_PAGE_ID", "warn", "Token missing")
          else: add_result("FACEBOOK_PAGE_ID", "skip", "Empty")

          if has_value("INSTAGRAM_BUSINESS_ACCOUNT_ID"):
              if has_value("FACEBOOK_INSTAGRAM_META_TOKEN"):
                  r = safe_get(f"https://graph.facebook.com/v19.0/{os.environ['INSTAGRAM_BUSINESS_ACCOUNT_ID']}", params={"access_token": os.environ['FACEBOOK_INSTAGRAM_META_TOKEN'], "fields": "id,username"})
                  if r.status_code == 200: add_result("INSTAGRAM_BUSINESS_ACCOUNT_ID", "ok", f"@{r.json().get('username', r.json().get('id'))}")
                  else: add_result("INSTAGRAM_BUSINESS_ACCOUNT_ID", "fail", f"HTTP {r.status_code}", r.status_code)
              else: add_result("INSTAGRAM_BUSINESS_ACCOUNT_ID", "warn", "Token missing")
          else: add_result("INSTAGRAM_BUSINESS_ACCOUNT_ID", "skip", "Empty")

          # ===== GOOGLE DRIVE =====
          if all(has_value(k) for k in ["GOOGLE_DRIVE_CLIENT_ID", "GOOGLE_DRIVE_CLIENT_SECRET", "GOOGLE_DRIVE_REFRESH_TOKEN"]):
              r = safe_post("https://oauth2.googleapis.com/token", data={
                  "client_id": os.environ["GOOGLE_DRIVE_CLIENT_ID"],
                  "client_secret": os.environ["GOOGLE_DRIVE_CLIENT_SECRET"],
                  "refresh_token": os.environ["GOOGLE_DRIVE_REFRESH_TOKEN"],
                  "grant_type": "refresh_token"})
              add_result("GOOGLE_DRIVE (OAuth)", "ok" if r.status_code == 200 else "fail",
                         "Refresh OK" if r.status_code == 200 else f"HTTP {r.status_code}", r.status_code)
          else: add_result("GOOGLE_DRIVE (OAuth)", "skip", "Missing credentials")

          for fk in ["GDRIVE_LONG_VIDEO_FOLDER_ID", "GDRIVE_SHORT_VIDEO_FOLDER_ID", "GDRIVE_STORY_VIDEO_FOLDER_ID"]:
              if has_value(fk): add_result(fk, "ok", f"Value: {mask_val(os.environ[fk])}")
              else: add_result(fk, "skip", "Empty")

          # ===== YOUTUBE =====
          if all(has_value(k) for k in ["YOUTUBE_CLIENT_ID", "YOUTUBE_CLIENT_SECRET", "YOUTUBE_REFRESH_TOKEN"]):
              r = safe_post("https://oauth2.googleapis.com/token", data={
                  "client_id": os.environ["YOUTUBE_CLIENT_ID"],
                  "client_secret": os.environ["YOUTUBE_CLIENT_SECRET"],
                  "refresh_token": os.environ["YOUTUBE_REFRESH_TOKEN"],
                  "grant_type": "refresh_token"})
              add_result("YOUTUBE (OAuth)", "ok" if r.status_code == 200 else "fail",
                         "Refresh OK" if r.status_code == 200 else f"HTTP {r.status_code}", r.status_code)
          else: add_result("YOUTUBE (OAuth)", "skip", "Missing credentials")

          if has_value("DAILY_HADEES_YT_PLAYLIST_ID"):
              add_result("DAILY_HADEES_YT_PLAYLIST_ID", "ok", f"Value: {mask_val(os.environ['DAILY_HADEES_YT_PLAYLIST_ID'])}")
          else: add_result("DAILY_HADEES_YT_PLAYLIST_ID", "skip", "Empty")

          # ===== TELEGRAM + GITHUB =====
          if has_value("TELEGRAM_BOT_TOKEN"):
              r = safe_get(f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/getMe")
              if r.status_code == 200 and r.json().get("ok"):
                  b = r.json().get("result", {}); add_result("TELEGRAM_BOT_TOKEN", "ok", f"Bot @{b.get('username')}")
              else: add_result("TELEGRAM_BOT_TOKEN", "fail", f"HTTP {r.status_code}", r.status_code)
          else: add_result("TELEGRAM_BOT_TOKEN", "skip", "Empty")

          if has_value("TELEGRAM_CHAT_ID"):
              add_result("TELEGRAM_CHAT_ID", "ok", f"Value: {mask_val(os.environ['TELEGRAM_CHAT_ID'])}")
          else: add_result("TELEGRAM_CHAT_ID", "skip", "Empty")

          if has_value("TOKEN_GITHUB"):
              r = safe_get("https://api.github.com/user", headers={"Authorization": f"Bearer {os.environ['TOKEN_GITHUB']}", "Accept": "application/vnd.github+json"})
              if r.status_code == 200: add_result("TOKEN_GITHUB", "ok", f"User: {r.json().get('login')}")
              else: add_result("TOKEN_GITHUB", "fail", f"HTTP {r.status_code}", r.status_code)
          else: add_result("TOKEN_GITHUB", "skip", "Empty")

          # ===== URLs =====
          for uk in ["HADITH_API_URL", "PRAYER_TIMES_API_URL", "QURAN_API_URL"]:
              if has_value(uk):
                  u = os.environ[uk]
                  if u.startswith("http"):
                      r = safe_get(u, timeout=8)
                      if r.status_code < 500: add_result(uk, "ok", f"HTTP {r.status_code} | {mask_val(u)}")
                      else: add_result(uk, "warn", f"Server HTTP {r.status_code}")
                  else: add_result(uk, "warn", f"Not URL: {mask_val(u)}")
              else: add_result(uk, "skip", "Empty")

          # ============================================================
          # BUILD SINGLE MESSAGE
          # ============================================================
          now = datetime.now(timezone.utc).strftime("%Y-%m-%d  %H:%M UTC")
          repo = os.environ.get('GITHUB_REPOSITORY', 'unknown')
          run_id = os.environ.get('GITHUB_RUN_ID', 'manual')
          actor = os.environ.get('GITHUB_ACTOR', 'unknown')

          categories = {
              "🧠 AI / LLM": ["CEREBRAS_API_KEY_AI", "COHERE_API_KEY_AI", "DEEPGRAM_API_KEY", "DEEPL_API_KEY", "ELEVENLABS_API_KEY", "GEMINI_API_KEY_AI", "GROQ_API_KEY_AI", "HUGGINGFACE_API_KEY_AI", "MISTRAL_API_KEY_AI", "OPENROUTER_API_KEY_AI", "TAVILY_API_KEY_AI", "JINA_API_KEY", "NVIDIA_API_KEY"],
              "🎬 Media": ["COVERR_API_KEY", "FREESOUND_API_KEY", "PEXELS_API_KEY", "PIXABAY_API_KEY", "OPENWEATHER_API_KEY"],
              "📱 Meta": ["FACEBOOK_INSTAGRAM_META_TOKEN", "FACEBOOK_PAGE_ID", "INSTAGRAM_BUSINESS_ACCOUNT_ID"],
              "☁️ Drive": ["GOOGLE_DRIVE (OAuth)", "GDRIVE_LONG_VIDEO_FOLDER_ID", "GDRIVE_SHORT_VIDEO_FOLDER_ID", "GDRIVE_STORY_VIDEO_FOLDER_ID"],
              "▶️ YouTube": ["YOUTUBE (OAuth)", "DAILY_HADEES_YT_PLAYLIST_ID"],
              "🤖 Bots": ["TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID", "TOKEN_GITHUB"],
              "🌐 URLs": ["HADITH_API_URL", "PRAYER_TIMES_API_URL", "QURAN_API_URL"]
          }

          result_map = {r["name"]: r for r in results}
          total = max(summary["total"], 1)
          health = int((summary["ok"] / total) * 100)
          if health >= 95: he, ht = "🟢", "Excellent"
          elif health >= 80: he, ht = "🟡", "Good"
          elif health >= 60: he, ht = "🟠", "Fair"
          else: he, ht = "🔴", "Critical"
          filled = int(10 * health / 100)
          bar = "█" * filled + "░" * (10 - filled)

          def sn(k):
              n = k.replace("_API_KEY_AI","").replace("_API_KEY","").replace("_"," ")
              return n[:20] + ".." if len(n) > 20 else n

          lines = []
          lines.append("╔══════════════════════════╗")
          lines.append("║  🔬 *SECRETS DIAGNOSIS*  ║")
          lines.append("╚══════════════════════════╝")
          lines.append("")
          lines.append(f"📅 `{now}`")
          lines.append(f"📦 `{repo}`")
          lines.append(f"👤 `{actor}` • Run `{run_id}`")
          lines.append("────────────────────────")
          lines.append(f"*HEALTH* {he} *{health}%* {ht}")
          lines.append(f"`{bar}`")
          lines.append(f"✅{summary['ok']} ❌{summary['fail']} ⚠️{summary['warn']} ⏭️{summary['skip']} 📊{summary['total']}")
          lines.append("────────────────────────")

          for cat, keys in categories.items():
              items = []
              for k in keys:
                  r = result_map.get(k)
                  if not r: continue
                  if r["status"] == "ok":
                      items.append(f"{r['emoji']} `{sn(k)}` | {r['detail']}")
                  else:
                      items.append(f"{r['emoji']} `{sn(k)}`\n     └ {r['detail'][:60]}")
              if items:
                  lines.append(f"\n*{cat}*")
                  lines.extend(items)

          lines.append("\n────────────────────────")
          if summary["fail"] == 0:
              lines.append("🎉 *All systems operational*")
          else:
              lines.append(f"⚠️ *{summary['fail']} issue(s) found*")
              for r in results:
                  if r["status"] == "fail":
                      lines.append(f"❌ `{r['name']}`")
                      lines.append(f"   {r['detail'][:90]}")

          lines.append("")
          lines.append("_Sawaj Studio Lab • GitHub Actions_")

          full_msg = "\n".join(lines)
          if len(full_msg) > 4000:
              full_msg = full_msg[:3950] + "\n\n… _(truncated)_"

          print("\n" + "="*60)
          print("SINGLE MESSAGE REPORT PREVIEW")
          print("="*60)
          print(full_msg)
          print("="*60)
          print(f"Length: {len(full_msg)} chars")

          # ===== SEND SINGLE MESSAGE =====
          if os.environ.get("SEND_TELEGRAM", "true").lower() == "true" and has_value("TELEGRAM_BOT_TOKEN") and has_value("TELEGRAM_CHAT_ID"):
              print(f"\n📤 Sending SINGLE message to Telegram...")
              payload = {"chat_id": os.environ["TELEGRAM_CHAT_ID"], "text": full_msg,
                         "parse_mode": "Markdown", "disable_web_page_preview": True}
              try:
                  resp = requests.post(f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
                                       json=payload, timeout=20)
                  if resp.status_code == 200:
                      print("✅ Single message sent successfully")
                  else:
                      print(f"❌ Failed: {resp.status_code} → {resp.text[:200]}")
                      payload.pop("parse_mode", None)
                      resp2 = requests.post(f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
                                            json=payload, timeout=20)
                      print(f"Fallback status: {resp2.status_code}")
              except Exception as e:
                  print(f"❌ Exception: {e}")
          else:
              print("\n⏭️ Telegram send skipped (either disabled or missing token/chat)")

          if summary["fail"] > 0:
              print(f"\n⚠️ Completed with {summary['fail']} failures")
          else:
              print("\n✅ All critical checks passed cleanly")

